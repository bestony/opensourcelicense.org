summary: "Copyleft ya maktaba: mabadiliko ya maktaba yanabaki wazi; programu
  zilizofungwa zinaweza kuiunganisha ikiwa watumiaji wanaweza kuunganisha upya
  na maktaba iliyobadilishwa."
analogy: Toleo la zamani la injini ya pamoja inayoweza kubadilishwa.
pros:
  - Inaruhusu programu za umiliki kutumia maktaba
  - Kawaida katika maktaba za desktop na multimedia
cons:
  - Kanuni za kuunganisha upya ni tata
  - Hakuna ruhusa ya wazi ya hataza
