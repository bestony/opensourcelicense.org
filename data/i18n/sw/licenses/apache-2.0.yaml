summary: Leseni ya ruhusa pana yenye ruhusa ya wazi ya hataza, kulipiza kisasi
  kwa hataza na sharti la kuweka alama kwenye faili zilizobadilishwa.
analogy: Sanduku la zana la bure linalokuja na ahadi ya kutokushtaki kuhusu
  hataza zake — isipokuwa ukishtaki kwanza.
pros:
  - Ruhusa ya wazi ya hataza kutoka kwa kila mchangiaji
  - Inapendelewa na makampuni na taasisi nyingi
  - Inalinda alama za biashara
cons:
  - Ndefu zaidi; kushughulikia faili la NOTICE
  - Haioani na GPL-2.0-only
  - Haizuii washindani wanaopangisha huduma
