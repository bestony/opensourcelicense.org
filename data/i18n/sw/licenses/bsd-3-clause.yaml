summary: Kama MIT, pamoja na kifungu kinachokataza kutumia jina lako kuidhinisha
  bidhaa zinazotokana.
analogy: 'Kitabu cha bure chenye dokezo: "Usidai kuwa mwandishi anapendekeza
  toleo lako."'
pros:
  - Ya ruhusa pana na inajulikana sana
  - Inalinda jina lako dhidi ya kutumiwa kuidhinisha
cons:
  - Hakuna ruhusa ya hataza
  - Fork za msimbo uliofungwa zinaruhusiwa
