summary: Matumizi ya kibiashara ni bure kwa huduma zenye watumiaji chini ya
  milioni moja kwa siku, baada ya kujisajili; huduma kubwa zaidi zinahitaji
  leseni tofauti.
analogy: Injini ya bure kwa makundi madogo ya magari baada ya kusajili gari.
pros:
  - Bure kwa watumiaji wengi wa kibiashara
  - Modeli imara za lugha ya Kichina
cons:
  - Si chanzo huria
  - Usajili na kiwango cha watumiaji
