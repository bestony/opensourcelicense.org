summary: Kama AGPL, lakini kutoa programu kama huduma kunahitaji kutoa msimbo
  chanzo wa mfumo mzima wa huduma. Haijaidhinishwa na OSI.
analogy: Ukiendesha mgahawa wenye mlo huu, lazima pia uchapishe michoro ya jiko lako.
pros:
  - Ulinzi imara dhidi ya watoa huduma za wingu
cons:
  - Si chanzo huria kwa vigezo vya OSI
  - Imekataliwa na distribution nyingi
  - Inaweza kusababisha fork za jamii
