summary: "Kwa hifadhidata na seti za data: matumizi yoyote, pamoja na ya
  kibiashara, ukihifadhi tangazo la kutaja chanzo. Kazi unazozalisha kutoka kwa
  data zinahitaji tangazo pia."
analogy: Tumia data ya ramani popote, sema tu ilikotoka.
pros:
  - Kanuni rahisi ya kutaja chanzo
  - Kawaida kwa makusanyo makubwa ya data ya kufunza AI
  - Inahusu haki za hifadhidata, si hakimiliki pekee
cons:
  - Haikuundwa kwa ajili ya programu
  - Hakuna ruhusa ya hataza
