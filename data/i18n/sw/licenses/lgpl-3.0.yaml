summary: "Copyleft ya kiwango cha maktaba: mabadiliko ya maktaba yanabaki wazi;
  programu zilizofungwa zinaweza kuiunganisha ikiwa watumiaji wanaweza
  kubadilisha maktaba."
analogy: "Injini ya pamoja: unaweza kuiweka kwenye gari lako, lakini wamiliki
  lazima waweze kuibadilisha kwa yao wenyewe."
pros:
  - Inaruhusu programu za umiliki kutumia maktaba
  - Mabadiliko ya maktaba yanabaki wazi
  - Ruhusa ya hataza
cons:
  - Kanuni za kuunganisha upya ni tata, hasa kwa uunganishaji tuli (static) na
    simu
  - Baadhi ya makampuni bado yanaiepuka
