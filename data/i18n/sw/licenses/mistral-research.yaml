summary: Uzito wa modeli kwa utafiti na matumizi binafsi pekee; matumizi yoyote
  ya kibiashara au ya uzalishaji yanahitaji leseni ya kibiashara kutoka Mistral
  AI.
analogy: "Kitabu cha maktaba: kisome na ujifunze, usikiuze upya."
pros:
  - Uzito wazi kwa utafiti
  - Inaruhusu marekebisho kwa ajili ya utafiti
cons:
  - Hakuna matumizi ya kibiashara
  - Si chanzo huria
