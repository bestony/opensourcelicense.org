summary: "Share-alike kwa hifadhidata: unaweza kutumia data kibiashara, lakini
  hifadhidata zinazotokana zinazotolewa hadharani lazima zibaki chini ya ODbL.
  Kazi zinazozalishwa kama ramani au picha zinahitaji kutaja chanzo tu."
analogy: Jenga juu ya ramani ya pamoja, na ukichapisha hifadhidata ya ramani
  iliyoboreshwa, ishiriki kwa masharti yaleyale.
pros:
  - Inaweka hifadhidata zilizoboreshwa wazi
  - Matumizi ya kibiashara yanaruhusiwa
  - Imethibitishwa na OpenStreetMap
cons:
  - Sharti la share-alike linaweza kuzuia kuchanganya na data nyingine
  - '"Hifadhidata inayotokana" wakati mwingine haiko wazi'
