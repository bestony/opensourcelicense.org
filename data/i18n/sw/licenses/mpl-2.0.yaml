summary: "Copyleft ya kiwango cha faili: mabadiliko ya faili zenye leseni ya MPL
  lazima yabaki wazi, lakini zinaweza kuchanganywa na msimbo uliofungwa katika
  faili nyingine."
analogy: Ukiazima sura moja lazima ushiriki marekebisho yako ya sura hiyo,
  lakini kitabu kilichobaki ni chako.
pros:
  - Uwiano kati ya ruhusa pana na copyleft
  - Ruhusa ya wazi ya hataza
  - Inaoana na GPL kwa chaguo-msingi
cons:
  - Mipaka ya faili inaweza kuwa haiko wazi
  - Haihusu matumizi ya mtandao
