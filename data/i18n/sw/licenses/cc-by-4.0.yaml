summary: "Kwa maudhui, data na nyaraka: matumizi yoyote, pamoja na ya
  kibiashara, kwa kutaja chanzo na kuonyesha mabadiliko."
analogy: Shiriki picha popote, mtaje tu mpiga picha.
pros:
  - Kanuni rahisi ya kutaja chanzo
  - Nzuri kwa data na nyaraka
  - Tafsiri rasmi zipo
cons:
  - Haikuundwa kwa ajili ya programu
  - Hakuna ruhusa ya hataza
