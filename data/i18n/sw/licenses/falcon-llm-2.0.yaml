summary: Leseni ya modeli kutoka TII inayotokana na Apache-2.0, yenye sera ya
  matumizi yanayokubalika; matumizi ya kibiashara yanaruhusiwa bila mrabaha.
analogy: Sanduku la zana la Apache lenye orodha fupi ya matumizi yaliyokatazwa.
pros:
  - Matumizi ya kibiashara bila mrabaha
  - Inatokana na Apache-2.0
cons:
  - Si chanzo huria kwa vigezo vya OSI
  - Sera ya matumizi inaweza kusasishwa
