summary: Inatoa kazi kwa umma (public domain) inapowezekana, pamoja na leseni
  mbadala ya ruhusa pana. Hakuna sharti la kutaja chanzo.
analogy: "Kuacha kitabu kisicho na jina ndani kwenye benchi la bustani: mtu
  yeyote anaweza kukichukua."
pros:
  - Hakuna masharti kabisa
  - Rahisi kuchanganya na chochote
cons:
  - Kutoa kazi kwa umma hakutambuliwi katika kila nchi
  - Baadhi ya makampuni yanaiepuka kwa sababu ya kutokuwa na uhakika wa kisheria
