summary: "Leseni ya ruhusa pana: msimbo chanzo uliobadilishwa lazima uwekwe
  alama kuwa umebadilishwa, asili yake isipotoshwe, na tangazo libaki katika
  nakala za msimbo chanzo."
analogy: Azima mapishi, lakini ukiyabadilisha, usidai kuwa ni ya asili.
pros:
  - Ya ruhusa pana na fupi
  - Maarufu kwa michezo na maktaba asilia (native)
cons:
  - Hakuna ruhusa ya hataza
  - Fork zilizofungwa zinaruhusiwa
