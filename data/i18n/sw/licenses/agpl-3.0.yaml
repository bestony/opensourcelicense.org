summary: "GPL-3.0 pamoja na kifungu cha mtandao: watumiaji wanaotumia toleo
  lililobadilishwa kupitia mtandao lazima wapewe msimbo chanzo wake."
analogy: "Kanuni ya mapishi inahusu pia migahawa: kuandaa chakula kwa wateja
  kunahesabiwa kama kukigawa."
pros:
  - Inaziba mwanya wa SaaS
  - Msingi mzuri wa leseni mbili (dual licensing)
  - Chanzo huria kilichoidhinishwa na OSI
cons:
  - Makampuni mengi yanaipiga marufuku kabisa
  - Kupangisha toleo lisilobadilishwa bado kunaruhusiwa
