summary: "Leseni maalum ya modeli: matumizi ya kibiashara yanaruhusiwa, pamoja
  na Acceptable Use Policy, kanuni za kutaja chanzo na kutoa majina, na leseni
  tofauti juu ya watumiaji milioni 700 wa kila mwezi."
analogy: Injini ya kutumia bure yenye kitabu cha kanuni, na mkataba maalum kwa
  watengenezaji magari wakubwa kabisa.
pros:
  - Matumizi ya kibiashara yanaruhusiwa kwa watumiaji wengi
  - Mfumo ikolojia mkubwa
cons:
  - Si chanzo huria kwa vigezo vya OSI
  - Wajibu wa sera ya matumizi na utoaji majina
  - Masharti hubadilika kati ya matoleo
