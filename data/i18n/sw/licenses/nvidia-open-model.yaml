summary: "Leseni ya modeli inayotumika kibiashara: kazi zinazotokana
  zinaruhusiwa, NVIDIA haidai haki yoyote kwenye matokeo, lakini kinga za
  usalama zilizojengwa ndani hazipaswi kukwepwa."
analogy: Injini ya bure ambayo hupaswi kuondoa mikanda yake ya usalama.
pros:
  - Matumizi ya kibiashara yanaruhusiwa
  - Hakuna madai kwenye matokeo
cons:
  - Si chanzo huria
  - Kifungu cha kinga za usalama kinahitaji uangalifu
