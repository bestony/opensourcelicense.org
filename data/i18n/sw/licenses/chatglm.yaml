summary: Uzito wa modeli ni bure kwa utafiti wa kitaaluma; matumizi ya
  kibiashara ni bure baada ya kujisajili, chini ya vikwazo vya matumizi.
analogy: Bure kujifunza; jisajili kabla ya kuitumia kibiashara.
pros:
  - Matumizi ya kibiashara baada ya kujisajili
  - Modeli za Kichina zinazotumika sana
cons:
  - Si chanzo huria
  - Hatua ya usajili
