sourceHash: 33f06e1e52928136
summary: Fanya karibu lolote na msimbo. Hifadhi tangazo la hakimiliki na la
  leseni. Hakuna dhamana.
analogy: "Kama kuacha kitabu cha bure kwenye mkahawa: kichukue, kinakili, kiuze,
  hifadhi tu jina la mwandishi kwenye jalada."
pros:
  - Fupi na inaeleweka na wengi
  - Leseni rahisi zaidi kwa makampuni kupitisha
  - Inaoana na karibu kila leseni nyingine
cons:
  - Hakuna ruhusa ya hataza
  - Mtu yeyote anaweza kujenga mshindani wa msimbo uliofungwa au unaopangishwa
