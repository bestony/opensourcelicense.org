summary: "Masharti ya modeli ya Google: matumizi ya kibiashara yanaruhusiwa, na
  sera ya matumizi yaliyokatazwa inayopita kwa kila kazi inayotokana, pamoja na
  modeli zilizofupishwa (distilled)."
analogy: Injini ya bure yenye kitabu cha kanuni ambacho kila injini iliyojengwa
  upya lazima ibebe.
pros:
  - Matumizi ya kibiashara bila kiwango cha watumiaji
  - Kanuni wazi za kazi zinazotokana
cons:
  - Si chanzo huria kwa vigezo vya OSI
  - Google inaweza kusasisha sera ya matumizi
