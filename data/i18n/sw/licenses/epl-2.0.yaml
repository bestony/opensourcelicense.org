summary: Copyleft dhaifu ya kiwango cha moduli yenye ruhusa ya hataza; inaweza
  kutaja GPL kama leseni ya pili kwa ajili ya kuoana.
analogy: Shiriki mabadiliko yako ya sura uliyoazima; kitabu kilichobaki ni chako.
pros:
  - Copyleft rafiki kwa biashara
  - Ruhusa ya hataza
cons:
  - Inaoana na GPL tu ikiwa leseni ya pili imetangazwa
  - Mipaka ya moduli inaweza kuwa haiko wazi
