summary: Leseni ya China ya ruhusa pana yenye ruhusa ya hataza na kulipiza
  kisasi. Maandishi ya Kichina na Kiingereza yana uzito sawa; Kichina
  kinatangulia kukiwa na mgongano.
analogy: Ulinzi wa mtindo wa Apache ulioandikwa kwa kuzingatia sheria ya China.
pros:
  - Maandishi rasmi ya lugha mbili
  - Ruhusa ya hataza
  - Imeidhinishwa na OSI
cons:
  - Haijulikani sana nje ya China
  - Mashauri machache ya kimahakama
