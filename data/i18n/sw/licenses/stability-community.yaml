summary: Bure kwa utafiti, matumizi yasiyo ya kibiashara, na matumizi ya
  kibiashara chini ya mapato ya USD milioni 1 kwa mwaka; makampuni makubwa zaidi
  yanahitaji leseni ya biashara kubwa.
analogy: Kuingia bure kwa biashara ndogo; kubwa zinanunua tiketi.
pros:
  - Bure kwa watu binafsi na makampuni madogo
  - Inahusu modeli za hivi karibuni za Stability
cons:
  - Si chanzo huria
  - Kiwango cha mapato kinahitaji kufuatiliwa
