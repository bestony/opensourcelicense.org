summary: "Leseni ya Responsible AI kwa modeli: masharti ya ruhusa pana pamoja na
  vikwazo vya matumizi ambavyo kila kazi inayotokana lazima ivipitishe."
analogy: Zana ya bure yenye orodha ya matumizi yaliyokatazwa inayosafiri na kila nakala.
pros:
  - Inaruhusu matumizi ya kibiashara
  - Inaendeleza vikwazo vya matumizi yenye madhara kwa watumiaji wa chini
cons:
  - Si chanzo huria kwa vigezo vya OSI
  - Vikwazo ni vigumu kutekeleza
  - Kuna matoleo kadhaa tofauti
