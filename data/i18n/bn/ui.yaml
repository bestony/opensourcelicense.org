  site.description: ওপেন সোর্স লাইসেন্স বাছাই করুন, তুলনা করুন এবং যাচাই করে
    দেখুন। দেখুন আসল প্রজেক্টগুলো কোন লাইসেন্স ব্যবহার করে, কী ভুল হতে পারে এবং
    আপনার প্রজেক্টের জন্য কোনটি মানানসই।
