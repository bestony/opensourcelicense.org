  home.title: জেনে-বুঝে সঠিক ওপেন সোর্স লাইসেন্স বাছাই করুন
  home.lead: শুধু “কোন লাইসেন্স” নয়, বরং একই ধরনের প্রজেক্টগুলো কী বেছে নিয়েছে,
    সবচেয়ে খারাপ পরিস্থিতি কেমন হতে পারে এবং এরপর কী করতে হবে।
  home.entry.chat.title: AI পরামর্শদাতার সঙ্গে কথা বলুন
  home.entry.chat.body: নিজের ভাষায় আপনার প্রজেক্টের বর্ণনা দিন। একটি প্রোফাইল,
    পরবর্তী প্রশ্ন এবং একটি রিপোর্ট পান।
  home.entry.projects.title: অন্যরা কী ব্যবহার করে দেখুন
  home.entry.projects.body: পরিচিত প্রজেক্টগুলোর লাইসেন্স, এবং তাদের কয়েকটি কেন লাইসেন্স বদলেছে।
  home.entry.wizard.title: ধাপে ধাপে বাছাই করুন
  home.entry.wizard.body: কয়েকটি প্রশ্নের উত্তর দিন এবং র‍্যাংক করা, ব্যাখ্যাসহ একটি ছোট তালিকা পান।
