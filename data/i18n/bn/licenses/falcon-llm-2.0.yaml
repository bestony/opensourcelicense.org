summary: TII-এর Apache-2.0-ভিত্তিক মডেল লাইসেন্স, গ্রহণযোগ্য ব্যবহার নীতিসহ;
  রয়্যালটি ছাড়া বাণিজ্যিক ব্যবহারের অনুমতি।
analogy: Apache-এর টুলকিট, নিষিদ্ধ ব্যবহারের একটি ছোট তালিকাসহ।
pros:
  - রয়্যালটিমুক্ত বাণিজ্যিক ব্যবহার
  - Apache-2.0-ভিত্তিক
cons:
  - OSI অনুযায়ী ওপেন সোর্স নয়
  - ব্যবহার নীতি হালনাগাদ হতে পারে
