sourceHash: 3ab9492f75e7adb0
summary: "শক্তিশালী কপিলেফট: সফটওয়্যার বা এর উদ্ভূত কাজ বিতরণ করলে সম্পূর্ণ
  সোর্স কোড GPL-3.0-এর অধীনে প্রকাশ করতে হবে।"
analogy: "একটি রেসিপি যা বলে: এর ভিত্তিতে যে খাবার পরিবেশন করবে, তাকে পুরো
  রেসিপিও দিতে হবে।"
pros:
  - সব বিতরণ করা উদ্ভূত কাজ উন্মুক্ত রাখে
  - পেটেন্ট অনুমতি ও অ্যান্টি-টিভোইজেশন
  - শক্তিশালী কমিউনিটি ঐতিহ্য
cons:
  - অনেক কোম্পানি এটি এড়িয়ে চলে
  - SaaS আওতায় আনে না (বিতরণ হয় না)
  - GPL-2.0-only-এর সঙ্গে অসামঞ্জস্যপূর্ণ
