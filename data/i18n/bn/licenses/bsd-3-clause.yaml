summary: MIT-এর মতো, সঙ্গে একটি ধারা যা উদ্ভূত পণ্যের সমর্থনে আপনার নাম ব্যবহার
  নিষেধ করে।
analogy: "একটি বিনামূল্যের বই, যাতে লেখা: “দাবি করবেন না যে লেখক আপনার সংস্করণের
  সুপারিশ করেন।”"
pros:
  - পারমিসিভ ও সুপরিচিত
  - সমর্থনের কাজে আপনার নাম ব্যবহার থেকে রক্ষা করে
cons:
  - পেটেন্ট অনুমতি নেই
  - ক্লোজড-সোর্স ফর্কের অনুমতি আছে
