sourceHash: 362187e701e25e6a
summary: MPL থেকে উদ্ভূত ফাইল-স্তরের কপিলেফট, পেটেন্ট অনুমতিসহ; GPL-এর সঙ্গে
  অসামঞ্জস্যপূর্ণ।
analogy: ধার করা ফাইলের পরিবর্তন শেয়ার করুন; চাইলে বাকিটা বন্ধ রাখুন।
pros:
  - ফাইল-স্তরের পরিধি
  - পেটেন্ট অনুমতি
cons:
  - GPL-এর সঙ্গে অসামঞ্জস্যপূর্ণ (Linux-এ ZFS সমস্যা)
  - খুব কম নতুন প্রজেক্ট এটি গ্রহণ করে
