sourceHash: 33f06e1e52928136
summary: কোড দিয়ে প্রায় সবকিছু করুন। কপিরাইট ও লাইসেন্স নোটিশ রাখুন। কোনো
  ওয়ারেন্টি নেই।
analogy: "যেন ক্যাফেতে একটি বিনামূল্যের বই রেখে যাওয়া: নিন, কপি করুন, বিক্রি
  করুন, শুধু মলাটে লেখকের নামটি রাখুন।"
pros:
  - ছোট ও সর্বজনবোধ্য
  - কোম্পানির জন্য গ্রহণ করা সবচেয়ে সহজ
  - প্রায় সব লাইসেন্সের সঙ্গে সামঞ্জস্যপূর্ণ
cons:
  - পেটেন্ট অনুমতি নেই
  - যে কেউ ক্লোজড-সোর্স বা হোস্টেড প্রতিযোগী বানাতে পারে
