summary: পেটেন্ট অনুমতিসহ মডিউল-স্তরের দুর্বল কপিলেফট; সামঞ্জস্যের জন্য GPL-কে
  দ্বিতীয় লাইসেন্স হিসেবে ঘোষণা করা যায়।
analogy: ধার করা অধ্যায়ে আপনার পরিবর্তন শেয়ার করুন; বইয়ের বাকিটা আপনার।
pros:
  - ব্যবসাবান্ধব কপিলেফট
  - পেটেন্ট অনুমতি
cons:
  - GPL সামঞ্জস্য শুধু ঘোষিত দ্বিতীয় লাইসেন্সের মাধ্যমে
  - মডিউলের সীমানা অস্পষ্ট হতে পারে
