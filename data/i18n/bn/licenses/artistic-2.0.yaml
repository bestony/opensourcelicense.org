summary: স্বাধীনভাবে পরিবর্তন ও বিতরণের অনুমতি দেয়, তবে পরিবর্তিত সংস্করণকে
  স্পষ্টভাবে চিহ্নিত করতে বা নতুন নাম দিতে হবে, অথবা এর সোর্স উপলব্ধ করতে হবে।
  পেটেন্ট শর্তও আছে।
analogy: গানের রিমিক্স করুন, কিন্তু রিমিক্সকে আসল গান বলে বিক্রি করবেন না।
pros:
  - মূল কাজের পরিচয় রক্ষা করে
  - GPL-সামঞ্জস্যপূর্ণ
cons:
  - শর্তগুলো বেশ শব্দবহুল
  - Raku ও Perl-এর বাইরে বিরল
