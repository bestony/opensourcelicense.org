sourceHash: 6d33e2e6b797d27f
summary: "ফাইল-স্তরের কপিলেফট: MPL লাইসেন্সের ফাইলের পরিবর্তন উন্মুক্ত রাখতে
  হবে, তবে অন্য ফাইলের বন্ধ কোডের সঙ্গে মেশানো যায়।"
analogy: একটি অধ্যায় ধার নিলে সেই অধ্যায়ে আপনার সম্পাদনা শেয়ার করতে হবে,
  কিন্তু বইয়ের বাকিটা আপনার।
pros:
  - পারমিসিভ ও কপিলেফটের মধ্যে ভারসাম্যপূর্ণ
  - সুস্পষ্ট পেটেন্ট অনুমতি
  - ডিফল্টভাবে GPL-সামঞ্জস্যপূর্ণ
cons:
  - ফাইলের সীমানা অস্পষ্ট হতে পারে
  - নেটওয়ার্ক ব্যবহার আওতায় আনে না
