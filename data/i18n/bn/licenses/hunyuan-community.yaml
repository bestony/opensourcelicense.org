summary: গ্রহণযোগ্য ব্যবহার নীতিসহ বাণিজ্যিক ব্যবহারের অনুমতি; খুব বড় সার্ভিসের
  আলাদা লাইসেন্স লাগে, এবং কিছু অঞ্চল বাদ দেওয়া হয়েছে।
analogy: একটি বিনামূল্যের ইঞ্জিন, সঙ্গে নিয়মপুস্তিকা, আকারের সীমা এবং কোথায়
  চালানো যাবে তার মানচিত্র।
pros:
  - বেশিরভাগ ব্যবহারকারীর জন্য বাণিজ্যিক ব্যবহার
  - টেক্সট, ভিডিও ও 3D মডেল আওতায় আনে
cons:
  - ওপেন সোর্স নয়
  - আঞ্চলিক বর্জন
