summary: "ফ্রি ফন্ট লাইসেন্স: ফন্ট স্বাধীনভাবে ব্যবহার, এমবেড ও পরিবর্তন করুন,
  তবে পরিবর্তিত ফন্টে সংরক্ষিত নাম রাখা যাবে না, এবং ফন্ট আলাদাভাবে বিক্রি করা
  যাবে না।"
analogy: টাইপফেস সব জায়গায় ব্যবহার করুন, কিন্তু শুধু ফন্ট ফাইলটি বিক্রি করবেন না।
pros:
  - ডকুমেন্ট ও অ্যাপে এমবেড করার অনুমতি
  - ওপেন ফন্টের জন্য মানদণ্ড
cons:
  - সংরক্ষিত ফন্ট নাম ফর্ককে জটিল করে
  - শুধু ফন্টের জন্য
