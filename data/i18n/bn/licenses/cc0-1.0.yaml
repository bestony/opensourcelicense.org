sourceHash: d61f5398bef2c150
summary: "ডেটা ও কনটেন্টের জন্য পাবলিক ডোমেইনে উৎসর্গ, সঙ্গে একটি বিকল্প
  লাইসেন্স: কোনো শর্ত নেই, এমনকি কৃতিত্ব স্বীকারও নয়।"
analogy: ছবিটি একটি পাবলিক দেয়ালে টাঙিয়ে দিন; যে কেউ নিতে পারে।
pros:
  - কোনো শর্ত নেই
  - ওপেন ডেটার জন্য আদর্শ
cons:
  - কৃতিত্বের কোনো নিশ্চয়তা নেই
  - পেটেন্ট অনুমতি নেই
