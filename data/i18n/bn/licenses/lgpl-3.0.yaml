sourceHash: cdef0d42cb1ab51e
summary: "লাইব্রেরি-স্তরের কপিলেফট: লাইব্রেরির পরিবর্তন উন্মুক্ত থাকে; বন্ধ
  অ্যাপ এর সঙ্গে লিংক করতে পারে, যদি ব্যবহারকারীরা লাইব্রেরিটি বদলাতে পারেন।"
analogy: "একটি যৌথ ইঞ্জিন: আপনার গাড়িতে বসাতে পারেন, তবে মালিকদের এটি নিজেদের
  ইঞ্জিন দিয়ে বদলানোর সুযোগ থাকতে হবে।"
pros:
  - প্রোপ্রাইটারি অ্যাপকে লাইব্রেরি ব্যবহার করতে দেয়
  - লাইব্রেরির পরিবর্তন উন্মুক্ত থাকে
  - পেটেন্ট অনুমতি
cons:
  - রিলিংকিংয়ের নিয়ম জটিল, বিশেষত স্ট্যাটিক লিংকিং ও মোবাইলে
  - কিছু কোম্পানি এখনও এটি এড়িয়ে চলে
