sourceHash: cf76d86201254c1b
summary: "শক্তিশালী কপিলেফট: বিতরণ করা উদ্ভূত কাজ সম্পূর্ণভাবে GPL-2.0-এর অধীনে
  প্রকাশ করতে হবে। কোনো সুস্পষ্ট পেটেন্ট অনুমতি নেই; 'or later' না থাকলে
  GPL-3.0-এর সঙ্গে অসামঞ্জস্যপূর্ণ।"
analogy: রেসিপি শেয়ারের নিয়ম, এর পুরোনো সংস্করণে।
pros:
  - বিতরণ করা উদ্ভূত কাজ উন্মুক্ত রাখে
  - Linux kernel ব্যবহার করে
cons:
  - Apache-2.0 ও GPL-3.0-এর সঙ্গে অসামঞ্জস্যপূর্ণ (শুধু এই সংস্করণ হলে)
  - সুস্পষ্ট পেটেন্ট অনুমতি নেই
