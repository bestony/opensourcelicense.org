summary: "GPL-3.0-এর সঙ্গে একটি নেটওয়ার্ক ধারা: যেসব ব্যবহারকারী নেটওয়ার্কের
  মাধ্যমে কোনো পরিবর্তিত সংস্করণ ব্যবহার করেন, তাদের এর সোর্স কোড দিতে হবে।"
analogy: "রেসিপির নিয়ম রেস্তোরাঁর ক্ষেত্রেও প্রযোজ্য: খাবার পরিবেশন করাও বিতরণ
  হিসেবে গণ্য।"
pros:
  - SaaS-এর ফাঁক বন্ধ করে
  - ডুয়াল লাইসেন্সিংয়ের ভালো ভিত্তি
  - OSI-অনুমোদিত ওপেন সোর্স
cons:
  - অনেক কোম্পানি এটি সরাসরি নিষিদ্ধ করে
  - অপরিবর্তিত অবস্থায় হোস্টিং এখনও অনুমোদিত
