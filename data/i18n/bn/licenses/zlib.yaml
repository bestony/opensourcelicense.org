summary: "পারমিসিভ লাইসেন্স: পরিবর্তিত সোর্সকে পরিবর্তিত হিসেবে চিহ্নিত করতে
  হবে, মূল উৎস সম্পর্কে ভুল তথ্য দেওয়া যাবে না, এবং নোটিশ সোর্স কপিতে থাকবে।"
analogy: রেসিপি ধার নিন, কিন্তু বদলালে সেটিকে আসল রেসিপি বলে দাবি করবেন না।
pros:
  - পারমিসিভ ও ছোট
  - গেম ও নেটিভ লাইব্রেরিতে জনপ্রিয়
cons:
  - পেটেন্ট অনুমতি নেই
  - বন্ধ ফর্কের অনুমতি আছে
