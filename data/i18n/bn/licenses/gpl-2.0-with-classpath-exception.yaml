sourceHash: 841fb8980cea558f
summary: লাইব্রেরির নিজের জন্য GPL-2.0, সঙ্গে একটি ব্যতিক্রম যা স্বাধীন
  প্রোগ্রামকে যেকোনো লাইসেন্সে এর সঙ্গে লিংক করতে দেয়।
analogy: রেসিপি শেয়ারের নিয়মে একটি যৌথ ইঞ্জিন, কিন্তু আপনার নিজের গাড়ি আপনারই থাকে।
pros:
  - এর সঙ্গে লিংক করা অ্যাপ্লিকেশন বন্ধ রাখা যায়
  - OpenJDK ব্যবহার করে
cons:
  - লাইব্রেরির পরিবর্তন GPL-ই থাকে
  - GPL-3.0-only প্রজেক্টের সঙ্গে অসামঞ্জস্যপূর্ণ
