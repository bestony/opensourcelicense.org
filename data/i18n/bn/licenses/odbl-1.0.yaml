sourceHash: 6a4054dc9cca8e7e
summary: "ডেটাবেসের জন্য একই শর্তে শেয়ার: ডেটা বাণিজ্যিকভাবে ব্যবহার করা যায়,
  তবে প্রকাশ্য উদ্ভূত ডেটাবেস ODbL-এর অধীনেই থাকতে হবে। মানচিত্র বা ছবির মতো
  উৎপাদিত কাজে শুধু কৃতিত্ব লাগে।"
analogy: যৌথ মানচিত্রের ওপর কাজ করুন, আর উন্নত মানচিত্র ডেটাবেস প্রকাশ করলে একই
  শর্তে ফেরত শেয়ার করুন।
pros:
  - উন্নত ডেটাবেস উন্মুক্ত রাখে
  - বাণিজ্যিক ব্যবহারের অনুমতি
  - OpenStreetMap-এ প্রমাণিত
cons:
  - একই শর্তে শেয়ারের নিয়ম অন্য ডেটার সঙ্গে মিশ্রণে বাধা দিতে পারে
  - “উদ্ভূত ডেটাবেস” কখনও কখনও অস্পষ্ট
