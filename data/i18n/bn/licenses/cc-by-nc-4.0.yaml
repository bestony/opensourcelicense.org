summary: "কনটেন্ট ও ডেটার জন্য: কৃতিত্ব স্বীকার বাধ্যতামূলক এবং বাণিজ্যিক
  ব্যবহার অনুমোদিত নয়।"
analogy: ছবিটি স্বাধীনভাবে শেয়ার করুন, তবে বিজ্ঞাপনে বা বিক্রির পণ্যে নয়।
pros:
  - বাণিজ্যিক পুনর্ব্যবহার আটকায়
  - অফিসিয়াল অনুবাদ আছে
cons:
  - OSI বা Open Definition অনুযায়ী উন্মুক্ত নয়
  - “অবাণিজ্যিক” প্রায়ই অস্পষ্ট
  - অনেক বৈধ ব্যবহারও আটকায়
