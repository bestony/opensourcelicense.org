summary: AGPL-এর মতো, তবে সফটওয়্যারটি সার্ভিস হিসেবে দিলে পুরো সার্ভিস
  স্ট্যাকের সোর্স প্রকাশ করতে হয়। OSI-অনুমোদিত নয়।
analogy: এই পদ পরিবেশনকারী রেস্তোরাঁ চালালে আপনার রান্নাঘরের নকশাও প্রকাশ করতে হবে।
pros:
  - ক্লাউড কোম্পানির বিরুদ্ধে শক্তিশালী সুরক্ষা
cons:
  - OSI অনুযায়ী ওপেন সোর্স নয়
  - অনেক ডিস্ট্রিবিউশন এটি প্রত্যাখ্যান করেছে
  - কমিউনিটি ফর্কের কারণ হতে পারে
