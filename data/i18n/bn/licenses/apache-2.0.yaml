sourceHash: 637c87bc846f9159
summary: সুস্পষ্ট পেটেন্ট অনুমতি, পেটেন্ট প্রতিশোধ ধারা এবং পরিবর্তিত ফাইল
  চিহ্নিত করার শর্তসহ একটি পারমিসিভ লাইসেন্স।
analogy: একটি বিনামূল্যের টুলকিট, সঙ্গে প্রতিশ্রুতি যে এর পেটেন্ট নিয়ে আপনার
  বিরুদ্ধে মামলা হবে না — যদি না আপনি আগে মামলা করেন।
pros:
  - প্রত্যেক অবদানকারীর কাছ থেকে সুস্পষ্ট পেটেন্ট অনুমতি
  - অনেক কোম্পানি ও ফাউন্ডেশনের পছন্দ
  - ট্রেডমার্ক সুরক্ষা করে
cons:
  - দীর্ঘ; NOTICE ফাইল সামলাতে হয়
  - GPL-2.0-only-এর সঙ্গে সামঞ্জস্যপূর্ণ নয়
  - হোস্টেড প্রতিযোগীদের আটকায় না
