summary: যেখানে সম্ভব, কাজটিকে পাবলিক ডোমেইনে উৎসর্গ করে, সঙ্গে একটি পারমিসিভ
  বিকল্প। কৃতিত্ব দিতে হয় না।
analogy: "পার্কের বেঞ্চে নামহীন একটি বই রেখে যাওয়া: যে কেউ নিতে পারে।"
pros:
  - কোনো শর্তই নেই
  - যেকোনো কিছুর সঙ্গে মেশানো সহজ
cons:
  - পাবলিক ডোমেইনে উৎসর্গ সব দেশে স্বীকৃত নয়
  - আইনি অনিশ্চয়তার কারণে কিছু কোম্পানি এটি এড়িয়ে চলে
