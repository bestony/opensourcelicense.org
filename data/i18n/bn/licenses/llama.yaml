summary: "একটি কাস্টম মডেল লাইসেন্স: বাণিজ্যিক ব্যবহারের অনুমতি, সঙ্গে
  Acceptable Use Policy, কৃতিত্ব ও নামকরণের নিয়ম, এবং মাসিক 70 কোটির বেশি
  সক্রিয় ব্যবহারকারী হলে আলাদা লাইসেন্স।"
analogy: বিনামূল্যে ব্যবহারযোগ্য একটি ইঞ্জিন নিয়মপুস্তিকাসহ, আর সবচেয়ে বড়
  গাড়ি নির্মাতাদের জন্য বিশেষ চুক্তি।
pros:
  - বেশিরভাগ ব্যবহারকারীর জন্য বাণিজ্যিক ব্যবহারের অনুমতি
  - বড় ইকোসিস্টেম
cons:
  - OSI অনুযায়ী ওপেন সোর্স নয়
  - ব্যবহার নীতি ও নামকরণের বাধ্যবাধকতা
  - সংস্করণভেদে শর্ত বদলায়
