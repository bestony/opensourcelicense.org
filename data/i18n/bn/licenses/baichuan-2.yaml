summary: নিবন্ধনের পর, দৈনিক দশ লাখের কম সক্রিয় ব্যবহারকারীর সার্ভিসের জন্য
  বিনামূল্যে বাণিজ্যিক ব্যবহার; বড় সার্ভিসের জন্য আলাদা লাইসেন্স লাগে।
analogy: ছোট বহরের জন্য বিনামূল্যের ইঞ্জিন, গাড়ি নিবন্ধনের পর।
pros:
  - বেশিরভাগ বাণিজ্যিক ব্যবহারকারীর জন্য বিনামূল্যে
  - শক্তিশালী চীনা ভাষার মডেল
cons:
  - ওপেন সোর্স নয়
  - নিবন্ধন ও ব্যবহারকারীর সীমা
