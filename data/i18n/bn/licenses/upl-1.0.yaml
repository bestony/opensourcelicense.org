sourceHash: ddb7b2f148c13edb
summary: সুস্পষ্ট পেটেন্ট অনুমতিসহ একটি ছোট পারমিসিভ লাইসেন্স, যা Oracle GraalVM
  ও অন্যান্য প্রজেক্টে ব্যবহার করে।
analogy: MIT-এর বিনামূল্যের বই, পেটেন্ট নিয়ে একটি বাড়তি প্রতিশ্রুতিসহ।
pros:
  - ছোট ও পারমিসিভ
  - সুস্পষ্ট পেটেন্ট অনুমতি
cons:
  - পেটেন্ট প্রতিশোধ ধারা নেই
  - MIT বা Apache-এর চেয়ে কম পরিচিত
