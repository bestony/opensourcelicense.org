summary: "LaTeX প্যাকেজের জন্য ফ্রি লাইসেন্স: পরিবর্তিত ফাইলের নাম বদলাতে বা
  স্পষ্টভাবে চিহ্নিত করতে হবে, যাতে ডকুমেন্ট সব জায়গায় একইভাবে কাজ করে।"
analogy: টাইপফেস বদলাতে পারেন, কিন্তু আপনার সংস্করণকে নতুন নাম দিন।
pros:
  - ডকুমেন্ট পুনরুৎপাদনযোগ্য রাখে
  - CTAN-এ মানদণ্ড
cons:
  - নাম বদলের নিয়মটি অস্বাভাবিক
  - GPL-সামঞ্জস্যপূর্ণ নয়
