summary: পেটেন্ট অনুমতি ও প্রতিশোধ ধারাসহ একটি চীনা পারমিসিভ লাইসেন্স। চীনা ও
  ইংরেজি পাঠ্য সমানভাবে বৈধ; বিরোধে চীনা পাঠ্য প্রাধান্য পায়।
analogy: চীনা আইন মাথায় রেখে লেখা Apache-ধাঁচের সুরক্ষা।
pros:
  - অফিসিয়াল দ্বিভাষিক পাঠ্য
  - পেটেন্ট অনুমতি
  - OSI-অনুমোদিত
cons:
  - চীনের বাইরে কম পরিচিত
  - সীমিত বিচারিক নজির
