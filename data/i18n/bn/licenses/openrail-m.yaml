summary: "মডেলের জন্য Responsible AI License: পারমিসিভ শর্ত ও ব্যবহারভিত্তিক
  বিধিনিষেধ, যা প্রতিটি উদ্ভূত কাজকে পরবর্তীদের কাছে পৌঁছে দিতে হবে।"
analogy: একটি বিনামূল্যের যন্ত্র, যার নিষিদ্ধ ব্যবহারের তালিকা প্রতিটি কপির সঙ্গে যায়।
pros:
  - বাণিজ্যিক ব্যবহারের অনুমতি
  - ক্ষতিকর ব্যবহারের বিধিনিষেধ পরবর্তী ধাপেও বজায় রাখে
cons:
  - OSI অনুযায়ী ওপেন সোর্স নয়
  - বিধিনিষেধ কার্যকর করা কঠিন
  - একাধিক রূপ আছে
