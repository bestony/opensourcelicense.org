sourceHash: 3440c6c6f7e1c94d
summary: "Apple-এর ফাইল-স্তরের কপিলেফট: আওতাভুক্ত পরিবর্তিত ফাইল প্রকাশ করতে
  হবে, বাইরে সার্ভিস হিসেবে চালালেও। GPL-এর সঙ্গে অসামঞ্জস্যপূর্ণ।"
analogy: ধার করা ফাইলের পরিবর্তন শেয়ার করুন, এমনকি যখন আপনি শুধু ফলাফল পরিবেশন করেন।
pros:
  - বাহ্যিক ডিপ্লয়মেন্টও আওতায় আনে
  - পেটেন্ট অনুমতি
cons:
  - GPL-এর সঙ্গে অসামঞ্জস্যপূর্ণ
  - মূলত Apple-এর ওপেন সোর্সে সীমাবদ্ধ
