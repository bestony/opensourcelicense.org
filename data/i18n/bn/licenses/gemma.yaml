sourceHash: c826929f8a1baf2e
summary: "Google-এর মডেল শর্তাবলি: বাণিজ্যিক ব্যবহারের অনুমতি, সঙ্গে নিষিদ্ধ
  ব্যবহার নীতি যা ডিস্টিল করা মডেলসহ প্রতিটি উদ্ভূত কাজে প্রযোজ্য।"
analogy: একটি বিনামূল্যের ইঞ্জিন, যার নিয়মপুস্তিকা প্রতিটি পুনর্নির্মিত
  ইঞ্জিনের সঙ্গে থাকতে হবে।
pros:
  - ব্যবহারকারীর সীমা ছাড়া বাণিজ্যিক ব্যবহার
  - উদ্ভূত কাজের স্পষ্ট নিয়ম
cons:
  - OSI অনুযায়ী ওপেন সোর্স নয়
  - Google ব্যবহার নীতি হালনাগাদ করতে পারে
