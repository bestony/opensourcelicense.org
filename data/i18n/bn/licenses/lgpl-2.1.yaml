summary: "লাইব্রেরি কপিলেফট: লাইব্রেরির পরিবর্তন উন্মুক্ত থাকে; বন্ধ প্রোগ্রাম
  এর সঙ্গে লিংক করতে পারে, যদি ব্যবহারকারীরা পরিবর্তিত লাইব্রেরি দিয়ে রিলিংক
  করতে পারেন।"
analogy: বদলযোগ্য যৌথ ইঞ্জিনের পুরোনো সংস্করণ।
pros:
  - প্রোপ্রাইটারি অ্যাপকে লাইব্রেরি ব্যবহার করতে দেয়
  - ডেস্কটপ ও মাল্টিমিডিয়া লাইব্রেরিতে প্রচলিত
cons:
  - রিলিংকিংয়ের নিয়ম জটিল
  - সুস্পষ্ট পেটেন্ট অনুমতি নেই
