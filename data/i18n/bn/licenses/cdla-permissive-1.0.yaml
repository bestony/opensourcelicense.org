summary: "Linux Foundation-এর পারমিসিভ ডেটা লাইসেন্স: ডেটা স্বাধীনভাবে ব্যবহার ও
  শেয়ার করুন; প্রশিক্ষিত মডেলের মতো ফলাফলে কোনো বিধিনিষেধ নেই।"
