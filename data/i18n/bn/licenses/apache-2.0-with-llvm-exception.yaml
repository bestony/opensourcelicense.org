sourceHash: ded3362d69058c2a
summary: Apache-2.0-এর সঙ্গে একটি ব্যতিক্রম, যা কম্পাইল করা কোডের জন্য কৃতিত্ব
  স্বীকারের শর্ত তুলে দেয় এবং GPL-2.0 প্রজেক্টের সঙ্গে ব্যবহারযোগ্য করে।
analogy: Apache-এর টুলকিট, সঙ্গে একটি নোট যে আপনার পণ্যে থেকে যাওয়া টুলের অংশের
  জন্য কৃতিত্ব দিতে হবে না।
pros:
  - Apache-2.0-এর পেটেন্ট অনুমতি
  - GPL-2.0 কোডের সঙ্গে কাজ করে
cons:
  - MIT-এর চেয়ে দীর্ঘ
  - ব্যতিক্রমটি কম্পাইলার-জাতীয় প্রজেক্টের জন্য নির্দিষ্ট
