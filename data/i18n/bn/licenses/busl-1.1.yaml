sourceHash: ce104e1cd96e85b1
summary: "সোর্স-উপলব্ধ: প্রোডাকশন ব্যবহার Additional Use Grant দ্বারা সীমিত, এবং
  প্রতিটি সংস্করণ Change Date-এর (সর্বোচ্চ 4 বছর) পরে একটি ওপেন লাইসেন্সে
  রূপান্তরিত হয়।"
analogy: "দোকানের শোকেস: দেখতে ও চেষ্টা করতে পারেন, আর কয়েক বছর পর জিনিসটি সবার
  জন্য বিনামূল্যে হয়ে যায়।"
pros:
  - বাণিজ্যিক ব্যবহার নিয়ন্ত্রণ করতে দেয়
  - কোড পরে ওপেন সোর্স হয়
cons:
  - ওপেন সোর্স নয়
  - অনুমতির শর্ত প্রজেক্ট ভেদে ভিন্ন
  - ফর্কের কারণ হতে পারে
