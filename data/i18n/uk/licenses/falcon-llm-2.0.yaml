summary: Ліцензія моделі від TII на основі Apache-2.0 з політикою допустимого
  використання; комерційне використання дозволене без роялті.
analogy: Набір інструментів Apache з коротким списком заборонених способів використання.
pros:
  - Комерційне використання без роялті
  - Заснована на Apache-2.0
cons:
  - Не є open source за визначенням OSI
  - Політику використання можуть оновлювати
