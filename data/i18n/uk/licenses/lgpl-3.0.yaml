sourceHash: cdef0d42cb1ab51e
summary: "Копілефт на рівні бібліотеки: зміни бібліотеки залишаються відкритими;
  закриті застосунки можуть із нею компонуватися, якщо користувачі можуть
  замінити бібліотеку."
analogy: "Спільний двигун: можна поставити його у своє авто, але власники мають
  мати змогу замінити його на власний."
pros:
  - Дозволяє пропрієтарним застосункам використовувати бібліотеку
  - Зміни бібліотеки залишаються відкритими
  - Патентна ліцензія
cons:
  - Правила повторного компонування складні, особливо для статичного
    компонування та мобільних пристроїв
  - Деякі компанії досі її уникають
