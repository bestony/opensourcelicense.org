summary: "Копілефт на рівні файлу: зміни у файлах під MPL мають залишатися
  відкритими, але їх можна поєднувати із закритим кодом в інших файлах."
analogy: Позичили розділ — діліться своїми правками до нього, але решта книжки ваша.
pros:
  - Баланс між дозвільними ліцензіями та копілефтом
  - Явна патентна ліцензія
  - За замовчуванням сумісна з GPL
cons:
  - Межі файлів можуть бути нечіткими
  - Не охоплює використання через мережу
