summary: "Як MIT: використовуйте код вільно; зберігайте повідомлення про
  авторське право та відмову від гарантій у вихідних і бінарних копіях."
analogy: "Безкоштовна картка з рецептом: копіюйте її куди завгодно, лише залиште
  внизу рядок з автором."
pros:
  - Дуже коротка й дозвільна
  - Широко використовується в системах BSD
cons:
  - Немає патентної ліцензії
  - Закриті форки дозволені
