summary: "Копілефт для посібників: копії та модифіковані версії мають залишатися
  під GFDL зі збереженням історії та незмінних розділів."
analogy: Правило «поділися рецептом» для посібника до кулінарної книги.
pros:
  - Зберігає документацію вільною
  - Використовується в посібниках GNU
cons:
  - Незмінні розділи викликають суперечки
  - Важко поєднувати з контентом CC
