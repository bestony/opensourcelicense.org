summary: "MIT без вимоги зазначати авторство: використовуйте, копіюйте й
  продавайте, не зберігаючи жодних повідомлень."
analogy: Безкоштовна книжка, яку можна навіть переплести без імені автора.
pros:
  - Зазначати авторство не потрібно
  - Добре підходить для прикладів і фрагментів коду
cons:
  - Немає патентної ліцензії
  - Автори не мають гарантованого зазначення
