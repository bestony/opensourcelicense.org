summary: "Умови моделей Google: комерційне використання дозволене, з політикою
  заборонених способів використання, що переходить на кожен похідний твір,
  зокрема дистильовані моделі."
analogy: Безкоштовний двигун зі зводом правил, який має супроводжувати кожен
  перебудований двигун.
pros:
  - Комерційне використання без порогу кількості користувачів
  - Чіткі правила для похідних творів
cons:
  - Не є open source за визначенням OSI
  - Google може оновлювати політику використання
