summary: "Власна ліцензія моделі: комерційне використання дозволене, з
  Acceptable Use Policy, правилами зазначення авторства та назв і окремою
  ліцензією понад 700 млн щомісячних активних користувачів."
analogy: Безкоштовний двигун зі зводом правил і спеціальним контрактом для
  найбільших автовиробників.
pros:
  - Комерційне використання дозволене для більшості користувачів
  - Велика екосистема
cons:
  - Не є open source за визначенням OSI
  - Зобов'язання щодо політики використання та назв
  - Умови змінюються між версіями
