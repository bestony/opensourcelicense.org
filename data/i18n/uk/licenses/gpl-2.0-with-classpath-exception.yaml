sourceHash: 841fb8980cea558f
summary: GPL-2.0 для самої бібліотеки плюс виняток, що дозволяє незалежним
  програмам компонуватися з нею під будь-якою ліцензією.
analogy: Спільний двигун за правилом «поділися рецептом», але ваше авто
  залишається вашим.
pros:
  - Застосунки, що з нею компонуються, можуть бути закритими
  - Використовується в OpenJDK
cons:
  - Зміни бібліотеки залишаються під GPL
  - Несумісна з проєктами під GPL-3.0-only
