sourceHash: ded3362d69058c2a
summary: Apache-2.0 з винятком, який знімає вимогу зазначати авторство для
  скомпільованого коду і дозволяє використовувати його в проєктах під GPL-2.0.
analogy: Набір інструментів Apache з приміткою, що залишки інструментів у вашому
  продукті не потребують зазначення автора.
pros:
  - Патентна ліцензія з Apache-2.0
  - Працює з кодом під GPL-2.0
cons:
  - Довша за MIT
  - Виняток розрахований на проєкти на кшталт компіляторів
