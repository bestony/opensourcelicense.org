summary: "Копілефт на рівні файлу від Apple: змінені файли, на які поширюється
  ліцензія, треба опублікувати, зокрема й у разі зовнішнього розгортання як
  сервісу. Несумісна з GPL."
analogy: Діліться змінами в позиченому файлі, навіть якщо лише надаєте результат.
pros:
  - Охоплює зовнішнє розгортання
  - Патентна ліцензія
cons:
  - Несумісна з GPL
  - Здебільшого обмежена open source-проєктами Apple
