summary: "Копілефт для контенту: будь-яке використання із зазначенням авторства,
  а адаптаціями треба ділитися під тією самою ліцензією."
analogy: Переробляйте фото вільно, але діліться своєю переробкою на тих самих умовах.
pros:
  - Зберігає адаптації відкритими
  - Використовується у Вікіпедії
cons:
  - Вимога тих самих умов може заважати поєднанню
  - Не призначена для програмного забезпечення
