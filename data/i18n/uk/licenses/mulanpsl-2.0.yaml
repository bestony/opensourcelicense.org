summary: Китайська дозвільна ліцензія з патентною ліцензією та положенням про
  відповідь. Китайський та англійський тексти рівноцінні; у разі розбіжностей
  переважає китайський.
analogy: Захист у стилі Apache, написаний з урахуванням китайського права.
pros:
  - Офіційний двомовний текст
  - Патентна ліцензія
  - Схвалена OSI
cons:
  - Менш відома за межами Китаю
  - Обмежена судова практика
