summary: "Для контенту: зазначення авторства, без комерційного використання, а
  адаптації — під тією самою ліцензією."
analogy: Поширюйте й переробляйте конспекти лекцій, ніколи не заради прибутку,
  завжди на тих самих умовах.
pros:
  - Блокує комерційне повторне використання
  - Поширена для навчальних матеріалів
cons:
  - Не є відкритою за Open Definition
  - «Некомерційне» часто трактується нечітко
