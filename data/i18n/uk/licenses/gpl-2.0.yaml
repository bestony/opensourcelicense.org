summary: "Сильний копілефт: похідні твори, що розповсюджуються, треба повністю
  випускати під GPL-2.0. Немає явної патентної ліцензії; несумісна з GPL-3.0,
  якщо не використано «or later»."
analogy: Правило «поділися рецептом» у старішому виданні.
pros:
  - Зберігає відкритими похідні твори, що розповсюджуються
  - Використовується в ядрі Linux
cons:
  - Несумісна з Apache-2.0 і GPL-3.0 (лише ця версія)
  - Немає явної патентної ліцензії
