summary: "Вільна ліцензія для пакетів LaTeX: змінені файли треба перейменувати
  або чітко позначити, щоб документи всюди працювали однаково."
analogy: Ви можете змінити шрифт, але дайте своїй версії нову назву.
pros:
  - Забезпечує відтворюваність документів
  - Стандарт у CTAN
cons:
  - Незвичне правило перейменування
  - Несумісна з GPL
