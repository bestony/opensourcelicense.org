sourceHash: 637c87bc846f9159
summary: Дозвільна ліцензія з явною патентною ліцензією, патентною відповіддю та
  вимогою позначати змінені файли.
analogy: Безкоштовний набір інструментів з обіцянкою не судитися з вами через
  його патенти — якщо ви не подасте позов першим.
pros:
  - Явна патентна ліцензія від кожного контриб'ютора
  - Її віддають перевагу багато компаній і фондів
  - Захищає торговельні марки
cons:
  - Довша; потрібно працювати з файлом NOTICE
  - Несумісна з GPL-2.0-only
  - Не зупиняє конкурентів, що надають її як хостинговий сервіс
