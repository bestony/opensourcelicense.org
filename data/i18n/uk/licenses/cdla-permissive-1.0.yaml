summary: "Дозвільна ліцензія для даних від Linux Foundation: вільно
  використовуйте й поширюйте дані; результати, як-от навчені моделі, не
  обмежуються."
analogy: Використовуйте набір даних для чого завгодно; додавайте угоду, коли
  передаєте дані далі.
pros:
  - Явно звільняє результати обчислень
  - Створена спеціально для даних
cons:
  - Менш відома, ніж ліцензії CC
  - Версія 2.0 простіша
