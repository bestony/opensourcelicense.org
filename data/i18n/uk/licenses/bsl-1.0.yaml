summary: Дозвільна ліцензія; повідомлення обов'язкове у вихідних копіях, але не
  в скомпільованих бінарних файлах.
analogy: Залиште ім'я автора в кулінарній книзі, а не на кожній тарілці, яку подаєте.
pros:
  - Повідомлення в бінарних файлах не потрібне
  - Стандарт для бібліотек C++
cons:
  - Немає патентної ліцензії
  - Менш відома поза C++
