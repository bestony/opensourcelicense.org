summary: "Дозвільна ліцензія: змінений вихідний код треба позначити як змінений,
  не можна спотворювати походження, а повідомлення залишається у вихідних
  копіях."
analogy: Позичте рецепт, але якщо змінили його, не видавайте за оригінал.
pros:
  - Дозвільна й коротка
  - Популярна в іграх і нативних бібліотеках
cons:
  - Немає патентної ліцензії
  - Закриті форки дозволені
