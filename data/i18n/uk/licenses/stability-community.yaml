summary: Безкоштовна для досліджень, некомерційного використання та комерційного
  використання з річним доходом до 1 млн доларів США; більшим компаніям потрібна
  корпоративна ліцензія.
analogy: Вхід безкоштовний для малого бізнесу; великі купують квиток.
pros:
  - Безкоштовна для приватних осіб і малих компаній
  - Охоплює нові моделі Stability
cons:
  - Не є open source
  - Поріг доходу потрібно відстежувати
