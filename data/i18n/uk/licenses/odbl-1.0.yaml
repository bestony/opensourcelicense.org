sourceHash: 6a4054dc9cca8e7e
summary: "Принцип «на тих самих умовах» для баз даних: дані можна
  використовувати комерційно, але публічні похідні бази даних мають залишатися
  під ODbL. Створені твори, як-от мапи чи зображення, потребують лише зазначення
  авторства."
analogy: Будуйте на спільній мапі, а якщо публікуєте покращену базу даних мапи,
  діліться нею на тих самих умовах.
pros:
  - Зберігає покращені бази даних відкритими
  - Комерційне використання дозволене
  - Перевірена на OpenStreetMap
cons:
  - Вимога тих самих умов може заважати поєднанню з іншими даними
  - «Похідна база даних» інколи трактується нечітко
