sourceHash: 5941dce0a6108d60
summary: Слабкий копілефт на рівні модуля з патентною ліцензією; для сумісності
  може вказувати GPL як вторинну ліцензію.
analogy: Діліться своїми змінами в позиченому розділі; решта книжки — ваша.
pros:
  - Копілефт, дружній до бізнесу
  - Патентна ліцензія
cons:
  - Сумісність із GPL лише із заявленою вторинною ліцензією
  - Межі модулів можуть бути нечіткими
