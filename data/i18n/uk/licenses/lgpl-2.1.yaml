sourceHash: 22649412ed3dbb5f
summary: "Бібліотечний копілефт: зміни бібліотеки залишаються відкритими;
  закриті програми можуть із нею компонуватися, якщо користувачі можуть повторно
  скомпонувати їх із модифікованою бібліотекою."
analogy: Старіше видання змінного спільного двигуна.
pros:
  - Дозволяє пропрієтарним застосункам використовувати бібліотеку
  - Поширена в десктопних і мультимедійних бібліотеках
cons:
  - Правила повторного компонування складні
  - Немає явної патентної ліцензії
