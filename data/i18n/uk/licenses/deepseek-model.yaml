summary: "Ліцензія моделі в стилі OpenRAIL: комерційне використання дозволене, з
  обмеженнями за способом використання, що переходять на похідні твори."
analogy: Безкоштовний інструмент зі списком заборонених способів використання,
  доданим до кожної копії.
pros:
  - Комерційне використання дозволене
  - Обмеження використання передаються далі
cons:
  - Не є open source за визначенням OSI
  - Новіші моделі DeepSeek перейшли на MIT
