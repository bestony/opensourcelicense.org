sourceHash: f723aee8de4d57cd
summary: Передає твір у суспільне надбання, де це можливо, з дозвільною
  резервною ліцензією. Зазначати авторство не потрібно.
analogy: "Залишити книжку на лавці в парку без імені всередині: будь-хто може її взяти."
pros:
  - Жодних умов
  - Легко поєднувати з чим завгодно
cons:
  - Передання в суспільне надбання визнається не в усіх країнах
  - Деякі компанії уникають її через юридичну невизначеність
