summary: "Вільна ліцензія для шрифтів: вільно використовуйте, вбудовуйте й
  змінюйте шрифти, але змінені шрифти мають відмовитися від зарезервованих назв,
  а самі шрифти не можна продавати окремо."
analogy: Використовуйте шрифт усюди, але не продавайте сам файл шрифту.
pros:
  - Дозволяє вбудовування в документи й застосунки
  - Стандарт для відкритих шрифтів
cons:
  - Зарезервовані назви шрифтів ускладнюють форки
  - Лише для шрифтів
