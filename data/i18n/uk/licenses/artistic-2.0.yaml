summary: Дозволяє вільно змінювати й розповсюджувати, але модифіковану версію
  треба чітко позначити чи перейменувати або відкрити її вихідний код. Містить
  патентні положення.
analogy: Робіть ремікс пісні, але не продавайте його як оригінал.
pros:
  - Захищає ідентичність оригіналу
  - Сумісна з GPL
cons:
  - Умови багатослівні
  - Рідко трапляється поза Raku та Perl
