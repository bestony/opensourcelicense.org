summary: Подібна до AGPL, але надання ПЗ як сервісу вимагає відкрити вихідний
  код усього стека сервісу. Не схвалена OSI.
analogy: Якщо у вашому ресторані подають цю страву, ви маєте опублікувати й
  креслення своєї кухні.
pros:
  - Сильний захист від хмарних провайдерів
cons:
  - Не є open source за визначенням OSI
  - Відхилена багатьма дистрибутивами
  - Може спровокувати форки спільноти
