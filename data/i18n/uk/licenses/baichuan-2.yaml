summary: Безкоштовне комерційне використання для сервісів із менш ніж мільйоном
  щоденних активних користувачів після реєстрації; більшим сервісам потрібна
  окрема ліцензія.
analogy: Безкоштовний двигун для невеликих автопарків, якщо зареєструвати авто.
pros:
  - Безкоштовна для більшості комерційних користувачів
  - Сильні моделі для китайської мови
cons:
  - Не є open source
  - Реєстрація та поріг кількості користувачів
