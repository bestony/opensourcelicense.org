summary: "Ліцензія Responsible AI для моделей: дозвільні умови плюс обмеження за
  способом використання, які кожен похідний твір має передавати далі."
analogy: Безкоштовний інструмент зі списком заборонених способів використання,
  що мандрує з кожною копією.
pros:
  - Дозволяє комерційне використання
  - Зберігає обмеження шкідливого використання далі за ланцюжком
cons:
  - Не є open source за визначенням OSI
  - Обмеження важко забезпечити на практиці
  - Існує кілька варіантів
