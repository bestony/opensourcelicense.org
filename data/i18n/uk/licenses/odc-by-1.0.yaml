sourceHash: 7c50fe5f1b7f3c7d
summary: "Для баз і наборів даних: будь-яке використання, зокрема комерційне, за
  умови збереження повідомлення про авторство. Твори, створені з даних, також
  потребують такого повідомлення."
analogy: Використовуйте картографічні дані будь-де, лише вкажіть, звідки вони.
pros:
  - Просте правило зазначення авторства
  - Поширена для великих навчальних корпусів ШІ
  - Охоплює права на бази даних, а не лише авторське право
cons:
  - Не призначена для програмного забезпечення
  - Немає патентної ліцензії
