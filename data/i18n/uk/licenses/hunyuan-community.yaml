summary: Комерційне використання дозволене з політикою допустимого використання;
  дуже великим сервісам потрібна окрема ліцензія, а деякі території виключено.
analogy: Безкоштовний двигун зі зводом правил, обмеженням розміру та мапою, де
  ним можна їздити.
pros:
  - Комерційне використання для більшості користувачів
  - Охоплює текстові, відео- та 3D-моделі
cons:
  - Не є open source
  - Територіальні винятки
