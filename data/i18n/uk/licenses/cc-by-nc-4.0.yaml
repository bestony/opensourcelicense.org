summary: "Для контенту й даних: потрібно зазначати авторство, комерційне
  використання заборонене."
analogy: Поширюйте фото вільно, але не в рекламі й не в продуктах, які продаєте.
pros:
  - Блокує комерційне повторне використання
  - Офіційні переклади
cons:
  - Не є відкритою за OSI чи Open Definition
  - «Некомерційне» часто трактується нечітко
  - Блокує багато законних способів використання
