summary: "Source-available: виробниче використання обмежує Additional Use Grant,
  а кожна версія переходить на відкриту ліцензію після Change Date (макс. 4
  роки)."
analogy: "Вітрина магазину: можна дивитися й приміряти, а за кілька років товар
  стає безкоштовним для всіх."
pros:
  - Дає змогу контролювати комерційне використання
  - Згодом код стає open source
cons:
  - Не є open source
  - Умови Grant різняться від проєкту до проєкту
  - Може спровокувати форки
