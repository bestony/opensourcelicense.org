summary: "GPL-3.0 з мережевим положенням: користувачам, які взаємодіють із
  модифікованою версією через мережу, треба запропонувати її вихідний код."
analogy: "Правило рецепта діє й для ресторанів: подати страву — те саме, що роздати її."
pros:
  - Закриває лазівку SaaS
  - Хороша основа для подвійного ліцензування
  - Open source, схвалений OSI
cons:
  - Багато компаній повністю її забороняють
  - Хостинг немодифікованої версії все одно дозволено
