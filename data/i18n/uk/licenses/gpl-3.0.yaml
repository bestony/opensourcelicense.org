summary: "Сильний копілефт: якщо ви розповсюджуєте ПЗ або похідні твори, ви
  маєте відкрити повний вихідний код під GPL-3.0."
analogy: "Рецепт, у якому сказано: хто подає страву за ним, мусить роздати й
  повний рецепт."
pros:
  - Зберігає відкритими всі похідні твори, що розповсюджуються
  - Патентна ліцензія та захист від тівоїзації
  - Сильна традиція спільноти
cons:
  - Багато компаній її уникають
  - Не охоплює SaaS (немає розповсюдження)
  - Несумісна з GPL-2.0-only
