summary: Przekazuje utwór do domeny publicznej tam, gdzie to możliwe, z
  permisywną licencją zapasową. Uznanie autorstwa nie jest wymagane.
analogy: "Zostawienie książki na ławce w parku bez nazwiska w środku: każdy może
  ją wziąć."
pros:
  - Żadnych warunków
  - Łatwo łączyć z czymkolwiek
cons:
  - Przekazanie do domeny publicznej nie jest uznawane w każdym kraju
  - Niektóre firmy unikają jej z powodu niepewności prawnej
