summary: ใช้เชิงพาณิชย์ได้ฟรีสำหรับบริการที่มีผู้ใช้งานรายวันต่ำกว่าหนึ่งล้านราย
  หลังลงทะเบียน บริการที่ใหญ่กว่าต้องขอไลเซนส์แยก
analogy: เครื่องยนต์ฟรีสำหรับกองรถขนาดเล็ก หลังจากคุณลงทะเบียนรถแล้ว
pros:
  - ฟรีสำหรับผู้ใช้เชิงพาณิชย์ส่วนใหญ่
  - โมเดลภาษาจีนที่แข็งแกร่ง
cons:
  - ไม่ใช่โอเพนซอร์ส
  - ต้องลงทะเบียนและมีเกณฑ์จำนวนผู้ใช้
