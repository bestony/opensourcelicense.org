summary: "สำหรับเนื้อหา: ต้องระบุที่มา ห้ามใช้เชิงพาณิชย์
  และงานดัดแปลงต้องใช้ไลเซนส์เดียวกัน"
analogy: แชร์และรีมิกซ์เอกสารประกอบการสอนได้ แต่ห้ามหากำไร
  และต้องใช้เงื่อนไขเดียวกันเสมอ
pros:
  - ป้องกันการนำไปใช้ซ้ำเชิงพาณิชย์
  - นิยมใช้กับสื่อการเรียนการสอน
cons:
  - ไม่เปิดตามเกณฑ์ Open Definition
  - คำว่า "ไม่ใช่เชิงพาณิชย์" มักไม่ชัดเจน
