summary: "สำหรับเนื้อหา ข้อมูล และเอกสาร: ใช้ได้ทุกรูปแบบรวมถึงเชิงพาณิชย์
  โดยต้องระบุที่มาและระบุการเปลี่ยนแปลง"
analogy: แชร์ภาพถ่ายไปที่ไหนก็ได้ แค่ให้เครดิตช่างภาพ
pros:
  - กฎการระบุที่มาเรียบง่าย
  - เหมาะกับข้อมูลและเอกสาร
  - มีคำแปลอย่างเป็นทางการ
cons:
  - ไม่ได้ออกแบบมาสำหรับซอฟต์แวร์
  - ไม่มีการให้สิทธิบัตร
