summary: "ไลเซนส์เสรีสำหรับแพ็กเกจ LaTeX:
  ไฟล์ที่แก้ไขต้องเปลี่ยนชื่อหรือระบุให้ชัดเจน
  เพื่อให้เอกสารแสดงผลเหมือนเดิมทุกที่"
analogy: คุณปรับแต่งแบบอักษรได้ แต่ต้องตั้งชื่อใหม่ให้เวอร์ชันของคุณ
pros:
  - ทำให้เอกสารสร้างซ้ำได้เหมือนเดิม
  - เป็นมาตรฐานทั่วทั้ง CTAN
cons:
  - กฎการเปลี่ยนชื่อไม่ธรรมดา
  - เข้ากันไม่ได้กับ GPL
