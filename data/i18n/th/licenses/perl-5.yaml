summary: "ไลเซนส์คู่ของ Perl: ผู้รับเลือกได้ระหว่าง Artistic License 1.0 หรือ
  GPL (เวอร์ชัน 1 ขึ้นไป)"
analogy: เลือกคู่มือกฎเล่มใดเล่มหนึ่งจากสองเล่มที่เหมาะกับคุณ
pros:
  - เลือกได้ระหว่างเงื่อนไขกึ่งผ่อนปรนกับ copyleft
  - เป็นมาตรฐานสำหรับโมดูล CPAN
cons:
  - Artistic 1.0 คลุมเครือ
  - ไม่มีการให้สิทธิบัตร
