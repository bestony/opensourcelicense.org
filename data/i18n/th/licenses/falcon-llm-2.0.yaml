summary: ไลเซนส์โมเดลจาก TII ที่อิงกับ Apache-2.0
  พร้อมนโยบายการใช้งานที่ยอมรับได้ ใช้เชิงพาณิชย์ได้โดยไม่ต้องจ่ายค่าสิทธิ
analogy: ชุดเครื่องมือของ Apache พร้อมรายการสั้น ๆ ของการใช้งานต้องห้าม
pros:
  - ใช้เชิงพาณิชย์โดยไม่มีค่าสิทธิ
  - อิงกับ Apache-2.0
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - นโยบายการใช้งานอาจถูกปรับปรุง
