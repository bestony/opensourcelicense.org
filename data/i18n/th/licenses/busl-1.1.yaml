summary: "Source-available: การใช้งานจริงถูกจำกัดโดย Additional Use Grant
  และแต่ละเวอร์ชันจะเปลี่ยนเป็นไลเซนส์เปิดหลัง Change Date (สูงสุด 4 ปี)"
analogy: "ตู้โชว์หน้าร้าน: ดูและลองได้
  และหลังจากไม่กี่ปีสินค้าจะกลายเป็นของฟรีสำหรับทุกคน"
pros:
  - ควบคุมการใช้เชิงพาณิชย์ได้
  - โค้ดจะเป็นโอเพนซอร์สในภายหลัง
cons:
  - ไม่ใช่โอเพนซอร์ส
  - เงื่อนไข Grant แตกต่างกันในแต่ละโปรเจกต์
  - อาจทำให้เกิด fork
