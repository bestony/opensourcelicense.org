summary: "ไลเซนส์ข้อมูลแบบผ่อนปรนจาก Linux Foundation:
  ใช้และแชร์ข้อมูลได้อย่างอิสระ ผลลัพธ์ เช่น โมเดลที่ฝึกแล้ว ไม่ถูกจำกัด"
analogy: ใช้ชุดข้อมูลทำอะไรก็ได้ แค่แนบข้อตกลงไปด้วยเมื่อส่งต่อข้อมูล
pros:
  - ปลดล็อกผลลัพธ์จากการประมวลผลอย่างชัดแจ้ง
  - เขียนขึ้นสำหรับข้อมูลโดยเฉพาะ
cons:
  - เป็นที่รู้จักน้อยกว่าไลเซนส์ CC
  - เวอร์ชัน 2.0 เรียบง่ายกว่า
