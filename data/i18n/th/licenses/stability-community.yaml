summary: ฟรีสำหรับการวิจัย การใช้ที่ไม่ใช่เชิงพาณิชย์
  และการใช้เชิงพาณิชย์ที่มีรายได้ต่อปีต่ำกว่า 1 ล้านดอลลาร์สหรัฐ
  บริษัทที่ใหญ่กว่าต้องใช้ไลเซนส์องค์กร
analogy: ธุรกิจขนาดเล็กเข้าฟรี ธุรกิจใหญ่ต้องซื้อตั๋ว
pros:
  - ฟรีสำหรับบุคคลและบริษัทขนาดเล็ก
  - ครอบคลุมโมเดลล่าสุดของ Stability
cons:
  - ไม่ใช่โอเพนซอร์ส
  - ต้องติดตามเกณฑ์รายได้
