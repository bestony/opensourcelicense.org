summary: น้ำหนักโมเดลสำหรับการใช้ที่ไม่ใช่เชิงพาณิชย์เท่านั้น
  การใช้เชิงพาณิชย์ต้องขอไลเซนส์แยกจาก Black Forest Labs
analogy: ยืมกล้องไปใช้ในโปรเจกต์ของตัวเองได้ แต่ห้ามใช้รับงานถ่ายแบบมีค่าจ้าง
pros:
  - น้ำหนักโมเดลเปิดสำหรับการวิจัยและงานอดิเรก
  - มีช่องทางเชิงพาณิชย์ที่ชัดเจน
cons:
  - ไม่ใช่โอเพนซอร์ส
  - การใช้เชิงพาณิชย์ต้องซื้อไลเซนส์
