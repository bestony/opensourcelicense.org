summary: อนุญาตให้ใช้เชิงพาณิชย์พร้อมนโยบายการใช้งานที่ยอมรับได้
  บริการขนาดใหญ่มากต้องขอไลเซนส์แยก และบางดินแดนถูกยกเว้น
analogy: เครื่องยนต์ฟรีที่มีคู่มือกฎ ข้อจำกัดขนาด และแผนที่ระบุว่าขับได้ที่ไหน
pros:
  - ใช้เชิงพาณิชย์ได้สำหรับผู้ใช้ส่วนใหญ่
  - ครอบคลุมโมเดลข้อความ วิดีโอ และ 3D
cons:
  - ไม่ใช่โอเพนซอร์ส
  - มีการยกเว้นบางดินแดน
