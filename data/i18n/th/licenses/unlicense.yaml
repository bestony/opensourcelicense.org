sourceHash: f723aee8de4d57cd
summary: อุทิศงานเป็นสาธารณสมบัติเท่าที่ทำได้ พร้อมไลเซนส์แบบผ่อนปรนสำรอง
  ไม่ต้องระบุที่มา
analogy: วางหนังสือที่ไม่มีชื่อเจ้าของไว้บนม้านั่งในสวน ใครจะหยิบไปก็ได้
pros:
  - ไม่มีเงื่อนไขใด ๆ เลย
  - ผสมกับอะไรก็ได้ง่าย
cons:
  - การอุทิศเป็นสาธารณสมบัติไม่ได้รับการยอมรับในทุกประเทศ
  - บางบริษัทหลีกเลี่ยงเพราะความไม่แน่นอนทางกฎหมาย
