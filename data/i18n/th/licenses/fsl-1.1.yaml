analogy: ตู้โชว์หน้าร้านที่สินค้าจะกลายเป็นของฟรีสำหรับทุกคนหลังสองปี
pros:
  - สั้นและคาดเดาได้
  - โค้ดจะเป็นโอเพนซอร์สหลังสองปี
cons:
