summary: "ไลเซนส์ที่สั้นกว่าแต่เทียบเท่า MIT:
  ใช้ได้ทุกรูปแบบโดยคงประกาศลิขสิทธิ์และการอนุญาตไว้"
analogy: หนังสือฟรีเล่มเดียวกับ MIT แต่มีโน้ตบนปกที่สั้นกว่า
pros:
  - ไลเซนส์แบบผ่อนปรนทั่วไปที่สั้นที่สุด
  - เป็นค่าเริ่มต้นของแพ็กเกจ npm จำนวนมาก
cons:
  - ไม่มีการให้สิทธิบัตร
  - อนุญาตให้ fork แบบปิดได้
