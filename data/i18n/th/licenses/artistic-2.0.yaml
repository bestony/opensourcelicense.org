sourceHash: cb1197749de0ea7e
summary: แก้ไขและแจกจ่ายได้อย่างอิสระ
  แต่เวอร์ชันที่แก้ไขต้องระบุให้ชัดเจนหรือเปลี่ยนชื่อ หรือเปิดเผยซอร์สโค้ด
  มีข้อกำหนดเรื่องสิทธิบัตรด้วย
analogy: รีมิกซ์เพลงได้ แต่อย่าขายรีมิกซ์ของคุณว่าเป็นต้นฉบับ
pros:
  - ปกป้องเอกลักษณ์ของต้นฉบับ
  - เข้ากันได้กับ GPL
cons:
  - เงื่อนไขเยิ่นเย้อ
  - พบได้น้อยนอก Raku และ Perl
