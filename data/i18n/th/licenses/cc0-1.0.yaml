summary: "การอุทิศเป็นสาธารณสมบัติสำหรับข้อมูลและเนื้อหา พร้อมไลเซนส์สำรอง:
  ไม่มีเงื่อนไขใด ๆ แม้แต่การระบุที่มา"
analogy: นำภาพถ่ายไปติดบนกำแพงสาธารณะ ใครจะหยิบไปก็ได้
pros:
  - ไม่มีเงื่อนไข
  - เหมาะสำหรับข้อมูลเปิด (open data)
cons:
  - ไม่รับประกันการระบุที่มา
  - ไม่มีการให้สิทธิบัตร
