summary: ไลเซนส์แบบผ่อนปรนสำหรับข้อมูลและซอฟต์แวร์ Unicode เช่น ICU และ CLDR
  คงประกาศไว้ และห้ามใช้ชื่อผู้ถือลิขสิทธิ์เพื่อการโปรโมต
analogy: "หนังสืออ้างอิงฟรี: คัดลอกได้ แค่คงบรรทัดให้เครดิตไว้"
pros:
  - ผ่อนปรน
  - ครอบคลุมไฟล์ข้อมูลและโค้ด
cons:
  - ไม่มีการให้สิทธิบัตร
  - ส่วนใหญ่ใช้กับโปรเจกต์ Unicode
