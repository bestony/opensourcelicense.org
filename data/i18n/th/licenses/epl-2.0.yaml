summary: Copyleft แบบอ่อนระดับโมดูล พร้อมการให้สิทธิบัตร สามารถระบุ GPL
  เป็นไลเซนส์รองเพื่อความเข้ากันได้
analogy: แบ่งปันการแก้ไขในบทที่ยืมมา ส่วนที่เหลือของหนังสือเป็นของคุณ
pros:
  - Copyleft ที่เป็นมิตรกับธุรกิจ
  - มีการให้สิทธิบัตร
cons:
  - เข้ากันได้กับ GPL เฉพาะเมื่อประกาศไลเซนส์รองไว้
  - ขอบเขตของโมดูลอาจไม่ชัดเจน
