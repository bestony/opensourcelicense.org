sourceHash: db235a56ea57284f
summary: เหมือน MIT บวกข้อที่ห้ามใช้ชื่อของคุณเพื่อรับรองผลิตภัณฑ์ที่ดัดแปลง
analogy: 'หนังสือฟรีที่มีโน้ตว่า: "ห้ามอ้างว่าผู้เขียนแนะนำฉบับของคุณ"'
pros:
  - ผ่อนปรนและเป็นที่รู้จักดี
  - ปกป้องชื่อของคุณจากการถูกนำไปอ้างรับรอง
cons:
  - ไม่มีการให้สิทธิบัตร
  - อนุญาตให้ fork แบบปิดซอร์สได้
