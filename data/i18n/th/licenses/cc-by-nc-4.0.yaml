sourceHash: 0196a50e1d1c6b89
summary: "สำหรับเนื้อหาและข้อมูล: ต้องระบุที่มา และไม่อนุญาตให้ใช้เชิงพาณิชย์"
analogy: แชร์ภาพถ่ายได้อย่างอิสระ แต่ห้ามใช้ในโฆษณาหรือสินค้าที่คุณขาย
pros:
  - ป้องกันการนำไปใช้ซ้ำเชิงพาณิชย์
  - มีคำแปลอย่างเป็นทางการ
cons:
  - ไม่เปิดตามเกณฑ์ OSI หรือ Open Definition
  - คำว่า "ไม่ใช่เชิงพาณิชย์" มักไม่ชัดเจน
  - ปิดกั้นการใช้งานที่ชอบธรรมจำนวนมาก
