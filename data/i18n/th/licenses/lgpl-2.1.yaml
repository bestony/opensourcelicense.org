sourceHash: 22649412ed3dbb5f
summary: "Copyleft สำหรับไลบรารี: การแก้ไขไลบรารียังคงเปิด
  โปรแกรมปิดซอร์สลิงก์ได้หากผู้ใช้สามารถลิงก์ใหม่กับไลบรารีที่แก้ไขแล้วได้"
analogy: เครื่องยนต์ส่วนกลางที่เปลี่ยนได้ ฉบับเก่า
pros:
  - ให้แอปกรรมสิทธิ์ (proprietary) ใช้ไลบรารีได้
  - พบบ่อยในไลบรารีเดสก์ท็อปและมัลติมีเดีย
cons:
  - กฎการลิงก์ใหม่ซับซ้อน
  - ไม่มีการให้สิทธิบัตรอย่างชัดแจ้ง
