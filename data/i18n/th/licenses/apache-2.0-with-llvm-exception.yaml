sourceHash: ded3362d69058c2a
summary: Apache-2.0 บวกข้อยกเว้นที่ยกเลิกการระบุที่มาสำหรับโค้ดที่คอมไพล์แล้ว
  และทำให้ใช้ร่วมกับโปรเจกต์ GPL-2.0 ได้
analogy: ชุดเครื่องมือของ Apache
  พร้อมโน้ตว่าเศษของเครื่องมือที่หลงเหลือในผลิตภัณฑ์ของคุณไม่ต้องให้เครดิต
pros:
  - มีการให้สิทธิบัตรแบบ Apache-2.0
  - ใช้ร่วมกับโค้ด GPL-2.0 ได้
cons:
  - ยาวกว่า MIT
  - ข้อยกเว้นเฉพาะสำหรับโปรเจกต์ลักษณะคอมไพเลอร์
