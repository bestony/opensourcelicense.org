sourceHash: 6a4054dc9cca8e7e
summary: "Share-alike สำหรับฐานข้อมูล: ใช้ข้อมูลเชิงพาณิชย์ได้
  แต่ฐานข้อมูลดัดแปลงที่เผยแพร่สาธารณะต้องอยู่ภายใต้ ODbL งานที่สร้างขึ้น เช่น
  แผนที่หรือภาพ ต้องระบุที่มาเท่านั้น"
analogy: สร้างต่อยอดจากแผนที่ส่วนกลาง
  และหากคุณเผยแพร่ฐานข้อมูลแผนที่ที่ปรับปรุงแล้ว
  ต้องแบ่งปันกลับด้วยเงื่อนไขเดียวกัน
pros:
  - ทำให้ฐานข้อมูลที่ปรับปรุงแล้วยังคงเปิด
  - อนุญาตให้ใช้เชิงพาณิชย์
  - พิสูจน์แล้วโดย OpenStreetMap
cons:
  - เงื่อนไข share-alike อาจทำให้ผสมกับข้อมูลอื่นไม่ได้
  - '"ฐานข้อมูลดัดแปลง" บางครั้งไม่ชัดเจน'
