sourceHash: 3d7476dd1bfc7f5b
summary: ไลเซนส์แบบผ่อนปรน ต้องมีประกาศในสำเนาซอร์ส แต่ไม่ต้องมีในไบนารีที่คอมไพล์แล้ว
analogy: คงชื่อผู้เขียนไว้ในตำราอาหาร ไม่ต้องใส่ไว้บนทุกจานที่เสิร์ฟ
pros:
  - ไม่ต้องมีประกาศในไบนารี
  - เป็นมาตรฐานสำหรับไลบรารี C++
cons:
  - ไม่มีการให้สิทธิบัตร
  - ไม่ค่อยเป็นที่รู้จักนอกวงการ C++
