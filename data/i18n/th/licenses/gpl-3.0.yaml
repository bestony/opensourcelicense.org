sourceHash: 3ab9492f75e7adb0
summary: "Copyleft แบบเข้ม: หากคุณแจกจ่ายซอฟต์แวร์หรืองานดัดแปลง
  คุณต้องเผยแพร่ซอร์สโค้ดทั้งหมดภายใต้ GPL-3.0"
analogy: "สูตรอาหารที่ระบุว่า: ใครเสิร์ฟอาหารที่ทำจากสูตรนี้ ต้องแจกสูตรฉบับเต็มด้วย"
pros:
  - ทำให้งานดัดแปลงที่แจกจ่ายทั้งหมดยังคงเปิด
  - มีการให้สิทธิบัตรและต่อต้าน tivoization
  - มีธรรมเนียมชุมชนที่แข็งแกร่ง
cons:
  - หลายบริษัทหลีกเลี่ยง
  - ไม่ครอบคลุม SaaS (ไม่มีการแจกจ่าย)
  - เข้ากันไม่ได้กับ GPL-2.0-only
