sourceHash: 362187e701e25e6a
summary: Copyleft ระดับไฟล์ที่พัฒนาจาก MPL พร้อมการให้สิทธิบัตร เข้ากันไม่ได้กับ GPL
analogy: แบ่งปันการแก้ไขในไฟล์ที่ยืมมา ส่วนที่เหลือจะปิดไว้ก็ได้
pros:
  - ขอบเขตระดับไฟล์
  - มีการให้สิทธิบัตร
cons:
  - เข้ากันไม่ได้กับ GPL (ปัญหา ZFS บน Linux)
  - มีโปรเจกต์ใหม่นำไปใช้น้อย
