summary: ไลเซนส์แบบผ่อนปรนสั้น ๆ พร้อมการให้สิทธิบัตรอย่างชัดแจ้ง ใช้โดย Oracle
  สำหรับ GraalVM และโปรเจกต์อื่น ๆ
analogy: หนังสือฟรีแบบ MIT พร้อมคำสัญญาเพิ่มเติมเรื่องสิทธิบัตร
pros:
  - สั้นและผ่อนปรน
  - มีการให้สิทธิบัตรอย่างชัดแจ้ง
cons:
  - ไม่มีข้อตอบโต้ด้านสิทธิบัตร
  - เป็นที่รู้จักน้อยกว่า MIT หรือ Apache
