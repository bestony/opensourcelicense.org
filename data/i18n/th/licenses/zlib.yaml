summary: "ไลเซนส์แบบผ่อนปรน: ซอร์สที่ถูกแก้ไขต้องระบุว่าแก้ไขแล้ว
  ห้ามบิดเบือนที่มา และต้องคงประกาศไว้ในสำเนาซอร์ส"
analogy: ยืมสูตรไปได้ แต่ถ้าคุณแก้ไข อย่าอ้างว่าเป็นต้นฉบับ
pros:
  - ผ่อนปรนและสั้น
  - นิยมใช้กับเกมและไลบรารีเนทีฟ
cons:
  - ไม่มีการให้สิทธิบัตร
  - อนุญาตให้ fork แบบปิดได้
