sourceHash: cdef0d42cb1ab51e
summary: "Copyleft ระดับไลบรารี: การแก้ไขไลบรารียังคงเปิด
  แอปปิดซอร์สลิงก์ได้หากผู้ใช้สามารถเปลี่ยนไลบรารีได้"
analogy: "เครื่องยนต์ส่วนกลาง: ใส่ในรถของคุณได้
  แต่เจ้าของรถต้องเปลี่ยนเป็นเครื่องของตัวเองได้"
pros:
  - ให้แอปกรรมสิทธิ์ (proprietary) ใช้ไลบรารีได้
  - การแก้ไขไลบรารียังคงเปิด
  - มีการให้สิทธิบัตร
cons:
  - กฎการลิงก์ใหม่ซับซ้อน โดยเฉพาะการลิงก์แบบ static และบนมือถือ
  - บางบริษัทยังคงหลีกเลี่ยง
