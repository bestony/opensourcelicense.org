summary: คล้าย AGPL แต่การนำซอฟต์แวร์ไปให้บริการต้องเปิดเผยซอร์สโค้ดของ service
  stack ทั้งหมด OSI ไม่รับรอง
analogy: หากคุณเปิดร้านอาหารที่มีเมนูนี้ คุณต้องเผยแพร่แบบแปลนครัวของคุณด้วย
pros:
  - ป้องกันผู้ให้บริการคลาวด์ได้อย่างเข้มแข็ง
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - ถูกปฏิเสธโดยดิสทริบิวชันจำนวนมาก
  - อาจทำให้ชุมชน fork ออกไป
