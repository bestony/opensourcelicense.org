summary: GPL-2.0 สำหรับตัวไลบรารี
  บวกข้อยกเว้นที่ให้โปรแกรมอิสระลิงก์เข้ามาได้ภายใต้ไลเซนส์ใดก็ได้
analogy: เครื่องยนต์ส่วนกลางภายใต้กฎการแบ่งปันสูตร แต่รถของคุณเองยังเป็นของคุณ
pros:
  - แอปพลิเคชันที่ลิงก์เข้ามาปิดซอร์สได้
  - ใช้โดย OpenJDK
cons:
  - การแก้ไขตัวไลบรารียังคงเป็น GPL
  - เข้ากันไม่ได้กับโปรเจกต์ GPL-3.0-only
