summary: น้ำหนักโมเดลสำหรับการวิจัยและการใช้ส่วนตัวเท่านั้น
  การใช้เชิงพาณิชย์หรือใช้งานจริงใด ๆ ต้องมีไลเซนส์เชิงพาณิชย์จาก Mistral AI
analogy: "หนังสือห้องสมุด: อ่านและศึกษาได้ แต่ห้ามนำไปขายต่อ"
pros:
  - น้ำหนักโมเดลเปิดสำหรับการวิจัย
  - อนุญาตให้แก้ไขเพื่อการวิจัย
cons:
  - ห้ามใช้เชิงพาณิชย์
  - ไม่ใช่โอเพนซอร์ส
