summary: "Copyleft สำหรับคู่มือ: สำเนาและเวอร์ชันที่แก้ไขต้องอยู่ภายใต้ GFDL
  โดยคงประวัติและส่วนที่ห้ามแก้ไข (invariant sections) ไว้"
analogy: กฎการแบ่งปันสูตรอาหาร สำหรับคู่มือของตำราอาหาร
pros:
  - ทำให้เอกสารยังคงเสรี
  - ใช้โดยคู่มือของ GNU
cons:
  - ส่วนที่ห้ามแก้ไขเป็นประเด็นถกเถียง
  - ผสมกับเนื้อหา CC ได้ยาก
