sourceHash: 33f06e1e52928136
summary: ทำแทบทุกอย่างกับโค้ดได้ โดยคงประกาศลิขสิทธิ์และไลเซนส์ไว้ ไม่มีการรับประกัน
analogy: "เหมือนวางหนังสือฟรีไว้ในร้านกาแฟ: หยิบไป คัดลอก หรือขายก็ได้
  แค่คงชื่อผู้เขียนไว้บนปก"
pros:
  - สั้นและเข้าใจกันแพร่หลาย
  - บริษัทนำไปใช้ได้ง่ายที่สุด
  - เข้ากันได้กับไลเซนส์อื่นเกือบทั้งหมด
cons:
  - ไม่มีการให้สิทธิบัตร
  - ใครก็สร้างคู่แข่งแบบปิดซอร์สหรือแบบโฮสต์ได้
