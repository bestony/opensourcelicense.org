sourceHash: 3440c6c6f7e1c94d
summary: "Copyleft ระดับไฟล์ของ Apple: ไฟล์ที่ครอบคลุมซึ่งถูกแก้ไขต้องเผยแพร่
  รวมถึงเมื่อนำไปให้บริการภายนอก เข้ากันไม่ได้กับ GPL"
analogy: ต้องแบ่งปันการแก้ไขในไฟล์ที่ยืมมา แม้คุณจะแค่ให้บริการผลลัพธ์
pros:
  - ครอบคลุมการใช้งานภายนอก
  - มีการให้สิทธิบัตร
cons:
  - เข้ากันไม่ได้กับ GPL
  - ส่วนใหญ่ใช้เฉพาะในโอเพนซอร์สของ Apple
