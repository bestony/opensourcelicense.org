summary: น้ำหนักโมเดลใช้ฟรีสำหรับการวิจัยทางวิชาการ
  การใช้เชิงพาณิชย์ฟรีหลังลงทะเบียน ภายใต้ข้อจำกัดการใช้งาน
analogy: ศึกษาได้ฟรี แต่ต้องลงทะเบียนก่อนนำไปใช้ทางธุรกิจ
pros:
  - ใช้เชิงพาณิชย์ได้หลังลงทะเบียน
  - โมเดลภาษาจีนที่ใช้กันแพร่หลาย
cons:
  - ไม่ใช่โอเพนซอร์ส
  - มีขั้นตอนการลงทะเบียน
