summary: "Responsible AI License สำหรับโมเดล: เงื่อนไขแบบผ่อนปรน
  บวกข้อจำกัดตามการใช้งานที่งานดัดแปลงทุกชิ้นต้องส่งต่อ"
analogy: เครื่องมือฟรีที่มีรายการการใช้งานต้องห้ามติดไปกับทุกสำเนา
pros:
  - อนุญาตให้ใช้เชิงพาณิชย์
  - ข้อจำกัดการใช้ที่เป็นอันตรายส่งต่อไปยังผู้ใช้ปลายทาง
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - บังคับใช้ข้อจำกัดได้ยาก
  - มีหลายรูปแบบย่อย
