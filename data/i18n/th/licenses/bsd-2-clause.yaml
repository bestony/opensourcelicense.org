summary: "เหมือน MIT: ใช้โค้ดได้อย่างอิสระ
  โดยคงประกาศลิขสิทธิ์และข้อสงวนสิทธิ์ไว้ทั้งในสำเนาซอร์สและไบนารี"
analogy: "การ์ดสูตรอาหารฟรี: คัดลอกไปที่ไหนก็ได้ แค่คงบรรทัดชื่อผู้เขียนไว้ด้านล่าง"
pros:
  - สั้นมากและผ่อนปรน
  - ใช้แพร่หลายในระบบ BSD
cons:
  - ไม่มีการให้สิทธิบัตร
  - อนุญาตให้ fork แบบปิดได้
