summary: "ไลเซนส์ฟอนต์เสรี: ใช้ ฝัง และแก้ไขฟอนต์ได้อย่างอิสระ
  แต่ฟอนต์ที่แก้ไขต้องไม่ใช้ชื่อที่สงวนไว้ และห้ามขายฟอนต์เพียงอย่างเดียว"
analogy: ใช้แบบอักษรได้ทุกที่ แต่ห้ามขายไฟล์ฟอนต์เปล่า ๆ
pros:
  - อนุญาตให้ฝังในเอกสารและแอป
  - เป็นมาตรฐานสำหรับฟอนต์เปิด
cons:
  - ชื่อฟอนต์ที่สงวนไว้ทำให้การ fork ยุ่งยาก
  - ใช้ได้กับฟอนต์เท่านั้น
