sourceHash: cf76d86201254c1b
summary: "Copyleft แบบเข้ม: งานดัดแปลงที่แจกจ่ายต้องเผยแพร่ทั้งหมดภายใต้ GPL-2.0
  ไม่มีการให้สิทธิบัตรอย่างชัดแจ้ง เข้ากันไม่ได้กับ GPL-3.0 เว้นแต่ใช้ 'or
  later'"
analogy: กฎการแบ่งปันสูตรอาหาร ฉบับเก่า
pros:
  - ทำให้งานดัดแปลงที่แจกจ่ายยังคงเปิด
  - ใช้โดยเคอร์เนล Linux
cons:
  - เข้ากันไม่ได้กับ Apache-2.0 และ GPL-3.0 (กรณีระบุเฉพาะเวอร์ชัน)
  - ไม่มีการให้สิทธิบัตรอย่างชัดแจ้ง
