sourceHash: 1db86c42c600a813
summary: "GPL-3.0 บวกข้อกำหนดด้านเครือข่าย:
  ผู้ใช้ที่โต้ตอบกับเวอร์ชันที่ถูกแก้ไขผ่านเครือข่ายต้องได้รับการเสนอซอร์สโค้ดข\
  องเวอร์ชันนั้น"
analogy: "กฎเรื่องสูตรอาหารใช้กับร้านอาหารด้วย: การเสิร์ฟอาหารถือเป็นการแจกจ่าย"
pros:
  - ปิดช่องโหว่ SaaS
  - เป็นฐานที่ดีสำหรับไลเซนส์คู่ (dual licensing)
  - เป็นโอเพนซอร์สที่ OSI รับรอง
cons:
  - หลายบริษัทห้ามใช้โดยเด็ดขาด
  - การโฮสต์เวอร์ชันที่ไม่ได้แก้ไขยังทำได้
