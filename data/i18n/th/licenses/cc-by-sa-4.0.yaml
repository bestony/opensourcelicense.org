summary: "Copyleft สำหรับเนื้อหา: ใช้ได้ทุกรูปแบบโดยระบุที่มา
  และงานดัดแปลงต้องแบ่งปันภายใต้ไลเซนส์เดียวกัน"
analogy: รีมิกซ์ภาพถ่ายได้อย่างอิสระ แต่ต้องแชร์รีมิกซ์ของคุณด้วยเงื่อนไขเดียวกัน
pros:
  - ทำให้งานดัดแปลงยังคงเปิด
  - ใช้โดย Wikipedia
cons:
  - เงื่อนไข share-alike อาจทำให้ผสมกับงานอื่นไม่ได้
  - ไม่ได้ออกแบบมาสำหรับซอฟต์แวร์
