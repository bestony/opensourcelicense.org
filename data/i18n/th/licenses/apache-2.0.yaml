summary: ไลเซนส์แบบผ่อนปรนที่ให้สิทธิบัตรอย่างชัดแจ้ง มีข้อตอบโต้ด้านสิทธิบัตร
  และกำหนดให้ระบุไฟล์ที่ถูกแก้ไข
analogy: ชุดเครื่องมือฟรีที่มาพร้อมคำสัญญาว่าจะไม่ฟ้องคุณเรื่องสิทธิบัตร —
  เว้นแต่คุณจะฟ้องก่อน
pros:
  - ผู้ร่วมพัฒนาทุกคนให้สิทธิบัตรอย่างชัดแจ้ง
  - เป็นที่นิยมของบริษัทและมูลนิธิจำนวนมาก
  - คุ้มครองเครื่องหมายการค้า
cons:
  - ยาวกว่า และต้องจัดการไฟล์ NOTICE
  - เข้ากันไม่ได้กับ GPL-2.0-only
  - ไม่ป้องกันคู่แข่งที่ให้บริการแบบโฮสต์
