summary: "เงื่อนไขโมเดลของ Google: อนุญาตให้ใช้เชิงพาณิชย์
  พร้อมนโยบายการใช้งานต้องห้ามที่ส่งต่อไปยังงานดัดแปลงทุกชิ้น
  รวมถึงโมเดลที่กลั่นมา (distilled)"
analogy: เครื่องยนต์ฟรีที่มีคู่มือกฎที่เครื่องยนต์ทุกเครื่องที่สร้างใหม่ต้องมีติดไปด้วย
pros:
  - ใช้เชิงพาณิชย์ได้โดยไม่มีเกณฑ์จำนวนผู้ใช้
  - กฎเรื่องงานดัดแปลงชัดเจน
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - Google อาจปรับปรุงนโยบายการใช้งาน
