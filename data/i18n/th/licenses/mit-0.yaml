summary: "MIT ที่ไม่ต้องระบุที่มา: ใช้ คัดลอก และขายได้โดยไม่ต้องคงประกาศใด ๆ"
analogy: หนังสือฟรีที่คุณเปลี่ยนปกใหม่โดยไม่มีชื่อผู้เขียนก็ได้
pros:
  - ไม่ต้องระบุที่มา
  - เหมาะกับโค้ดตัวอย่างและ snippet
cons:
  - ไม่มีการให้สิทธิบัตร
  - ผู้เขียนไม่ได้รับการรับประกันเรื่องเครดิต
