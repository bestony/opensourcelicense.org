summary: ไลเซนส์แบบผ่อนปรนของจีน พร้อมการให้สิทธิบัตรและข้อตอบโต้
  ข้อความภาษาจีนและอังกฤษมีผลเท่ากัน หากขัดแย้งกันให้ยึดภาษาจีน
analogy: การคุ้มครองแบบ Apache ที่เขียนโดยคำนึงถึงกฎหมายจีน
pros:
  - มีข้อความทางการสองภาษา
  - มีการให้สิทธิบัตร
  - OSI รับรอง
cons:
  - ไม่ค่อยเป็นที่รู้จักนอกจีน
  - มีคำพิพากษาอ้างอิงน้อย
