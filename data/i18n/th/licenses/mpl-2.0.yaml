sourceHash: 6d33e2e6b797d27f
summary: "Copyleft ระดับไฟล์: การแก้ไขไฟล์ที่ใช้ MPL ต้องยังคงเปิด
  แต่นำไปรวมกับโค้ดปิดในไฟล์อื่นได้"
analogy: ยืมบทหนึ่งไปแล้วต้องแบ่งปันการแก้ไขในบทนั้น แต่ส่วนที่เหลือของหนังสือเป็นของคุณ
pros:
  - สมดุลระหว่างแบบผ่อนปรนกับ copyleft
  - มีการให้สิทธิบัตรอย่างชัดแจ้ง
  - เข้ากันได้กับ GPL โดยค่าเริ่มต้น
cons:
  - ขอบเขตของไฟล์อาจไม่ชัดเจน
  - ไม่ครอบคลุมการใช้งานผ่านเครือข่าย
