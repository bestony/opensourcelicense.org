summary: "ไลเซนส์โมเดลเฉพาะ: อนุญาตให้ใช้เชิงพาณิชย์ พร้อม Acceptable Use Policy
  กฎการระบุที่มาและการตั้งชื่อ และต้องขอไลเซนส์แยกเมื่อมีผู้ใช้งานรายเดือนเกิน
  700 ล้านราย"
analogy: เครื่องยนต์ที่ใช้ฟรีพร้อมคู่มือกฎ และสัญญาพิเศษสำหรับผู้ผลิตรถยนต์รายใหญ่ที่สุด
pros:
  - ผู้ใช้ส่วนใหญ่ใช้เชิงพาณิชย์ได้
  - ระบบนิเวศขนาดใหญ่
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - มีข้อผูกพันด้านนโยบายการใช้งานและการตั้งชื่อ
  - เงื่อนไขเปลี่ยนไปในแต่ละเวอร์ชัน
