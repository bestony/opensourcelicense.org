summary: "สำหรับฐานข้อมูลและชุดข้อมูล: ใช้ได้ทุกรูปแบบรวมถึงเชิงพาณิชย์
  หากคงประกาศระบุที่มาไว้ งานที่สร้างจากข้อมูลก็ต้องมีประกาศด้วย"
analogy: ใช้ข้อมูลแผนที่ที่ไหนก็ได้ แค่บอกว่ามาจากไหน
pros:
  - กฎการระบุที่มาเรียบง่าย
  - พบบ่อยในคลังข้อมูลขนาดใหญ่สำหรับฝึก AI
  - ครอบคลุมสิทธิในฐานข้อมูล ไม่ใช่แค่ลิขสิทธิ์
cons:
  - ไม่ได้ออกแบบมาสำหรับซอฟต์แวร์
  - ไม่มีการให้สิทธิบัตร
