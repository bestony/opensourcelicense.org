summary: "ไลเซนส์โมเดลแบบ OpenRAIL: อนุญาตให้ใช้เชิงพาณิชย์
  พร้อมข้อจำกัดตามการใช้งานที่ส่งต่อไปยังงานดัดแปลง"
analogy: เครื่องมือฟรีที่มีรายการการใช้งานต้องห้ามแนบไปกับทุกสำเนา
pros:
  - อนุญาตให้ใช้เชิงพาณิชย์
  - ข้อจำกัดการใช้งานส่งต่อไปยังผู้ใช้ปลายทาง
cons:
  - ไม่เป็นโอเพนซอร์สตามเกณฑ์ OSI
  - โมเดล DeepSeek รุ่นใหม่เปลี่ยนไปใช้ MIT แล้ว
