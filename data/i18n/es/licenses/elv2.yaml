summary: "Código disponible: se puede usar y modificar gratis, pero no ofrecerlo
  como servicio gestionado ni eludir claves de licencia."
analogy: Cocina con ello en casa o en tu restaurante, pero no abras una tienda
  que venda justo este plato.
pros:
  - Corta y clara
