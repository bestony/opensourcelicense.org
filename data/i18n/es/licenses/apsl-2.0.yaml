summary: "Copyleft de Apple a nivel de archivo: los archivos modificados deben
  publicarse, también si se despliegan externamente como servicio. Incompatible
  con la GPL."
analogy: Comparte los cambios del archivo prestado aunque solo sirvas el resultado.
pros:
  - Cubre el despliegue externo
  - Concesión de patentes
cons:
  - Incompatible con la GPL
  - Limitada casi solo al código abierto de Apple
