summary: Licencia permisiva china con concesión de patentes y represalia. Los
  textos en chino e inglés tienen igual validez; si hay conflicto, prevalece el
  chino.
analogy: Protección al estilo Apache escrita pensando en el derecho chino.
pros:
  - Texto oficial bilingüe
  - Concesión de patentes
  - Aprobada por OSI
cons:
