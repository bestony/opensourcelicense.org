sourceHash: f723aee8de4d57cd
summary: Dedica la obra al dominio público cuando es posible, con una licencia
  permisiva de respaldo. No exige atribución.
analogy: "Dejar un libro sin nombre en un banco del parque: cualquiera puede
  llevárselo."
pros:
  - Sin ninguna condición
  - Fácil de combinar con cualquier cosa
cons:
  - No todos los países reconocen la dedicación al dominio público
  - Algunas empresas la evitan por incertidumbre legal
