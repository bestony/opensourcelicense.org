summary: Ilayisensi evumela kakhulu yedatha nesoftwe ye-Unicode efana ne-ICU
  ne-CLDR; gcina isaziso kwaye ungalisebenzisi igama lomnini we-copyright
  ukuthengisa.
analogy: "Incwadi yesalathiso yasimahla: yikope, gcina umgca wokukhankanya."
pros:
  - Ivumela kakhulu
  - Igubungela iifayile zedatha nekhowudi
cons:
  - Akukho mvume ye-patent
  - Isetyenziswa ikakhulu kwiiprojekthi ze-Unicode
