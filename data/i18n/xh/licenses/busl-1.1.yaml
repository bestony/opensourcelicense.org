summary: "I-source-available: ukusetyenziswa kwemveliso kunomda obekwe
  yi-Additional Use Grant, kwaye inguqulelo nganye iba yilayisensi evulelekileyo
  emva kwe-Change Date (iminyaka engagqithiyo kwe-4)."
analogy: "Ifestile yevenkile: ungajonga uzame, kwaye emva kweminyaka embalwa
  into iba simahla kuye wonke umntu."
pros:
  - Ikuvumela ukulawula ukusetyenziswa kwezorhwebo
  - Ikhowudi iba yi-open source kamva
cons:
  - Ayiyo i-open source
  - Imimiselo ye-Grant yahluka ngokweprojekthi
  - Inokubangela ii-fork
