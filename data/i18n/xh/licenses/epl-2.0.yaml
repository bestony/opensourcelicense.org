summary: I-copyleft ebuthathaka kwinqanaba lemodyuli enemvume ye-patent;
  inokuchaza i-GPL njengelayisensi yesibini ukuze kuhambelane.
analogy: Yabelana ngotshintsho lwakho kwisahluko esibolekiweyo; incwadi eseleyo yeyakho.
pros:
