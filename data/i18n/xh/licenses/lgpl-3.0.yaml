summary: "I-copyleft yenqanaba lelayibrari: utshintsho kwilayibrari luhlala
  luvulelekile; usetyenziso oluvaliweyo lunokudibana nayo ukuba abasebenzisi
  banokuyitshintsha ilayibrari."
analogy: "Injini ekwabelwana ngayo: ungayifaka emotweni yakho, kodwa abanini
  kufuneka bakwazi ukuyitshintsha ngeyabo."
pros:
  - Ivumela usetyenziso lobunini ukuba lusebenzise ilayibrari
  - Utshintsho kwilayibrari luhlala luvulelekile
  - Imvume ye-patent
cons:
  - Imithetho yokudibanisa kwakhona intsonkothile, ingakumbi kudibaniso
    olumileyo (static) nakwiiselula
  - Ezinye iinkampani zisayiphepha
