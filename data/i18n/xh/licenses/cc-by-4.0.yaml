summary: "Kumxholo, idatha namaxwebhu: nakuphi na ukusetyenziswa, kuquka
  ezorhwebo, ngokukhankanya umthombo nokubonisa utshintsho."
analogy: Yabelana ngefoto naphi na, khankanya nje umfoti.
pros:
  - Umthetho olula wokukhankanya umthombo
  - Ilungele idatha namaxwebhu
  - Kukho iinguqulelo ezisemthethweni
cons:
  - Ayenzelwanga isoftwe
  - Akukho mvume ye-patent
