summary: "Imimiselo yemodeli ye-Google: ukusetyenziswa kwezorhwebo kuvumelekile,
  kunye nomgaqo-nkqubo wosetyenziso olwalelweyo odlulela kuwo wonke umsebenzi
  ovela kuyo, kuquka iimodeli ezicokisiweyo (distilled)."
analogy: Injini yasimahla enencwadi yemithetho ekufuneka ithwalwe yinjini nganye
  eyakhiwe ngokutsha.
pros:
  - Ukusetyenziswa kwezorhwebo ngaphandle komda wabasebenzisi
  - Imithetho ecacileyo yemisebenzi evela kuyo
cons:
  - Ayiyo i-open source ngokwe-OSI
  - I-Google inokuhlaziya umgaqo-nkqubo wokusetyenziswa
