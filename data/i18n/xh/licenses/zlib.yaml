summary: "Ilayisensi evumela kakhulu: ikhowudi yomthombo elungisiweyo kufuneka
  iphawulwe njengelungisiweyo, imvelaphi ayifanele ichazwe ngobuxoki, kwaye
  isaziso sihlala kwiikopi zomthombo."
analogy: Boleka iresiphi, kodwa ukuba uyayitshintsha, musa ukuthi yeyokuqala.
pros:
  - Ivumela kakhulu kwaye imfutshane
  - Ithandwa kwimidlalo nakwiilayibrari zomthonyama (native)
cons:
  - Akukho mvume ye-patent
  - Ii-fork ezivaliweyo ziyavumeleka
