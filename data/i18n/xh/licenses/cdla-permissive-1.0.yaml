summary: "Ilayisensi yedatha evumela kakhulu evela kwi-Linux Foundation:
  sebenzisa kwaye wabelane ngedatha ngokukhululekileyo; iziphumo ezifana
  neemodeli eziqeqeshiweyo azithintelwanga."
analogy: Sebenzisa iseti yedatha kuyo nayiphi na into; faka isivumelwano xa
  udlulisela idatha kwabanye.
pros:
  - Ikhulula ngokucacileyo iziphumo zokubala
  - Ibhalelwe idatha
cons:
  - Ayaziwa kangako njengeelayisensi ze-CC
  - Inguqulelo 2.0 ilula ngakumbi
