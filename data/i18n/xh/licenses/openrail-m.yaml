summary: "I-Responsible AI License yeemodeli: imimiselo evumela kakhulu kunye
  nezithintelo ezisekelwe ekusetyenzisweni ekufuneka zidluliselwe ngumsebenzi
  ngamnye ovela kuyo."
analogy: Isixhobo sasimahla esinoluhlu losetyenziso olwalelweyo oluhamba nekopi nganye.
pros:
  - Ivumela ukusetyenziswa kwezorhwebo
  - Igcina izithintelo zosetyenziso oluyingozi ziqhubekela phambili
cons:
  - Ayiyo i-open source ngokwe-OSI
  - Izithintelo kunzima ukuzinyanzelisa
  - Kukho iintlobo ezininzi
