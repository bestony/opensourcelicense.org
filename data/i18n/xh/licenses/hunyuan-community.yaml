summary: Ukusetyenziswa kwezorhwebo kuvumelekile ngomgaqo-nkqubo wokusetyenziswa
  okwamkelekileyo; iinkonzo ezinkulu kakhulu zifuna ilayisensi eyahlukileyo,
  kwaye eminye imimandla ayibandakanywanga.
analogy: Injini yasimahla enencwadi yemithetho, umda wobukhulu, nemaphu yeendawo
  enokuqhutywa kuzo.
pros:
  - Ukusetyenziswa kwezorhwebo kubasebenzisi abaninzi
  - Igubungela iimodeli zombhalo, zevidiyo nezi-3D
cons:
  - Ayiyo i-open source
  - Imimandla engabandakanywanga
