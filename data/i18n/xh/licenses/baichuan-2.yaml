summary: Ukusetyenziswa kwezorhwebo kusimahla kwiinkonzo ezinabasebenzisi
  abangaphantsi kwesigidi esinye ngosuku, emva kokubhalisa; iinkonzo ezinkulu
  zifuna ilayisensi eyahlukileyo.
analogy: Injini yasimahla yamaqela amancinci eemoto emva kokubhalisa imoto.
pros:
