summary: "Ilayisensi yeefonti ekhululekileyo: sebenzisa, faka ngaphakathi kwaye
  ulungise iifonti ngokukhululekileyo, kodwa iifonti ezilungisiweyo kufuneka
  ziyeke amagama agciniweyo, kwaye iifonti azinakuthengiswa zodwa."
analogy: Sebenzisa uhlobo loonobumba kuyo yonke indawo, kodwa ungathengisi
  ifayile yefonti iyodwa.
pros:
  - Ivumela ukufakwa ngaphakathi kumaxwebhu nakusetyenziso
  - Ngumgangatho oqhelekileyo weefonti ezivulelekileyo
cons:
  - Amagama eefonti agciniweyo enza ii-fork zibe nzima
  - Yeyeefonti kuphela
