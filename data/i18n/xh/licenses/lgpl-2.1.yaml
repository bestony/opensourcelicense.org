summary: "I-copyleft yelayibrari: utshintsho kwilayibrari luhlala luvulelekile;
  iinkqubo ezivaliweyo zinokudibana nayo ukuba abasebenzisi banokudibanisa
  kwakhona nelayibrari elungisiweyo."
analogy: Uhlelo oludala lwenjini ekwabelwana ngayo enokutshintshwa.
pros:
  - Ivumela usetyenziso lobunini ukuba lusebenzise ilayibrari
  - Iqhelekile kwiilayibrari ze-desktop nee-multimedia
cons:
  - Imithetho yokudibanisa kwakhona intsonkothile
  - Akukho mvume ye-patent ecacileyo
