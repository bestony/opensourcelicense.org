summary: Isimahla kuphando, ekusetyenzisweni okungekokwezorhwebo,
  nasekusetyenzisweni kwezorhwebo ngaphantsi kwengeniso engu-USD 1M ngonyaka;
  iinkampani ezinkulu zifuna ilayisensi yeshishini elikhulu.
analogy: Ukungena simahla kumashishini amancinci; amakhulu athenga itikiti.
pros:
  - Isimahla kubantu ngabanye nakwiinkampani ezincinci
  - Igubungela iimodeli zakutsha nje ze-Stability
cons:
  - Ayiyo i-open source
  - Umda wengeniso ufuna ukulandelelwa
