summary: Ilayisensi yaseTshayina evumela kakhulu enemvume ye-patent
  nempindezelo. Izicatshulwa zesiTshayina nezesiNgesi zinamandla alinganayo;
  isiTshayina siyaphumelela xa kukho ungquzulwano.
analogy: Ukhuseleko lwesimbo se-Apache olubhalwe kucingwa ngomthetho waseTshayina.
pros:
  - Isicatshulwa esisemthethweni seelwimi ezimbini
  - Imvume ye-patent
  - Ivunywe yi-OSI
cons:
  - Ayaziwa kangako ngaphandle kweTshayina
  - Amatyala ekubhekiselwa kuwo ambalwa
