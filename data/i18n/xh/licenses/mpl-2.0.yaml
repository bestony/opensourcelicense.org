summary: "I-copyleft yenqanaba lefayile: utshintsho kwiifayile ezinelayisensi
  ye-MPL kufuneka luhlale luvulelekile, kodwa zinokudityaniswa nekhowudi
  evaliweyo kwezinye iifayile."
analogy: Boleka isahluko kwaye kufuneka wabelane ngotshintsho lwakho kweso
  sahluko, kodwa incwadi yakho eseleyo yeyakho.
pros:
  - Ilungelelaniswe phakathi kwevumela kakhulu ne-copyleft
  - Imvume ye-patent ecacileyo
  - Iyahambelana ne-GPL ngokungagqibekanga
cons:
  - Imida yeefayile isenokungacaci
  - Ayigubunguli ukusetyenziswa ngenethiwekhi
