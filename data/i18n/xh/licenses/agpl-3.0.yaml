summary: "I-GPL-3.0 kunye necandelo lenethiwekhi: abasebenzisi abasebenzisa
  inguqulelo elungisiweyo ngenethiwekhi kufuneka banikwe ikhowudi yayo
  yomthombo."
analogy: "Umthetho weresiphi usebenza nakwiindawo zokutyela: ukuphakela isitya
  kubalwa njengokusinika abanye."
pros:
  - Ivala umngxuma we-SaaS
  - Isiseko esihle seelayisensi ezimbini (dual licensing)
  - I-open source evunywe yi-OSI
cons:
  - Iinkampani ezininzi ziyayalela ngokupheleleyo
  - Ukusingatha inguqulelo engalungiswanga kusavumelekile
