summary: Inikela umsebenzi kuluntu (public domain) apho kunokwenzeka khona,
  kunye nelayisensi evumela kakhulu yokubuyela kuyo. Akufuneki kukhankanya
  umthombo.
analogy: "Ukushiya incwadi engenagama ngaphakathi ebhentshini lepaki: nabani na
  angayithatha."
pros:
  - Akukho miqathango kwaphela
  - Kulula ukuyidibanisa nantoni na
cons:
  - Ukunikela kuluntu akwamkelwa kuwo onke amazwe
  - Ezinye iinkampani ziyayiphepha ngenxa yokungaqiniseki kwezomthetho
