summary: "I-share-alike yeedatabheyisi: ungasebenzisa idatha kwezorhwebo, kodwa
  iidatabheyisi ezivela kuyo ezipapashwa esidlangalaleni kufuneka zihlale
  phantsi kwe-ODbL. Imisebenzi eveliswayo efana neemaphu okanye imifanekiso
  ifuna ukukhankanya umthombo kuphela."
analogy: Yakha phezu kwemaphu ekwabelwana ngayo, kwaye ukuba upapasha
  idatabheyisi yemaphu ephuculweyo, yabelana ngayo ngemimiselo efanayo.
pros:
  - Igcina iidatabheyisi eziphuculweyo zivulelekile
  - Ukusetyenziswa kwezorhwebo kuvumelekile
  - Ingqinwe yi-OpenStreetMap
cons:
  - Umqathango we-share-alike unokuthintela ukuxuba nenye idatha
  - '"Idatabheyisi evela kuyo" ngamanye amaxesha ayicacanga'
