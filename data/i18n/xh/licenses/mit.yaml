summary: Yenza phantse nantoni na ngekhowudi. Gcina isaziso se-copyright
  nesaziso selayisensi. Akukho siqinisekiso.
analogy: "Kufana nokushiya incwadi yasimahla kwikhefi: yithathe, yikope,
  yithengise, gcina nje igama lombhali kwiqweqwe."
pros:
  - Imfutshane kwaye iqondwa ngabaninzi
  - Ilayisensi elula kakhulu ukuba iinkampani ziyamkele
  - Iyahambelana phantse nazo zonke ezinye iilayisensi
cons:
  - Akukho mvume ye-patent
  - Nabani na unokwakha imbangi enekhowudi evaliweyo okanye esingathwe
    njengenkonzo
