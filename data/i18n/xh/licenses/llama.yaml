summary: "Ilayisensi yemodeli ekhethekileyo: ukusetyenziswa kwezorhwebo
  kuvumelekile, kunye ne-Acceptable Use Policy, imithetho yokukhankanya
  nokuthiya amagama, nelayisensi eyahlukileyo ngaphezu kwabasebenzisi
  abazizigidi ezingama-700 ngenyanga."
analogy: Injini yasimahla enencwadi yemithetho, nesivumelwano esikhethekileyo
  sabavelisi beemoto abakhulu kakhulu.
pros:
  - Ukusetyenziswa kwezorhwebo kuvumelekile kubasebenzisi abaninzi
  - I-ecosystem enkulu
cons:
  - Ayiyo i-open source ngokwe-OSI
  - Iimbopheleleko zomgaqo-nkqubo wokusetyenziswa nokuthiya amagama
  - Imimiselo iyatshintsha phakathi kweenguqulelo
