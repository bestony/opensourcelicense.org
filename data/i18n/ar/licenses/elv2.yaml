summary: "مصدر متاح: الاستخدام والتعديل مجانيان، لكن لا يجوز لك تقديمه كخدمة
  مُدارة أو التحايل على مفاتيح الترخيص."
analogy: اطبخ به في منزلك أو مطعمك، لكن لا تفتح متجرًا يبيع هذا الطبق بعينه.
pros:
  - قصيرة وواضحة
  - تستهدف منافسي الخدمات المُدارة فقط
cons:
  - ليست مفتوحة المصدر
  - تقيّد التفرعات وبعض الشركاء
