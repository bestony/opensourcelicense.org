summary: Apache-2.0 مع استثناء يلغي متطلبات النسب للشيفرة المُصرَّفة ويجعلها
  قابلة للاستخدام مع مشاريع GPL-2.0.
analogy: صندوق أدوات Apache، مع ملاحظة بأن بقايا الأدوات في منتجك لا تحتاج إلى نسب.
pros:
  - منح براءة الاختراع الخاص بـ Apache-2.0
  - تعمل مع شيفرة GPL-2.0
cons:
  - أطول من MIT
  - الاستثناء خاص بالمشاريع الشبيهة بالمُصرِّفات
