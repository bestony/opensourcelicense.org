sourceHash: 7c50fe5f1b7f3c7d
summary: "لقواعد البيانات ومجموعات البيانات: أي استخدام، بما فيه التجاري، إذا
  أبقيت على إشعار النسب. والأعمال التي تنتجها من البيانات تحتاج إلى إشعار
  أيضًا."
analogy: استخدم بيانات الخريطة في أي مكان، فقط اذكر مصدرها.
pros:
  - قاعدة نسب بسيطة
  - شائعة في مدوّنات تدريب الذكاء الاصطناعي الكبيرة
  - تشمل حقوق قواعد البيانات، لا حقوق النشر فقط
cons:
  - غير مصممة للبرمجيات
  - لا منح لبراءة الاختراع
