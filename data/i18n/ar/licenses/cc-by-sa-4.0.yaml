summary: "حقوق متروكة للمحتوى: أي استخدام مع النسب، ويجب مشاركة الأعمال المقتبسة
  بموجب الرخصة نفسها."
analogy: أعد تحرير الصورة بحرية، لكن شارك نسختك بالشروط نفسها.
pros:
  - تُبقي الأعمال المقتبسة مفتوحة
  - تستخدمها Wikipedia
cons:
  - شرط المشاركة بالمثل قد يمنع الدمج
  - غير مصممة للبرمجيات
