summary: الاستخدام التجاري مسموح مع سياسة استخدام مقبول؛ وتحتاج الخدمات الضخمة
  جدًا إلى رخصة منفصلة، وبعض الأقاليم مستثناة.
analogy: محرّك مجاني مع كتيّب قواعد وحدّ للحجم وخريطة للأماكن المسموح القيادة فيها.
pros:
  - استخدام تجاري لمعظم المستخدمين
  - تشمل نماذج النصوص والفيديو والنماذج ثلاثية الأبعاد
cons:
  - ليست مفتوحة المصدر
  - استثناءات إقليمية
