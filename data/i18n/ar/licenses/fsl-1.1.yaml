summary: "مصدر متاح: أي استخدام عدا المنتج المنافس، ويصبح كل إصدار بموجب
  Apache-2.0 بعد عامين."
analogy: واجهة متجر تصبح منتجاتها مجانية للجميع بعد عامين.
pros:
  - قصيرة ويمكن التنبؤ بها
  - تصبح الشيفرة مفتوحة المصدر بعد عامين
cons:
  - ليست مفتوحة المصدر
  - قد يصعب الحكم على «الاستخدام المنافس»
