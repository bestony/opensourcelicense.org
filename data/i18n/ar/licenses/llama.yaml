summary: "رخصة نموذج مخصّصة: الاستخدام التجاري مسموح، مع سياسة استخدام مقبول
  وقواعد للنسب والتسمية، ورخصة منفصلة عند تجاوز 700 مليون مستخدم نشط شهريًا."
analogy: محرّك مجاني الاستخدام مع كتيّب قواعد، وعقد خاص لأكبر صانعي السيارات.
pros:
  - الاستخدام التجاري مسموح لمعظم المستخدمين
  - منظومة كبيرة
cons:
  - ليست مفتوحة المصدر وفق OSI
  - التزامات سياسة الاستخدام والتسمية
  - تتغير الشروط بين الإصدارات
