sourceHash: cec538ff11fd0ee8
summary: "رخصة متساهلة: يجب توضيح أن المصدر المعدّل قد عُدّل، ولا يجوز تحريف
  أصله، ويبقى الإشعار في نسخ المصدر."
analogy: استعر الوصفة، لكن إن غيّرتها فلا تدّعِ أنها الأصلية.
pros:
  - متساهلة وقصيرة
  - شائعة في الألعاب والمكتبات الأصلية
cons:
  - لا منح لبراءة الاختراع
  - التفرعات المغلقة مسموحة
