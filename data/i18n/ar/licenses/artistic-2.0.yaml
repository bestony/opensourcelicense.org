summary: تتيح التعديل والتوزيع بحرية، لكن يجب توضيح النسخة المعدّلة بجلاء أو
  إعادة تسميتها أو إتاحة مصدرها. تتضمن أحكامًا بشأن البراءات.
analogy: أعد توزيع الأغنية، لكن لا تبع نسختك على أنها الأصلية.
pros:
  - تحمي هوية العمل الأصلي
  - متوافقة مع GPL
cons:
  - شروطها مطوّلة
  - نادرة خارج Raku وPerl
