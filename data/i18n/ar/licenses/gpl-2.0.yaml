sourceHash: cf76d86201254c1b
summary: "حقوق متروكة قوية: يجب نشر الأعمال المشتقة الموزّعة كاملةً بموجب
  GPL-2.0. لا منح صريح لبراءة الاختراع؛ وغير متوافقة مع GPL-3.0 ما لم تُستخدم
  صيغة «or later»."
analogy: قاعدة مشاركة الوصفة، في طبعتها الأقدم.
pros:
  - تُبقي الأعمال المشتقة الموزّعة مفتوحة
  - يستخدمها نواة Linux
cons:
  - غير متوافقة مع Apache-2.0 وGPL-3.0 (في صيغة الإصدار الواحد)
  - لا منح صريح لبراءة الاختراع
