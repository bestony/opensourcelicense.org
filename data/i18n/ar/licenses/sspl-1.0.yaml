summary: شبيهة بـ AGPL، لكن تقديم البرنامج كخدمة يتطلب نشر مصدر حزمة الخدمة
  كاملة. غير معتمدة من OSI.
analogy: إذا كنت تدير مطعمًا يقدّم هذا الطبق، فعليك أيضًا نشر مخططات مطبخك.
pros:
  - حماية قوية من مزوّدي السحابة
cons:
  - ليست مفتوحة المصدر وفق OSI
  - رفضتها توزيعات كثيرة
  - قد تؤدي إلى تفرعات مجتمعية
