summary: رخصة متساهلة مع منح صريح لبراءة الاختراع، وبند للردّ على دعاوى
  البراءات، واشتراط توضيح الملفات المعدّلة.
analogy: صندوق أدوات مجاني يأتي مع وعد بعدم مقاضاتك بسبب براءاته — ما لم تبدأ
  أنت بالمقاضاة.
pros:
  - منح صريح لبراءة الاختراع من كل مساهم
  - تفضّلها شركات ومؤسسات كثيرة
  - تحمي العلامات التجارية
cons:
  - أطول، وتتطلب التعامل مع ملف NOTICE
