summary: "للمحتوى: النسب، ولا استخدام تجاري، والأعمال المقتبسة بموجب الرخصة نفسها."
analogy: شارك ملاحظات المحاضرة وأعد صياغتها، دون ربح أبدًا، وبالشروط نفسها دائمًا.
pros:
  - تمنع إعادة الاستخدام التجاري
  - شائعة في المواد التعليمية
cons:
  - ليست مفتوحة وفق Open Definition
  - مفهوم «غير التجاري» غالبًا غير واضح
