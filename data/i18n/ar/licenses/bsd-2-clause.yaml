summary: "مثل MIT: استخدم الشيفرة بحرية، وأبقِ على إشعار حقوق النشر وإخلاء
  المسؤولية في نسخ المصدر والنسخ الثنائية."
analogy: "بطاقة وصفة مجانية: انسخها أينما شئت، فقط أبقِ سطر المؤلف في أسفلها."
pros:
  - قصيرة جدًا ومتساهلة
  - مستخدمة على نطاق واسع في أنظمة BSD
cons:
  - لا منح لبراءة الاختراع
  - التفرعات المغلقة مسموحة
