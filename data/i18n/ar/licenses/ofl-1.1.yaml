summary: "رخصة خطوط حرة: استخدم الخطوط وضمّنها وعدّلها بحرية، لكن يجب أن تتخلى
  الخطوط المعدّلة عن الأسماء المحجوزة، ولا يجوز بيع الخطوط منفردة."
analogy: استخدم الخط في كل مكان، لكن لا تبع ملف الخط وحده.
pros:
  - تسمح بالتضمين في المستندات والتطبيقات
  - معيار للخطوط المفتوحة
cons:
  - أسماء الخطوط المحجوزة تعقّد التفرعات
  - للخطوط فقط
