summary: "رخصة ذكاء اصطناعي مسؤول للنماذج: شروط متساهلة مع قيود قائمة على
  الاستخدام يجب أن يمرّرها كل عمل مشتق."
analogy: أداة مجانية ترافقها قائمة بالاستخدامات المحظورة مع كل نسخة.
pros:
  - تسمح بالاستخدام التجاري
  - تُبقي قيود الاستخدام الضار سارية على المستخدمين اللاحقين
cons:
  - ليست مفتوحة المصدر وفق OSI
  - يصعب إنفاذ القيود
  - توجد عدة متغيرات منها
