summary: "حقوق متروكة على مستوى الملف من Apple: يجب نشر الملفات المشمولة
  المعدّلة، بما في ذلك عند نشرها خارجيًا كخدمة. غير متوافقة مع GPL."
analogy: شارك تغييراتك على الملف المُستعار، حتى لو كنت تقدّم النتيجة فقط.
pros:
  - تشمل النشر الخارجي
  - منح براءة الاختراع
cons:
  - غير متوافقة مع GPL
  - تقتصر في الغالب على مشاريع Apple مفتوحة المصدر
