summary: "للمحتوى والبيانات والتوثيق: أي استخدام، بما فيه التجاري، مع النسب
  والإشارة إلى التغييرات."
analogy: شارك الصورة في أي مكان، فقط انسبها إلى المصوّر.
pros:
  - قاعدة نسب بسيطة
  - مناسبة للبيانات والتوثيق
  - ترجمات رسمية
cons:
  - غير مصممة للبرمجيات
  - لا منح لبراءة الاختراع
