sourceHash: 3ab9492f75e7adb0
summary: "حقوق متروكة قوية: إذا وزّعت البرنامج أو أعمالًا مشتقة منه، فعليك نشر
  الشيفرة المصدرية الكاملة بموجب GPL-3.0."
analogy: "وصفة تقول: من يقدّم طبقًا مبنيًا عليها يجب أن يسلّم الوصفة كاملة أيضًا."
pros:
  - تُبقي جميع الأعمال المشتقة الموزّعة مفتوحة
  - منح براءة الاختراع ومكافحة tivoization
  - تقليد مجتمعي قوي
cons:
  - كثير من الشركات تتجنبها
  - لا تشمل SaaS (لا يوجد توزيع)
  - غير متوافقة مع GPL-2.0-only
