summary: افعل بالشيفرة كل شيء تقريبًا. أبقِ على إشعار حقوق النشر والرخصة. لا ضمان.
analogy: "مثل ترك كتاب مجاني في مقهى: خذه، انسخه، بِعه، فقط أبقِ اسم المؤلف على الغلاف."
pros:
  - قصيرة ومفهومة على نطاق واسع
  - أسهل رخصة تتبناها الشركات
  - متوافقة مع كل الرخص الأخرى تقريبًا
cons:
  - لا منح لبراءة الاختراع
  - يمكن لأي شخص بناء منافس مغلق المصدر أو مستضاف
