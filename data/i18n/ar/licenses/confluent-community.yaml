summary: "مصدر متاح: استخدم وعدّل ووزّع بحرية، إلا لتقديم منتج SaaS ينافس Confluent."
analogy: استخدم الوصفة في أي مطعم، إلا مطعمًا ينافس مطعم المؤلف.
pros:
  - قيد ضيّق النطاق
  - معظم المستخدمين غير متأثرين
cons:
  - ليست مفتوحة المصدر
  - تستبعد المنافسين السحابيين بالوصف فقط
