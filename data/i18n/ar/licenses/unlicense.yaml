sourceHash: f723aee8de4d57cd
summary: تهدي العمل إلى الملك العام حيثما أمكن، مع رخصة متساهلة احتياطية. لا
  يُشترط النسب.
analogy: "كترك كتاب على مقعد في حديقة دون اسم بداخله: يمكن لأي شخص أخذه."
pros:
  - لا شروط على الإطلاق
  - سهلة الدمج مع أي شيء
cons:
  - الإهداء إلى الملك العام غير معترف به في كل البلدان
  - بعض الشركات تتجنبها بسبب الغموض القانوني
