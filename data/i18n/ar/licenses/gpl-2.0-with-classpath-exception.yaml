summary: GPL-2.0 للمكتبة نفسها، مع استثناء يتيح للبرامج المستقلة الربط بها بموجب
  أي رخصة.
analogy: محرّك مشترك يخضع لقاعدة مشاركة الوصفة، لكن سيارتك تبقى ملكك.
pros:
  - يمكن أن تكون التطبيقات المرتبطة بها مغلقة
  - يستخدمها OpenJDK
cons:
  - تبقى تغييرات المكتبة بموجب GPL
  - غير متوافقة مع مشاريع GPL-3.0-only
