summary: أوزان نموذج للاستخدام غير التجاري فقط؛ ويتطلب الاستخدام التجاري للأوزان
  رخصة منفصلة من Black Forest Labs.
analogy: استعر الكاميرا لمشاريعك الخاصة، لا لجلسات التصوير المدفوعة.
pros:
  - أوزان مفتوحة للبحث والهواية
  - مسار تجاري واضح
cons:
  - ليست مفتوحة المصدر
  - الاستخدام التجاري يتطلب رخصة مدفوعة
