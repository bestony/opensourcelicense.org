summary: "شروط نماذج Google: الاستخدام التجاري مسموح، مع سياسة استخدامات محظورة
  تنتقل إلى كل عمل مشتق، بما في ذلك النماذج المقطّرة."
analogy: محرّك مجاني مع كتيّب قواعد يجب أن يرافق كل محرّك يُعاد بناؤه.
pros:
  - استخدام تجاري دون حدّ للمستخدمين
  - قواعد واضحة للأعمال المشتقة
cons:
  - ليست مفتوحة المصدر وفق OSI
  - قد تحدّث Google سياسة الاستخدام
