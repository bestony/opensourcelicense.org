summary: مثل MIT، مع بند يحظر استخدام اسمك لتزكية المنتجات المشتقة.
analogy: "كتاب مجاني مع ملاحظة: «لا تدّعِ أن المؤلف يوصي بطبعتك»."
pros:
  - متساهلة ومعروفة جيدًا
  - تحمي اسمك من الاستخدام في التزكية
cons:
  - لا منح لبراءة الاختراع
  - التفرعات مغلقة المصدر مسموحة
