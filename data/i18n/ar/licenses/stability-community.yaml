summary: مجانية للبحث والاستخدام غير التجاري والاستخدام التجاري لمن تقل
  إيراداتهم السنوية عن مليون دولار أمريكي؛ وتحتاج الشركات الأكبر إلى رخصة
  مؤسسية.
analogy: دخول مجاني للأعمال الصغيرة؛ أما الكبيرة فتشتري تذكرة.
pros:
  - مجانية للأفراد والشركات الصغيرة
  - تشمل نماذج Stability الحديثة
cons:
  - ليست مفتوحة المصدر
  - حدّ الإيرادات يتطلب المتابعة
