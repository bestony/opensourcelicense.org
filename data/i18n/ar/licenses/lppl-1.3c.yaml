summary: "رخصة حرة لحزم LaTeX: يجب إعادة تسمية الملفات المعدّلة أو توضيحها بجلاء
  كي تعمل المستندات بالطريقة نفسها في كل مكان."
analogy: يمكنك تعديل الخط، لكن أعطِ نسختك اسمًا جديدًا.
pros:
  - تُبقي المستندات قابلة لإعادة الإنتاج
  - معيار في CTAN
cons:
  - قاعدة إعادة التسمية غير مألوفة
  - غير متوافقة مع GPL
