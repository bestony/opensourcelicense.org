summary: "MIT دون اشتراط النسب: استخدم وانسخ وبِع دون الإبقاء على أي إشعار."
analogy: كتاب مجاني يمكنك حتى تغيير غلافه دون اسم المؤلف.
pros:
  - لا حاجة إلى النسب
  - مناسبة للأمثلة والمقتطفات البرمجية
cons:
  - لا منح لبراءة الاختراع
  - لا يحصل المؤلفون على أي اشتراط للنسب
