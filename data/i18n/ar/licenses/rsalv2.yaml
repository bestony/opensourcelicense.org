summary: "رخصة مصدر متاح من Redis: الاستخدام والتعديل مجانيان، لكن لا يجوز تقديم
  البرنامج كخدمة مُدارة أو التحايل على مفاتيح الترخيص."
analogy: اطبخ به في أي مكان، لكن لا تفتح متجرًا يبيع هذا الطبق.
pros:
  - تستهدف منافسي الخدمات المُدارة فقط
  - قصيرة
cons:
  - ليست مفتوحة المصدر
  - تسببت في تفرّع Valkey
