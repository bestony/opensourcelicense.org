summary: رخصة متساهلة قصيرة مع منح صريح لبراءة الاختراع، تستخدمها Oracle لـ
  GraalVM ومشاريع أخرى.
analogy: كتاب MIT المجاني، مع وعد إضافي بشأن البراءات.
pros:
  - قصيرة ومتساهلة
  - منح صريح لبراءة الاختراع
cons:
  - لا بند للردّ على دعاوى البراءات
  - أقل شهرة من MIT أو Apache
