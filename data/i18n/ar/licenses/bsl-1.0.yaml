summary: رخصة متساهلة؛ الإشعار مطلوب في نسخ المصدر لكن ليس في الملفات الثنائية
  المُصرَّفة.
analogy: أبقِ اسم المؤلف في كتاب الوصفات، لا على كل طبق تقدّمه.
pros:
  - لا حاجة إلى إشعار في الملفات الثنائية
  - معيار لمكتبات C++
cons:
  - لا منح لبراءة الاختراع
  - أقل شهرة خارج C++
