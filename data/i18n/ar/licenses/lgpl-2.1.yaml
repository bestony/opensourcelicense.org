summary: "حقوق متروكة للمكتبات: تبقى تغييرات المكتبة مفتوحة؛ ويجوز للبرامج
  المغلقة الربط بها إذا أمكن للمستخدمين إعادة الربط بمكتبة معدّلة."
analogy: الطبعة الأقدم من المحرّك المشترك القابل للاستبدال.
pros:
  - تتيح للتطبيقات المملوكة استخدام المكتبة
  - شائعة في مكتبات سطح المكتب والوسائط المتعددة
cons:
  - قواعد إعادة الربط معقدة
  - لا منح صريح لبراءة الاختراع
