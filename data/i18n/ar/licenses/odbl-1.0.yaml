summary: "مشاركة بالمثل لقواعد البيانات: يمكنك استخدام البيانات تجاريًا، لكن يجب
  أن تبقى قواعد البيانات المشتقة العامة بموجب ODbL. أما الأعمال المُنتَجة مثل
  الخرائط أو الصور فتحتاج إلى النسب فقط."
analogy: ابنِ على الخريطة المشتركة، وإذا نشرت قاعدة بيانات خرائط محسّنة فشاركها
  بالشروط نفسها.
pros:
  - تُبقي قواعد البيانات المحسّنة مفتوحة
  - الاستخدام التجاري مسموح
  - أثبتت جدواها مع OpenStreetMap
cons:
  - المشاركة بالمثل قد تمنع الدمج مع بيانات أخرى
  - مفهوم «قاعدة البيانات المشتقة» غير واضح أحيانًا
