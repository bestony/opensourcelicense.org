summary: الأوزان مجانية للبحث الأكاديمي؛ والاستخدام التجاري مجاني بعد التسجيل،
  مع مراعاة قيود الاستخدام.
analogy: مجانية للدراسة؛ سجّل قبل استخدامها في الأعمال.
pros:
  - استخدام تجاري بعد التسجيل
  - نماذج صينية واسعة الاستخدام
cons:
  - ليست مفتوحة المصدر
  - خطوة التسجيل
