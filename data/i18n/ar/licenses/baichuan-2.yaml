summary: استخدام تجاري مجاني للخدمات التي يقل عدد مستخدميها النشطين يوميًا عن
  مليون، بعد التسجيل؛ وتحتاج الخدمات الأكبر إلى رخصة منفصلة.
analogy: محرّك مجاني للأساطيل الصغيرة بعد تسجيل السيارة.
pros:
  - مجانية لمعظم المستخدمين التجاريين
  - نماذج قوية للغة الصينية
cons:
  - ليست مفتوحة المصدر
  - تسجيل وحدّ للمستخدمين
