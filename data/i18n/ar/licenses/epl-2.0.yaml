summary: حقوق متروكة ضعيفة على مستوى الوحدة مع منح لبراءة الاختراع؛ ويمكن تسمية
  GPL رخصةً ثانوية لأغراض التوافق.
analogy: شارك تغييراتك على الفصل المُستعار؛ وبقية الكتاب ملكك.
pros:
  - حقوق متروكة ملائمة للأعمال
  - منح براءة الاختراع
cons:
  - التوافق مع GPL فقط برخصة ثانوية مُعلنة
  - حدود الوحدات قد تكون غير واضحة
