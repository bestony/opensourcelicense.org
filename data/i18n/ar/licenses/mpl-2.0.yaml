summary: "حقوق متروكة على مستوى الملف: يجب أن تبقى التغييرات على الملفات
  المرخّصة بموجب MPL مفتوحة، لكن يمكن دمجها مع شيفرة مغلقة في ملفات أخرى."
analogy: استعر فصلًا وعليك مشاركة تعديلاتك على ذلك الفصل، لكن بقية كتابك ملكك.
pros:
  - توازن بين الرخص المتساهلة والحقوق المتروكة
  - منح صريح لبراءة الاختراع
  - متوافقة مع GPL افتراضيًا
cons:
  - حدود الملفات قد تكون غير واضحة
  - لا تشمل الاستخدام عبر الشبكة
