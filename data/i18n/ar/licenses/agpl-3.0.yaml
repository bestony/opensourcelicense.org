summary: "GPL-3.0 مع بند شبكي: يجب عرض الشيفرة المصدرية على المستخدمين الذين
  يتفاعلون مع نسخة معدّلة عبر الشبكة."
analogy: "قاعدة الوصفة تسري على المطاعم أيضًا: تقديم الطبق يُعدّ توزيعًا له."
pros:
  - تسدّ ثغرة SaaS
  - أساس جيد للترخيص المزدوج
  - مصدر مفتوح معتمد من OSI
cons:
  - كثير من الشركات تحظرها تمامًا
  - استضافة النسخة غير المعدّلة لا تزال مسموحة
