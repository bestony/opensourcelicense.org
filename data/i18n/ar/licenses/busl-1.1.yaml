summary: "مصدر متاح: الاستخدام الإنتاجي محدود بموجب Additional Use Grant، ويتحول
  كل إصدار إلى رخصة مفتوحة بعد Change Date (4 سنوات كحدّ أقصى)."
analogy: "واجهة متجر: يمكنك النظر والتجربة، وبعد بضع سنوات يصبح المنتج مجانيًا للجميع."
pros:
  - تتيح لك التحكم في الاستخدام التجاري
  - تصبح الشيفرة مفتوحة المصدر لاحقًا
cons:
  - ليست مفتوحة المصدر
  - شروط المنح تختلف من مشروع لآخر
  - قد تؤدي إلى تفرعات
