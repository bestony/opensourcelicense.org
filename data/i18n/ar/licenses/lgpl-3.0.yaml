sourceHash: cdef0d42cb1ab51e
summary: "حقوق متروكة على مستوى المكتبة: تبقى تغييرات المكتبة مفتوحة؛ ويجوز
  للتطبيقات المغلقة الربط بها إذا أمكن للمستخدمين استبدال المكتبة."
analogy: "محرّك مشترك: يمكنك وضعه في سيارتك، لكن يجب أن يتمكن المالكون من
  استبداله بمحرّكهم."
pros:
  - تتيح للتطبيقات المملوكة استخدام المكتبة
  - تبقى تغييرات المكتبة مفتوحة
  - منح براءة الاختراع
cons:
  - قواعد إعادة الربط معقدة، خصوصًا في الربط الثابت وتطبيقات الهاتف
  - بعض الشركات لا تزال تتجنبها
