summary: "رخصة نموذج قابلة للاستخدام التجاري: الأعمال المشتقة مسموحة، ولا تدّعي
  NVIDIA أي حقوق في المخرجات، لكن لا يجوز تجاوز ضوابط الأمان المدمجة."
analogy: محرّك مجاني لا يجوز لك نزع أحزمة الأمان منه.
pros:
  - الاستخدام التجاري مسموح
  - لا ادعاء بحقوق في المخرجات
cons:
  - ليست مفتوحة المصدر
  - بند ضوابط الأمان يتطلب عناية
