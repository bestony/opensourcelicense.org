summary: حقوق متروكة على مستوى الملف مشتقة من MPL، مع منح لبراءة الاختراع؛ غير
  متوافقة مع GPL.
analogy: شارك تغييراتك على الملف المُستعار، وأبقِ الباقي مغلقًا إن شئت.
pros:
  - نطاق على مستوى الملف
  - منح براءة الاختراع
cons:
  - غير متوافقة مع GPL (مشكلة ZFS-on-Linux)
  - قلّة من المشاريع الجديدة تعتمدها
