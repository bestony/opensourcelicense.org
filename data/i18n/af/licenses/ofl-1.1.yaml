summary: "Vrye lettertipelisensie: gebruik, bed in en wysig lettertipes vrylik,
  maar gewysigde lettertipes moet voorbehoude name laat vaar, en die lettertipes
  mag nie op hul eie verkoop word nie."
analogy: Gebruik die lettertipe oral, maar moenie die kaal lettertipelêer verkoop nie.
pros:
  - Laat inbedding in dokumente en toepassings toe
  - Standaard vir oop lettertipes
cons:
  - Voorbehoude lettertipename bemoeilik vurke
  - Slegs vir lettertipes
