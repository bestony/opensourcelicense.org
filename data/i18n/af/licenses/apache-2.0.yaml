summary: Permissiewe lisensie met 'n uitdruklike patenttoekenning,
  patentvergelding en 'n vereiste om gewysigde lêers te merk.
analogy: "'n Gratis gereedskapkis wat ook kom met 'n belofte om jou nie oor sy
  patente te dagvaar nie — tensy jy eerste dagvaar."
pros:
  - Uitdruklike patenttoekenning van elke bydraer
  - Verkies deur baie maatskappye en stigtings
  - Beskerm handelsmerke
cons:
  - Langer; hantering van die NOTICE-lêer
  - Nie versoenbaar met GPL-2.0-only nie
  - Keer nie gehuisveste mededingers nie
