summary: Swak copyleft op modulevlak met 'n patenttoekenning; kan die GPL as
  sekondêre lisensie aanwys vir versoenbaarheid.
analogy: Deel jou veranderinge aan die geleende hoofstuk; die res van die boek is joune.
