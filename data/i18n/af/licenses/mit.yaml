summary: Doen byna enigiets met die kode. Behou die kopiereg- en
  lisensiekennisgewing. Geen waarborg nie.
analogy: "Soos om 'n gratis boek in 'n kafee te los: neem dit, kopieer dit,
  verkoop dit, hou net die outeur se naam op die voorblad."
pros:
  - Kort en wyd verstaan
  - Maklikste lisensie vir maatskappye om aan te neem
  - Versoenbaar met byna elke ander lisensie
cons:
  - Geen patenttoekenning nie
  - Enigiemand kan 'n geslotebron- of gehuisveste mededinger bou
