summary: "Veritabanları ve veri kümeleri için: atıf bildirimini korumanız
  koşuluyla ticari dahil her türlü kullanım. Veriden ürettiğiniz çalışmalar da
  bildirim gerektirir."
analogy: Harita verisini her yerde kullanın, yalnızca nereden geldiğini söyleyin.
pros:
  - Basit atıf kuralı
  - Büyük yapay zekâ eğitim derlemlerinde yaygın
  - Yalnızca telif hakkını değil, veritabanı haklarını da kapsar
cons:
