analogy: Kural kitabıyla birlikte kullanımı ücretsiz bir motor ve en büyük
  otomobil üreticileri için özel bir sözleşme.
pros:
  - Çoğu kullanıcı için ticari kullanıma izin verilir
  - Geniş ekosistem
cons:
  - OSI tanımına göre açık kaynak değil
  - Kullanım politikası ve adlandırma yükümlülükleri
  - Koşullar sürümler arasında değişir
