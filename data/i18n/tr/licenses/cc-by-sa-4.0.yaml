summary: "İçerik için copyleft: atıfla her türlü kullanım; uyarlamalar aynı
  lisansla paylaşılmalıdır."
analogy: Fotoğrafı serbestçe yeniden düzenleyin, ama sonucu aynı koşullarla paylaşın.
pros:
  - Uyarlamaları açık tutar
  - Wikipedia tarafından kullanılır
cons:
  - Aynı lisansla paylaşım (share-alike) karıştırmayı engelleyebilir
  - Yazılım için tasarlanmamış
