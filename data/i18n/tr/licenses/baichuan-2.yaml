summary: Kayıt olduktan sonra günlük bir milyondan az aktif kullanıcısı olan
  hizmetler için ücretsiz ticari kullanım; daha büyük hizmetler ayrı bir lisans
  gerektirir.
analogy: Aracınızı kaydettirdikten sonra küçük filolar için ücretsiz bir motor.
pros:
  - Çoğu ticari kullanıcı için ücretsiz
  - Güçlü Çince dil modelleri
cons:
  - Açık kaynak değil
  - Kayıt zorunluluğu ve kullanıcı eşiği
