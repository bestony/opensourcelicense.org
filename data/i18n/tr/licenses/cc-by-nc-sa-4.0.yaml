summary: "İçerik için: atıf, ticari kullanım yok ve uyarlamalar aynı lisansla."
analogy: Ders notlarını paylaşın ve yeniden düzenleyin; asla kâr amacıyla değil,
  her zaman aynı koşullarla.
pros:
  - Ticari yeniden kullanımı engeller
  - Ders materyallerinde yaygın
cons:
  - Open Definition'a göre açık değil
  - “Ticari olmayan” çoğu zaman belirsizdir
