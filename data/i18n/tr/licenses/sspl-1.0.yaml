summary: AGPL'ye benzer, ancak yazılımı hizmet olarak sunmak tüm hizmet
  yığınının kaynağını yayımlamayı gerektirir. OSI onaylı değildir.
analogy: Bu yemeği sunan bir restoran işletiyorsanız mutfağınızın planlarını da
  yayımlamalısınız.
pros:
  - Bulut sağlayıcılarına karşı güçlü koruma
cons:
  - OSI tanımına göre açık kaynak değil
  - Birçok dağıtım tarafından reddedildi
  - Topluluk çatallarını tetikleyebilir
