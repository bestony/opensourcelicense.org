summary: "ⴽⵓⴱⵉⵍⵉⴼⵜ ⴳ ⵓⵙⵡⵉⵔ ⵏ ⵜⵙⴷⵍⵉⵙⵜ: ⵉⵙⵏⴼⴰⵍⵏ ⵏ ⵜⵙⴷⵍⵉⵙⵜ ⵇⵇⵉⵎⵏ ⵕⵥⵎⵏ; ⵉⵙⵏⵙⵏ ⵉⵇⵇⵏⵏ
  ⵣⵎⵔⵏ ⴰⴷ ⵙⵔⵙ ⵜⵜⵓⵙⵖⵏⵏ ⵉⵖ ⵣⵎⵔⵏ ⵉⵎⵙⵎⵔⴰⵙⵏ ⴰⴷ ⵙⵏⴼⵍⵏ ⵜⴰⵙⴷⵍⵉⵙⵜ."
analogy: "ⴰⵎⵓⵜⵓⵔ ⴰⵎⵓⵏ: ⵜⵣⵎⵔⴷ ⴰⴷ ⵜ ⵜⴳⴷ ⴳ ⵜⴽⵔⵓⵙⵜ ⵏⵏⴽ, ⵎⴰⵛ ⵉⵎⵍⴰⵢⵏ ⵉⵍⵍⴰ ⴰⴷ ⵣⵎⵔⵏ ⴰⴷ ⵜ
  ⵙⵏⴼⵍⵏ ⵙ ⵡⵉⵏⵏⵙⵏ."
pros:
  - ⵜⵙⵔⴰⴳ ⵉ ⵉⵙⵏⵙⵏ ⵉⵎⵍⴰⵢⵏ ⴰⴷ ⵙⵎⵔⵙⵏ ⵜⴰⵙⴷⵍⵉⵙⵜ
  - ⵉⵙⵏⴼⴰⵍⵏ ⵏ ⵜⵙⴷⵍⵉⵙⵜ ⵇⵇⵉⵎⵏ ⵕⵥⵎⵏ
  - ⴰⴼⴽⴰ ⵏ ⵉⵣⵔⴼⴰⵏ ⵏ ⵓⵙⵏⵓⵍⴼⵓ
cons:
  - ⵜⵉⵏⴱⴹⴰⵜⵉⵏ ⵏ ⵜⵍⵙⴰ ⵏ ⵓⵙⵖⵏ ⵎⵔⵏⵏⵉⵏⵜ, ⵙ ⵓⵎⴰⵜⴰ ⴳ ⵓⵙⵖⵏ ⴰⵔⵎⵉⴷ ⴷ ⵜⵉⵍⵉⴼⵓⵏⵉⵏ
  - ⴽⵔⴰ ⵏ ⵜⴽⴰⴱⴱⴰⵏⵉⵢⵉⵏ ⴰⵔ ⴷⵉⵖ ⵙⵙⵓⴳⵎⵏⵜ ⵜⵜ
