summary: காப்புரிமை வழங்கலும் நியூயார்க் ஆளுகைச் சட்டமும் கொண்ட தொகுதி நிலை
  காப்பிலெஃப்ட்; GPL உடன் இணக்கமற்றது.
analogy: Eclipse-இன் அத்தியாயப் பகிர்வு விதியின் முதல் பதிப்பு.
pros:
  - காப்புரிமை வழங்கல்
  - Clojure, JUnit 4 பயன்படுத்துகின்றன
cons:
  - GPL உடன் இணக்கமற்றது
  - EPL-2.0 இதற்குப் பதிலாக வந்துவிட்டது
