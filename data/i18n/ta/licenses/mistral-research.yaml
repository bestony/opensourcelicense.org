summary: எடைகள் ஆய்வு மற்றும் தனிப்பட்ட பயன்பாட்டுக்கு மட்டும்; எந்த வணிக அல்லது
  தயாரிப்புப் பயன்பாட்டுக்கும் Mistral AI-இடமிருந்து வணிக உரிமம் தேவை.
analogy: "நூலகப் புத்தகம்: படியுங்கள், ஆய்வு செய்யுங்கள், மறுவிற்பனை செய்யாதீர்கள்."
pros:
  - ஆய்வுக்குத் திறந்த எடைகள்
  - ஆய்வுக்காக மாற்ற அனுமதிக்கிறது
cons:
  - வணிகப் பயன்பாடு இல்லை
  - ஓப்பன் சோர்ஸ் அல்ல
