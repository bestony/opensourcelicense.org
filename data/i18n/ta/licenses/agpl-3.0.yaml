summary: "GPL-3.0 உடன் ஒரு நெட்வொர்க் பிரிவு: மாற்றப்பட்ட பதிப்புடன் நெட்வொர்க்
  வழியாகத் தொடர்புகொள்ளும் பயனர்களுக்கு அதன் மூலக் குறியீடு வழங்கப்பட வேண்டும்."
analogy: "சமையல் குறிப்பு விதி உணவகங்களுக்கும் பொருந்தும்: உணவைப் பரிமாறுவதும்
  அதை வழங்குவதாகவே கருதப்படும்."
pros:
  - SaaS ஓட்டையை அடைக்கிறது
  - இரட்டை உரிமத்துக்கு நல்ல அடிப்படை
  - OSI அங்கீகரித்த ஓப்பன் சோர்ஸ்
cons:
  - பல நிறுவனங்கள் இதை முற்றிலும் தடை செய்கின்றன
  - மாற்றாமல் ஹோஸ்ட் செய்வது இன்னும் அனுமதிக்கப்படுகிறது
