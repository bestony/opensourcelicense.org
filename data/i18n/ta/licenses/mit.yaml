sourceHash: 33f06e1e52928136
summary: குறியீட்டைக் கொண்டு ஏறக்குறைய எதையும் செய்யலாம். பதிப்புரிமை மற்றும்
  உரிம அறிவிப்பை வைத்திருங்கள். உத்தரவாதம் இல்லை.
analogy: "ஒரு கஃபேயில் இலவசப் புத்தகத்தை விட்டுச் செல்வது போல: எடுங்கள்,
  நகலெடுங்கள், விற்கவும் செய்யுங்கள்; அட்டையில் ஆசிரியர் பெயரை மட்டும்
  விட்டுவிடுங்கள்."
pros:
  - சுருக்கமானது, பரவலாகப் புரிந்துகொள்ளப்பட்டது
  - நிறுவனங்கள் ஏற்க மிக எளிதான உரிமம்
  - ஏறக்குறைய எல்லா உரிமங்களுடனும் இணக்கமானது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - யார் வேண்டுமானாலும் மூடிய மூல அல்லது ஹோஸ்ட் செய்த போட்டியாளரை உருவாக்கலாம்
