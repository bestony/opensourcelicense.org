summary: பதிவுசெய்த பிறகு, தினசரி பத்து லட்சத்துக்கும் குறைவான செயலில் உள்ள
  பயனர்களைக் கொண்ட சேவைகளுக்கு இலவச வணிகப் பயன்பாடு; பெரிய சேவைகளுக்குத் தனி
  உரிமம் தேவை.
analogy: வாகனத்தைப் பதிவுசெய்த பிறகு, சிறிய வாகனக் குழுக்களுக்கு இலவச இன்ஜின்.
pros:
  - பெரும்பாலான வணிகப் பயனர்களுக்கு இலவசம்
  - வலுவான சீன மொழி மாடல்கள்
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - பதிவும் பயனர் வரம்பும்
