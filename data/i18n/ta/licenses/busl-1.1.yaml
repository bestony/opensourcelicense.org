summary: "மூலம் கிடைக்கும் உரிமம்: தயாரிப்புப் பயன்பாடு Additional Use Grant
  மூலம் வரம்பிடப்படுகிறது; ஒவ்வொரு பதிப்பும் Change Date-க்குப் பிறகு
  (அதிகபட்சம் 4 ஆண்டுகள்) திறந்த உரிமமாக மாறும்."
analogy: "கடைக் கண்ணாடிப் பெட்டி: பார்க்கலாம், முயன்று பார்க்கலாம்; சில
  ஆண்டுகளுக்குப் பிறகு அந்தப் பொருள் அனைவருக்கும் இலவசமாகிறது."
pros:
  - வணிகப் பயன்பாட்டைக் கட்டுப்படுத்த உதவுகிறது
  - குறியீடு பின்னர் ஓப்பன் சோர்ஸாகிறது
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - வழங்கல் விதிகள் திட்டத்துக்குத் திட்டம் மாறுபடும்
  - ஃபோர்க்குகளைத் தூண்டலாம்
