summary: "உள்ளடக்கத்துக்கான காப்பிலெஃப்ட்: படைப்பாளர் குறிப்புடன் எந்தப்
  பயன்பாடும்; தழுவல்கள் அதே உரிமத்தின் கீழ் பகிரப்பட வேண்டும்."
analogy: புகைப்படத்தைச் சுதந்திரமாக ரீமிக்ஸ் செய்யுங்கள், ஆனால் உங்கள் ரீமிக்ஸை
  அதே விதிகளில் பகிருங்கள்.
pros:
  - தழுவல்களைத் திறந்தே வைக்கிறது
  - Wikipedia பயன்படுத்துகிறது
cons:
  - அதே-விதிப் பகிர்வு கலப்பதைத் தடுக்கலாம்
  - மென்பொருளுக்காக வடிவமைக்கப்படவில்லை
