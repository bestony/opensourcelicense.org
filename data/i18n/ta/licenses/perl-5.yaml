sourceHash: 4f54478806088c0d
summary: "Perl-இன் இரட்டை உரிமம்: பெறுநர்கள் Artistic License 1.0 அல்லது GPL
  (பதிப்பு 1 அல்லது அதற்குப் பிந்தையது) ஆகியவற்றில் ஒன்றைத் தேர்ந்தெடுக்கலாம்."
analogy: இரண்டு விதிப் புத்தகங்களில் உங்களுக்குப் பொருந்துவதைத் தேர்ந்தெடுங்கள்.
pros:
  - ஓரளவு அனுமதிமிக்க மற்றும் காப்பிலெஃப்ட் விதிகளுக்கு இடையே தேர்வு
  - CPAN தொகுதிகளுக்கான தரநிலை
cons:
  - Artistic 1.0 தெளிவற்றது
  - காப்புரிமை வழங்கல் இல்லை
