summary: எடைகள் கல்வி ஆய்வுக்கு இலவசம்; பதிவுசெய்த பிறகு வணிகப் பயன்பாடும்
  இலவசம், பயன்பாட்டுக் கட்டுப்பாடுகளுக்கு உட்பட்டு.
analogy: படிப்பதற்கு இலவசம்; வணிகத்தில் பயன்படுத்தும் முன் பதிவுசெய்யுங்கள்.
pros:
  - பதிவுக்குப் பிறகு வணிகப் பயன்பாடு
  - பரவலாகப் பயன்படும் சீன மாடல்கள்
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - பதிவுப் படி
