sourceHash: f723aee8de4d57cd
summary: முடிந்த இடங்களில் படைப்பைப் பொதுக்களத்துக்கு அர்ப்பணிக்கிறது,
  அனுமதிமிக்க மாற்று உரிமத்துடன். படைப்பாளர் குறிப்பு தேவையில்லை.
analogy: "பெயர் எழுதாத புத்தகத்தைப் பூங்கா இருக்கையில் விட்டுச் செல்வது: யார்
  வேண்டுமானாலும் எடுக்கலாம்."
pros:
  - எந்த நிபந்தனையும் இல்லை
  - எதனுடனும் இணைப்பது எளிது
cons:
  - பொதுக்கள அர்ப்பணிப்பு எல்லா நாடுகளிலும் அங்கீகரிக்கப்படவில்லை
  - சட்ட நிச்சயமின்மை காரணமாகச் சில நிறுவனங்கள் இதைத் தவிர்க்கின்றன
