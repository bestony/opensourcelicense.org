sourceHash: 362187e701e25e6a
summary: MPL-இலிருந்து வந்த கோப்பு நிலை காப்பிலெஃப்ட், காப்புரிமை வழங்கலுடன்;
  GPL உடன் இணக்கமற்றது.
analogy: கடன் வாங்கிய கோப்பில் செய்த மாற்றங்களைப் பகிருங்கள்; விரும்பினால்
  மற்றவற்றை மூடியே வைக்கலாம்.
pros:
  - கோப்பு நிலை வரம்பு
  - காப்புரிமை வழங்கல்
cons:
  - GPL உடன் இணக்கமற்றது (Linux-இல் ZFS சிக்கல்)
  - புதிய திட்டங்கள் அரிதாகவே ஏற்கின்றன
