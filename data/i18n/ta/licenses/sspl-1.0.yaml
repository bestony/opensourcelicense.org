summary: AGPL போன்றது, ஆனால் மென்பொருளைச் சேவையாக வழங்கினால் முழு சேவை அடுக்கின்
  மூலத்தையும் வெளியிட வேண்டும். OSI அங்கீகரிக்கவில்லை.
analogy: இந்த உணவைப் பரிமாறும் உணவகத்தை நடத்தினால், உங்கள் சமையலறையின்
  வரைபடத்தையும் வெளியிட வேண்டும்.
pros:
  - கிளவுட் நிறுவனங்களுக்கு எதிராக வலுவான பாதுகாப்பு
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - பல விநியோகங்கள் இதை நிராகரித்தன
  - சமூக ஃபோர்க்குகளைத் தூண்டலாம்
