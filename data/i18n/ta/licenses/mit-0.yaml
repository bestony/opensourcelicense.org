summary: "படைப்பாளர் குறிப்புத் தேவை இல்லாத MIT: எந்த அறிவிப்பையும் வைக்காமல்
  பயன்படுத்தலாம், நகலெடுக்கலாம், விற்கலாம்."
analogy: ஆசிரியர் பெயர் இல்லாமல் மறு அட்டை போடக்கூடிய இலவசப் புத்தகம்.
pros:
  - படைப்பாளர் குறிப்பு தேவையில்லை
  - மாதிரிகள் மற்றும் குறியீட்டுத் துணுக்குகளுக்கு ஏற்றது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - ஆசிரியர்களுக்குப் பெயர் குறிப்பிடும் கட்டாயம் இல்லை
