summary: "மூலம் கிடைக்கும் உரிமம்: பயன்படுத்தவும் மாற்றவும் இலவசம்; ஆனால் இதை
  நிர்வகிக்கப்பட்ட சேவையாக வழங்கவோ உரிமச் சாவிகளைத் தவிர்க்கவோ கூடாது."
analogy: வீட்டிலோ உங்கள் உணவகத்திலோ இதைக் கொண்டு சமையுங்கள், ஆனால் இதே உணவை
  விற்கும் கடையைத் திறக்காதீர்கள்.
pros:
  - சுருக்கமானது, தெளிவானது
  - நிர்வகிக்கப்பட்ட சேவைப் போட்டியாளர்களை மட்டும் குறிவைக்கிறது
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - ஃபோர்க்குகளையும் சில கூட்டாளர்களையும் வரம்பிடுகிறது
