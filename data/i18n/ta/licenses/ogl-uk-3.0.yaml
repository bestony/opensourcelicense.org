summary: "ஐக்கிய இராச்சியப் பொதுத்துறை உரிமம்: அரசுத் தகவல்களை வணிகரீதியாகவும்
  சுதந்திரமாகப் பயன்படுத்தலாம், படைப்பாளர் குறிப்புடன்."
analogy: மூலத்தைக் குறிப்பிட்டால் மறுபயன்படுத்தக்கூடிய பொதுப் பதிவுகள்.
pros:
  - எளிய படைப்பாளர் குறிப்பு விதி
  - CC BY 4.0 உடன் இணக்கமானது
cons:
  - ஐக்கிய இராச்சியத்துக்கே உரிய சொல்லாடல்
  - சில தரவுகள் விலக்கப்பட்டுள்ளன (தனிப்பட்ட தரவு, சின்னங்கள்)
