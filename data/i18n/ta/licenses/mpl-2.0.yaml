sourceHash: 6d33e2e6b797d27f
summary: "கோப்பு நிலை காப்பிலெஃப்ட்: MPL உரிமக் கோப்புகளில் செய்த மாற்றங்கள்
  திறந்தே இருக்க வேண்டும், ஆனால் பிற கோப்புகளில் உள்ள மூடிய குறியீட்டுடன்
  இணைக்கலாம்."
analogy: ஓர் அத்தியாயத்தைக் கடன் வாங்கினால் அதில் செய்த திருத்தங்களைப் பகிர
  வேண்டும்; மீதிப் புத்தகம் உங்களுடையது.
pros:
  - அனுமதிமிக்கதுக்கும் காப்பிலெஃப்ட்டுக்கும் இடையே சமநிலை
  - வெளிப்படையான காப்புரிமை வழங்கல்
  - இயல்பாகவே GPL இணக்கமானது
cons:
  - கோப்பு எல்லைகள் தெளிவற்றதாக இருக்கலாம்
  - நெட்வொர்க் பயன்பாட்டை உள்ளடக்காது
