summary: "LaTeX தொகுப்புகளுக்கான கட்டற்ற உரிமம்: ஆவணங்கள் எங்கும் ஒரே மாதிரி
  வேலை செய்ய, மாற்றிய கோப்புகள் மறுபெயரிடப்பட வேண்டும் அல்லது தெளிவாகக்
  குறிக்கப்பட வேண்டும்."
analogy: எழுத்துருவை மாற்றலாம், ஆனால் உங்கள் பதிப்புக்குப் புதிய பெயர் கொடுங்கள்.
pros:
  - ஆவணங்களை மறுஉருவாக்கக்கூடியதாக வைக்கிறது
  - CTAN முழுவதும் தரநிலை
cons:
  - மறுபெயரிடல் விதி வழக்கத்துக்கு மாறானது
  - GPL இணக்கமற்றது
