sourceHash: 22649412ed3dbb5f
summary: "லைப்ரரி காப்பிலெஃப்ட்: லைப்ரரியில் செய்த மாற்றங்கள் திறந்தே இருக்கும்;
  பயனர்கள் மாற்றிய லைப்ரரியுடன் மறு இணைப்பு செய்ய முடிந்தால், மூடிய நிரல்கள்
  அதனுடன் இணையலாம்."
analogy: மாற்றக்கூடிய பொது இன்ஜினின் பழைய பதிப்பு.
pros:
  - தனியுரிமப் பயன்பாடுகள் லைப்ரரியைப் பயன்படுத்த அனுமதிக்கிறது
  - டெஸ்க்டாப், மல்டிமீடியா லைப்ரரிகளில் பொதுவானது
cons:
  - மறு இணைப்பு விதிகள் சிக்கலானவை
  - வெளிப்படையான காப்புரிமை வழங்கல் இல்லை
