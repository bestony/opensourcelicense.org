summary: "வலுவான காப்பிலெஃப்ட்: மென்பொருளையோ அதன் வழிப்படைப்புகளையோ
  விநியோகித்தால், முழு மூலக் குறியீட்டையும் GPL-3.0-இன் கீழ் வெளியிட வேண்டும்."
analogy: “இதை அடிப்படையாகக் கொண்ட உணவைப் பரிமாறுபவர் முழுச் சமையல் குறிப்பையும்
  தர வேண்டும்” என்று சொல்லும் ஒரு சமையல் குறிப்பு.
pros:
  - விநியோகிக்கப்படும் அனைத்து வழிப்படைப்புகளையும் திறந்தே வைக்கிறது
  - காப்புரிமை வழங்கலும் டிவோயிசேஷன் எதிர்ப்பும்
  - வலுவான சமூக மரபு
cons:
  - பல நிறுவனங்கள் இதைத் தவிர்க்கின்றன
  - SaaS-ஐ உள்ளடக்காது (விநியோகம் இல்லை)
  - GPL-2.0-only உடன் இணக்கமற்றது
