sourceHash: 72d99432db49e19d
summary: Unicode தரவு மற்றும் ICU, CLDR போன்ற மென்பொருளுக்கான அனுமதிமிக்க
  உரிமம்; அறிவிப்பை வைத்திருங்கள், விளம்பரத்துக்குப் பதிப்புரிமைதாரரின் பெயரைப்
  பயன்படுத்தாதீர்கள்.
analogy: "ஓர் இலவசக் குறிப்புப் புத்தகம்: நகலெடுங்கள், மேற்கோள் வரியை வைத்திருங்கள்."
pros:
  - அனுமதிமிக்கது
  - தரவுக் கோப்புகளையும் குறியீட்டையும் உள்ளடக்குகிறது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - பெரும்பாலும் Unicode திட்டங்களில் பயன்படுகிறது
