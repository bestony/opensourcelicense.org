summary: மாடல் எடைகள் வணிகமற்ற பயன்பாட்டுக்கு மட்டும்; எடைகளின் வணிகப்
  பயன்பாட்டுக்கு Black Forest Labs-இடமிருந்து தனி உரிமம் தேவை.
analogy: கேமராவை உங்கள் சொந்தத் திட்டங்களுக்குக் கடன் வாங்குங்கள், கட்டணப்
  படப்பிடிப்புகளுக்கு அல்ல.
pros:
  - ஆய்வு மற்றும் பொழுதுபோக்குக்குத் திறந்த எடைகள்
  - தெளிவான வணிகப் பாதை
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - வணிகப் பயன்பாட்டுக்குக் கட்டண உரிமம் தேவை
