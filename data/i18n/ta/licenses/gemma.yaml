summary: "Google-இன் மாடல் விதிமுறைகள்: வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது;
  தடைசெய்யப்பட்ட பயன்பாட்டுக் கொள்கை வடித்தெடுத்த மாடல்கள் உட்பட ஒவ்வொரு
  வழிப்படைப்புக்கும் செல்லும்."
analogy: மீண்டும் உருவாக்கப்படும் ஒவ்வொரு இன்ஜினும் தன்னுடன் எடுத்துச் செல்ல
  வேண்டிய விதிப் புத்தகத்துடன் ஓர் இலவச இன்ஜின்.
pros:
  - பயனர் வரம்பின்றி வணிகப் பயன்பாடு
  - தெளிவான வழிப்படைப்பு விதிகள்
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - Google பயன்பாட்டுக் கொள்கையைப் புதுப்பிக்கலாம்
