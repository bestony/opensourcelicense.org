summary: "Linux Foundation-இன் அனுமதிமிக்க தரவு உரிமம்: தரவைச் சுதந்திரமாகப்
  பயன்படுத்திப் பகிருங்கள்; பயிற்றுவிக்கப்பட்ட மாடல்கள் போன்ற முடிவுகளுக்குக்
  கட்டுப்பாடு இல்லை."
analogy: தரவுத்தொகுப்பை எதற்கும் பயன்படுத்துங்கள்; தரவை மற்றவருக்குக்
  கொடுக்கும்போது ஒப்பந்தத்தையும் சேர்த்துக் கொடுங்கள்.
pros:
  - கணினி முடிவுகளை வெளிப்படையாக விடுவிக்கிறது
  - தரவுக்காகவே எழுதப்பட்டது
cons:
  - CC உரிமங்களை விடக் குறைவாக அறியப்பட்டது
  - பதிப்பு 2.0 எளிமையானது
