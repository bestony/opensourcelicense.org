summary: வெளிப்படையான காப்புரிமை வழங்கல் கொண்ட சுருக்கமான அனுமதிமிக்க உரிமம்;
  Oracle GraalVM மற்றும் பிற திட்டங்களுக்குப் பயன்படுத்துகிறது.
analogy: காப்புரிமை பற்றிய கூடுதல் உறுதிமொழியுடன் MIT இலவசப் புத்தகம்.
pros:
  - சுருக்கமானது, அனுமதிமிக்கது
  - வெளிப்படையான காப்புரிமை வழங்கல்
cons:
  - காப்புரிமைப் பதிலடிப் பிரிவு இல்லை
  - MIT அல்லது Apache-ஐ விடக் குறைவாக அறியப்பட்டது
