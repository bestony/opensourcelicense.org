summary: வெளிப்படையான காப்புரிமை வழங்கல், காப்புரிமைப் பதிலடிப் பிரிவு, மாற்றிய
  கோப்புகளைக் குறிக்கும் கட்டாயம் கொண்ட அனுமதிமிக்க உரிமம்.
analogy: ஓர் இலவசக் கருவிப்பெட்டி; அதன் காப்புரிமைகளுக்காக உங்கள் மீது வழக்குத்
  தொடர மாட்டோம் என்ற உறுதிமொழியுடன் — நீங்கள் முதலில் வழக்குத் தொடராத வரை.
pros:
  - ஒவ்வொரு பங்களிப்பாளரிடமிருந்தும் வெளிப்படையான காப்புரிமை வழங்கல்
  - பல நிறுவனங்களும் அறக்கட்டளைகளும் விரும்புகின்றன
  - வர்த்தகமுத்திரைகளைப் பாதுகாக்கிறது
cons:
  - நீளமானது; NOTICE கோப்பைக் கையாள வேண்டும்
  - GPL-2.0-only உடன் இணக்கமற்றது
  - ஹோஸ்ட் செய்யும் போட்டியாளர்களைத் தடுக்காது
