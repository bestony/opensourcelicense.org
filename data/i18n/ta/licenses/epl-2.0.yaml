sourceHash: 5941dce0a6108d60
summary: காப்புரிமை வழங்கலுடன் தொகுதி நிலை பலவீனமான காப்பிலெஃப்ட்;
  இணக்கத்துக்காக GPL-ஐ இரண்டாம் நிலை உரிமமாக அறிவிக்கலாம்.
analogy: கடன் வாங்கிய அத்தியாயத்தில் செய்த மாற்றங்களைப் பகிருங்கள்; மீதிப்
  புத்தகம் உங்களுடையது.
pros:
  - வணிகத்துக்கு ஏற்ற காப்பிலெஃப்ட்
  - காப்புரிமை வழங்கல்
cons:
  - அறிவிக்கப்பட்ட இரண்டாம் நிலை உரிமத்துடன் மட்டுமே GPL இணக்கம்
  - தொகுதி எல்லைகள் தெளிவற்றதாக இருக்கலாம்
