summary: "தரவுத்தளங்கள் மற்றும் தரவுத்தொகுப்புகளுக்கு: படைப்பாளர் குறிப்பு
  அறிவிப்பை வைத்திருந்தால், வணிகம் உட்பட எந்தப் பயன்பாடும். தரவிலிருந்து
  உருவாக்கும் படைப்புகளிலும் அறிவிப்பு தேவை."
analogy: வரைபடத் தரவை எங்கும் பயன்படுத்துங்கள், அது எங்கிருந்து வந்தது என்பதை
  மட்டும் சொல்லுங்கள்.
pros:
  - எளிய படைப்பாளர் குறிப்பு விதி
  - பெரிய AI பயிற்சித் தரவுத் தொகுப்புகளுக்குப் பொதுவானது
  - பதிப்புரிமை மட்டுமல்ல, தரவுத்தள உரிமைகளையும் உள்ளடக்குகிறது
cons:
  - மென்பொருளுக்காக வடிவமைக்கப்படவில்லை
  - காப்புரிமை வழங்கல் இல்லை
