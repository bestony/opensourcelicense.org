summary: "மாடல்களுக்கான Responsible AI License: அனுமதிமிக்க விதிமுறைகளுடன்,
  ஒவ்வொரு வழிப்படைப்பும் கடத்த வேண்டிய பயன்பாடு சார்ந்த கட்டுப்பாடுகள்."
analogy: தடைசெய்யப்பட்ட பயன்பாடுகளின் பட்டியல் ஒவ்வொரு நகலுடனும் பயணிக்கும் ஓர்
  இலவசக் கருவி.
pros:
  - வணிகப் பயன்பாட்டை அனுமதிக்கிறது
  - தீங்கான பயன்பாட்டுக் கட்டுப்பாடுகளைக் கீழ்நிலையிலும் தக்கவைக்கிறது
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - கட்டுப்பாடுகளைச் செயல்படுத்துவது கடினம்
  - பல வகைகள் உள்ளன
