summary: "OpenRAIL பாணி மாடல் உரிமம்: வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது;
  பயன்பாடு சார்ந்த கட்டுப்பாடுகள் வழிப்படைப்புகளுக்கும் செல்லும்."
analogy: ஒவ்வொரு நகலுடனும் தடைசெய்யப்பட்ட பயன்பாடுகளின் பட்டியல் இணைக்கப்பட்ட
  ஓர் இலவசக் கருவி.
pros:
  - வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது
  - பயன்பாட்டுக் கட்டுப்பாடுகள் கீழ்நிலைக்கும் செல்லும்
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - புதிய DeepSeek மாடல்கள் MIT-க்கு மாறிவிட்டன
