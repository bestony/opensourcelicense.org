sourceHash: 99f045fe47a729cc
summary: "மூலம் கிடைக்கும் உரிமம்: சுதந்திரமாகப் பயன்படுத்தலாம், மாற்றலாம்,
  விநியோகிக்கலாம்; Confluent-உடன் போட்டியிடும் SaaS தயாரிப்பை வழங்குவது மட்டும்
  தவிர."
analogy: சமையல் குறிப்பை எந்த உணவகத்திலும் பயன்படுத்துங்கள், ஆசிரியரின்
  உணவகத்துடன் போட்டியிடும் உணவகத்தைத் தவிர.
pros:
  - குறுகிய கட்டுப்பாடு
  - பெரும்பாலான பயனர்கள் பாதிக்கப்படுவதில்லை
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - கிளவுட் போட்டியாளர்களை விவரிப்பின் அடிப்படையில் மட்டுமே விலக்குகிறது
