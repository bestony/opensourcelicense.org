summary: "உள்ளடக்கம் மற்றும் தரவுக்கு: படைப்பாளர் குறிப்பு கட்டாயம், வணிகப்
  பயன்பாடு அனுமதிக்கப்படாது."
analogy: புகைப்படத்தைச் சுதந்திரமாகப் பகிருங்கள், ஆனால் விளம்பரங்களிலோ விற்கும்
  பொருள்களிலோ அல்ல.
pros:
  - வணிக மறுபயன்பாட்டைத் தடுக்கிறது
  - அதிகாரப்பூர்வ மொழிபெயர்ப்புகள் உண்டு
cons:
  - OSI அல்லது Open Definition வரையறைப்படி திறந்தது அல்ல
  - “வணிகமற்றது” என்பது பெரும்பாலும் தெளிவற்றது
  - பல முறையான பயன்பாடுகளையும் தடுக்கிறது
