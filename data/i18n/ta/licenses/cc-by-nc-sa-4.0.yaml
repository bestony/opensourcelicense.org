summary: "உள்ளடக்கத்துக்கு: படைப்பாளர் குறிப்பு, வணிகப் பயன்பாடு இல்லை,
  தழுவல்கள் அதே உரிமத்தின் கீழ்."
analogy: விரிவுரைக் குறிப்புகளைப் பகிருங்கள், ரீமிக்ஸ் செய்யுங்கள்; ஒருபோதும்
  லாபத்துக்கு அல்ல, எப்போதும் அதே விதிகளில்.
pros:
  - வணிக மறுபயன்பாட்டைத் தடுக்கிறது
  - பாடப்பொருள்களுக்குப் பொதுவானது
cons:
  - Open Definition வரையறைப்படி திறந்தது அல்ல
  - “வணிகமற்றது” என்பது பெரும்பாலும் தெளிவற்றது
