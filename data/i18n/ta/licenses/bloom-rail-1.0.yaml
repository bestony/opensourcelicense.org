summary: "ஒரு பெரிய மொழி மாடலுக்கான முதல் Responsible AI License: திறந்த அணுகல்,
  வழிப்படைப்புகளையும் கட்டுப்படுத்தும் பயன்பாடு சார்ந்த கட்டுப்பாடுகளுடன்."
analogy: ஒவ்வொரு நகலுடனும் தடைசெய்யப்பட்ட பயன்பாடுகளின் பட்டியல் இணைக்கப்பட்ட
  ஓர் இலவசக் கருவி.
pros:
  - வணிகப் பயன்பாட்டை அனுமதிக்கிறது
  - RAIL உரிமமுறையின் முன்னோடி
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - கட்டுப்பாடுகளைச் செயல்படுத்துவது கடினம்
