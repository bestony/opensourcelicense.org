sourceHash: 6a4054dc9cca8e7e
summary: "தரவுத்தளங்களுக்கான அதே-விதிப் பகிர்வு: தரவை வணிகரீதியாகப்
  பயன்படுத்தலாம், ஆனால் பொதுவில் வெளியிடப்படும் வழித் தரவுத்தளங்கள் ODbL-இன்
  கீழேயே இருக்க வேண்டும். வரைபடங்கள், படங்கள் போன்ற உருவாக்கப்பட்ட
  படைப்புகளுக்குப் படைப்பாளர் குறிப்பு மட்டும் போதும்."
analogy: பொது வரைபடத்தின் மீது கட்டமையுங்கள்; மேம்படுத்திய வரைபடத் தரவுத்தளத்தை
  வெளியிட்டால் அதே விதிகளில் திரும்பப் பகிருங்கள்.
pros:
  - மேம்படுத்திய தரவுத்தளங்களைத் திறந்தே வைக்கிறது
  - வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது
  - OpenStreetMap மூலம் நிரூபிக்கப்பட்டது
cons:
  - அதே-விதிப் பகிர்வு பிற தரவுடன் கலப்பதைத் தடுக்கலாம்
  - “வழித் தரவுத்தளம்” சில நேரங்களில் தெளிவற்றது
