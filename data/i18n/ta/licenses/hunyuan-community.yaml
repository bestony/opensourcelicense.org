sourceHash: c882745d1b8524bb
summary: ஏற்கத்தக்க பயன்பாட்டுக் கொள்கையுடன் வணிகப் பயன்பாடு
  அனுமதிக்கப்படுகிறது; மிகப் பெரிய சேவைகளுக்குத் தனி உரிமம் தேவை, சில
  பிராந்தியங்கள் விலக்கப்பட்டுள்ளன.
analogy: விதிப் புத்தகம், அளவு வரம்பு, எங்கே ஓட்டலாம் என்ற வரைபடம் ஆகியவற்றுடன்
  ஓர் இலவச இன்ஜின்.
pros:
  - பெரும்பாலான பயனர்களுக்கு வணிகப் பயன்பாடு
  - உரை, வீடியோ, 3D மாடல்களை உள்ளடக்குகிறது
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - பிராந்திய விலக்குகள்
