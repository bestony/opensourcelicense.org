summary: "ஒரு தனிப்பயன் மாடல் உரிமம்: வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது;
  Acceptable Use Policy, படைப்பாளர் குறிப்பு மற்றும் பெயரிடல் விதிகளுடன்,
  மாதாந்திரச் செயலில் உள்ள பயனர்கள் 70 கோடியைத் தாண்டினால் தனி உரிமம்."
analogy: விதிப் புத்தகத்துடன் இலவசமாகப் பயன்படுத்தக்கூடிய இன்ஜின், மிகப் பெரிய
  கார் உற்பத்தியாளர்களுக்குச் சிறப்பு ஒப்பந்தத்துடன்.
pros:
  - பெரும்பாலான பயனர்களுக்கு வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது
  - பெரிய சூழலமைப்பு
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - பயன்பாட்டுக் கொள்கை மற்றும் பெயரிடல் கடமைகள்
  - பதிப்புகளுக்கு இடையே விதிமுறைகள் மாறுகின்றன
