summary: "MIT-க்கு இணையான சுருக்கமான உரிமம்: பதிப்புரிமை மற்றும் அனுமதி
  அறிவிப்பை வைத்திருந்தால் எந்தப் பயன்பாடும்."
analogy: MIT போன்ற அதே இலவசப் புத்தகம், அட்டையில் சுருக்கமான குறிப்புடன்.
pros:
  - பொதுவான அனுமதிமிக்க உரிமங்களில் மிகச் சுருக்கமானது
  - பல npm தொகுப்புகளின் இயல்புநிலை
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - மூடிய ஃபோர்க்குகள் அனுமதிக்கப்படுகின்றன
