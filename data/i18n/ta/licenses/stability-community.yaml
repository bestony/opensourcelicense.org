summary: ஆய்வு, வணிகமற்ற பயன்பாடு, ஆண்டு வருவாய் 10 லட்சம் USD-க்குக் குறைவான
  வணிகப் பயன்பாடு ஆகியவற்றுக்கு இலவசம்; பெரிய நிறுவனங்களுக்கு நிறுவன உரிமம்
  தேவை.
analogy: சிறு வணிகங்களுக்கு இலவச அனுமதி; பெரியவை டிக்கெட் வாங்க வேண்டும்.
pros:
  - தனிநபர்களுக்கும் சிறு நிறுவனங்களுக்கும் இலவசம்
  - சமீபத்திய Stability மாடல்களை உள்ளடக்குகிறது
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - வருவாய் வரம்பைக் கண்காணிக்க வேண்டும்
