summary: "வணிகரீதியாகப் பயன்படுத்தக்கூடிய மாடல் உரிமம்: வழிப்படைப்புகள்
  அனுமதிக்கப்படுகின்றன, வெளியீடுகள் மீது NVIDIA உரிமை கோருவதில்லை; ஆனால்
  உள்ளமைந்த பாதுகாப்புக் கட்டுப்பாடுகளைத் தவிர்க்கக் கூடாது."
analogy: சீட் பெல்ட்டுகளை அகற்றக் கூடாத ஓர் இலவச இன்ஜின்.
pros:
  - வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது
  - வெளியீடுகள் மீது உரிமைக் கோரல் இல்லை
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - பாதுகாப்புக் கட்டுப்பாட்டுப் பிரிவில் கவனம் தேவை
