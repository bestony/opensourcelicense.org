summary: "கையேடுகளுக்கான காப்பிலெஃப்ட்: நகல்களும் மாற்றிய பதிப்புகளும் GFDL-இன்
  கீழேயே இருக்க வேண்டும்; வரலாறும் மாற்ற முடியாத பிரிவுகளும் தக்கவைக்கப்பட
  வேண்டும்."
analogy: சமையல் புத்தகத்தின் கையேட்டுக்கான சமையல் குறிப்புப் பகிர்வு விதி.
pros:
  - ஆவணங்களைக் கட்டற்றதாக வைக்கிறது
  - GNU கையேடுகள் பயன்படுத்துகின்றன
cons:
  - மாற்ற முடியாத பிரிவுகள் சர்ச்சைக்குரியவை
  - CC உள்ளடக்கத்துடன் கலப்பது கடினம்
