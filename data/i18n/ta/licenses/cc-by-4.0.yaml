summary: "உள்ளடக்கம், தரவு, ஆவணங்களுக்கு: வணிகம் உட்பட எந்தப் பயன்பாடும்,
  படைப்பாளர் குறிப்பு மற்றும் மாற்றங்களைச் சுட்டுவதுடன்."
analogy: புகைப்படத்தை எங்கும் பகிருங்கள், புகைப்படக் கலைஞருக்கு மட்டும் பெயர்
  குறிப்பிடுங்கள்.
pros:
  - எளிய படைப்பாளர் குறிப்பு விதி
  - தரவு மற்றும் ஆவணங்களுக்கு ஏற்றது
  - அதிகாரப்பூர்வ மொழிபெயர்ப்புகள் உண்டு
cons:
  - மென்பொருளுக்காக வடிவமைக்கப்படவில்லை
  - காப்புரிமை வழங்கல் இல்லை
