sourceHash: cdef0d42cb1ab51e
summary: "லைப்ரரி நிலை காப்பிலெஃப்ட்: லைப்ரரியில் செய்த மாற்றங்கள் திறந்தே
  இருக்கும்; பயனர்கள் லைப்ரரியை மாற்ற முடிந்தால், மூடிய பயன்பாடுகள் அதனுடன்
  இணையலாம்."
analogy: "ஒரு பொது இன்ஜின்: அதை உங்கள் காரில் பொருத்தலாம், ஆனால் உரிமையாளர்கள்
  அதைத் தங்கள் சொந்த இன்ஜினால் மாற்ற முடிய வேண்டும்."
pros:
  - தனியுரிமப் பயன்பாடுகள் லைப்ரரியைப் பயன்படுத்த அனுமதிக்கிறது
  - லைப்ரரியில் செய்த மாற்றங்கள் திறந்தே இருக்கும்
  - காப்புரிமை வழங்கல்
cons:
  - மறு இணைப்பு விதிகள் சிக்கலானவை, குறிப்பாக நிலையான இணைப்பு (static linking)
    மற்றும் மொபைலுக்கு
  - சில நிறுவனங்கள் இன்னும் இதைத் தவிர்க்கின்றன
