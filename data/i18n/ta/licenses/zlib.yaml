summary: "அனுமதிமிக்க உரிமம்: மாற்றிய மூலம் மாற்றப்பட்டது எனக் குறிக்கப்பட
  வேண்டும், மூலத்தின் தோற்றம் தவறாகக் காட்டப்படக் கூடாது, அறிவிப்பு மூல
  நகல்களில் இருக்க வேண்டும்."
analogy: சமையல் குறிப்பைக் கடன் வாங்குங்கள், ஆனால் மாற்றினால் அதை மூலக் குறிப்பு
  என்று சொல்லாதீர்கள்.
pros:
  - அனுமதிமிக்கது, சுருக்கமானது
  - கேம்கள் மற்றும் நேட்டிவ் லைப்ரரிகளில் பிரபலம்
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - மூடிய ஃபோர்க்குகள் அனுமதிக்கப்படுகின்றன
