summary: "மூலம் கிடைக்கும் உரிமம்: போட்டித் தயாரிப்பைத் தவிர எந்தப் பயன்பாடும்;
  ஒவ்வொரு வெளியீடும் இரண்டு ஆண்டுகளுக்குப் பிறகு Apache-2.0 ஆகிறது."
analogy: இரண்டு ஆண்டுகளுக்குப் பிறகு பொருள்கள் அனைவருக்கும் இலவசமாகும் கடைக்
  கண்ணாடிப் பெட்டி.
pros:
  - சுருக்கமானது, முன்கணிக்கக்கூடியது
  - குறியீடு இரண்டு ஆண்டுகளில் ஓப்பன் சோர்ஸாகிறது
cons:
  - ஓப்பன் சோர்ஸ் அல்ல
  - “போட்டிப் பயன்பாடு” என்பதைத் தீர்மானிப்பது கடினமாக இருக்கலாம்
