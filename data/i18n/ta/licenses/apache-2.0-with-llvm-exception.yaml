sourceHash: ded3362d69058c2a
summary: "Apache-2.0 உடன் ஒரு விதிவிலக்கு: தொகுக்கப்பட்ட (compiled)
  குறியீட்டுக்குப் படைப்பாளர் குறிப்புத் தேவையை நீக்கி, GPL-2.0 திட்டங்களுடன்
  பயன்படுத்தக்கூடியதாக்குகிறது."
analogy: Apache-இன் கருவிப்பெட்டி; உங்கள் தயாரிப்பில் மிஞ்சும் கருவித்
  துண்டுகளுக்குப் பெயர் குறிப்பிடத் தேவையில்லை என்ற குறிப்புடன்.
pros:
  - Apache-2.0 இன் காப்புரிமை வழங்கல்
  - GPL-2.0 குறியீட்டுடன் வேலை செய்யும்
cons:
  - MIT-ஐ விட நீளமானது
  - விதிவிலக்கு கம்பைலர் போன்ற திட்டங்களுக்கே உரியது
