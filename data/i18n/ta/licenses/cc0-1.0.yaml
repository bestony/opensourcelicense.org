sourceHash: d61f5398bef2c150
summary: "தரவு மற்றும் உள்ளடக்கத்துக்கான பொதுக்கள அர்ப்பணிப்பு, மாற்று
  உரிமத்துடன்: எந்த நிபந்தனையும் இல்லை, படைப்பாளர் குறிப்பும் தேவையில்லை."
analogy: புகைப்படத்தைப் பொதுச் சுவரில் ஒட்டுங்கள்; யார் வேண்டுமானாலும்
  எடுத்துக்கொள்ளலாம்.
pros:
  - நிபந்தனைகள் இல்லை
  - திறந்த தரவுக்கு ஏற்றது
cons:
  - படைப்பாளர் குறிப்புக்கு உத்தரவாதம் இல்லை
  - காப்புரிமை வழங்கல் இல்லை
