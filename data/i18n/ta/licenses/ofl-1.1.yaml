sourceHash: 2388a1183d57050c
summary: "கட்டற்ற எழுத்துரு உரிமம்: எழுத்துருக்களைச் சுதந்திரமாகப்
  பயன்படுத்தலாம், உட்பொதிக்கலாம், மாற்றலாம்; ஆனால் மாற்றிய எழுத்துருக்கள்
  ஒதுக்கப்பட்ட பெயர்களை நீக்க வேண்டும், எழுத்துருக்களைத் தனியாக விற்கக் கூடாது."
analogy: எழுத்துருவை எங்கும் பயன்படுத்துங்கள், ஆனால் வெறும் எழுத்துருக் கோப்பை
  விற்காதீர்கள்.
pros:
  - ஆவணங்கள் மற்றும் பயன்பாடுகளில் உட்பொதிக்க அனுமதிக்கிறது
  - திறந்த எழுத்துருக்களுக்கான தரநிலை
cons:
  - ஒதுக்கப்பட்ட எழுத்துருப் பெயர்கள் ஃபோர்க்குகளைச் சிக்கலாக்குகின்றன
  - எழுத்துருக்களுக்கு மட்டும்
