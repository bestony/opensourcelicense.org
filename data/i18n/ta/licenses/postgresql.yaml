summary: MIT, BSD போன்ற சுருக்கமான அனுமதிமிக்க உரிமம்; PostgreSQL-உம் அதன்
  சூழலமைப்பும் பயன்படுத்துகின்றன.
analogy: இலவசப் புத்தகத்தின் PostgreSQL சமூகப் பதிப்பு.
pros:
  - சுருக்கமானது, அனுமதிமிக்கது
  - PostgreSQL சூழலமைப்புக்குப் பழக்கமானது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - மூடிய ஃபோர்க்குகள் அனுமதிக்கப்படுகின்றன
