summary: அனுமதிமிக்க உரிமம்; மூல நகல்களில் அறிவிப்பு கட்டாயம், ஆனால்
  தொகுக்கப்பட்ட பைனரிகளில் தேவையில்லை.
analogy: ஆசிரியர் பெயரைச் சமையல் புத்தகத்தில் வையுங்கள், பரிமாறும் ஒவ்வொரு
  தட்டிலும் அல்ல.
pros:
  - பைனரிகளில் அறிவிப்பு தேவையில்லை
  - C++ லைப்ரரிகளுக்கான தரநிலை
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - C++ தவிர பிற இடங்களில் அதிகம் அறியப்படவில்லை
