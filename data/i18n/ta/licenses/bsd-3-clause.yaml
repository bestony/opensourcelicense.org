summary: MIT போன்றது; கூடுதலாக, வழிவந்த தயாரிப்புகளை ஆதரிக்க உங்கள் பெயரைப்
  பயன்படுத்துவதைத் தடுக்கும் பிரிவு.
analogy: “உங்கள் பதிப்பை ஆசிரியர் பரிந்துரைக்கிறார் என்று கூறாதீர்கள்” என்ற
  குறிப்புடன் ஓர் இலவசப் புத்தகம்.
pros:
  - அனுமதிமிக்கது, நன்கு அறியப்பட்டது
  - ஒப்புதலுக்காக உங்கள் பெயர் பயன்படுத்தப்படுவதைத் தடுக்கிறது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - மூடிய மூல ஃபோர்க்குகள் அனுமதிக்கப்படுகின்றன
