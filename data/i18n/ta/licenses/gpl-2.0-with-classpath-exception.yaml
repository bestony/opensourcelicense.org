sourceHash: 841fb8980cea558f
summary: லைப்ரரிக்கு GPL-2.0; கூடுதலாக, சுயாதீன நிரல்கள் எந்த உரிமத்தின் கீழும்
  அதனுடன் இணைய அனுமதிக்கும் விதிவிலக்கு.
analogy: சமையல் குறிப்புப் பகிர்வு விதியின் கீழ் ஒரு பொது இன்ஜின், ஆனால் உங்கள்
  சொந்தக் கார் உங்களுடையதாகவே இருக்கும்.
pros:
  - இதனுடன் இணையும் பயன்பாடுகள் மூடியவையாக இருக்கலாம்
  - OpenJDK பயன்படுத்துகிறது
cons:
  - லைப்ரரியில் செய்த மாற்றங்கள் GPL ஆகவே இருக்கும்
  - GPL-3.0-only திட்டங்களுடன் இணக்கமற்றது
