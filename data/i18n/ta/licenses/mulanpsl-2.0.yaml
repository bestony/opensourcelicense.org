summary: காப்புரிமை வழங்கலும் பதிலடிப் பிரிவும் கொண்ட சீன அனுமதிமிக்க உரிமம்.
  சீன, ஆங்கில உரைகள் சம செல்லுபடியானவை; முரண்பட்டால் சீன உரையே மேலோங்கும்.
analogy: சீனச் சட்டத்தை மனதில் கொண்டு எழுதப்பட்ட Apache பாணிப் பாதுகாப்பு.
pros:
  - அதிகாரப்பூர்வ இருமொழி உரை
  - காப்புரிமை வழங்கல்
  - OSI அங்கீகரித்தது
cons:
  - சீனாவுக்கு வெளியே குறைவாக அறியப்பட்டது
  - வழக்கு முன்மாதிரிகள் குறைவு
