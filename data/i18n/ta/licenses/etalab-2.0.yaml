summary: "பிரெஞ்சு அரசின் திறந்த உரிமம்: பொதுத் தரவை வணிகரீதியாகவும் சுதந்திரமாக
  மறுபயன்படுத்தலாம், படைப்பாளர் குறிப்புடன்."
analogy: ஒரு மேற்கோள் வரியுடன் மறுபயன்படுத்தக்கூடிய பிரான்ஸின் பொதுத் தரவு.
