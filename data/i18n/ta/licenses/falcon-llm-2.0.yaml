summary: TII-இன் Apache-2.0 அடிப்படையிலான மாடல் உரிமம், ஏற்கத்தக்க பயன்பாட்டுக்
  கொள்கையுடன்; ராயல்டி இல்லாமல் வணிகப் பயன்பாடு அனுமதிக்கப்படுகிறது.
analogy: தடைசெய்யப்பட்ட பயன்பாடுகளின் சிறு பட்டியலுடன் Apache-இன் கருவிப்பெட்டி.
pros:
  - ராயல்டி இல்லாத வணிகப் பயன்பாடு
  - Apache-2.0 அடிப்படையிலானது
cons:
  - OSI வரையறைப்படி ஓப்பன் சோர்ஸ் அல்ல
  - பயன்பாட்டுக் கொள்கை புதுப்பிக்கப்படலாம்
