sourceHash: cb1197749de0ea7e
summary: சுதந்திரமாக மாற்றவும் விநியோகிக்கவும் அனுமதிக்கிறது; ஆனால் மாற்றிய
  பதிப்பைத் தெளிவாகக் குறிக்க வேண்டும் அல்லது மறுபெயரிட வேண்டும், இல்லையெனில்
  அதன் மூலத்தைக் கிடைக்கச் செய்ய வேண்டும். காப்புரிமை விதிகளும் உண்டு.
analogy: பாடலை ரீமிக்ஸ் செய்யுங்கள், ஆனால் உங்கள் ரீமிக்ஸை மூலப் பாடல் என்று
  விற்காதீர்கள்.
pros:
  - மூலப் படைப்பின் அடையாளத்தைக் காக்கிறது
  - GPL இணக்கமானது
cons:
  - நிபந்தனைகள் நீளமானவை
  - Raku, Perl தவிர அரிதாகவே பயன்படுகிறது
