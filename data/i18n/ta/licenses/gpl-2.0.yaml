sourceHash: cf76d86201254c1b
summary: "வலுவான காப்பிலெஃப்ட்: விநியோகிக்கப்படும் வழிப்படைப்புகள் முழுமையாக
  GPL-2.0-இன் கீழ் வெளியிடப்பட வேண்டும். வெளிப்படையான காப்புரிமை வழங்கல் இல்லை;
  'or later' பயன்படுத்தாவிட்டால் GPL-3.0 உடன் இணக்கமற்றது."
analogy: சமையல் குறிப்புப் பகிர்வு விதி, அதன் பழைய பதிப்பில்.
pros:
  - விநியோகிக்கப்படும் வழிப்படைப்புகளைத் திறந்தே வைக்கிறது
  - Linux kernel பயன்படுத்துகிறது
cons:
  - Apache-2.0, GPL-3.0 உடன் இணக்கமற்றது (இந்தப் பதிப்பு மட்டும் எனில்)
  - வெளிப்படையான காப்புரிமை வழங்கல் இல்லை
