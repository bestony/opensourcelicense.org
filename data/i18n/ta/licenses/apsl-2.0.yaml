sourceHash: 3440c6c6f7e1c94d
summary: "Apple-இன் கோப்பு நிலை காப்பிலெஃப்ட்: உள்ளடங்கிய கோப்புகளை மாற்றினால்,
  வெளிப்புறச் சேவையாக இயக்கும்போதும் அவற்றை வெளியிட வேண்டும். GPL உடன்
  இணக்கமற்றது."
analogy: கடன் வாங்கிய கோப்பில் செய்த மாற்றங்களைப் பகிருங்கள், முடிவை மட்டும்
  பரிமாறினாலும் கூட.
pros:
  - வெளிப்புற வரிசைப்படுத்தலையும் உள்ளடக்கும்
  - காப்புரிமை வழங்கல்
cons:
  - GPL உடன் இணக்கமற்றது
  - பெரும்பாலும் Apple-இன் ஓப்பன் சோர்ஸுக்கு மட்டும்
