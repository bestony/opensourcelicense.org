summary: "MIT போன்றது: குறியீட்டைச் சுதந்திரமாகப் பயன்படுத்துங்கள்; மூல மற்றும்
  பைனரி நகல்களில் பதிப்புரிமை அறிவிப்பையும் பொறுப்புத் துறப்பையும்
  வைத்திருங்கள்."
analogy: "ஓர் இலவசச் சமையல் குறிப்பு அட்டை: எங்கும் நகலெடுங்கள், கீழே உள்ள
  ஆசிரியர் வரியை மட்டும் விட்டுவிடுங்கள்."
pros:
  - மிகச் சுருக்கமானது, அனுமதிமிக்கது
  - BSD அமைப்புகளில் பரவலாகப் பயன்படுகிறது
cons:
  - காப்புரிமை வழங்கல் இல்லை
  - மூடிய ஃபோர்க்குகள் அனுமதிக்கப்படுகின்றன
