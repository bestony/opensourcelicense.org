  home.title: சரியான ஓப்பன் சோர்ஸ் உரிமத்தைத் தெளிவாகப் புரிந்து தேர்ந்தெடுங்கள்
  home.lead: “எந்த உரிமம்” என்பது மட்டுமல்ல; ஒத்த திட்டங்கள் எதைத் தேர்ந்தெடுத்தன,
    மோசமான சூழ்நிலை எப்படி இருக்கும், அடுத்து என்ன செய்ய வேண்டும் என்பதும்.
  home.entry.chat.title: AI ஆலோசகருடன் பேசுங்கள்
  home.entry.chat.body: உங்கள் திட்டத்தை உங்கள் சொந்த வார்த்தைகளில் விவரியுங்கள்.
    சுயவிவரம், தொடர் கேள்விகள் மற்றும் ஓர் அறிக்கையைப் பெறுங்கள்.
  home.entry.projects.title: மற்றவர்கள் எதைப் பயன்படுத்துகிறார்கள் எனப் பாருங்கள்
  home.entry.projects.body: நன்கு அறியப்பட்ட திட்டங்களின் உரிமங்கள், அவற்றில் சில
    ஏன் உரிமத்தை மாற்றின என்பதும்.
  home.entry.wizard.title: படிப்படியாக வடிகட்டுங்கள்
  home.entry.wizard.body: சில கேள்விகளுக்குப் பதிலளித்து, தரவரிசைப்படுத்தப்பட்ட,
    விளக்கத்துடன் கூடிய சுருக்கப் பட்டியலைப் பெறுங்கள்.
  home.wall: பிரபல திட்டங்களின் உரிமங்கள்
  home.changes: சமீபத்திய உரிம மாற்றங்கள்
  home.scenarios: என்ன தவறு நடக்கலாம்?
  home.scenarios.body: 27 தீவிர சூழ்நிலைகள் × 17 உரிம நெடுவரிசைகள், ஒவ்வொரு
    கட்டத்துக்கும் தனிப் பக்கம்.
