  site.name: opensourcelicense.org
  site.tagline: ஓப்பன் சோர்ஸ் உரிமங்களைத் தேர்ந்தெடுத்து ஒப்பிடும் பணிமேசை
  site.description: ஓப்பன் சோர்ஸ் (திறந்த மூல) உரிமங்களைத் தேர்ந்தெடுங்கள்,
    ஒப்பிடுங்கள், சோதித்துப் பாருங்கள். உண்மையான திட்டங்கள் எந்த உரிமத்தைப்
    பயன்படுத்துகின்றன, என்ன தவறு நடக்கலாம், உங்கள் திட்டத்துக்கு எது பொருந்தும்
    என்பதைப் பாருங்கள்.
