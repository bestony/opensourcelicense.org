    பண்பு அதிகம் என்று பொருள், “சிறந்தது” என்று அல்ல.
  scenarios.title: தீவிர சூழ்நிலை அணி
  scenarios.lead: உரிமத்தைத் தேர்ந்தெடுத்த பிறகு என்ன நடக்கும்? ஒவ்வொரு கட்டமும்
    ஒரு கேள்விக்குப் பதிலளிக்கிறது, அதற்கெனத் தனிப் பக்கம் உண்டு.
  scenarios.highlight: ஓர் உரிமத்தை முன்னிலைப்படுத்து
  scenarios.expand: அனைத்தையும் விரி
  scenarios.collapse: அனைத்தையும் சுருக்கு
  scenarios.silent-note: “—” மட்டுமே உள்ள வரிசைகள் வேண்டுமென்றே வைக்கப்பட்டுள்ளன.
    இவற்றின் பதில் உரிமத்தைச் சார்ந்ததல்ல; வேலை ஒப்பந்தங்கள் (C6), ஏற்றுமதிக்
    கட்டுப்பாட்டுச் சட்டம் (D5) அல்லது நடந்துகொண்டிருக்கும் வழக்குகள் (D6)
