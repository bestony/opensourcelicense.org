summary: Как MIT, плюс пункт, запрещающий использовать ваше имя для продвижения
  производных продуктов.
analogy: "Бесплатная книга с запиской: «Не говорите, что автор рекомендует ваше
  издание»."
pros:
  - Разрешительная и хорошо известная
  - Защищает ваше имя от использования в рекламе
cons:
  - Нет патентной лицензии
  - Закрытые форки разрешены
