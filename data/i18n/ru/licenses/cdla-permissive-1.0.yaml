summary: "Разрешительная лицензия Linux Foundation для данных: данные можно
  свободно использовать и распространять; результаты, например обученные модели,
  не ограничиваются."
analogy: Используйте набор данных для чего угодно; передавая данные, приложите
  соглашение.
pros:
  - Явно освобождает результаты вычислений
  - Написана для данных
cons:
  - Менее известна, чем CC
  - Версия 2.0 проще
