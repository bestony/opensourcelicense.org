sourceHash: 22649412ed3dbb5f
summary: "Копилефт на уровне библиотеки: изменения библиотеки остаются
  открытыми; закрытые программы могут с ней компоноваться, если пользователь
  может перекомпоновать их с изменённой библиотекой."
analogy: Старая редакция «заменяемого общего двигателя».
pros:
  - Проприетарные приложения могут использовать библиотеку
  - Часто встречается в библиотеках для настольных и мультимедийных приложений
cons:
  - Сложные правила перекомпоновки
  - Нет явной патентной лицензии
