summary: "Для контента и данных: нужно указывать авторство, коммерческое
  использование запрещено."
analogy: Делитесь фото свободно, но не в рекламе и не в продаваемых продуктах.
pros:
  - Не допускает коммерческого повторного использования
  - Есть официальные переводы
cons:
  - Не соответствует OSI и Open Definition
  - Понятие «некоммерческое» часто размыто
  - Блокирует многие законные применения
