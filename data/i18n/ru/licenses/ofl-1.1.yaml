sourceHash: 2388a1183d57050c
summary: "Свободная лицензия для шрифтов: шрифты можно свободно использовать,
  встраивать и изменять, но изменённые версии должны отказаться от
  зарезервированных имён, а сам шрифт нельзя продавать отдельно."
analogy: Используйте шрифт везде, но не продавайте файл шрифта отдельно.
pros:
  - Разрешает встраивание в документы и приложения
  - Стандарт для открытых шрифтов
cons:
  - Зарезервированные имена усложняют форки
  - Только для шрифтов
