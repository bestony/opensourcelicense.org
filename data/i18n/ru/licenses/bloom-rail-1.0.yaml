summary: "Первая лицензия ответственного ИИ для большой языковой модели:
  открытый доступ с ограничениями по назначению, обязательными для производных."
analogy: Бесплатный инструмент со списком запрещённых применений в каждой копии.
pros:
  - Разрешает коммерческое использование
  - Первопроходец лицензий RAIL
cons:
  - OSI не считает её открытой
  - Ограничения трудно применить на практике
