sourceHash: 7c50fe5f1b7f3c7d
summary: "Для баз и наборов данных: любое использование, в том числе
  коммерческое, если сохранено указание авторства. Для произведений, созданных
  на основе данных, тоже нужно уведомление."
analogy: Используйте картографические данные где угодно, просто укажите источник.
pros:
  - Простое правило указания авторства
  - Часто используется для больших корпусов обучения ИИ
  - Охватывает права на базы данных, а не только авторское право
cons:
  - Не предназначена для ПО
  - Нет патентной лицензии
