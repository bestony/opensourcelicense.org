sourceHash: 3440c6c6f7e1c94d
summary: "Копилефт Apple на уровне файлов: изменённые файлы нужно публиковать, в
  том числе при внешнем развёртывании как сервиса. Несовместима с GPL."
analogy: Делитесь изменениями в заимствованном файле, даже если вы только
  предоставляете результат.
pros:
  - Покрывает внешнее развёртывание
  - Патентная лицензия
cons:
  - Несовместима с GPL
  - Применяется в основном в открытых проектах Apple
