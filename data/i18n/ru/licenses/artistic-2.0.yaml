summary: Позволяет свободно изменять и распространять, но изменённую версию
  нужно явно пометить, переименовать или открыть её исходный код. Содержит
  патентные положения.
analogy: Делайте ремикс песни, но не продавайте его как оригинал.
pros:
  - Защищает идентичность оригинала
  - Совместима с GPL
cons:
  - Многословные условия
  - Редко встречается за пределами Raku и Perl
