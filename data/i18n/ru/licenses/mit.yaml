summary: С кодом можно делать почти всё. Нужно лишь сохранять уведомления об
  авторских правах и лицензии. Гарантий нет.
analogy: "Как бесплатная книга в кафе: её можно взять, скопировать или продать,
  но имя автора на обложке должно остаться."
pros:
  - Короткая и всем понятная
  - Компаниям проще всего её принять
  - Совместима почти со всеми лицензиями
cons:
  - Нет патентной лицензии
  - Кто угодно может сделать закрытого или хостингового конкурента
