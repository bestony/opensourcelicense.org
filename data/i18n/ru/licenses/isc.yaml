sourceHash: 7db0448b4abf3505
summary: "Более короткий аналог MIT: любое использование при сохранении
  уведомлений об авторских правах и разрешении."
analogy: Та же бесплатная книга, что и MIT, только с более короткой надписью на обложке.
pros:
  - Самая короткая из распространённых разрешительных лицензий
  - Стандарт для многих пакетов npm
cons:
  - Нет патентной лицензии
  - Закрытые форки разрешены
