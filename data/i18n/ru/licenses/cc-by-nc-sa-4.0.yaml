summary: "Для контента: указание авторства, только некоммерческое использование,
  переработки — под той же лицензией."
analogy: Делитесь конспектами и перерабатывайте их, но не ради прибыли и всегда
  на тех же условиях.
pros:
  - Не допускает коммерческого повторного использования
  - Часто применяется для учебных материалов
cons:
  - Не соответствует Open Definition
  - Понятие «некоммерческое» часто размыто
