sourceHash: 3ab9492f75e7adb0
summary: "Сильный копилефт: если вы распространяете ПО или производные, нужно
  опубликовать полный исходный код под GPL-3.0."
analogy: "Рецепт, в котором написано: кто подаёт блюдо по этому рецепту, обязан
  отдать и весь рецепт."
pros:
  - Все распространяемые производные остаются открытыми
  - Патентная лицензия и защита от тивоизации
  - Сильная традиция сообщества
cons:
  - Многие компании её избегают
  - Не покрывает SaaS (это не распространение)
  - Несовместима с GPL-2.0-only
