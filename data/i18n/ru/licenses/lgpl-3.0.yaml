reviewed: false
sourceHash: cdef0d42cb1ab51e
summary: "Копилефт на уровне библиотеки: изменения библиотеки остаются
  открытыми; закрытые приложения могут с ней компоноваться, если пользователь
  может заменить библиотеку."
analogy: "Общий двигатель: его можно поставить в свою машину, но владелец должен
  иметь возможность заменить его своим."
pros:
  - Проприетарные приложения могут использовать библиотеку
  - Улучшения библиотеки остаются открытыми
  - Патентная лицензия
cons:
  - Сложные правила перекомпоновки, особенно при статической компоновке и на
    мобильных
  - Некоторые компании всё равно её избегают
