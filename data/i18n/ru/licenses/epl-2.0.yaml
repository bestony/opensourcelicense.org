summary: Слабый копилефт на уровне модуля с патентной лицензией; для
  совместимости можно указать GPL как вторичную лицензию.
analogy: Делитесь изменениями в заимствованной главе; остальная книга — ваша.
pros:
  - Копилефт, удобный для бизнеса
  - Патентная лицензия
cons:
  - Совместима с GPL только при указании вторичной лицензии
  - Границы модулей бывают размыты
