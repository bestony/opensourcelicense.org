summary: "Разрешительная лицензия: уведомление нужно в исходных копиях, но не в
  скомпилированных двоичных файлах."
analogy: Имя автора указывают в книге рецептов, а не на каждой тарелке.
pros:
  - Не требует уведомления в бинарных файлах
  - Стандарт для библиотек C++
cons:
  - Нет патентной лицензии
  - Малоизвестна за пределами C++
