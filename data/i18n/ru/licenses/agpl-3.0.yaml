sourceHash: 1db86c42c600a813
summary: "GPL-3.0 плюс сетевой пункт: пользователям, которые взаимодействуют с
  изменённой версией по сети, нужно предложить её исходный код."
analogy: "Правило рецепта распространяется и на рестораны: подать блюдо — всё
  равно что отдать его."
pros:
  - Закрывает лазейку SaaS
  - Хорошая основа для двойного лицензирования
  - Открытая лицензия, одобренная OSI
cons:
  - Многие компании прямо её запрещают
  - Хостинг без изменений по-прежнему разрешён
