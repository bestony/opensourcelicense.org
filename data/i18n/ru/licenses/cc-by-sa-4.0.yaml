summary: "Копилефт для контента: любое использование с указанием авторства, а
  переработки распространяются под той же лицензией."
analogy: Делайте ремиксы фото свободно, но делитесь ими на тех же условиях.
pros:
  - Переработки остаются открытыми
  - Используется Википедией
cons:
  - Условие «на тех же условиях» может мешать смешиванию
  - Не предназначена для ПО
