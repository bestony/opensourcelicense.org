summary: Бесплатное коммерческое использование для сервисов с менее чем 1 млн
  активных пользователей в день после регистрации; более крупным нужна отдельная
  лицензия.
analogy: Бесплатный двигатель для небольших автопарков после регистрации машины.
pros:
  - Бесплатно для большинства коммерческих пользователей
  - Сильные модели для китайского языка
cons:
  - Это не открытая лицензия
  - Регистрация и порог пользователей
