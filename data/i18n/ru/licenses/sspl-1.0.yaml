summary: Похожа на AGPL, но при предоставлении ПО как сервиса нужно раскрыть
  исходный код всего стека сервиса. Не одобрена OSI.
analogy: Если открываете ресторан с этим блюдом, придётся опубликовать и чертежи
  всей кухни.
pros:
  - Самая сильная защита от облачных провайдеров
cons:
  - OSI не считает её открытой
  - Многие дистрибутивы её не принимают
  - Может спровоцировать форки сообщества
