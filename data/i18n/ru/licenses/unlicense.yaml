summary: Передаёт произведение в общественное достояние, где это возможно, с
  разрешительной резервной лицензией. Указывать авторство не нужно.
analogy: "Оставить книгу без имени на скамейке в парке: её может взять любой."
pros:
  - Никаких условий
  - Легко сочетается с чем угодно
cons:
  - Передачу в общественное достояние признают не во всех странах
  - Некоторые компании избегают её из-за правовой неопределённости
