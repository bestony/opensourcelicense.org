sourceHash: 6a4054dc9cca8e7e
summary: "«Копилефт» для баз данных: коммерческое использование разрешено, но
  публикуемые производные базы должны оставаться под ODbL. Для созданных
  произведений, например карт или изображений, достаточно указать авторство."
analogy: Стройте на общей карте, а если публикуете улучшенную базу, делитесь ею
  на тех же условиях.
pros:
  - Улучшенные базы данных остаются открытыми
  - Коммерческое использование разрешено
  - Проверена на OpenStreetMap
cons:
  - Условие «на тех же условиях» может мешать смешиванию с другими данными
  - Понятие «производная база» иногда размыто
