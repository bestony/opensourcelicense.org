summary: "Код доступен для просмотра: любое использование, кроме конкурирующего
  продукта; каждый выпуск через два года переходит на Apache-2.0."
analogy: Витрина, товары которой через два года становятся бесплатными для всех.
pros:
  - Короткая и предсказуемая
  - Через два года код становится открытым
cons:
  - Это не открытая лицензия
  - «Конкурирующее использование» бывает трудно оценить
