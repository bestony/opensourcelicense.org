summary: "Копилефт на уровне файлов: изменения файлов под MPL остаются
  открытыми, но их можно сочетать с закрытым кодом в других файлах."
analogy: Если вы взяли главу, делитесь правками этой главы; остальная книга — ваша.
pros:
  - Баланс между разрешительной лицензией и копилефтом
  - Явная патентная лицензия
  - По умолчанию совместима с GPL
cons:
  - Границы файлов бывают размыты
  - Не покрывает сетевое использование
