summary: Коммерческое использование разрешено при соблюдении политики
  допустимого использования; очень крупным сервисам нужна отдельная лицензия,
  некоторые территории исключены.
analogy: Бесплатный двигатель со сводом правил, ограничением размера и картой
  разрешённых дорог.
pros:
  - Коммерческое использование для большинства
  - Покрывает текстовые, видео- и 3D-модели
cons:
  - Это не открытая лицензия
  - Территориальные исключения
