summary: "Код доступен для просмотра: использование в продакшене ограничено
  Additional Use Grant, и каждая версия переходит на открытую лицензию после
  Change Date (не более 4 лет)."
analogy: "Витрина: можно смотреть и пробовать, а через несколько лет вещь станет
  бесплатной для всех."
pros:
  - Позволяет контролировать коммерческое использование
  - Позже код становится открытым
cons:
  - Это не открытая лицензия
  - Условия различаются от проекта к проекту
  - Может спровоцировать форки
