summary: Китайская разрешительная лицензия с патентной лицензией и пунктом о
  возмездии. Китайский и английский тексты равнозначны; при расхождении
  действует китайский.
analogy: Защита в духе Apache, написанная с учётом китайского права.
pros:
  - Официальный двуязычный текст
  - Патентная лицензия
  - Одобрена OSI
cons:
  - Малоизвестна за пределами Китая
  - Мало судебной практики
