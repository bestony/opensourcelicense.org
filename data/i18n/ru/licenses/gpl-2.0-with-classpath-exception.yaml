sourceHash: 841fb8980cea558f
summary: GPL-2.0 для самой библиотеки плюс исключение, позволяющее независимым
  программам компоноваться с ней под любой лицензией.
analogy: Общий двигатель по правилу «отдай рецепт», но ваша машина остаётся вашей.
pros:
  - Приложения, использующие библиотеку, могут быть закрытыми
  - Используется OpenJDK
cons:
  - Изменения библиотеки остаются под GPL
  - Несовместима с проектами только под GPL-3.0
