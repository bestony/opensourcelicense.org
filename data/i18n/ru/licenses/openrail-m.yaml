summary: "Лицензия ответственного ИИ для моделей: разрешительные условия плюс
  ограничения по назначению, которые каждая производная обязана передавать
  дальше."
analogy: Бесплатный инструмент со списком запрещённых применений, который
  сопровождает каждую копию.
pros:
  - Разрешает коммерческое использование
  - Ограничения вредного использования действуют и дальше по цепочке
cons:
  - OSI не считает её открытой
  - Ограничения трудно применить на практике
  - Существует несколько вариантов
