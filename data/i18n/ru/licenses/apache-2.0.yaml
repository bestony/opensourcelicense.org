sourceHash: 637c87bc846f9159
summary: Разрешительная лицензия с явной патентной лицензией, пунктом о
  патентном возмездии и требованием отмечать изменённые файлы.
analogy: Бесплатный набор инструментов с обещанием не судиться с вами из-за его
  патентов — если только вы не подадите иск первым.
pros:
  - Явная патентная лицензия от каждого контрибьютора
  - Её предпочитают многие компании и фонды
  - Защищает товарные знаки
cons:
  - Длиннее; нужно следить за файлом NOTICE
  - Несовместима с GPL-2.0-only
  - Не останавливает хостинговых конкурентов
