summary: "Как MIT: код можно использовать свободно, сохраняя уведомление об
  авторских правах и отказ от гарантий в исходных и бинарных копиях."
analogy: "Бесплатная карточка с рецептом: копируйте где угодно, но оставьте
  строку с автором."
