sourceHash: cf76d86201254c1b
summary: "Сильный копилефт: распространяемые производные должны публиковаться
  полностью под GPL-2.0. Явной патентной лицензии нет; без «или более поздней
  версии» несовместима с GPL-3.0."
analogy: Правило «отдай и рецепт» в старой редакции.
pros:
  - Распространяемые производные остаются открытыми
  - Используется ядром Linux
cons:
  - При фиксированной версии несовместима с Apache-2.0 и GPL-3.0
  - Нет явной патентной лицензии
