summary: "Код доступен для просмотра: использовать и изменять можно бесплатно,
  но нельзя предлагать его как управляемый сервис или обходить лицензионные
  ключи."
analogy: Готовьте с ним дома или в своём ресторане, но не открывайте магазин,
  который продаёт именно это блюдо.
pros:
  - Короткая и ясная
  - Направлена только против конкурентов с управляемым сервисом
cons:
  - Это не открытая лицензия
  - Ограничивает форки и некоторых партнёров
