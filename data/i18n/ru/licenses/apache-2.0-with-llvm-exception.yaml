summary: "Apache-2.0 плюс исключение: для скомпилированного кода не нужно
  указывать авторство, и его можно использовать с проектами под GPL-2.0."
analogy: "Набор инструментов Apache с пометкой: следы инструментов в вашем
  продукте не требуют указания авторства."
pros:
  - Патентная лицензия Apache-2.0
  - Совместима с кодом под GPL-2.0
cons:
  - Длиннее MIT
  - Исключение рассчитано на проекты вроде компиляторов
