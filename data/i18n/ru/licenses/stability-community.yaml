summary: Бесплатно для исследований, некоммерческого и коммерческого
  использования при годовой выручке до 1 млн долларов США; более крупным
  компаниям нужна корпоративная лицензия.
analogy: Малому бизнесу вход бесплатный, крупным компаниям нужен билет.
pros:
  - Бесплатно для частных лиц и небольших компаний
  - Покрывает новые модели Stability
cons:
  - Это не открытая лицензия
  - Нужно отслеживать порог выручки
