summary: "Собственная лицензия для моделей: коммерческое использование
  разрешено, но есть политика допустимого использования, правила указания
  авторства и именования, а при более чем 700 млн активных пользователей в месяц
  нужна отдельная лицензия."
analogy: Бесплатный двигатель со сводом правил и особым договором для самых
  крупных автопроизводителей.
pros:
  - Большинству пользователей коммерческое использование доступно
  - Большая экосистема
cons:
  - OSI не считает её открытой
  - Обязательства по политике использования и именованию
  - Условия меняются от версии к версии
