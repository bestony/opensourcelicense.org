sourceHash: 362187e701e25e6a
summary: MPL سے ماخوذ فائل کی سطح کا کاپی لیفٹ، پیٹنٹ اجازت کے ساتھ؛ GPL سے غیر مطابق۔
analogy: ادھار لی گئی فائل کی تبدیلیاں شیئر کریں؛ چاہیں تو باقی بند رکھیں۔
pros:
  - فائل کی سطح کا دائرہ
  - پیٹنٹ اجازت
cons:
  - GPL سے غیر مطابق (Linux پر ZFS کا مسئلہ)
  - کم نئے پروجیکٹ اسے اپناتے ہیں
