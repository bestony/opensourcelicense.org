summary: "ڈیٹا بیس کے لیے یکساں شرائط کا لائسنس: آپ ڈیٹا تجارتی طور پر استعمال
  کر سکتے ہیں، لیکن عوامی ماخوذ ڈیٹا بیس ODbL کے تحت ہی رہنے چاہییں۔ نقشوں یا
  تصاویر جیسے تیار شدہ کاموں کے لیے صرف انتساب درکار ہے۔"
analogy: مشترکہ نقشے پر تعمیر کریں، اور اگر آپ بہتر نقشہ ڈیٹا بیس شائع کریں تو
  اسے انہی شرائط پر واپس شیئر کریں۔
pros:
  - بہتر ڈیٹا بیس کو کھلا رکھتا ہے
  - تجارتی استعمال کی اجازت
  - OpenStreetMap سے ثابت شدہ
cons:
  - یکساں شرائط کا اصول دوسرے ڈیٹا سے ملاوٹ میں رکاوٹ بن سکتا ہے
  - “ماخوذ ڈیٹا بیس” کبھی کبھی مبہم ہوتا ہے
