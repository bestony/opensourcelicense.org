summary: "Google کی ماڈل شرائط: تجارتی استعمال کی اجازت، ایک ممنوعہ استعمال کی
  پالیسی کے ساتھ جو ہر ماخوذ کام پر لاگو ہوتی ہے، ڈسٹل کیے گئے ماڈلز سمیت۔"
analogy: ایک مفت انجن، جس کی قواعد کی کتاب ہر دوبارہ بنائے گئے انجن کے ساتھ ہونی چاہیے۔
pros:
  - صارفین کی حد کے بغیر تجارتی استعمال
  - ماخوذ کاموں کے واضح اصول
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - Google استعمال کی پالیسی بدل سکتا ہے
