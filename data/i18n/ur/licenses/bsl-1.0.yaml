summary: پرمسیو لائسنس؛ نوٹس سورس کاپیوں میں لازم ہے لیکن کمپائل شدہ بائنریز میں نہیں۔
analogy: مصنف کا نام ترکیبوں کی کتاب میں رکھیں، ہر پیش کی گئی پلیٹ پر نہیں۔
pros:
  - بائنریز میں نوٹس کی ضرورت نہیں
  - C++ لائبریریوں کے لیے معیاری
cons:
  - پیٹنٹ اجازت نہیں
  - C++ کے علاوہ کم معروف
