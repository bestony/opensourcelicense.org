sourceHash: f723aee8de4d57cd
summary: جہاں ممکن ہو، کام کو پبلک ڈومین کے لیے وقف کرتا ہے، ساتھ میں ایک پرمسیو
  متبادل۔ انتساب کی ضرورت نہیں۔
analogy: "پارک کے بینچ پر بغیر نام والی کتاب چھوڑ دینا: کوئی بھی لے سکتا ہے۔"
pros:
  - کوئی شرط نہیں
  - کسی بھی چیز کے ساتھ ملانا آسان
cons:
  - پبلک ڈومین وقف ہر ملک میں تسلیم شدہ نہیں
  - قانونی غیر یقینی کی وجہ سے کچھ کمپنیاں اس سے گریز کرتی ہیں
