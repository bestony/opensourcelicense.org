summary: "مواد کے لیے کاپی لیفٹ: انتساب کے ساتھ کوئی بھی استعمال، اور ترمیم شدہ
  صورتیں اسی لائسنس کے تحت شیئر کرنا لازم ہے۔"
analogy: تصویر کو آزادانہ ری مکس کریں، لیکن اپنا ری مکس انہی شرائط پر شیئر کریں۔
pros:
  - ترمیم شدہ صورتوں کو کھلا رکھتا ہے
  - Wikipedia استعمال کرتا ہے
cons:
  - یکساں شرائط کا اصول ملاوٹ میں رکاوٹ بن سکتا ہے
  - سافٹ ویئر کے لیے نہیں بنایا گیا
