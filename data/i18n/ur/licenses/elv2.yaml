summary: "سورس دستیاب: استعمال اور ترمیم مفت، لیکن آپ اسے منیجڈ سروس کے طور پر
  پیش نہیں کر سکتے یا لائسنس کی کو بائی پاس نہیں کر سکتے۔"
analogy: اس سے گھر پر یا اپنے ریسٹورنٹ میں کھانا پکائیں، لیکن ایسی دکان نہ
  کھولیں جو بالکل یہی ڈش بیچے۔
pros:
  - مختصر اور واضح
  - صرف منیجڈ سروس کے حریفوں کو نشانہ بناتا ہے
cons:
  - اوپن سورس نہیں
  - فورکس اور کچھ شراکت داروں کو محدود کرتا ہے
