sourceHash: cdef0d42cb1ab51e
summary: "لائبریری کی سطح کا کاپی لیفٹ: لائبریری میں تبدیلیاں کھلی رہتی ہیں؛ بند
  ایپس اس سے لنک کر سکتی ہیں، اگر صارفین لائبریری بدل سکیں۔"
analogy: "ایک مشترکہ انجن: آپ اسے اپنی گاڑی میں لگا سکتے ہیں، لیکن مالکان کو اسے
  اپنے انجن سے بدلنے کی سہولت ہونی چاہیے۔"
pros:
  - پروپرائٹری ایپس کو لائبریری استعمال کرنے دیتا ہے
  - لائبریری میں تبدیلیاں کھلی رہتی ہیں
  - پیٹنٹ اجازت
cons:
  - ری لنکنگ کے اصول پیچیدہ ہیں، خاص طور پر اسٹیٹک لنکنگ اور موبائل کے لیے
  - کچھ کمپنیاں اب بھی اس سے گریز کرتی ہیں
