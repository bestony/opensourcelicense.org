summary: ویٹس تعلیمی تحقیق کے لیے مفت ہیں؛ رجسٹریشن کے بعد تجارتی استعمال مفت
  ہے، استعمال کی پابندیوں کے تابع۔
analogy: مطالعے کے لیے مفت؛ کاروبار میں استعمال سے پہلے رجسٹر کریں۔
pros:
  - رجسٹریشن کے بعد تجارتی استعمال
  - وسیع پیمانے پر استعمال ہونے والے چینی ماڈل
cons:
  - اوپن سورس نہیں
  - رجسٹریشن کا مرحلہ
