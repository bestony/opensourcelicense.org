summary: "ایک مخصوص ماڈل لائسنس: تجارتی استعمال کی اجازت، Acceptable Use Policy،
  انتساب اور نام رکھنے کے اصولوں کے ساتھ، اور 70 کروڑ ماہانہ فعال صارفین سے زائد
  پر الگ لائسنس۔"
analogy: مفت استعمال ہونے والا انجن قواعد کی کتاب کے ساتھ، اور سب سے بڑی کار
  کمپنیوں کے لیے خصوصی معاہدہ۔
pros:
  - زیادہ تر صارفین کے لیے تجارتی استعمال کی اجازت
  - بڑا ایکو سسٹم
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - استعمال کی پالیسی اور نام رکھنے کی ذمہ داریاں
  - ورژنز کے درمیان شرائط بدلتی ہیں
