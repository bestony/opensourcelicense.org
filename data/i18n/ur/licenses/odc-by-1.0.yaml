summary: "ڈیٹا بیس اور ڈیٹاسیٹس کے لیے: تجارتی سمیت کوئی بھی استعمال، اگر آپ
  انتساب کا نوٹس برقرار رکھیں۔ ڈیٹا سے تیار کیے گئے کاموں میں بھی نوٹس درکار
  ہے۔"
analogy: نقشے کا ڈیٹا کہیں بھی استعمال کریں، بس بتائیں کہ یہ کہاں سے آیا۔
pros:
  - سادہ انتساب کا اصول
  - بڑے AI تربیتی ذخیروں کے لیے عام
  - صرف کاپی رائٹ نہیں، ڈیٹا بیس کے حقوق کا بھی احاطہ کرتا ہے
cons:
  - سافٹ ویئر کے لیے نہیں بنایا گیا
  - پیٹنٹ اجازت نہیں
