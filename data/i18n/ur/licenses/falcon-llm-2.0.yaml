summary: TII کا Apache-2.0 پر مبنی ماڈل لائسنس، قابلِ قبول استعمال کی پالیسی کے
  ساتھ؛ بغیر رائلٹی کے تجارتی استعمال کی اجازت۔
analogy: Apache کا ٹول کٹ، ممنوعہ استعمالات کی مختصر فہرست کے ساتھ۔
pros:
  - رائلٹی سے پاک تجارتی استعمال
  - Apache-2.0 پر مبنی
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - استعمال کی پالیسی بدلی جا سکتی ہے
