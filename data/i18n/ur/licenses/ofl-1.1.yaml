summary: "فری فونٹ لائسنس: فونٹس آزادانہ استعمال، ایمبیڈ اور ترمیم کریں، لیکن
  ترمیم شدہ فونٹس میں محفوظ نام نہیں رہ سکتے، اور فونٹس اکیلے فروخت نہیں کیے جا
  سکتے۔"
analogy: ٹائپ فیس ہر جگہ استعمال کریں، لیکن صرف فونٹ فائل نہ بیچیں۔
pros:
  - دستاویزات اور ایپس میں ایمبیڈ کرنے کی اجازت
  - اوپن فونٹس کے لیے معیاری
cons:
  - محفوظ فونٹ نام فورکس کو پیچیدہ بناتے ہیں
  - صرف فونٹس کے لیے
