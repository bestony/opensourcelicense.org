summary: واضح پیٹنٹ اجازت، پیٹنٹ جوابی کارروائی کی شق اور تبدیل شدہ فائلوں کی
  نشان دہی کی شرط والا پرمسیو لائسنس۔
analogy: ایک مفت ٹول کٹ، جس کے ساتھ یہ وعدہ بھی ہے کہ اس کے پیٹنٹس پر آپ پر
  مقدمہ نہیں ہوگا — جب تک آپ پہل نہ کریں۔
pros:
  - ہر معاون کی طرف سے واضح پیٹنٹ اجازت
  - بہت سی کمپنیوں اور فاؤنڈیشنز کی ترجیح
  - ٹریڈ مارکس کا تحفظ کرتا ہے
