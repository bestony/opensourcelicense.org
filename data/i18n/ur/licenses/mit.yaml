sourceHash: 33f06e1e52928136
summary: کوڈ کے ساتھ تقریباً کچھ بھی کریں۔ کاپی رائٹ اور لائسنس کا نوٹس برقرار
  رکھیں۔ کوئی وارنٹی نہیں۔
analogy: "جیسے کسی کیفے میں مفت کتاب چھوڑ دینا: لے لیں، کاپی کریں، بیچیں، بس
  سرورق پر مصنف کا نام رہنے دیں۔"
pros:
  - مختصر اور وسیع پیمانے پر سمجھا جانے والا
  - کمپنیوں کے لیے اپنانے میں سب سے آسان
  - تقریباً ہر دوسرے لائسنس سے مطابقت
cons:
  - پیٹنٹ اجازت نہیں
  - کوئی بھی کلوزڈ سورس یا ہوسٹڈ حریف بنا سکتا ہے
