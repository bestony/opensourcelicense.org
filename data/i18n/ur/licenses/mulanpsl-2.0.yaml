summary: پیٹنٹ اجازت اور جوابی کارروائی کی شق والا ایک چینی پرمسیو لائسنس۔ چینی
  اور انگریزی متن یکساں معتبر ہیں؛ تصادم کی صورت میں چینی متن کو ترجیح ہے۔
analogy: چینی قانون کو مدنظر رکھ کر لکھا گیا Apache طرز کا تحفظ۔
pros:
  - سرکاری دو لسانی متن
  - پیٹنٹ اجازت
  - OSI سے منظور شدہ
cons:
  - چین سے باہر کم معروف
  - محدود عدالتی نظائر
