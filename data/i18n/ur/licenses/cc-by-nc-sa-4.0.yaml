summary: "مواد کے لیے: انتساب، کوئی تجارتی استعمال نہیں، اور ترمیم شدہ صورتیں
  اسی لائسنس کے تحت۔"
analogy: لیکچر نوٹس شیئر اور ری مکس کریں، کبھی منافع کے لیے نہیں، ہمیشہ انہی شرائط پر۔
pros:
  - تجارتی دوبارہ استعمال روکتا ہے
  - تعلیمی مواد کے لیے عام
cons:
  - Open Definition کے مطابق کھلا نہیں
  - “غیر تجارتی” اکثر مبہم ہوتا ہے
