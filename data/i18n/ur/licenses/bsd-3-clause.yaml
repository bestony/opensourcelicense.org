summary: MIT جیسا، ساتھ میں ایک شق جو ماخوذ مصنوعات کی توثیق کے لیے آپ کے نام کے
  استعمال کو منع کرتی ہے۔
analogy: "ایک مفت کتاب جس میں لکھا ہے: “یہ دعویٰ نہ کریں کہ مصنف آپ کے ایڈیشن کی
  سفارش کرتا ہے۔”"
pros:
  - پرمسیو اور معروف
  - آپ کے نام کو توثیق کے لیے استعمال ہونے سے بچاتا ہے
cons:
  - پیٹنٹ اجازت نہیں
  - کلوزڈ سورس فورک کی اجازت ہے
