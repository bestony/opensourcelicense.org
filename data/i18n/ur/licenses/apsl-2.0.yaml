sourceHash: 3440c6c6f7e1c94d
summary: "Apple کا فائل کی سطح کا کاپی لیفٹ: ترمیم شدہ متعلقہ فائلیں شائع کرنا
  لازم ہے، بیرونی طور پر بطور سروس چلانے کی صورت میں بھی۔ GPL سے غیر مطابق۔"
analogy: ادھار لی گئی فائل کی تبدیلیاں شیئر کریں، اس وقت بھی جب آپ صرف اس کا
  نتیجہ پیش کرتے ہیں۔
pros:
  - بیرونی ڈیپلائمنٹ کا احاطہ کرتا ہے
  - پیٹنٹ اجازت
cons:
  - GPL سے غیر مطابق
  - زیادہ تر Apple کے اوپن سورس تک محدود
