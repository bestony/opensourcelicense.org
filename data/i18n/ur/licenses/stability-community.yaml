summary: تحقیق، غیر تجارتی استعمال، اور 10 لاکھ USD سے کم سالانہ آمدنی والے
  تجارتی استعمال کے لیے مفت؛ بڑی کمپنیوں کو انٹرپرائز لائسنس درکار ہے۔
analogy: چھوٹے کاروباروں کے لیے مفت داخلہ؛ بڑے کاروبار ٹکٹ خریدیں۔
pros:
  - افراد اور چھوٹی کمپنیوں کے لیے مفت
  - حالیہ Stability ماڈلز کا احاطہ کرتا ہے
cons:
  - اوپن سورس نہیں
  - آمدنی کی حد پر نظر رکھنی پڑتی ہے
