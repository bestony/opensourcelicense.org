summary: "مواد اور ڈیٹا کے لیے: انتساب لازم ہے اور تجارتی استعمال کی اجازت نہیں۔"
analogy: تصویر آزادانہ شیئر کریں، لیکن اشتہارات یا بیچی جانے والی مصنوعات میں نہیں۔
pros:
  - تجارتی دوبارہ استعمال روکتا ہے
  - سرکاری تراجم دستیاب
cons:
  - OSI یا Open Definition کے مطابق کھلا نہیں
  - “غیر تجارتی” اکثر مبہم ہوتا ہے
  - بہت سے جائز استعمالات روکتا ہے
