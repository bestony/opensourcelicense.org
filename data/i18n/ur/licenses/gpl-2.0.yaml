summary: "مضبوط کاپی لیفٹ: تقسیم شدہ ماخوذ کام مکمل طور پر GPL-2.0 کے تحت جاری
  کرنا لازم ہے۔ کوئی واضح پیٹنٹ اجازت نہیں؛ 'or later' نہ ہونے پر GPL-3.0 سے غیر
  مطابق۔"
analogy: ترکیب شیئر کرنے کا اصول، اپنے پرانے ایڈیشن میں۔
pros:
  - تقسیم شدہ ماخوذ کاموں کو کھلا رکھتا ہے
  - Linux kernel استعمال کرتا ہے
cons:
  - Apache-2.0 اور GPL-3.0 سے غیر مطابق (صرف اسی ورژن کی صورت میں)
  - واضح پیٹنٹ اجازت نہیں
