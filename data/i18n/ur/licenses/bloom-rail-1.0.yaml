summary: "کسی بڑے لینگویج ماڈل کے لیے پہلا Responsible AI License: کھلی رسائی،
  ساتھ میں استعمال پر مبنی پابندیاں جو ماخوذ کاموں پر بھی لاگو ہوتی ہیں۔"
analogy: ایک مفت اوزار، جس کی ہر کاپی کے ساتھ ممنوعہ استعمالات کی فہرست منسلک ہے۔
pros:
  - تجارتی استعمال کی اجازت
  - RAIL لائسنسنگ کا آغاز کیا
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - پابندیوں کا نفاذ مشکل ہے
