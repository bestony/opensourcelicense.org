summary: "سورس دستیاب: آزادانہ استعمال، ترمیم اور تقسیم کریں، سوائے Confluent سے
  مقابلہ کرنے والی SaaS پروڈکٹ پیش کرنے کے۔"
analogy: ترکیب کسی بھی ریسٹورنٹ میں استعمال کریں، سوائے اس کے جو مصنف کے
  ریسٹورنٹ کا حریف ہو۔
pros:
  - محدود پابندی
  - زیادہ تر صارفین متاثر نہیں ہوتے
cons:
  - اوپن سورس نہیں
  - کلاؤڈ حریفوں کو صرف وضاحت کی بنیاد پر خارج کرتا ہے
