summary: "فائل کی سطح کا کاپی لیفٹ: MPL لائسنس یافتہ فائلوں میں تبدیلیاں کھلی
  رہنی چاہییں، لیکن انہیں دوسری فائلوں کے بند کوڈ کے ساتھ ملایا جا سکتا ہے۔"
analogy: ایک باب ادھار لیں تو اس باب میں اپنی ترامیم شیئر کرنا لازم ہے، لیکن
  باقی کتاب آپ کی ہے۔
pros:
  - پرمسیو اور کاپی لیفٹ کے درمیان متوازن
  - واضح پیٹنٹ اجازت
  - بطور ڈیفالٹ GPL سے مطابقت
cons:
  - فائلوں کی حدود مبہم ہو سکتی ہیں
  - نیٹ ورک استعمال کا احاطہ نہیں کرتا
