summary: "OpenRAIL طرز کا ماڈل لائسنس: تجارتی استعمال کی اجازت، استعمال پر مبنی
  پابندیوں کے ساتھ جو ماخوذ کاموں تک منتقل ہوتی ہیں۔"
analogy: ایک مفت اوزار، جس کی ہر کاپی کے ساتھ ممنوعہ استعمالات کی فہرست منسلک ہے۔
pros:
  - تجارتی استعمال کی اجازت
  - استعمال کی پابندیاں آگے تک جاتی ہیں
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - نئے DeepSeek ماڈل MIT پر منتقل ہو گئے
