summary: رجسٹریشن کے بعد، دس لاکھ سے کم یومیہ فعال صارفین والی سروسز کے لیے مفت
  تجارتی استعمال؛ بڑی سروسز کو الگ لائسنس درکار ہے۔
analogy: چھوٹے بیڑوں کے لیے مفت انجن، گاڑی رجسٹر کروانے کے بعد۔
pros:
  - زیادہ تر تجارتی صارفین کے لیے مفت
  - مضبوط چینی زبان کے ماڈل
cons:
  - اوپن سورس نہیں
  - رجسٹریشن اور صارفین کی حد
