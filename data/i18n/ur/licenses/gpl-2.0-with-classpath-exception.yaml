summary: لائبریری پر خود GPL-2.0، ساتھ میں ایک استثنا جو آزاد پروگراموں کو کسی
  بھی لائسنس کے تحت اس سے لنک کرنے دیتا ہے۔
analogy: ترکیب شیئر کرنے کے اصول کے تحت ایک مشترکہ انجن، لیکن آپ کی اپنی گاڑی آپ
  کی ہی رہتی ہے۔
pros:
  - اس سے لنک ہونے والی ایپلیکیشنز بند رہ سکتی ہیں
  - OpenJDK استعمال کرتا ہے
cons:
  - لائبریری میں تبدیلیاں GPL ہی رہتی ہیں
  - GPL-3.0-only پروجیکٹس سے غیر مطابق
