summary: آزادانہ ترمیم اور تقسیم کی اجازت دیتا ہے، لیکن ترمیم شدہ ورژن کو واضح
  طور پر نشان زد کرنا یا نیا نام دینا، یا اس کا سورس دستیاب کرنا لازم ہے۔ اس میں
  پیٹنٹ کی شرائط بھی شامل ہیں۔
analogy: گانے کا ری مکس بنائیں، لیکن اپنے ری مکس کو اصل گانا کہہ کر نہ بیچیں۔
pros:
  - اصل کام کی شناخت کا تحفظ کرتا ہے
  - GPL سے مطابقت رکھتا ہے
cons:
  - شرائط طویل اور پیچیدہ ہیں
  - Raku اور Perl کے علاوہ کم استعمال
