summary: "پرمسیو لائسنس: تبدیل شدہ سورس کو تبدیل شدہ کے طور پر نشان زد کرنا لازم
  ہے، اصل ماخذ کو غلط طور پر پیش نہیں کیا جا سکتا، اور نوٹس سورس کاپیوں میں رہنا
  چاہیے۔"
analogy: ترکیب ادھار لیں، لیکن اگر اسے بدلیں تو اسے اصل ترکیب نہ کہیں۔
pros:
  - پرمسیو اور مختصر
  - گیمز اور نیٹو لائبریریوں میں مقبول
cons:
  - پیٹنٹ اجازت نہیں
  - بند فورک کی اجازت ہے
