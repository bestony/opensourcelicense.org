summary: "GPL-3.0 کے ساتھ ایک نیٹ ورک شق: جو صارفین نیٹ ورک پر کسی ترمیم شدہ
  ورژن سے تعامل کرتے ہیں، انہیں اس کا سورس کوڈ پیش کرنا لازم ہے۔"
analogy: "ترکیب والا اصول ریسٹورنٹ پر بھی لاگو ہوتا ہے: کھانا پیش کرنا بھی اسے
  بانٹنا شمار ہوتا ہے۔"
pros:
  - SaaS کا چور دروازہ بند کرتا ہے
  - ڈوئل لائسنسنگ کے لیے اچھی بنیاد
  - OSI سے منظور شدہ اوپن سورس
cons:
  - بہت سی کمپنیاں اس پر مکمل پابندی لگاتی ہیں
  - بغیر ترمیم کے ہوسٹنگ اب بھی جائز ہے
