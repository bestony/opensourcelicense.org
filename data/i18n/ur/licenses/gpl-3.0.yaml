sourceHash: 3ab9492f75e7adb0
summary: "مضبوط کاپی لیفٹ: اگر آپ سافٹ ویئر یا اس سے ماخوذ کام تقسیم کرتے ہیں تو
  مکمل سورس کوڈ GPL-3.0 کے تحت جاری کرنا لازم ہے۔"
analogy: "ایک ترکیب جو کہتی ہے: اس پر مبنی کھانا پیش کرنے والے کو پوری ترکیب بھی
  دینی ہوگی۔"
pros:
  - تمام تقسیم شدہ ماخوذ کاموں کو کھلا رکھتا ہے
  - پیٹنٹ اجازت اور اینٹی ٹیوائزیشن
  - مضبوط کمیونٹی روایت
cons:
  - بہت سی کمپنیاں اس سے گریز کرتی ہیں
  - SaaS کا احاطہ نہیں کرتا (تقسیم نہیں ہوتی)
  - GPL-2.0-only سے غیر مطابق
