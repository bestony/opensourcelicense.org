summary: "سورس دستیاب: پروڈکشن استعمال Additional Use Grant کے ذریعے محدود ہے،
  اور ہر ورژن Change Date (زیادہ سے زیادہ 4 سال) کے بعد اوپن لائسنس میں بدل جاتا
  ہے۔"
analogy: "دکان کی کھڑکی: آپ دیکھ اور آزما سکتے ہیں، اور چند سال بعد وہ چیز سب کے
  لیے مفت ہو جاتی ہے۔"
pros:
  - تجارتی استعمال پر کنٹرول دیتا ہے
  - کوڈ بعد میں اوپن سورس بن جاتا ہے
cons:
  - اوپن سورس نہیں
  - اجازت کی شرائط ہر پروجیکٹ میں مختلف
  - فورکس کا سبب بن سکتا ہے
