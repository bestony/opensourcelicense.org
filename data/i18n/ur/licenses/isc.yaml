summary: "MIT کے مساوی ایک مختصر لائسنس: کاپی رائٹ اور اجازت کا نوٹس برقرار
  رکھتے ہوئے کوئی بھی استعمال۔"
analogy: MIT جیسی ہی مفت کتاب، سرورق پر مختصر نوٹ کے ساتھ۔
pros:
  - سب سے مختصر عام پرمسیو لائسنس
  - بہت سے npm پیکیجز کا ڈیفالٹ
cons:
  - پیٹنٹ اجازت نہیں
  - بند فورک کی اجازت ہے
