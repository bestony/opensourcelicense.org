summary: Apache-2.0 کے ساتھ ایک استثنا جو کمپائل شدہ کوڈ کے لیے انتساب کی شرط
  ختم کرتا ہے اور اسے GPL-2.0 پروجیکٹس کے ساتھ قابلِ استعمال بناتا ہے۔
analogy: Apache کا ٹول کٹ، اس نوٹ کے ساتھ کہ آپ کی پروڈکٹ میں رہ جانے والے
  اوزاروں کے ٹکڑوں کے لیے کریڈٹ ضروری نہیں۔
pros:
  - Apache-2.0 کی پیٹنٹ اجازت
  - GPL-2.0 کوڈ کے ساتھ کام کرتا ہے
cons:
  - MIT سے طویل
  - استثنا کمپائلر جیسے پروجیکٹس کے لیے مخصوص ہے
