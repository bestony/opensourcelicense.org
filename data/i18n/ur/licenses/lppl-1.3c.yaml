summary: "LaTeX پیکیجز کے لیے فری لائسنس: ترمیم شدہ فائلوں کا نام بدلنا یا انہیں
  واضح طور پر نشان زد کرنا لازم ہے تاکہ دستاویزات ہر جگہ یکساں کام کریں۔"
analogy: آپ ٹائپ فیس بدل سکتے ہیں، لیکن اپنے ورژن کو نیا نام دیں۔
pros:
  - دستاویزات کو دوبارہ تیار کرنے کے قابل رکھتا ہے
  - CTAN میں معیاری
cons:
  - نام بدلنے کا اصول غیر معمولی ہے
  - GPL سے مطابقت نہیں
