summary: AGPL جیسا، لیکن سافٹ ویئر کو بطور سروس پیش کرنے پر پورے سروس اسٹیک کا
  سورس جاری کرنا لازم ہے۔ OSI سے منظور شدہ نہیں۔
analogy: اگر آپ یہ ڈش پیش کرنے والا ریسٹورنٹ چلاتے ہیں تو آپ کو اپنے باورچی خانے
  کا نقشہ بھی شائع کرنا ہوگا۔
pros:
  - کلاؤڈ کمپنیوں کے خلاف مضبوط تحفظ
cons:
  - OSI کے مطابق اوپن سورس نہیں
  - بہت سی ڈسٹری بیوشنز نے اسے مسترد کیا
  - کمیونٹی فورکس کا سبب بن سکتا ہے
