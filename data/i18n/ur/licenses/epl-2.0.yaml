summary: پیٹنٹ اجازت کے ساتھ ماڈیول کی سطح کا کمزور کاپی لیفٹ؛ مطابقت کے لیے GPL
  کو ثانوی لائسنس کے طور پر نامزد کر سکتا ہے۔
analogy: ادھار لیے گئے باب میں اپنی تبدیلیاں شیئر کریں؛ باقی کتاب آپ کی ہے۔
pros:
  - کاروبار دوست کاپی لیفٹ
  - پیٹنٹ اجازت
cons:
  - GPL مطابقت صرف اعلان شدہ ثانوی لائسنس کے ساتھ
  - ماڈیول کی حدود مبہم ہو سکتی ہیں
