summary: Unicode ڈیٹا اور ICU و CLDR جیسے سافٹ ویئر کے لیے پرمسیو لائسنس؛ نوٹس
  برقرار رکھیں اور تشہیر کے لیے کاپی رائٹ ہولڈر کا نام استعمال نہ کریں۔
analogy: "ایک مفت حوالہ جاتی کتاب: کاپی کریں، کریڈٹ کی سطر رہنے دیں۔"
pros:
  - پرمسیو
  - ڈیٹا فائلوں اور کوڈ دونوں کا احاطہ کرتا ہے
cons:
  - پیٹنٹ اجازت نہیں
  - زیادہ تر Unicode پروجیکٹس میں استعمال
