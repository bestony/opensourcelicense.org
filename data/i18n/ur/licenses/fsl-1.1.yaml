summary: "سورس دستیاب: مسابقتی پروڈکٹ کے سوا کوئی بھی استعمال، اور ہر ریلیز دو
  سال بعد Apache-2.0 بن جاتی ہے۔"
analogy: دکان کی کھڑکی، جس کی چیزیں دو سال بعد سب کے لیے مفت ہو جاتی ہیں۔
pros:
  - مختصر اور قابلِ پیش گوئی
  - کوڈ دو سال بعد اوپن سورس بن جاتا ہے
cons:
  - اوپن سورس نہیں
  - “مسابقتی استعمال” طے کرنا مشکل ہو سکتا ہے
