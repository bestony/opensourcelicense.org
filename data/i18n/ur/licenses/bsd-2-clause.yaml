analogy: "ایک مفت ترکیب کا کارڈ: کہیں بھی کاپی کریں، بس نیچے مصنف کی سطر رہنے دیں۔"
pros:
  - بہت مختصر اور پرمسیو
  - BSD سسٹمز میں وسیع پیمانے پر استعمال
cons:
  - پیٹنٹ اجازت نہیں
  - بند فورک کی اجازت ہے
