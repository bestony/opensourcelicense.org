summary: "لائبریری کاپی لیفٹ: لائبریری میں تبدیلیاں کھلی رہتی ہیں؛ بند پروگرام
  اس سے لنک کر سکتے ہیں، اگر صارفین ترمیم شدہ لائبریری کے ساتھ ری لنک کر سکیں۔"
analogy: قابلِ تبدیل مشترکہ انجن کا پرانا ایڈیشن۔
pros:
  - پروپرائٹری ایپس کو لائبریری استعمال کرنے دیتا ہے
  - ڈیسک ٹاپ اور ملٹی میڈیا لائبریریوں میں عام
cons:
  - ری لنکنگ کے اصول پیچیدہ ہیں
  - واضح پیٹنٹ اجازت نہیں
