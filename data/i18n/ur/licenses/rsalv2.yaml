summary: "Redis کا سورس دستیاب لائسنس: استعمال اور ترمیم مفت، لیکن سافٹ ویئر کو
  منیجڈ سروس کے طور پر پیش کرنا یا لائسنس کی بائی پاس کرنا منع ہے۔"
analogy: اس سے کہیں بھی کھانا پکائیں، لیکن ایسی دکان نہ کھولیں جو یہی ڈش بیچے۔
pros:
  - صرف منیجڈ سروس کے حریفوں کو نشانہ بناتا ہے
  - مختصر
cons:
  - اوپن سورس نہیں
  - Valkey فورک کا سبب بنا
