summary: قابلِ قبول استعمال کی پالیسی کے ساتھ تجارتی استعمال کی اجازت؛ بہت بڑی
  سروسز کو الگ لائسنس درکار ہے، اور کچھ علاقے خارج ہیں۔
analogy: ایک مفت انجن، قواعد کی کتاب، سائز کی حد اور اس نقشے کے ساتھ کہ اسے کہاں
  چلایا جا سکتا ہے۔
pros:
  - زیادہ تر صارفین کے لیے تجارتی استعمال
  - ٹیکسٹ، ویڈیو اور 3D ماڈلز کا احاطہ کرتا ہے
cons:
  - اوپن سورس نہیں
  - علاقائی اخراج
