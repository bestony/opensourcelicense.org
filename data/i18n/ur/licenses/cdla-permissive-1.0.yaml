summary: "Linux Foundation کا پرمسیو ڈیٹا لائسنس: ڈیٹا آزادانہ استعمال اور شیئر
  کریں؛ تربیت یافتہ ماڈلز جیسے نتائج پر کوئی پابندی نہیں۔"
analogy: ڈیٹاسیٹ کو کسی بھی کام میں استعمال کریں؛ ڈیٹا آگے دیتے وقت معاہدہ ساتھ
  شامل کریں۔
pros:
  - حسابی نتائج کو واضح طور پر آزاد کرتا ہے
  - ڈیٹا کے لیے لکھا گیا
cons:
