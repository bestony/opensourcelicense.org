summary: "ڈیٹا اور مواد کے لیے پبلک ڈومین وقف، ساتھ میں ایک متبادل لائسنس: کوئی
  شرط نہیں، انتساب بھی نہیں۔"
analogy: تصویر کو عوامی دیوار پر لگا دیں؛ کوئی بھی لے سکتا ہے۔
pros:
  - کوئی شرط نہیں
  - اوپن ڈیٹا کے لیے مثالی
cons:
  - انتساب کی کوئی ضمانت نہیں
  - پیٹنٹ اجازت نہیں
