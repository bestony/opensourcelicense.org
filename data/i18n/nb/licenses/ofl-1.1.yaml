summary: "Fri skriftlisens: bruk, bygg inn og endre skrifter fritt, men endrede
  skrifter må droppe reserverte navn, og skriftene kan ikke selges alene."
analogy: Bruk skrifttypen overalt, men ikke selg den nakne skriftfilen.
pros:
