summary: Gjør nesten hva som helst med koden. Behold opphavsretts- og
  lisensmerknaden. Ingen garanti.
analogy: "Som å legge igjen en gratis bok på en kafé: ta den, kopier den, selg
  den, bare behold forfatterens navn på omslaget."
pros:
