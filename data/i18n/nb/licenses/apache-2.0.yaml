summary: Tillatende lisens med uttrykkelig patentlisens, patentgjengjeldelse og
  krav om å merke endrede filer.
analogy: En gratis verktøykasse som også kommer med et løfte om ikke å saksøke
  deg for patentene – med mindre du saksøker først.
pros:
