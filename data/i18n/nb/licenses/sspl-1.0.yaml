summary: Lik AGPL, men å tilby programvaren som tjeneste krever at kildekoden
  til hele tjenestestakken frigis. Ikke OSI-godkjent.
analogy: Driver du en restaurant med denne retten, må du også publisere
  tegningene av kjøkkenet ditt.
pros:
  - Sterkt vern mot skyleverandører
