summary: Overfører verket til det fri der det er mulig, med en tillatende
  reservelisens. Ingen navngivelse kreves.
analogy: "Som å legge igjen en bok på en parkbenk uten navn i: hvem som helst
  kan ta den."
pros:
  - Ingen vilkår i det hele tatt
  - Lett å kombinere med hva som helst
cons:
  - Overføring til det fri er ikke anerkjent i alle land
  - Noen selskaper unngår den på grunn av juridisk usikkerhet
