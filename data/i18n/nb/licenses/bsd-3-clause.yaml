summary: Som MIT, pluss en klausul som forbyr å bruke navnet ditt til å anbefale
  avledede produkter.
analogy: "En gratis bok med en merknad: «Ikke påstå at forfatteren anbefaler din
  utgave.»"
pros:
  - Tillatende og velkjent
  - Beskytter navnet ditt mot bruk i anbefalinger
cons:
  - Ingen patentlisens
  - Forgreninger med lukket kildekode er tillatt
