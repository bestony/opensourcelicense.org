summary: "Sterk copyleft: distribuerte avledede verk må frigis i sin helhet
  under GPL-2.0. Ingen uttrykkelig patentlisens; ikke kompatibel med GPL-3.0 med
  mindre «or later» brukes."
analogy: Del-oppskriften-regelen, i den eldre utgaven.
pros:
  - Holder distribuerte avledede verk åpne
  - Brukes av Linux-kjernen
cons:
  - Ikke kompatibel med Apache-2.0 og GPL-3.0 (bare denne versjonen)
  - Ingen uttrykkelig patentlisens
