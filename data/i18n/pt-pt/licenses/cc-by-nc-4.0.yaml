sourceHash: 0196a50e1d1c6b89
summary: "Para conteúdos e dados: atribuição obrigatória e utilização comercial
  não permitida."
analogy: Partilhe a fotografia livremente, mas não em anúncios nem em produtos
  que venda.
pros:
  - Impede a reutilização comercial
  - Traduções oficiais
cons:
  - Não é aberta segundo a OSI nem a Open Definition
  - '"Não comercial" é muitas vezes pouco claro'
  - Impede muitas utilizações legítimas
