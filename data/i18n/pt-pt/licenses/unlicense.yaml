sourceHash: f723aee8de4d57cd
summary: Dedica a obra ao domínio público sempre que possível, com uma licença
  permissiva de recurso. Não é exigida atribuição.
analogy: "Deixar um livro num banco de jardim sem nome lá dentro: qualquer
  pessoa o pode levar."
pros:
  - Nenhuma condição
  - Fácil de combinar com tudo
cons:
  - A dedicação ao domínio público não é reconhecida em todos os países
  - Algumas empresas evitam-na por incerteza jurídica
