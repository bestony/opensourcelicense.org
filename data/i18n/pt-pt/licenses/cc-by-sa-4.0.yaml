summary: "Copyleft para conteúdos: qualquer utilização com atribuição, e as
  adaptações têm de ser partilhadas sob a mesma licença."
analogy: Adapte a fotografia livremente, mas partilhe a sua versão nos mesmos termos.
pros:
  - Mantém as adaptações abertas
  - Usada pela Wikipédia
cons:
  - O "partilha nos mesmos termos" pode impedir combinações
  - Não foi concebida para software
