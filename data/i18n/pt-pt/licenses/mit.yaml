summary: Faça quase tudo com o código. Mantenha o aviso de direitos de autor e
  de licença. Sem garantia.
analogy: "Como deixar um livro gratuito num café: leve-o, copie-o, venda-o, mas
  mantenha o nome do autor na capa."
pros:
  - Curta e amplamente compreendida
  - A licença mais fácil de adotar pelas empresas
  - Compatível com quase todas as outras licenças
cons:
  - Sem concessão de patentes
  - Qualquer pessoa pode criar um concorrente fechado ou alojado
