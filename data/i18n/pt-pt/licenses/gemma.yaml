summary: "Os termos de modelo da Google: utilização comercial permitida, com uma
  política de utilizações proibidas que passa para todas as obras derivadas,
  incluindo modelos destilados."
analogy: Um motor gratuito com um regulamento que todos os motores reconstruídos
  têm de levar.
pros:
