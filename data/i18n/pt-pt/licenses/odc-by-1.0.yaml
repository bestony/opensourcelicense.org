sourceHash: 7c50fe5f1b7f3c7d
summary: "Para bases de dados e conjuntos de dados: qualquer utilização,
  incluindo comercial, desde que mantenha o aviso de atribuição. As obras
  produzidas a partir dos dados também precisam de um aviso."
analogy: Use os dados do mapa onde quiser, basta dizer de onde vieram.
pros:
  - Regra de atribuição simples
  - Comum em grandes corpora de treino de IA
  - Abrange direitos sobre bases de dados, não só direitos de autor
cons:
  - Não foi concebida para software
  - Sem concessão de patentes
