summary: Permite modificar e distribuir livremente, mas uma versão modificada
  tem de ser claramente identificada ou renomeada, ou o seu código-fonte
  disponibilizado. Inclui termos sobre patentes.
analogy: Faça um remix da canção, mas não venda o seu remix como o original.
pros:
  - Protege a identidade do original
  - Compatível com a GPL
cons:
  - Condições prolixas
  - Rara fora de Raku e Perl
