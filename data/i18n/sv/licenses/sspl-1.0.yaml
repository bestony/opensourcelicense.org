summary: Liknar AGPL, men att erbjuda programvaran som tjänst kräver att
  källkoden till hela tjänstestacken släpps. Inte OSI-godkänd.
analogy: Driver du en restaurang med den här rätten måste du också publicera
  ritningarna till ditt kök.
pros:
  - Starkt skydd mot molnleverantörer
cons:
