summary: Överlåter verket till allmän egendom där det är möjligt, med en
  tillåtande reservlösning. Inget erkännande krävs.
analogy: "Att lämna en bok utan namn på en parkbänk: vem som helst får ta den."
pros:
  - Inga villkor alls
  - Lätt att kombinera med vad som helst
cons:
