  4 år)."
analogy: "Ett skyltfönster: du får titta och prova, och efter några år blir
  varan gratis för alla."
pros:
  - Du kan styra kommersiell användning
  - Koden blir öppen källkod senare
cons:
  - Inte öppen källkod
  - Villkoren i Grant skiljer sig mellan projekt
  - Kan leda till forkar
