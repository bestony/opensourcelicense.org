summary: Gratis för forskning, icke-kommersiell användning och kommersiell
  användning under 1 miljon USD i årsomsättning; större företag behöver en
  företagslicens.
analogy: Fri entré för småföretag; stora företag köper biljett.
pros:
  - Gratis för privatpersoner och små företag
  - Omfattar nya Stability-modeller
cons:
  - Inte öppen källkod
  - Omsättningströskeln måste följas upp
