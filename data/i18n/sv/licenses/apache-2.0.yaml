summary: Tillåtande licens med uttrycklig patentlicens, patentvedergällning och
  krav på att markera ändrade filer.
analogy: En gratis verktygslåda som också har ett löfte om att inte stämma dig
  för dess patent — om du inte stämmer först.
pros:
