reviewed: false
sourceHash: 6a4054dc9cca8e7e
summary: 데이터베이스용 동일조건변경허락. 상업적으로 쓸 수 있지만 공개하는 파생 데이터베이스는 ODbL을 유지해야 합니다. 지도나 이미지
  같은 결과물은 저작자 표시만 하면 됩니다.
analogy: 공유 지도 위에 쌓아 올리고, 개선한 지도 데이터베이스를 공개한다면 같은 조건으로 돌려주세요.
pros:
  - 개선된 데이터베이스를 계속 개방
  - 상업적 사용 허용
  - OpenStreetMap에서 검증됨
cons:
  - 동일조건 요구가 다른 데이터와의 결합을 막을 수 있음
  - '"파생 데이터베이스"의 범위가 모호할 때가 있음'
