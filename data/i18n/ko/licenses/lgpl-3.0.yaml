sourceHash: cdef0d42cb1ab51e
summary: 라이브러리 단위 카피레프트. 라이브러리 변경은 공개해야 하며, 사용자가 라이브러리를 교체할 수 있다면 폐쇄형 앱도 링크할 수 있습니다.
analogy: 공용 엔진과 같습니다. 차에 넣어도 되지만 차주가 자신의 엔진으로 바꿀 수 있어야 합니다.
pros:
  - 상용 앱도 라이브러리를 쓸 수 있음
  - 라이브러리 개선은 공개됨
  - 특허 허락
cons:
  - 재링크 규칙이 복잡함 (특히 정적 링크와 모바일)
  - 여전히 피하는 기업이 있음
