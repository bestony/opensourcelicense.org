sourceHash: 637c87bc846f9159
summary: 명시적인 특허 허락과 특허 보복 조항이 있고, 수정한 파일을 표시하도록 요구하는 허용형 라이선스입니다.
analogy: 특허로 소송하지 않겠다는 약속이 붙은 무료 도구 상자. 단, 당신이 먼저 소송하면 그렇지 않습니다.
pros:
  - 모든 기여자의 명시적 특허 허락
  - 많은 기업과 재단이 선호
  - 상표를 보호
cons:
  - 길고 NOTICE 파일 처리가 필요
  - GPL-2.0-only와 비호환
  - 호스팅형 경쟁자는 막지 못함
