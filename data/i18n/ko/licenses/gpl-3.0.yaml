sourceHash: 3ab9492f75e7adb0
summary: 강한 카피레프트. 소프트웨어나 파생물을 배포하면 전체 소스를 GPL-3.0으로 공개해야 합니다.
analogy: 이 레시피로 만든 음식을 내는 사람은 레시피 전체도 함께 건네야 한다고 적힌 레시피.
pros:
  - 배포되는 모든 파생물이 공개 상태로 유지
  - 특허 허락과 반(反) 티보이제이션
  - 강한 커뮤니티 전통
cons:
  - 많은 기업이 회피
  - SaaS는 다루지 않음 (배포가 아님)
  - GPL-2.0-only와 비호환
