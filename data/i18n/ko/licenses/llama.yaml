sourceHash: 4803251a37336702
summary: 자체 모델 라이선스. 상업적 사용이 가능하지만 허용 사용 정책, 저작자 표시와 이름 규칙이 있고, 월간 활성 사용자 7억 명을
  넘으면 별도 라이선스가 필요합니다.
analogy: 규칙집이 딸린 무료 엔진. 가장 큰 자동차 회사만 따로 계약해야 합니다.
pros:
  - 대부분의 사용자는 상업적으로 사용 가능
  - 큰 생태계
cons:
  - OSI는 오픈소스로 인정하지 않음
  - 사용 정책과 이름 규칙 의무
  - 버전마다 조건이 바뀜
