summary: Verse l'œuvre dans le domaine public quand c'est possible, avec une
  licence permissive de secours. Aucune attribution requise.
analogy: "Laisser un livre sans nom sur un banc public : chacun peut le prendre."
pros:
  - Aucune condition
  - Facile à combiner avec tout
cons:
  - Le domaine public volontaire n'est pas reconnu partout
  - Certaines entreprises l'évitent par prudence juridique
