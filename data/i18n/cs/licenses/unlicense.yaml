summary: Uvolňuje dílo do veřejné domény, kde je to možné, s permisivní záložní
  licencí. Uvedení autorství není vyžadováno.
analogy: "Jako nechat knihu na lavičce v parku bez jména uvnitř: kdokoli si ji
  může vzít."
pros:
  - Žádné podmínky
  - Snadno se kombinuje s čímkoli
cons:
  - Uvolnění do veřejné domény není uznáváno ve všech zemích
  - Některé firmy se jí vyhýbají kvůli právní nejistotě
