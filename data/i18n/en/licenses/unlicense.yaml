reviewed: true
summary: Dedicates the work to the public domain where possible, with a
  permissive fallback. No attribution is required.
analogy: "Leaving a book on a park bench with no name inside: anyone may take it."
pros:
  - No conditions at all
  - Easy to combine with anything
cons:
  - Public-domain dedication is not recognized in every country
  - Some companies avoid it for legal uncertainty
