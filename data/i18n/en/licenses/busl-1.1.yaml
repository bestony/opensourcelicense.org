reviewed: true
summary: "Source-available: production use is limited by the Additional Use
  Grant, and each version converts to an open license after the Change Date (max
  4 years)."
analogy: "A shop window: you can look and try, and after a few years the item
  becomes free for everyone."
pros:
  - Lets you control commercial use
  - Code becomes open source later
cons:
  - Not open source
  - Grant terms differ per project
  - Can trigger forks
