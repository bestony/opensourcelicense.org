  advisory.needs-cla: Use a Contributor License Agreement (CLA). You will need it to sell commercial licenses or change the license later.
  advisory.consider-dco: A Developer Certificate of Origin (DCO, "Signed-off-by") is usually enough.
  advisory.busl-change-date: Set the Additional Use Grant, the Change Date and the Change License in the BSL header.
  advisory.model-card: Put the license in the model or dataset card metadata ("license:" field).
  advisory.notice-file: Add a NOTICE file and keep it when you redistribute.
  advisory.consult-lawyer: Ask a lawyer to check the dependency and business terms before you release.
  advisory.network-source-link: Show a "Source code" link to users of your network service.
