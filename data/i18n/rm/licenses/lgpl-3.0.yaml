summary: "Copyleft al nivel da la biblioteca: midadas vi da la biblioteca restan
  avertas; applicaziuns serradas pon sa colliar cun ella, sch'ils utilisaders
  pon remplazzar la biblioteca."
analogy: "In motor cuminaivel: Vus al pudais montar en Voss auto, ma ils
  possessurs al ston pudair barattar cun in agen."
pros:
  - Permetta ad applicaziuns proprietaras da duvrar la biblioteca
  - Midadas vi da la biblioteca restan avertas
  - Concessiun da patents
cons:
  - Las reglas per colliar da nov èn cumplexas, surtut per colliaziuns staticas
    e sin apparats mobils
  - Intginas interpresas la evitan anc adina
