summary: Deditgescha l'ovra a la domena publica, nua che quai è pussaivel, cun
  ina licenza permissiva da reserva. I na dovra nagina attribuziun.
analogy: "Sco laschar in cudesch sin in banc en il parc senza num en el: mintgin
  al po prender."
pros:
  - Dal tuttafatg naginas cundiziuns
  - Simpel da cumbinar cun tut
cons:
  - La dedicaziun a la domena publica n'è betg renconuschida en tut ils pajais
  - Intginas interpresas la evitan pervia da l'intschertezza giuridica
