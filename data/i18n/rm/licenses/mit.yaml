summary: Faschai bunamain tut cun il code. Mantegnai la remartga dal dretg
  d'autur e da la licenza. Nagina garanzia.
analogy: "Sco laschar in cudesch gratuit en in café: prender, copiar, vender, mo
  il num da l'autur sto restar sin la cuverta."
pros:
  - Curta e chapida da tuts
  - La licenza la pli simpla da surpigliar per interpresas
  - Cumpatibla cun bunamain tut las autras licenzas
cons:
  - Nagina concessiun da patents
  - Mintgin po construir in concurrent serrà u ospità
