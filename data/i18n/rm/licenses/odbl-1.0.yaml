summary: "Share-alike per bancas da datas: Vus pudais duvrar las datas
  commerzialmain, ma bancas da datas derivadas publicas ston restar sut l'ODbL.
  Ovras producidas sco chartas u maletgs dovran mo ina attribuziun."
analogy: Construi sin la charta cuminaivla, e sche Vus publitgais ina banca da
