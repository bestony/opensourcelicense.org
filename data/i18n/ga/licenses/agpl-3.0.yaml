summary: "GPL-3.0 móide clásal líonra: ní mór an fhoinse a thairiscint
  d'úsáideoirí a idirghníomhaíonn le leagan mionathraithe thar líonra."
analogy: "Baineann riail an oidis le bialanna freisin: meastar gur tabhairt
  amach é an mhias a riar."
pros:
  - Dúnann sé bealach éalaithe SaaS
  - Bunús maith don décheadúnú
  - Foinse oscailte ceadaithe ag OSI
cons:
  - Toirmisceann go leor cuideachtaí é ar fad
  - Tá óstáil gan mhionathrú ceadaithe fós
