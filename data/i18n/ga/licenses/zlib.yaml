summary: "Ceadúnas ceadaitheach: ní mór foinse athraithe a mharcáil mar
  athraithe, ní ceadmhach an bunús a mhífhaisnéisiú, agus fanann an fógra i
  gcóipeanna foinse."
analogy: Faigh an t-oideas ar iasacht, ach má athraíonn tú é, ná maígh gurb é an
  bunleagan é.
pros:
  - Ceadaitheach agus gearr
  - Móréilimh do chluichí agus do leabharlanna dúchasacha
cons:
  - Gan deonú paitinne
  - Tá forcanna dúnta ceadaithe
