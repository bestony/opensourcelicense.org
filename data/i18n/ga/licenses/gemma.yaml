summary: "Téarmaí samhla Google: úsáid tráchtála ceadaithe, le beartas úsáide
  toirmiscthe a théann ar aghaidh chuig gach saothar díorthach, samhlacha
  driogtha san áireamh."
analogy: Inneall saor in aisce le leabhar rialacha nach mór do gach inneall
  atógtha a iompar.
pros:
  - Úsáid tráchtála gan tairseach úsáideoirí
  - Rialacha soiléire do shaothair dhíorthacha
cons:
  - Ní foinse oscailte é de réir OSI
  - Féadfaidh Google an beartas úsáide a nuashonrú
