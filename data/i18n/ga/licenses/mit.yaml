summary: Déan beagnach rud ar bith leis an gcód. Coinnigh an fógra cóipchirt
  agus ceadúnais. Gan bharántas.
analogy: "Cosúil le leabhar saor in aisce a fhágáil i gcaife: tóg é, cóipeáil é,
  díol é, ach coinnigh ainm an údair ar an gclúdach."
pros:
  - Gearr agus tuigtear go forleathan é
  - An ceadúnas is éasca do chuideachtaí glacadh leis
  - Comhoiriúnach le beagnach gach ceadúnas eile
cons:
  - Gan deonú paitinne
  - Is féidir le duine ar bith iomaitheoir foinse dúnta nó óstáilte a thógáil
