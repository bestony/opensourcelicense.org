summary: "Copyleft ar leibhéal leabharlainne: fanann athruithe ar an leabharlann
  oscailte; féadfaidh feidhmchláir dhúnta nascadh léi má tá úsáideoirí in ann an
  leabharlann a athsholáthar."
analogy: "Inneall comhroinnte: is féidir leat é a chur i do charr, ach caithfidh
  na húinéirí a bheith in ann a gceann féin a chur ina áit."
pros:
  - Ligeann sé d'fheidhmchláir dhílseánaigh an leabharlann a úsáid
  - Fanann athruithe ar an leabharlann oscailte
  - Deonú paitinne
cons:
  - Tá rialacha athnasctha casta, go háirithe do nascadh statach agus do
    ghléasanna soghluaiste
  - Seachnaíonn roinnt cuideachtaí é fós
