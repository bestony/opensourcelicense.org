summary: "D'ábhar, do shonraí agus do dhoiciméadú: úsáid ar bith, tráchtáil san
  áireamh, le sannadh agus léiriú ar athruithe."
analogy: Roinn an grianghraf áit ar bith, ach tabhair creidiúint don ghrianghrafadóir.
pros:
  - Riail shimplí sannta
  - Go maith do shonraí agus do dhoiciméid
  - Aistriúcháin oifigiúla
cons:
  - Níor dearadh do bhogearraí é
  - Gan deonú paitinne
