summary: Cosúil le AGPL, ach má thairgtear na bogearraí mar sheirbhís, ní mór
  foinse na cruaiche seirbhíse ar fad a scaoileadh. Gan cheadú OSI.
analogy: Má ritheann tú bialann a bhfuil an mhias seo aici, caithfidh tú
  pleananna do chistine a fhoilsiú freisin.
pros:
  - Cosaint láidir in aghaidh soláthraithe néil
cons:
  - Ní foinse oscailte é de réir OSI
  - Diúltaithe ag go leor dáileachán
  - Is féidir leis forcanna pobail a spreagadh
