summary: Ceadúnas ceadaitheach Síneach le deonú paitinne agus frithbheart. Tá na
  téacsanna Síneacha agus Béarla chomh bailí céanna; bíonn forlámhas ag an
  tSínis i gcás coimhlinte.
analogy: Cosaint i stíl Apache, scríofa agus dlí na Síne san áireamh.
pros:
  - Téacs oifigiúil dátheangach
  - Deonú paitinne
  - Ceadaithe ag OSI
cons:
  - Níos lú aithne air lasmuigh den tSín
  - Cásdlí teoranta
