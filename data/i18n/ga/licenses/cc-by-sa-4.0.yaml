summary: "Copyleft d'ábhar: úsáid ar bith le sannadh, agus ní mór oiriúnuithe a
  roinnt faoin gceadúnas céanna."
analogy: Athmheasc an grianghraf go saor, ach roinn d'athmheascán ar na téarmaí céanna.
pros:
  - Coinníonn sé oiriúnuithe oscailte
  - Úsáideann Vicipéid é
cons:
