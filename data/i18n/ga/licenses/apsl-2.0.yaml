summary: "Copyleft ar leibhéal comhaid ó Apple: ní mór comhaid chumhdaithe
  mhionathraithe a fhoilsiú, fiú nuair a imscartar go seachtrach iad mar
  sheirbhís. Neamh-chomhoiriúnach leis an GPL."
analogy: Roinn na hathruithe ar an gcomhad a fuair tú ar iasacht, fiú nuair nach
  ndéanann tú ach an toradh a riar.
pros:
  - Clúdaíonn sé imscaradh seachtrach
  - Deonú paitinne
cons:
  - Neamh-chomhoiriúnach leis an GPL
  - Teoranta den chuid is mó d'fhoinse oscailte Apple
