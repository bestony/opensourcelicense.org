summary: "Ceadúnas sonraí ceadaitheach ón Linux Foundation: úsáid agus roinn
  sonraí go saor; níl srian ar thorthaí ar nós samhlacha oilte."
analogy: Úsáid an tacar sonraí le haghaidh rud ar bith; cuir an comhaontú san
  áireamh nuair a thugann tú na sonraí ar aghaidh.
pros:
  - Scaoileann sé torthaí ríomhaireachtúla go sainráite
  - Scríofa do shonraí
cons:
  - Níos lú aithne air ná ceadúnais CC
  - Tá leagan 2.0 níos simplí
