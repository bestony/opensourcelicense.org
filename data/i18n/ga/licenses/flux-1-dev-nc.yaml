summary: Meáchain samhla d'úsáid neamhthráchtála amháin; teastaíonn ceadúnas ar
  leith ó Black Forest Labs chun na meáchain a úsáid go tráchtála.
analogy: Faigh an ceamara ar iasacht do do thionscadail féin, ní do sheisiúin íoctha.
pros:
