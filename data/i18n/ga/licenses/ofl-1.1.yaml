summary: "Ceadúnas saor do chlófhoirne: úsáid, leabaigh agus mionathraigh
  clófhoirne go saor, ach ní mór do chlófhoirne mionathraithe ainmneacha
  forchoimeádta a scaoileadh, agus ní féidir na clófhoirne a dhíol leo féin."
analogy: Úsáid an cló i ngach áit, ach ná díol an comhad clófhoirne lom.
pros:
  - Ceadaíonn sé leabú i ndoiciméid agus in aipeanna
  - Caighdeán do chlófhoirne oscailte
cons:
  - Déanann ainmneacha forchoimeádta clófhoirne forcanna níos casta
  - Do chlófhoirne amháin
