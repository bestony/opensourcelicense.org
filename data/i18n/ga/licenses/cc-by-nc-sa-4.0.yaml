summary: "D'ábhar: sannadh, gan úsáid tráchtála, agus oiriúnuithe faoin
  gceadúnas céanna."
analogy: Roinn agus athmheasc na nótaí léachta, choíche ar mhaithe le brabús, i
  gcónaí ar na téarmaí céanna.
pros:
  - Coisceann sé athúsáid tráchtála
  - Coitianta d'ábhar cúrsa
cons:
  - Níl sé oscailte de réir an Open Definition
  - Is minic nach léir cad is “neamhthráchtáil” ann
