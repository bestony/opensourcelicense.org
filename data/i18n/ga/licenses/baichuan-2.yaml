summary: Úsáid tráchtála saor in aisce do sheirbhísí faoi bhun milliún úsáideoir
  gníomhach in aghaidh an lae, tar éis clárú; teastaíonn ceadúnas ar leith ó
  sheirbhísí níos mó.
analogy: Inneall saor in aisce do chabhlaigh bheaga tar éis duit an carr a chlárú.
pros:
  - Saor in aisce don chuid is mó d'úsáideoirí tráchtála
  - Samhlacha láidre teanga Síneach
cons:
  - Ní foinse oscailte é
  - Clárú agus tairseach úsáideoirí
