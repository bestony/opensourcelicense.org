summary: "Do bhunachair sonraí agus do thacair sonraí: úsáid ar bith, tráchtáil
  san áireamh, má choinníonn tú an fógra sannta. Teastaíonn fógra freisin ó
  shaothair a tháirgeann tú ó na sonraí."
analogy: Úsáid na sonraí léarscáile áit ar bith, ach abair cárb as dóibh.
pros:
  - Riail shimplí sannta
  - Coitianta do chorpais mhóra oiliúna IS
  - Clúdaíonn sé cearta bunachar sonraí, ní cóipcheart amháin
cons:
  - Níor dearadh do bhogearraí é
  - Gan deonú paitinne
