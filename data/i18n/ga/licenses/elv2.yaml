sourceHash: 1b47253adc7fb00d
summary: "Foinse ar fáil: saor le húsáid agus le mionathrú, ach ní féidir leat é
  a thairiscint mar sheirbhís bhainistithe ná eochracha ceadúnais a sheachaint."
analogy: Cócaráil leis sa bhaile nó i do bhialann, ach ná hoscail siopa a
  dhíolann an mhias chéanna seo.
pros:
  - Gearr agus soiléir
  - Ní dhíríonn sé ach ar iomaitheoirí seirbhísí bainistithe
cons:
  - Ní foinse oscailte é
  - Cuireann sé teorainn le forcanna agus le roinnt comhpháirtithe
