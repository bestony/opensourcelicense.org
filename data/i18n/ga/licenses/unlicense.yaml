summary: Tiomnaíonn sé an saothar don fhearann poiblí nuair is féidir, le
  ceadúnas cúltaca ceadaitheach. Níl sannadh riachtanach.
analogy: "Leabhar a fhágáil ar bhinse páirce gan ainm ann: is féidir le duine ar
  bith é a thógáil."
pros:
  - Gan choinníollacha ar bith
  - Éasca é a chomhcheangal le rud ar bith
cons:
  - Ní aithnítear tiomnú don fhearann poiblí i ngach tír
  - Seachnaíonn roinnt cuideachtaí é mar gheall ar éiginnteacht dhlíthiúil
