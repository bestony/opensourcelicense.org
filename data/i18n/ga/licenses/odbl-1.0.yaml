sourceHash: 6a4054dc9cca8e7e
summary: "Comhroinnt ar comhchéim do bhunachair sonraí: is féidir leat na sonraí
  a úsáid go tráchtála, ach ní mór do bhunachair sonraí díorthacha poiblí
  fanacht faoin ODbL. Ní theastaíonn ach sannadh ó shaothair tháirgthe ar nós
  léarscáileanna nó íomhánna."
analogy: Tóg ar an léarscáil chomhroinnte, agus má fhoilsíonn tú bunachar sonraí
  léarscáile feabhsaithe, roinn ar ais é ar na téarmaí céanna.
pros:
  - Coinníonn sé bunachair sonraí feabhsaithe oscailte
  - Úsáid tráchtála ceadaithe
  - Cruthaithe ag OpenStreetMap
cons:
  - Is féidir le comhroinnt ar comhchéim cosc a chur ar mheascadh le sonraí eile
  - Uaireanta ní léir cad is “bunachar sonraí díorthach” ann
