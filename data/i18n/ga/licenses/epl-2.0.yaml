summary: Copyleft lag ar leibhéal modúil le deonú paitinne; is féidir an GPL a
  ainmniú mar cheadúnas tánaisteach ar mhaithe le comhoiriúnacht.
analogy: Roinn d'athruithe ar an gcaibidil a fuair tú ar iasacht; is leatsa an
  chuid eile den leabhar.
pros:
  - Copyleft atá báúil le gnó
  - Deonú paitinne
cons:
  - Comhoiriúnacht GPL le ceadúnas tánaisteach dearbhaithe amháin
  - Is féidir le teorainneacha modúl a bheith doiléir
