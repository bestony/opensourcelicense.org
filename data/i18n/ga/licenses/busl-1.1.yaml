summary: "Foinse ar fáil: tá úsáid táirgthe teoranta ag an Additional Use Grant,
  agus iompaíonn gach leagan ina cheadúnas oscailte tar éis an Change Date (4
  bliana ar a mhéad)."
analogy: "Fuinneog siopa: is féidir leat féachaint agus triail a bhaint as, agus
  i gceann cúpla bliain beidh an earra saor do chách."
pros:
  - Ligeann sé duit úsáid tráchtála a rialú
  - Éiríonn an cód ina fhoinse oscailte níos déanaí
cons:
  - Ní foinse oscailte é
  - Bíonn téarmaí an deontais difriúil ó thionscadal go tionscadal
  - Is féidir leis forcanna a spreagadh
