summary: "Copyleft leabharlainne: fanann athruithe ar an leabharlann oscailte;
  féadfaidh ríomhchláir dhúnta nascadh léi má tá úsáideoirí in ann athnascadh le
  leabharlann mhionathraithe."
analogy: An t-eagrán níos sine den inneall comhroinnte in-inmhalartaithe.
pros:
  - Ligeann sé d'fheidhmchláir dhílseánaigh an leabharlann a úsáid
  - Coitianta i leabharlanna deisce agus ilmheán
cons:
  - Tá rialacha athnasctha casta
  - Gan deonú paitinne sainráite
