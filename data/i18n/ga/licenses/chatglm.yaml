sourceHash: 6b573c3cf6eaeea1
summary: Tá na meáchain saor in aisce do thaighde acadúil; tá úsáid tráchtála
  saor in aisce tar éis clárú, faoi réir srianta úsáide.
analogy: Saor le staidéar; cláraigh sula n-úsáideann tú i ngnó é.
pros:
  - Úsáid tráchtála tar éis clárú
  - Samhlacha Síneacha a úsáidtear go forleathan
cons:
  - Ní foinse oscailte é
  - Céim chláraithe
