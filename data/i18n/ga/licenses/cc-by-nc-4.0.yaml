sourceHash: 0196a50e1d1c6b89
summary: "D'ábhar agus do shonraí: tá sannadh riachtanach agus níl úsáid
  tráchtála ceadaithe."
analogy: Roinn an grianghraf go saor, ach ní i bhfógraí ná i dtáirgí a dhíolann tú.
pros:
  - Coisceann sé athúsáid tráchtála
  - Aistriúcháin oifigiúla
cons:
  - Níl sé oscailte de réir OSI ná an Open Definition
  - Is minic nach léir cad is “neamhthráchtáil” ann
  - Coisceann sé go leor úsáidí dlisteanacha
