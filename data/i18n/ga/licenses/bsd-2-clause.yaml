summary: "Cosúil le MIT: úsáid an cód go saor; coinnigh an fógra cóipchirt agus
  an séanadh i gcóipeanna foinse agus dénártha."
analogy: "Cárta oidis saor in aisce: cóipeáil áit ar bith é, ach coinnigh líne
  an údair ag an mbun."
pros:
