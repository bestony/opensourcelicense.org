summary: "Source-available: vrij te gebruiken en te wijzigen, maar je mag het
  niet als managed service aanbieden of licentiesleutels omzeilen."
analogy: Kook ermee thuis of in je restaurant, maar open geen winkel die precies
  dit gerecht verkoopt.
pros:
