summary: Gratis commercieel gebruik voor diensten met minder dan een miljoen
  dagelijks actieve gebruikers, na registratie; grotere diensten hebben een
  aparte licentie nodig.
analogy: Een gratis motor voor kleine wagenparken, nadat je de auto hebt geregistreerd.
pros:
  - Gratis voor de meeste commerciële gebruikers
  - Sterke Chineestalige modellen
cons:
  - Geen open source
  - Registratie en gebruikersdrempel
