summary: Draagt het werk waar mogelijk over aan het publieke domein, met een
  permissieve terugvaloptie. Naamsvermelding is niet vereist.
analogy: "Een boek zonder naam erin op een parkbankje achterlaten: iedereen mag
  het meenemen."
pros:
  - Helemaal geen voorwaarden
  - Makkelijk met alles te combineren
cons:
  - Overdracht aan het publieke domein wordt niet in elk land erkend
  - Sommige bedrijven vermijden het vanwege juridische onzekerheid
