summary: "GPL-3.0 के साथ एक नेटवर्क धारा: जो उपयोगकर्ता नेटवर्क पर किसी संशोधित
  संस्करण से इंटरैक्ट करते हैं, उन्हें उसका सोर्स कोड देना होगा।"
analogy: "रेसिपी वाला नियम रेस्टोरेंट पर भी लागू होता है: व्यंजन परोसना भी उसे
  बाँटना माना जाता है।"
pros:
  - SaaS की खामी बंद करता है
  - डुअल लाइसेंसिंग के लिए अच्छा आधार
  - OSI-स्वीकृत ओपन सोर्स
cons:
  - कई कंपनियाँ इस पर सीधा प्रतिबंध लगाती हैं
  - बिना संशोधन के होस्टिंग अब भी अनुमत है
