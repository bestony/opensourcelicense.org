summary: "डेटाबेस के लिए समान-शर्त लाइसेंस: आप डेटा का व्यावसायिक उपयोग कर सकते
  हैं, पर सार्वजनिक व्युत्पन्न डेटाबेस ODbL के तहत ही रहने चाहिए। नक्शे या चित्र
  जैसे निर्मित कार्यों के लिए केवल श्रेय चाहिए।"
analogy: साझा नक्शे पर निर्माण करें, और यदि आप बेहतर नक्शा डेटाबेस प्रकाशित करते
  हैं, तो उसे उन्हीं शर्तों पर वापस साझा करें।
pros:
  - बेहतर डेटाबेस को खुला रखता है
  - व्यावसायिक उपयोग की अनुमति
  - OpenStreetMap द्वारा सिद्ध
cons:
  - समान-शर्त नियम दूसरे डेटा के साथ मिश्रण में बाधा बन सकता है
  - “व्युत्पन्न डेटाबेस” कभी-कभी अस्पष्ट होता है
