summary: लाइब्रेरी पर स्वयं GPL-2.0, साथ में एक अपवाद जो स्वतंत्र प्रोग्रामों को
  किसी भी लाइसेंस के तहत उससे लिंक करने देता है।
analogy: रेसिपी-साझा नियम के तहत एक साझा इंजन, पर आपकी अपनी गाड़ी आपकी ही रहती है।
pros:
  - इससे लिंक करने वाले ऐप्लिकेशन बंद रह सकते हैं
  - OpenJDK द्वारा प्रयुक्त
cons:
  - लाइब्रेरी के बदलाव GPL ही रहते हैं
  - GPL-3.0-only प्रोजेक्ट के साथ असंगत
