summary: स्पष्ट पेटेंट अनुदान, पेटेंट प्रतिशोध धारा और बदली गई फ़ाइलों को
  चिह्नित करने की शर्त वाला परमिसिव लाइसेंस।
analogy: एक मुफ़्त टूलकिट, जिसके साथ यह वादा भी है कि उसके पेटेंट पर आप पर
  मुकदमा नहीं होगा — जब तक आप पहले मुकदमा न करें।
pros:
  - हर योगदानकर्ता से स्पष्ट पेटेंट अनुदान
  - कई कंपनियों और फ़ाउंडेशन की पसंद
  - ट्रेडमार्क की रक्षा करता है
cons:
  - लंबा; NOTICE फ़ाइल संभालनी पड़ती है
  - GPL-2.0-only के साथ संगत नहीं
  - होस्टेड प्रतिस्पर्धियों को नहीं रोकता
