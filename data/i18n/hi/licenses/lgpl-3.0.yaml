sourceHash: cdef0d42cb1ab51e
summary: "लाइब्रेरी-स्तरीय कॉपीलेफ्ट: लाइब्रेरी के बदलाव खुले रहते हैं; बंद ऐप
  इससे लिंक कर सकते हैं, यदि उपयोगकर्ता लाइब्रेरी बदल सकें।"
analogy: "एक साझा इंजन: आप इसे अपनी गाड़ी में लगा सकते हैं, पर मालिकों को इसे
  अपने इंजन से बदलने की सुविधा होनी चाहिए।"
pros:
  - प्रोप्राइटरी ऐप को लाइब्रेरी इस्तेमाल करने देता है
  - लाइब्रेरी के बदलाव खुले रहते हैं
  - पेटेंट अनुदान
cons:
  - री-लिंकिंग नियम जटिल हैं, ख़ासकर स्टैटिक लिंकिंग और मोबाइल के लिए
  - कुछ कंपनियाँ अब भी इससे बचती हैं
