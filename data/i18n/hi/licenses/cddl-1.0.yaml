summary: MPL से निकला फ़ाइल-स्तरीय कॉपीलेफ्ट, पेटेंट अनुदान के साथ; GPL के साथ असंगत।
analogy: उधार ली गई फ़ाइल के बदलाव साझा करें; चाहें तो बाकी बंद रखें।
pros:
  - फ़ाइल-स्तरीय दायरा
  - पेटेंट अनुदान
cons:
  - GPL के साथ असंगत (Linux पर ZFS की समस्या)
  - कम नए प्रोजेक्ट इसे अपनाते हैं
