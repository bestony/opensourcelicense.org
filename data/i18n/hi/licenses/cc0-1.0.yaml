summary: "डेटा और कंटेंट के लिए पब्लिक डोमेन समर्पण, साथ में एक बैकअप लाइसेंस:
  कोई शर्त नहीं, श्रेय भी नहीं।"
analogy: फ़ोटो को सार्वजनिक दीवार पर लगा दीजिए; कोई भी ले सकता है।
pros:
  - कोई शर्त नहीं
  - ओपन डेटा के लिए आदर्श
cons:
  - श्रेय की कोई गारंटी नहीं
  - पेटेंट अनुदान नहीं
