summary: AGPL जैसा, लेकिन सॉफ़्टवेयर को सर्विस के रूप में पेश करने पर पूरे
  सर्विस स्टैक का सोर्स जारी करना होता है। OSI-स्वीकृत नहीं।
analogy: यदि आप इस व्यंजन वाला रेस्टोरेंट चलाते हैं, तो आपको अपनी रसोई का नक्शा
  भी प्रकाशित करना होगा।
pros:
  - क्लाउड कंपनियों के ख़िलाफ़ मज़बूत सुरक्षा
cons:
  - OSI के अनुसार ओपन सोर्स नहीं
  - कई डिस्ट्रीब्यूशन ने इसे अस्वीकार किया
  - सामुदायिक फ़ोर्क को जन्म दे सकता है
