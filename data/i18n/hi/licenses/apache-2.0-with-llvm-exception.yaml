summary: Apache-2.0 के साथ एक अपवाद जो कंपाइल किए गए कोड के लिए श्रेय की शर्त
  हटाता है और इसे GPL-2.0 प्रोजेक्ट के साथ उपयोग योग्य बनाता है।
analogy: Apache का टूलकिट, इस नोट के साथ कि आपके प्रोडक्ट में रह गए औज़ारों के
  अंशों के लिए श्रेय ज़रूरी नहीं।
pros:
  - Apache-2.0 का पेटेंट अनुदान
  - GPL-2.0 कोड के साथ काम करता है
cons:
  - MIT से लंबा
  - अपवाद कंपाइलर जैसे प्रोजेक्ट के लिए ही बना है
