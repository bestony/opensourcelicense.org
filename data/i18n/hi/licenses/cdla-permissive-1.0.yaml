summary: "Linux Foundation का परमिसिव डेटा लाइसेंस: डेटा का स्वतंत्र उपयोग और
  साझा करें; प्रशिक्षित मॉडल जैसे परिणामों पर कोई प्रतिबंध नहीं।"
analogy: डेटासेट का किसी भी काम में उपयोग करें; डेटा आगे देते समय समझौता साथ दें।
pros:
  - गणनात्मक परिणामों को स्पष्ट रूप से मुक्त करता है
  - डेटा के लिए लिखा गया
cons:
  - CC लाइसेंसों से कम जाना-माना
  - संस्करण 2.0 अधिक सरल है
