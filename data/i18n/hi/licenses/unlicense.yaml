summary: जहाँ संभव हो, कृति को पब्लिक डोमेन में समर्पित करता है, साथ में परमिसिव
  बैकअप। श्रेय की ज़रूरत नहीं।
analogy: "पार्क की बेंच पर बिना नाम वाली किताब छोड़ देना: कोई भी ले सकता है।"
pros:
  - कोई भी शर्त नहीं
  - किसी भी चीज़ के साथ जोड़ना आसान
cons:
  - पब्लिक डोमेन समर्पण हर देश में मान्य नहीं
  - कानूनी अनिश्चितता के कारण कुछ कंपनियाँ इससे बचती हैं
