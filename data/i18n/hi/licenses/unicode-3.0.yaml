summary: Unicode डेटा और ICU व CLDR जैसे सॉफ़्टवेयर के लिए परमिसिव लाइसेंस;
  सूचना बनाए रखें और प्रचार के लिए कॉपीराइट धारक का नाम इस्तेमाल न करें।
analogy: "एक मुफ़्त संदर्भ पुस्तक: कॉपी करें, श्रेय पंक्ति रहने दें।"
pros:
  - परमिसिव
  - डेटा फ़ाइलों और कोड दोनों को कवर करता है
cons:
  - पेटेंट अनुदान नहीं
  - ज़्यादातर Unicode प्रोजेक्ट में प्रयुक्त
