summary: "सोर्स-उपलब्ध: उपयोग और संशोधन मुफ़्त, लेकिन आप इसे मैनेज्ड सर्विस के
  रूप में पेश नहीं कर सकते या लाइसेंस-की को बायपास नहीं कर सकते।"
analogy: इससे घर पर या अपने रेस्टोरेंट में खाना बनाइए, पर ऐसी दुकान मत खोलिए जो
  ठीक यही व्यंजन बेचे।
pros:
  - छोटा और स्पष्ट
  - केवल मैनेज्ड-सर्विस प्रतिस्पर्धियों को निशाना बनाता है
cons:
  - ओपन सोर्स नहीं
  - फ़ोर्क और कुछ साझेदारों को सीमित करता है
