summary: "LaTeX पैकेजों के लिए फ़्री लाइसेंस: संशोधित फ़ाइलों का नाम बदलना या
  उन्हें साफ़ चिह्नित करना होगा, ताकि दस्तावेज़ हर जगह एक जैसे काम करें।"
analogy: आप टाइपफ़ेस बदल सकते हैं, पर अपने संस्करण को नया नाम दें।
pros:
  - दस्तावेज़ों को पुनरुत्पादन योग्य रखता है
  - CTAN में मानक
cons:
  - नाम बदलने का नियम असामान्य है
  - GPL-संगत नहीं
