summary: "फ़ाइल-स्तरीय कॉपीलेफ्ट: MPL लाइसेंस वाली फ़ाइलों के बदलाव खुले रहने
  चाहिए, लेकिन उन्हें दूसरी फ़ाइलों के बंद कोड के साथ जोड़ा जा सकता है।"
analogy: एक अध्याय उधार लें तो उस अध्याय के अपने संपादन साझा करने होंगे, पर बाकी
  किताब आपकी है।
pros:
  - परमिसिव और कॉपीलेफ्ट के बीच संतुलित
  - स्पष्ट पेटेंट अनुदान
  - डिफ़ॉल्ट रूप से GPL के साथ संगत
cons:
