summary: "एक कस्टम मॉडल लाइसेंस: व्यावसायिक उपयोग की अनुमति, Acceptable Use
  Policy, श्रेय और नामकरण नियमों के साथ, और 70 करोड़ मासिक सक्रिय उपयोगकर्ताओं
  से ऊपर अलग लाइसेंस।"
analogy: मुफ़्त में इस्तेमाल होने वाला इंजन नियम-पुस्तिका के साथ, और सबसे बड़ी
  कार कंपनियों के लिए ख़ास अनुबंध।
pros:
  - ज़्यादातर उपयोगकर्ताओं के लिए व्यावसायिक उपयोग की अनुमति
  - बड़ा इकोसिस्टम
cons:
  - OSI के अनुसार ओपन सोर्स नहीं
  - उपयोग-नीति और नामकरण दायित्व
  - संस्करणों के बीच शर्तें बदलती हैं
