summary: स्वतंत्र रूप से संशोधन और वितरण की अनुमति देता है, लेकिन संशोधित
  संस्करण को साफ़ चिह्नित करना या नया नाम देना होगा, या उसका सोर्स उपलब्ध कराना
  होगा। इसमें पेटेंट शर्तें भी हैं।
analogy: गाने का रीमिक्स बनाइए, पर अपने रीमिक्स को मूल गाना बताकर मत बेचिए।
pros:
  - मूल कृति की पहचान की रक्षा करता है
  - GPL-संगत
cons:
  - शर्तें लंबी-चौड़ी हैं
  - Raku और Perl के बाहर दुर्लभ
