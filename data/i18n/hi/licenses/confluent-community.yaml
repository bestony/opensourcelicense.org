summary: "सोर्स-उपलब्ध: स्वतंत्र रूप से उपयोग, संशोधन और वितरण करें, सिवाय
  Confluent से प्रतिस्पर्धा करने वाला SaaS उत्पाद पेश करने के।"
analogy: रेसिपी को किसी भी रेस्टोरेंट में इस्तेमाल करें, सिवाय उसके जो लेखक के
  रेस्टोरेंट से प्रतिस्पर्धा करे।
pros:
  - सीमित प्रतिबंध
  - ज़्यादातर उपयोगकर्ता प्रभावित नहीं होते
cons:
  - ओपन सोर्स नहीं
  - क्लाउड प्रतिस्पर्धियों को केवल विवरण के आधार पर बाहर करता है
