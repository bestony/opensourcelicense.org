summary: कोड के साथ लगभग कुछ भी करें। कॉपीराइट और लाइसेंस सूचना बनाए रखें। कोई
  वारंटी नहीं।
analogy: "जैसे किसी कैफ़े में मुफ़्त किताब छोड़ देना: ले लीजिए, कॉपी कीजिए,
  बेचिए, बस कवर पर लेखक का नाम रहने दीजिए।"
pros:
  - छोटा और व्यापक रूप से समझा जाने वाला
  - कंपनियों के लिए अपनाने में सबसे आसान
  - लगभग हर दूसरे लाइसेंस के साथ संगत
cons:
  - पेटेंट अनुदान नहीं
  - कोई भी क्लोज़्ड-सोर्स या होस्टेड प्रतिस्पर्धी बना सकता है
