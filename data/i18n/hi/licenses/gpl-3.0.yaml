sourceHash: 3ab9492f75e7adb0
summary: "मज़बूत कॉपीलेफ्ट: यदि आप सॉफ़्टवेयर या उससे व्युत्पन्न कार्य वितरित
  करते हैं, तो पूरा सोर्स कोड GPL-3.0 के तहत जारी करना होगा।"
analogy: "एक रेसिपी जो कहती है: इस पर आधारित व्यंजन परोसने वाले को पूरी रेसिपी
  भी देनी होगी।"
pros:
  - सभी वितरित व्युत्पन्न कार्यों को खुला रखता है
  - पेटेंट अनुदान और एंटी-टिवोइज़ेशन
  - मज़बूत सामुदायिक परंपरा
cons:
  - कई कंपनियाँ इससे बचती हैं
  - SaaS को कवर नहीं करता (वितरण नहीं होता)
  - GPL-2.0-only के साथ असंगत
