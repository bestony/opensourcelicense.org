summary: "Google की मॉडल शर्तें: व्यावसायिक उपयोग की अनुमति, एक निषिद्ध-उपयोग
  नीति के साथ जो हर व्युत्पन्न पर लागू होती है, डिस्टिल किए गए मॉडल सहित।"
analogy: एक मुफ़्त इंजन, जिसकी नियम-पुस्तिका हर दोबारा बने इंजन के साथ जानी चाहिए।
pros:
  - उपयोगकर्ता सीमा के बिना व्यावसायिक उपयोग
  - व्युत्पन्न के स्पष्ट नियम
cons:
  - OSI के अनुसार ओपन सोर्स नहीं
  - Google उपयोग नीति बदल सकता है
