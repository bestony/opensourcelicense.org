sourceHash: db235a56ea57284f
summary: MIT जैसा, साथ में एक धारा जो व्युत्पन्न उत्पादों के समर्थन के लिए आपके
  नाम के उपयोग को रोकती है।
analogy: "एक मुफ़्त किताब जिसमें लिखा है: “यह दावा न करें कि लेखक आपके संस्करण
  की सिफ़ारिश करता है।”"
pros:
  - परमिसिव और जाना-माना
  - आपके नाम को समर्थन के रूप में इस्तेमाल होने से बचाता है
cons:
  - पेटेंट अनुदान नहीं
  - क्लोज़्ड-सोर्स फ़ोर्क की अनुमति है
