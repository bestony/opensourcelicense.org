summary: TII का Apache-2.0 पर आधारित मॉडल लाइसेंस, स्वीकार्य उपयोग नीति के साथ;
  बिना रॉयल्टी के व्यावसायिक उपयोग की अनुमति।
analogy: Apache का टूलकिट, वर्जित उपयोगों की छोटी सूची के साथ।
pros:
  - रॉयल्टी-मुक्त व्यावसायिक उपयोग
  - Apache-2.0 पर आधारित
cons:
  - OSI के अनुसार ओपन सोर्स नहीं
  - उपयोग नीति बदली जा सकती है
