summary: "डेटाबेस और डेटासेट के लिए: व्यावसायिक सहित कोई भी उपयोग, यदि आप श्रेय
  सूचना बनाए रखें। डेटा से बनाए गए कार्यों में भी सूचना चाहिए।"
analogy: नक्शे का डेटा कहीं भी इस्तेमाल करें, बस बताइए कि वह कहाँ से आया।
pros:
  - सरल श्रेय नियम
  - बड़े AI प्रशिक्षण कॉर्पस के लिए आम
  - केवल कॉपीराइट नहीं, डेटाबेस अधिकारों को भी कवर करता है
cons:
  - सॉफ़्टवेयर के लिए नहीं बना
  - पेटेंट अनुदान नहीं
