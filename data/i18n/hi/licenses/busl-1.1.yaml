summary: "सोर्स-उपलब्ध: प्रोडक्शन उपयोग Additional Use Grant द्वारा सीमित है, और
  हर संस्करण Change Date (अधिकतम 4 वर्ष) के बाद एक ओपन लाइसेंस में बदल जाता है।"
analogy: "दुकान की खिड़की: आप देख और आज़मा सकते हैं, और कुछ वर्षों बाद वह चीज़
  सबके लिए मुफ़्त हो जाती है।"
pros:
  - व्यावसायिक उपयोग पर नियंत्रण देता है
  - कोड बाद में ओपन सोर्स बन जाता है
cons:
  - ओपन सोर्स नहीं
  - अनुदान की शर्तें हर प्रोजेक्ट में अलग
  - फ़ोर्क को जन्म दे सकता है
