summary: पेटेंट अनुदान के साथ मॉड्यूल-स्तरीय कमज़ोर कॉपीलेफ्ट; संगतता के लिए GPL
  को द्वितीयक लाइसेंस के रूप में नामित कर सकता है।
analogy: उधार लिए गए अध्याय में अपने बदलाव साझा करें; बाकी किताब आपकी है।
pros:
  - व्यवसाय के अनुकूल कॉपीलेफ्ट
  - पेटेंट अनुदान
cons:
  - GPL संगतता केवल घोषित द्वितीयक लाइसेंस के साथ
  - मॉड्यूल की सीमाएँ अस्पष्ट हो सकती हैं
