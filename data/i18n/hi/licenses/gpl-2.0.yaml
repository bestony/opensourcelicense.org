summary: "मज़बूत कॉपीलेफ्ट: वितरित व्युत्पन्न कार्य पूरी तरह GPL-2.0 के तहत जारी
  करने होंगे। कोई स्पष्ट पेटेंट अनुदान नहीं; 'or later' न होने पर GPL-3.0 के साथ
  असंगत।"
analogy: रेसिपी-साझा नियम, अपने पुराने संस्करण में।
pros:
  - वितरित व्युत्पन्न कार्यों को खुला रखता है
  - Linux kernel द्वारा प्रयुक्त
cons:
  - Apache-2.0 और GPL-3.0 के साथ असंगत (केवल इसी संस्करण पर)
  - स्पष्ट पेटेंट अनुदान नहीं
