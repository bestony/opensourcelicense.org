summary: "लाइब्रेरी कॉपीलेफ्ट: लाइब्रेरी के बदलाव खुले रहते हैं; बंद प्रोग्राम
  इससे लिंक कर सकते हैं, यदि उपयोगकर्ता संशोधित लाइब्रेरी के साथ री-लिंक कर
  सकें।"
analogy: बदले जा सकने वाले साझा इंजन का पुराना संस्करण।
pros:
  - प्रोप्राइटरी ऐप को लाइब्रेरी इस्तेमाल करने देता है
  - डेस्कटॉप और मल्टीमीडिया लाइब्रेरी में आम
cons:
  - री-लिंकिंग नियम जटिल हैं
  - स्पष्ट पेटेंट अनुदान नहीं
