summary: "Für Inhalte und Daten: Namensnennung erforderlich, kommerzielle
  Nutzung nicht erlaubt."
analogy: Teilen Sie das Foto frei, aber nicht in Werbung oder in Produkten, die
  Sie verkaufen.
pros:
  - Verhindert kommerzielle Weiterverwendung
  - Offizielle Übersetzungen
cons:
  - Erfüllt weder OSI noch Open Definition
  - „Nicht kommerziell“ ist oft unklar
  - Blockiert viele legitime Nutzungen
