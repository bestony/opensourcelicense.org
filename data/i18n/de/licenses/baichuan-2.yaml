summary: Kostenlose kommerzielle Nutzung für Dienste unter einer Million täglich
  aktiven Nutzern nach Registrierung; größere Dienste brauchen eine separate
  Lizenz.
analogy: Ein kostenloser Motor für kleine Flotten, sobald das Auto registriert ist.
pros:
  - Für die meisten kommerziellen Nutzer kostenlos
  - Starke Modelle für Chinesisch
cons:
  - Keine Open Source
  - Registrierung und Nutzerschwelle
