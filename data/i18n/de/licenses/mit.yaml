summary: Mit dem Code darf fast alles gemacht werden. Nur Copyright- und
  Lizenzhinweis müssen erhalten bleiben. Keine Gewährleistung.
analogy: "Wie ein kostenloses Buch im Café: mitnehmen, kopieren oder verkaufen
  ist erlaubt, solange der Name des Autors auf dem Umschlag bleibt."
pros:
  - Kurz und weithin verstanden
  - Für Unternehmen am einfachsten zu übernehmen
  - Mit fast jeder anderen Lizenz kompatibel
cons:
  - Keine Patentlizenz
  - Jeder kann einen geschlossenen oder gehosteten Konkurrenten bauen
