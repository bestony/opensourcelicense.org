summary: "Responsible-AI-Lizenz für Modelle: freizügige Bedingungen plus
  nutzungsbezogene Einschränkungen, die jede Ableitung weitergeben muss."
analogy: Ein kostenloses Werkzeug mit einer Liste verbotener Verwendungen, die
  jede Kopie begleitet.
pros:
  - Erlaubt kommerzielle Nutzung
  - Einschränkungen schädlicher Nutzung gelten auch weiter unten
cons:
  - Für die OSI keine Open Source
  - Einschränkungen sind schwer durchzusetzen
  - Es gibt mehrere Varianten
