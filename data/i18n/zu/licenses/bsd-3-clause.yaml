summary: Njenge-MIT, kanye nesigatshana esenqabela ukusebenzisa igama lakho
  ukugunyaza imikhiqizo ephuma kuyo.
analogy: 'Incwadi yamahhala enenothi: "Ungathi umbhali uncoma uhlelo lwakho."'
pros:
  - Ivumela kakhulu futhi yaziwa kahle
  - Ivikela igama lakho ekusetshenzisweni njengokugunyaza
cons:
  - Ayikho imvume ye-patent
  - Ama-fork anekhodi evaliwe ayavunyelwa
