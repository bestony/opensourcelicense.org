summary: "I-copyleft yokuqukethwe: noma yikuphi ukusetshenziswa ngokubalula
  umthombo, futhi ukulungiswa kufanele kwabelwane ngaphansi kwelayisense
  efanayo."
analogy: Yenza i-remix yesithombe ngokukhululeka, kodwa yabelana nge-remix yakho
  ngemigomo efanayo.
pros:
  - Igcina ukulungiswa kuvulekile
  - Isetshenziswa yi-Wikipedia
cons:
  - Umbandela we-share-alike ungavimba ukuxuba
  - Ayenzelwe isofthiwe
