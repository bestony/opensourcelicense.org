summary: Inikela umsebenzi emphakathini (public domain) lapho kungenzeka khona,
  nelayisense evumela kakhulu yokubuyela kuyo. Akudingeki ukubalula umthombo.
analogy: "Ukushiya incwadi engenagama ebhentshini lasepaki: noma ubani angayithatha."
pros:
  - Ayikho imibandela nhlobo
  - Kulula ukuyihlanganisa nanoma yini
cons:
  - Ukunikela emphakathini akwamukelwa kuwo wonke amazwe
  - Ezinye izinkampani ziyayigwema ngenxa yokungaqiniseki kwezomthetho
