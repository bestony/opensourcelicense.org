summary: Yenza cishe noma yini ngekhodi. Gcina isaziso se-copyright nesaziso
  selayisense. Asikho isiqinisekiso.
analogy: "Kufana nokushiya incwadi yamahhala ekhefini: yithathe, yikopishe,
  yithengise, vele ugcine igama lombhali ekhaveni."
pros:
  - Imfushane futhi iqondwa kabanzi
  - Ilayisense elula kakhulu ukuthi izinkampani ziyamukele
  - Iyahambisana cishe nawo wonke amanye amalayisense
cons:
  - Ayikho imvume ye-patent
  - Noma ubani angakha imbangi enekhodi evaliwe noma ebanjwe njengesevisi
