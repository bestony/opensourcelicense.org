summary: Ilayisense yaseShayina evumela kakhulu enemvume ye-patent
  nokuziphindisela. Imibhalo yesiShayina neyesiNgisi inamandla alinganayo;
  isiShayina siyaphumelela uma kungqubuzana.
analogy: Ukuvikelwa kohlobo lwe-Apache okubhalwe kucatshangwa umthetho waseShayina.
pros:
  - Umbhalo osemthethweni wezilimi ezimbili
  - Imvume ye-patent
  - Igunyazwe yi-OSI
cons:
  - Ayaziwa kangako ngaphandle kweShayina
  - Amacala okubhekiselwa kuwo ambalwa
