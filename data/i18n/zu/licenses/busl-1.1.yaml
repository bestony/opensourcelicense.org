summary: "I-source-available: ukusetshenziswa kokukhiqiza kukhawulelwe
  yi-Additional Use Grant, futhi inguqulo ngayinye iba yilayisense evulekile
  ngemuva kwe-Change Date (iminyaka engeqile ku-4)."
analogy: "Ifasitela lesitolo: ungabuka futhi uzame, futhi ngemuva kweminyaka
  embalwa into iba mahhala kuwo wonke umuntu."
pros:
  - Ikuvumela ukulawula ukusetshenziswa kwezohwebo
  - Ikhodi iba yi-open source kamuva
cons:
  - Akuyona i-open source
  - Imigomo ye-Grant iyahlukahluka ngephrojekthi
  - Ingadala ama-fork
