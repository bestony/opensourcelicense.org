summary: "I-share-alike yezizindalwazi: ungasebenzisa idatha kwezohwebo, kodwa
  izizindalwazi eziphuma kuyo ezishicilelwa emphakathini kufanele zihlale
  ngaphansi kwe-ODbL. Imisebenzi ekhiqiziwe efana namamephu noma izithombe
  idinga ukubalula umthombo kuphela."
analogy: Yakha phezu kwemephu eyabelwanayo, futhi uma ushicilela isizindalwazi
  semephu esithuthukisiwe, yabelana ngaso ngemigomo efanayo.
pros:
  - Igcina izizindalwazi ezithuthukisiwe zivulekile
  - Ukusetshenziswa kwezohwebo kuvunyelwe
  - Kufakazelwe yi-OpenStreetMap
cons:
  - Umbandela we-share-alike ungavimba ukuxuba nenye idatha
  - '"Isizindalwazi esiphuma kuyo" kwesinye isikhathi asicaci'
