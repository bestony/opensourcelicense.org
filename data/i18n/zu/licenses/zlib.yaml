summary: "Ilayisense evumela kakhulu: ikhodi yomthombo eguquliwe kufanele
  iphawulwe njengeguquliwe, imvelaphi akumele ichazwe ngokungeyikho, futhi
  isaziso sihlala kumakhophi omthombo."
analogy: Boleka iresiphi, kodwa uma uyishintsha, ungathi iyona yokuqala.
pros:
  - Ivumela kakhulu futhi imfushane
  - Idumile emidlalweni nakumalayibhulali endabuko (native)
cons:
  - Ayikho imvume ye-patent
  - Ama-fork avaliwe ayavunyelwa
