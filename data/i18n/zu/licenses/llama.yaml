summary: "Ilayisense yemodeli ekhethekile: ukusetshenziswa kwezohwebo
  kuvunyelwe, ne-Acceptable Use Policy, imithetho yokubalula nokuqamba amagama,
  nelayisense ehlukile ngaphezu kwabasebenzisi abayizigidi ezingu-700
  ngenyanga."
analogy: Injini yamahhala enencwadi yemithetho, nenkontileka ekhethekile
  yabakhiqizi bezimoto abakhulu kakhulu.
pros:
  - Ukusetshenziswa kwezohwebo kuvunyelwe kubasebenzisi abaningi
  - I-ecosystem enkulu
cons:
  - Akuyona i-open source ngokwe-OSI
  - Izibopho zenqubomgomo yokusetshenziswa nokuqamba amagama
  - Imigomo iyashintsha phakathi kwezinguqulo
