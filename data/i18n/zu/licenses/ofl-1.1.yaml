summary: "Ilayisense yamafonti ekhululekile: sebenzisa, shumeka futhi uguqule
  amafonti ngokukhululeka, kodwa amafonti aguqulwe kufanele ayeke amagama
  agodliwe, futhi amafonti awanakuthengiswa odwa."
analogy: Sebenzisa uhlobo lwamagama yonke indawo, kodwa ungathengisi ifayela
  lefonti lilodwa.
pros:
  - Ivumela ukushumeka emibhalweni nasezinhlelweni
  - Iyindinganiso yamafonti avulekile
cons:
  - Amagama amafonti agodliwe enza ama-fork abe nzima
  - Eyamafonti kuphela
