summary: "I-copyleft yezinga lelayibhulali: izinguquko zelayibhulali zihlala
  zivulekile; izinhlelo ezivaliwe zingaxhumana nayo uma abasebenzisi
  bengayishintsha ilayibhulali."
analogy: "Injini eyabelwanayo: ungayifaka emotweni yakho, kodwa abanikazi
  kufanele bakwazi ukuyishintsha ngeyabo."
pros:
  - Ivumela izinhlelo zobunikazi ukusebenzisa ilayibhulali
  - Izinguquko zelayibhulali zihlala zivulekile
  - Imvume ye-patent
cons:
  - Imithetho yokuxhuma kabusha iyinkimbinkimbi, ikakhulukazi ekuxhumeni okumile
    (static) nakumaselula
  - Ezinye izinkampani zisayigwema
