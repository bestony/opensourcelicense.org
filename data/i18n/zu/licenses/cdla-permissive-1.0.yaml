summary: "Ilayisense yedatha evumela kakhulu evela ku-Linux Foundation:
  sebenzisa futhi wabelane ngedatha ngokukhululeka; imiphumela efana namamodeli
  aqeqeshiwe ayikhawulelwe."
analogy: Sebenzisa iqoqo ledatha kunoma yini; faka isivumelwano lapho udlulisela
  idatha kwabanye.
pros:
  - Ikhulula ngokucacile imiphumela yokubala
  - Ibhalelwe idatha
cons:
  - Ayaziwa kangako njengamalayisense e-CC
  - Inguqulo 2.0 ilula kakhulu
