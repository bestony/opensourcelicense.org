summary: Izisindo zemodeli zocwaningo nokusetshenziswa komuntu siqu kuphela;
  noma yikuphi ukusetshenziswa kwezohwebo noma kokukhiqiza kudinga ilayisense
  yezohwebo evela ku-Mistral AI.
analogy: "Incwadi yomtapo wolwazi: yifunde futhi uyitadishe, ungayithengisi kabusha."
pros:
  - Izisindo ezivulekile zocwaningo
  - Ivumela ukuguqula ngenhloso yocwaningo
cons:
  - Akukho kusetshenziswa kwezohwebo
  - Akuyona i-open source
