summary: "Imigomo yemodeli ye-Google: ukusetshenziswa kwezohwebo kuvunyelwe,
  nenqubomgomo yokusetshenziswa okwenqatshelwe edlulela kukho konke okuphuma
  kuyo, okuhlanganisa amamodeli acwengiwe (distilled)."
analogy: Injini yamahhala enencwadi yemithetho okufanele iphathwe yinjini
  ngayinye eyakhiwe kabusha.
pros:
  - Ukusetshenziswa kwezohwebo ngaphandle komkhawulo wabasebenzisi
  - Imithetho ecacile yokuphuma kuyo
cons:
  - Akuyona i-open source ngokwe-OSI
  - I-Google ingabuyekeza inqubomgomo yokusetshenziswa
