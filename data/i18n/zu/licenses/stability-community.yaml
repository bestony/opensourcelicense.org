summary: Mahhala ocwaningweni, ekusetshenzisweni okungekona kwezohwebo,
  nasekusetshenzisweni kwezohwebo ngaphansi kwemali engenayo engu-USD 1M
  ngonyaka; izinkampani ezinkulu zidinga ilayisense yebhizinisi elikhulu.
analogy: Ukungena mahhala kwamabhizinisi amancane; amakhulu athenga ithikithi.
pros:
  - Mahhala kubantu ngabanye nezinkampani ezincane
  - Ihlanganisa amamodeli akamuva e-Stability
cons:
  - Akuyona i-open source
  - Umkhawulo wemali engenayo udinga ukulandelelwa
