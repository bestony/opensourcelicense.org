summary: "Okokuqukethwe, idatha nemibhalo: noma yikuphi ukusetshenziswa,
  okuhlanganisa ezohwebo, ngokubalula umthombo nokukhombisa izinguquko."
analogy: Yabelana ngesithombe noma kuphi, vele ubalule umthwebuli.
pros:
  - Umthetho olula wokubalula umthombo
  - Ilungele idatha nemibhalo
  - Kunezinguqulo ezihunyushwe ngokusemthethweni
cons:
  - Ayenzelwe isofthiwe
  - Ayikho imvume ye-patent
