summary: "I-copyleft yezinga lefayela: izinguquko zamafayela anelayisense ye-MPL
  kufanele zihlale zivulekile, kodwa angahlanganiswa nekhodi evaliwe kwamanye
  amafayela."
analogy: Boleka isahluko futhi kufanele wabelane ngezinguquko zakho kuleso
  sahluko, kodwa incwadi yakho esele ingeyakho.
pros:
  - Ilinganisela phakathi kwevumela kakhulu ne-copyleft
  - Imvume ye-patent ecacile
  - Iyahambisana ne-GPL ngokuzenzakalelayo
cons:
  - Imingcele yamafayela ingase ingacaci
  - Ayihlanganisi ukusetshenziswa ngenethiwekhi
