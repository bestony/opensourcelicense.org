summary: "I-copyleft yelayibhulali: izinguquko zelayibhulali zihlala zivulekile;
  izinhlelo ezivaliwe zingaxhumana nayo uma abasebenzisi bengaxhuma kabusha
  nelayibhulali eguquliwe."
analogy: Uhlelo oludala lwenjini eyabelwanayo engashintshwa.
pros:
  - Ivumela izinhlelo zobunikazi ukusebenzisa ilayibhulali
  - Ivamile kumalayibhulali e-desktop nawe-multimedia
cons:
  - Imithetho yokuxhuma kabusha iyinkimbinkimbi
  - Ayikho imvume ye-patent ecacile
