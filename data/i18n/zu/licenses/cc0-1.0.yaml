summary: "Ukunikela emphakathini (public domain) ngedatha nokuqukethwe,
  nelayisense yokubuyela kuyo: ayikho imibandela, ngisho nokubalula umthombo."
analogy: Beka isithombe odongeni lomphakathi; noma ubani angasithatha.
pros:
