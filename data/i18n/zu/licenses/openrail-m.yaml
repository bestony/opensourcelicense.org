summary: "I-Responsible AI License yamamodeli: imigomo evumela kakhulu kanye
  nemikhawulo esekelwe ekusetshenzisweni okufanele idluliselwe yiyo yonke into
  ephuma kuyo."
analogy: Ithuluzi lamahhala elinohlu lokusetshenziswa okwenqatshelwe oluhamba
  nekhophi ngayinye.
pros:
  - Ivumela ukusetshenziswa kwezohwebo
  - Igcina imikhawulo yokusetshenziswa okuyingozi iqhubekela phambili
cons:
  - Akuyona i-open source ngokwe-OSI
  - Imikhawulo inzima ukuyiphoqelela
  - Kunezinhlobo eziningana
