summary: Ukusetshenziswa kwezohwebo kuvunyelwe ngenqubomgomo yokusetshenziswa
  okwamukelekayo; amasevisi amakhulu kakhulu adinga ilayisense ehlukile, futhi
  ezinye izindawo azifakiwe.
analogy: Injini yamahhala enencwadi yemithetho, umkhawulo wobukhulu, nemephu
  yalapho ingashayelwa khona.
pros:
  - Ukusetshenziswa kwezohwebo kubasebenzisi abaningi
  - Ihlanganisa amamodeli ombhalo, evidiyo ne-3D
cons:
  - Akuyona i-open source
  - Izindawo ezingafakiwe
