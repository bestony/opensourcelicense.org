summary: I-copyleft yezinga lefayela ephuma ku-MPL, enemvume ye-patent;
  ayihambisani ne-GPL.
analogy: Yabelana ngezinguquko zefayela oliboleke; okunye ungakuvala uma uthanda.
pros:
  - Ububanzi bezinga lefayela
  - Imvume ye-patent
cons:
  - Ayihambisani ne-GPL (inkinga ye-ZFS ku-Linux)
  - Mbalwa amaphrojekthi amasha ayamukelayo
