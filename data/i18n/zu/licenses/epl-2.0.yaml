summary: I-copyleft ebuthakathaka ezingeni lemojula enemvume ye-patent; ingabala
  i-GPL njengelayisense yesibili ukuze kuhambisane.
analogy: Yabelana ngezinguquko zakho esahlukweni esibolekiwe; incwadi esele ingeyakho.
pros:
  - I-copyleft enobungane nebhizinisi
  - Imvume ye-patent
cons:
  - Ukuhambisana ne-GPL kukhona kuphela uma kumenyezelwe ilayisense yesibili
  - Imingcele yamamojula ingase ingacaci
