summary: "I-GPL-3.0 kanye nesigatshana senethiwekhi: abasebenzisi abasebenzisa
  inguqulo eguquliwe ngenethiwekhi kufanele banikezwe ikhodi yayo yomthombo."
analogy: "Umthetho weresiphi usebenza nasezindaweni zokudlela: ukuphakela isidlo
  kubalwa njengokusinikeza abanye."
pros:
  - Ivala imbobo ye-SaaS
  - Isisekelo esihle samalayisense amabili (dual licensing)
  - I-open source egunyazwe yi-OSI
cons:
  - Izinkampani eziningi ziyenqabela ngokuphelele
  - Ukubamba inguqulo engaguqulwanga kusavunyelwe
