summary: Giấy phép mô hình của TII dựa trên Apache-2.0, kèm chính sách sử dụng
  được chấp nhận; cho phép sử dụng thương mại không mất phí bản quyền.
analogy: Bộ công cụ của Apache kèm một danh sách ngắn các mục đích bị cấm.
pros:
  - Sử dụng thương mại không mất phí bản quyền
  - Dựa trên Apache-2.0
cons:
  - Không phải mã nguồn mở theo OSI
  - Chính sách sử dụng có thể được cập nhật
