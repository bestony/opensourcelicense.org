summary: "Hiến tặng vào phạm vi công cộng cho dữ liệu và nội dung, kèm giấy phép
  dự phòng: không có điều kiện nào, kể cả ghi công."
analogy: Dán bức ảnh lên bức tường công cộng; ai cũng có thể lấy.
pros:
  - Không có điều kiện
  - Lý tưởng cho dữ liệu mở
cons:
  - Không đảm bảo được ghi công
  - Không cấp quyền sáng chế
