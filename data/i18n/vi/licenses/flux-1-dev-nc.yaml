summary: Trọng số mô hình chỉ cho mục đích phi thương mại; dùng trọng số cho mục
  đích thương mại cần giấy phép riêng từ Black Forest Labs.
analogy: Mượn máy ảnh cho dự án cá nhân, không phải cho buổi chụp có thù lao.
pros:
  - Trọng số mở cho nghiên cứu và sở thích
  - Con đường thương mại rõ ràng
cons:
  - Không phải mã nguồn mở
  - Sử dụng thương mại cần giấy phép trả phí
