summary: "Responsible AI License cho mô hình: điều khoản dễ dãi cộng thêm các
  hạn chế dựa trên mục đích sử dụng mà mọi sản phẩm phái sinh phải chuyển tiếp."
analogy: Một công cụ miễn phí kèm danh sách các mục đích bị cấm đi theo mọi bản sao.
pros:
  - Cho phép sử dụng thương mại
  - Giữ các hạn chế sử dụng gây hại ở hạ nguồn
cons:
  - Không phải mã nguồn mở theo OSI
  - Các hạn chế khó thực thi
  - Có nhiều biến thể
