summary: Giống MIT, cộng thêm điều khoản cấm dùng tên của bạn để bảo chứng cho
  sản phẩm phái sinh.
analogy: 'Một cuốn sách miễn phí kèm ghi chú: "Đừng nói rằng tác giả giới thiệu
  ấn bản của bạn."'
pros:
