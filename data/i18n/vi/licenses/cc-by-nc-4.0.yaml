summary: "Dành cho nội dung và dữ liệu: bắt buộc ghi công và không được sử dụng
  thương mại."
analogy: Tự do chia sẻ bức ảnh, nhưng không dùng trong quảng cáo hay sản phẩm bạn bán.
pros:
  - Ngăn tái sử dụng thương mại
  - Có bản dịch chính thức
cons:
  - Không được coi là mở theo OSI hay Open Definition
  - Khái niệm "phi thương mại" thường không rõ ràng
  - Chặn nhiều mục đích sử dụng chính đáng
