summary: "Copyleft cho nội dung: được dùng cho mọi mục đích nếu ghi công, và bản
  chuyển thể phải được chia sẻ theo cùng giấy phép."
analogy: Tự do phối lại bức ảnh, nhưng hãy chia sẻ bản phối theo cùng điều khoản.
pros:
  - Giữ các bản chuyển thể luôn mở
  - Được Wikipedia sử dụng
cons:
  - Share-alike có thể cản trở việc kết hợp
  - Không được thiết kế cho phần mềm
