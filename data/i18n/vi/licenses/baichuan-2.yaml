summary: Miễn phí sử dụng thương mại cho dịch vụ dưới một triệu người dùng hoạt
  động hằng ngày, sau khi đăng ký; dịch vụ lớn hơn cần giấy phép riêng.
analogy: Động cơ miễn phí cho đội xe nhỏ sau khi bạn đăng ký xe.
pros:
  - Miễn phí cho hầu hết người dùng thương mại
  - Mô hình tiếng Trung mạnh
cons:
  - Không phải mã nguồn mở
  - Phải đăng ký và có ngưỡng số người dùng
