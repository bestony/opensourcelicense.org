analogy: Chia sẻ thay đổi trên tệp đã mượn; phần còn lại có thể giữ đóng nếu bạn muốn.
pros:
  - Phạm vi cấp tệp
  - Cấp quyền sáng chế
cons:
  - Không tương thích với GPL (vấn đề ZFS-on-Linux)
  - Ít dự án mới áp dụng
