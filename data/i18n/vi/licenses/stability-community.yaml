summary: Miễn phí cho nghiên cứu, sử dụng phi thương mại và sử dụng thương mại
  với doanh thu hằng năm dưới 1 triệu USD; công ty lớn hơn cần giấy phép doanh
  nghiệp.
analogy: Vào cửa miễn phí cho doanh nghiệp nhỏ; doanh nghiệp lớn mua vé.
pros:
  - Miễn phí cho cá nhân và công ty nhỏ
  - Bao gồm các mô hình Stability gần đây
cons:
  - Không phải mã nguồn mở
  - Cần theo dõi ngưỡng doanh thu
