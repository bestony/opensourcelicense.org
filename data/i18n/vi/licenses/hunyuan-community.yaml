summary: Cho phép sử dụng thương mại kèm chính sách sử dụng được chấp nhận; dịch
  vụ rất lớn cần giấy phép riêng, và một số vùng lãnh thổ bị loại trừ.
analogy: Một động cơ miễn phí kèm cuốn quy tắc, giới hạn kích thước và bản đồ
  những nơi được phép chạy.
pros:
  - Hầu hết người dùng được dùng thương mại
  - Bao gồm mô hình văn bản, video và 3D
cons:
  - Không phải mã nguồn mở
  - Loại trừ một số vùng lãnh thổ
