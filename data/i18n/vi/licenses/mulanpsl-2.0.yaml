summary: Giấy phép dễ dãi của Trung Quốc có cấp quyền sáng chế và điều khoản trả
  đũa. Bản tiếng Trung và tiếng Anh có giá trị như nhau; bản tiếng Trung được ưu
  tiên khi có mâu thuẫn.
analogy: Cơ chế bảo vệ kiểu Apache được viết có tính đến pháp luật Trung Quốc.
pros:
  - Văn bản chính thức song ngữ
  - Cấp quyền sáng chế
  - Được OSI phê duyệt
cons:
  - Ít được biết đến ngoài Trung Quốc
  - Ít án lệ
