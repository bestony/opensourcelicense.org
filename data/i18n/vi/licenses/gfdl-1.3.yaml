  sections)."
analogy: Quy tắc chia sẻ công thức áp dụng cho sách hướng dẫn của cuốn sách nấu ăn.
pros:
  - Giữ tài liệu luôn tự do
  - Được các sách hướng dẫn GNU sử dụng
cons:
  - Các phần bất biến gây tranh cãi
  - Khó kết hợp với nội dung CC
