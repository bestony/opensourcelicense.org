sourceHash: f723aee8de4d57cd
summary: Hiến tặng tác phẩm vào phạm vi công cộng khi có thể, với giấy phép dễ
  dãi dự phòng. Không yêu cầu ghi công.
analogy: "Để một cuốn sách trên ghế công viên, không ghi tên bên trong: ai cũng
  có thể lấy."
pros:
  - Hoàn toàn không có điều kiện
  - Dễ kết hợp với bất cứ thứ gì
cons:
  - Không phải quốc gia nào cũng công nhận việc hiến tặng vào phạm vi công cộng
  - Một số công ty tránh dùng vì rủi ro pháp lý không rõ ràng
