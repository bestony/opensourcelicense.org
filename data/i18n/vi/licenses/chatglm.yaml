summary: Trọng số miễn phí cho nghiên cứu học thuật; sử dụng thương mại miễn phí
  sau khi đăng ký, tuân theo các hạn chế sử dụng.
analogy: Miễn phí để học; đăng ký trước khi dùng cho kinh doanh.
pros:
  - Được dùng thương mại sau khi đăng ký
  - Các mô hình tiếng Trung được dùng rộng rãi
cons:
  - Không phải mã nguồn mở
  - Có bước đăng ký
