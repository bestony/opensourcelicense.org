summary: Dedică lucrarea domeniului public acolo unde este posibil, cu o licență
  permisivă de rezervă. Nu este necesară atribuirea.
analogy: "Ca și cum ai lăsa o carte pe o bancă în parc, fără niciun nume
  înăuntru: oricine o poate lua."
pros:
  - Absolut nicio condiție
  - Ușor de combinat cu orice
cons:
  - Dedicarea în domeniul public nu este recunoscută în toate țările
  - Unele companii o evită din cauza incertitudinii juridice
