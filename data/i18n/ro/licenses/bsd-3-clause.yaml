summary: Ca MIT, plus o clauză care interzice folosirea numelui tău pentru a
  promova produsele derivate.
analogy: "O carte gratuită cu o notă: „Nu pretinde că autorul îți recomandă ediția.”"
pros:
  - Permisivă și bine cunoscută
  - Îți protejează numele de folosirea ca garanție
cons:
