summary: Poți face aproape orice cu codul. Păstrează nota de copyright și de
  licență. Fără garanție.
analogy: "Ca și cum ai lăsa o carte gratuită într-o cafenea: ia-o, copiaz-o,
  vinde-o, doar păstrează numele autorului pe copertă."
pros:
  - Scurtă și larg înțeleasă
  - Cea mai ușor de adoptat licență pentru companii
  - Compatibilă cu aproape orice altă licență
cons:
  - Fără licență de brevet
  - Oricine poate construi un concurent închis sau găzduit
