summary: "O licență de model personalizată: utilizarea comercială este permisă,
  cu o Acceptable Use Policy, reguli de atribuire și de denumire și o licență
  separată peste 700M de utilizatori activi lunar."
analogy: Un motor de folosit gratuit, cu un regulament și un contract special
  pentru cei mai mari producători auto.
pros:
  - Utilizare comercială permisă pentru majoritatea utilizatorilor
  - Ecosistem mare
cons:
  - Nu este open source conform OSI
  - Obligații privind politica de utilizare și denumirea
  - Termenii se schimbă de la o versiune la alta
