summary: "Lisensi source-available dari Redis: bebas dipakai dan dimodifikasi,
  tetapi tidak boleh ditawarkan sebagai layanan terkelola atau dipakai untuk
  mengakali kunci lisensi."
analogy: Memasak dengannya di mana saja boleh, tetapi jangan buka toko yang
  menjual hidangan ini.
pros:
  - Hanya menyasar pesaing layanan terkelola
  - Singkat
cons:
  - Bukan open source
  - Memicu lahirnya fork Valkey
