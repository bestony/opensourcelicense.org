summary: "Copyleft untuk konten: penggunaan apa pun dengan atribusi, dan
  adaptasi harus dibagikan dengan lisensi yang sama."
analogy: Olah fotonya dengan bebas, tetapi bagikan hasil olahan Anda dengan
