summary: "Lisensi model khusus: penggunaan komersial diizinkan, dengan
  Acceptable Use Policy, aturan atribusi dan penamaan, serta lisensi terpisah di
  atas 700 juta pengguna aktif bulanan."
analogy: Mesin yang bebas dipakai dengan buku aturan, dan kontrak khusus bagi
  produsen mobil terbesar.
pros:
