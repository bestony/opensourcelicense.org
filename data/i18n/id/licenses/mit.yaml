summary: Lakukan hampir apa saja dengan kodenya. Pertahankan pemberitahuan hak
  cipta dan lisensi. Tanpa jaminan.
analogy: "Seperti meninggalkan buku gratis di kafe: ambil, salin, jual, asalkan
  nama penulis di sampul tetap ada."
pros:
  - Singkat dan dipahami secara luas
  - Lisensi paling mudah diadopsi perusahaan
  - Kompatibel dengan hampir semua lisensi lain
cons:
  - Tidak ada pemberian hak paten
  - Siapa pun dapat membuat pesaing sumber tertutup atau berbasis hosting
