summary: Melepaskan karya ke domain publik sejauh dimungkinkan, dengan lisensi
  permisif sebagai cadangan. Tidak perlu atribusi.
analogy: "Meninggalkan buku di bangku taman tanpa nama di dalamnya: siapa pun
  boleh mengambilnya."
pros:
  - Tanpa syarat apa pun
  - Mudah digabungkan dengan apa saja
cons:
  - Pelepasan ke domain publik tidak diakui di semua negara
  - Sebagian perusahaan menghindarinya karena ketidakpastian hukum
