summary: Lakukan hampir apa sahaja dengan kod. Kekalkan notis hak cipta dan
  lesen. Tiada waranti.
analogy: "Seperti meninggalkan buku percuma di kafe: ambil, salin, jual, asalkan
  nama pengarang pada kulit dikekalkan."
pros:
  - Ringkas dan difahami secara meluas
  - Lesen paling mudah diterima pakai oleh syarikat
  - Serasi dengan hampir semua lesen lain
cons:
  - Tiada pemberian hak paten
  - Sesiapa boleh membina pesaing sumber tertutup atau berasaskan pengehosan
