summary: "Copyleft peringkat fail oleh Apple: fail terlindung yang diubah suai
  mesti diterbitkan, termasuk apabila digunakan secara luaran sebagai
  perkhidmatan. Tidak serasi dengan GPL."
analogy: Kongsi perubahan pada fail yang dipinjam, walaupun anda hanya
  menghidangkan hasilnya.
pros:
  - Merangkumi penggunaan luaran
  - Pemberian hak paten
cons:
  - Tidak serasi dengan GPL
  - Kebanyakannya terhad kepada sumber terbuka Apple
