summary: "Kod sumber tersedia: bebas digunakan dan diubah suai, tetapi anda
  tidak boleh menawarkannya sebagai perkhidmatan terurus atau memintas kunci
  lesen."
analogy: Masaklah dengannya di rumah atau di restoran anda, tetapi jangan buka
  kedai yang menjual hidangan yang sama persis.
pros:
  - Ringkas dan jelas
  - Hanya menyasarkan pesaing perkhidmatan terurus
cons:
  - Bukan sumber terbuka
  - Mengehadkan fork dan sesetengah rakan kongsi
