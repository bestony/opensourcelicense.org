summary: Lesen permisif dengan pemberian hak paten secara nyata, tindakan balas
  paten dan keperluan menandakan fail yang diubah.
analogy: Kotak alat percuma yang turut disertakan janji untuk tidak menyaman
  anda atas patennya — melainkan anda menyaman dahulu.
pros:
  - Pemberian hak paten secara nyata daripada setiap penyumbang
  - Menjadi pilihan banyak syarikat dan yayasan
  - Melindungi cap dagangan
