summary: "Copyleft untuk kandungan: sebarang penggunaan dengan atribusi, dan
  adaptasi mesti dikongsi di bawah lesen yang sama."
analogy: Olah semula foto itu dengan bebas, tetapi kongsi hasil olahan anda
  dengan terma yang sama.
pros:
  - Memastikan adaptasi kekal terbuka
  - Digunakan oleh Wikipedia
cons:
  - Share-alike boleh menghalang penggabungan
  - Tidak direka untuk perisian
