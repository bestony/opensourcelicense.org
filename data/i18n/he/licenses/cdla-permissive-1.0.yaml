summary: "רישיון נתונים מתירני של Linux Foundation: השתמשו בנתונים ושתפו אותם
  בחופשיות; תוצאות כגון מודלים מאומנים אינן מוגבלות."
analogy: השתמשו במערך הנתונים לכל דבר; צרפו את ההסכם כשאתם מעבירים את הנתונים הלאה.
pros:
