analogy: "חלון ראווה: אפשר להסתכל ולנסות, ואחרי כמה שנים הפריט הופך לחינמי לכולם."
pros:
  - מאפשר לכם לשלוט בשימוש המסחרי
  - הקוד הופך לקוד פתוח בהמשך
cons:
  - אינו קוד פתוח
  - תנאי ההענקה שונים מפרויקט לפרויקט
  - עלול לגרום לפיצולים
