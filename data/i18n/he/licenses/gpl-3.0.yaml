summary: "Copyleft חזק: אם אתם מפיצים את התוכנה או יצירות נגזרות, עליכם לשחרר את
  קוד המקור המלא תחת GPL-3.0."
analogy: "מתכון שאומר: מי שמגיש מנה המבוססת עליו חייב למסור גם את המתכון המלא."
pros:
  - שומר על כל היצירות הנגזרות המופצות פתוחות
  - הענקת פטנט והגנה מפני tivoization
  - מסורת קהילתית חזקה
cons:
  - חברות רבות נמנעות ממנו
  - אינו מכסה SaaS (אין הפצה)
  - אינו תואם ל-GPL-2.0-only
