summary: GPL-2.0 לספרייה עצמה, בתוספת חריג שמאפשר לתוכניות עצמאיות להתקשר אליה
  תחת כל רישיון.
analogy: מנוע משותף תחת כלל שיתוף המתכון, אבל המכונית שלכם נשארת שלכם.
pros:
  - יישומים שמקושרים אליה יכולים להיות סגורים
  - בשימוש ב-OpenJDK
cons:
  - שינויים בספרייה נשארים GPL
  - אינו תואם לפרויקטים תחת GPL-3.0-only
