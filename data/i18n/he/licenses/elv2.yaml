summary: "קוד מקור זמין: חינם לשימוש ולשינוי, אך אסור להציע אותו כשירות מנוהל או
  לעקוף מפתחות רישיון."
analogy: בשלו איתו בבית או במסעדה שלכם, אבל אל תפתחו חנות שמוכרת בדיוק את המנה הזאת.
pros:
  - קצר וברור
  - מכוון רק למתחרים שמציעים שירות מנוהל
cons:
  - אינו קוד פתוח
  - מגביל פיצולים וחלק מהשותפים
