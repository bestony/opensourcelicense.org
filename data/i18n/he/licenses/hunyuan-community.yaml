summary: שימוש מסחרי מותר עם מדיניות שימוש מקובל; שירותים גדולים מאוד זקוקים
  לרישיון נפרד, וחלק מהטריטוריות מוחרגות.
analogy: מנוע חינמי עם ספר חוקים, מגבלת גודל ומפה של המקומות שבהם מותר לנהוג בו.
pros:
  - שימוש מסחרי לרוב המשתמשים
  - מכסה מודלי טקסט, וידאו ותלת-ממד
cons:
  - אינו קוד פתוח
  - החרגות טריטוריאליות
