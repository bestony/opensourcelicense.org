summary: כמו MIT, בתוספת סעיף שאוסר להשתמש בשמכם כדי להמליץ על מוצרים נגזרים.
analogy: "ספר חינמי עם הערה: “אל תטענו שהמחבר ממליץ על המהדורה שלכם.”"
pros:
  - מתירני ומוכר היטב
  - מגן על שמכם מפני שימוש לצורכי המלצה
cons:
  - אין הענקת פטנט
  - פיצולים בקוד סגור מותרים
