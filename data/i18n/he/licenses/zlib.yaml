summary: "רישיון מתירני: יש לסמן קוד מקור ששונה כמשונה, אסור להציג את מקורו
  באופן כוזב, וההודעה נשארת בעותקי המקור."
analogy: שאלו את המתכון, אבל אם שיניתם אותו, אל תטענו שזה המקור.
pros:
  - מתירני וקצר
  - פופולרי במשחקים ובספריות נייטיב
cons:
  - אין הענקת פטנט
  - פיצולים סגורים מותרים
