sourceHash: 33f06e1e52928136
summary: עשו עם הקוד כמעט כל דבר. שמרו על הודעת זכויות היוצרים והרישיון. ללא אחריות.
analogy: "כמו להשאיר ספר חינמי בבית קפה: קחו אותו, העתיקו אותו, מכרו אותו, רק
  השאירו את שם המחבר על הכריכה."
pros:
  - קצר ומובן לכול
  - הרישיון הקל ביותר לאימוץ בחברות
  - תואם כמעט לכל רישיון אחר
cons:
  - אין הענקת פטנט
  - כל אחד יכול לבנות מתחרה בקוד סגור או כשירות מתארח
