summary: "Copyleft חזק: יצירות נגזרות מופצות חייבות להשתחרר במלואן תחת GPL-2.0.
  אין הענקת פטנט מפורשת; אינו תואם ל-GPL-3.0 אלא אם נעשה שימוש ב-“or later”."
analogy: כלל שיתוף המתכון, במהדורתו הישנה.
pros:
  - שומר על יצירות נגזרות מופצות פתוחות
  - בשימוש בליבת Linux
cons:
  - אינו תואם ל-Apache-2.0 ול-GPL-3.0 (בגרסה היחידה)
  - אין הענקת פטנט מפורשת
