summary: Copyleft חלש ברמת המודול עם הענקת פטנט; ניתן לציין את GPL כרישיון משני
  לצורך תאימות.
analogy: שתפו את השינויים בפרק השאול; שאר הספר שלכם.
pros:
  - Copyleft ידידותי לעסקים
  - הענקת פטנט
cons:
  - תאימות ל-GPL רק עם רישיון משני מוצהר
  - גבולות המודולים עלולים להיות לא ברורים
