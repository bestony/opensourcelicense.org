summary: "רישיון מודל ייעודי: שימוש מסחרי מותר, עם מדיניות שימוש מקובל, כללי
  ייחוס ושמות, ורישיון נפרד מעל 700 מיליון משתמשים פעילים בחודש."
analogy: מנוע חינמי לשימוש עם ספר חוקים, וחוזה מיוחד ליצרניות הרכב הגדולות ביותר.
pros:
  - שימוש מסחרי מותר לרוב המשתמשים
  - מערכת אקולוגית גדולה
cons:
  - אינו קוד פתוח לפי OSI
  - חובות הנוגעות למדיניות שימוש ולשמות
  - התנאים משתנים בין גרסאות
