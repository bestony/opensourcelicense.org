sourceHash: cdef0d42cb1ab51e
summary: "Copyleft ברמת הספרייה: שינויים בספרייה נשארים פתוחים; יישומים סגורים
  רשאיים להתקשר אליה אם המשתמשים יכולים להחליף את הספרייה."
analogy: "מנוע משותף: אפשר להכניס אותו למכונית שלכם, אבל הבעלים חייבים להיות
  מסוגלים להחליף אותו במנוע משלהם."
pros:
  - מאפשר ליישומים קנייניים להשתמש בספרייה
  - שינויים בספרייה נשארים פתוחים
  - הענקת פטנט
cons:
  - כללי הקישור מחדש מורכבים, במיוחד בקישור סטטי ובמובייל
  - חלק מהחברות עדיין נמנעות ממנו
