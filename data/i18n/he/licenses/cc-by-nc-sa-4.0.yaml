summary: "לתוכן: ייחוס, ללא שימוש מסחרי, ועיבודים תחת אותו רישיון."
analogy: שתפו ועבדו את סיכומי ההרצאה, אף פעם לא למטרות רווח, תמיד באותם תנאים.
pros:
