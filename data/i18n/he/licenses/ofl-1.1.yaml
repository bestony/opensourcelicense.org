summary: "רישיון גופנים חופשי: מותר להשתמש בגופנים, להטמיע ולשנות אותם בחופשיות,
  אך גופנים ששונו חייבים לוותר על השמות השמורים, ואסור למכור את הגופנים
  כשלעצמם."
analogy: השתמשו בגופן בכל מקום, אבל אל תמכרו את קובץ הגופן לבדו.
pros:
  - מתיר הטמעה במסמכים וביישומים
  - סטנדרט לגופנים פתוחים
cons:
  - שמות גופנים שמורים מסבכים פיצולים
  - לגופנים בלבד
