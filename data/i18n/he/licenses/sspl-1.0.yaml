summary: דומה ל-AGPL, אך הצעת התוכנה כשירות מחייבת לפרסם את קוד המקור של כל
  מחסנית השירות. לא אושר על ידי OSI.
analogy: אם אתם מפעילים מסעדה עם המנה הזאת, עליכם לפרסם גם את התוכניות של המטבח שלכם.
pros:
  - הגנה חזקה מפני ספקי ענן
cons:
  - אינו קוד פתוח לפי OSI
  - נדחה על ידי הפצות רבות
  - עלול לגרום לפיצולים קהילתיים
