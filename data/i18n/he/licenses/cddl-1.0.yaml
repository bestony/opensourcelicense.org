summary: Copyleft ברמת הקובץ שנגזר מ-MPL, עם הענקת פטנט; אינו תואם ל-GPL.
analogy: שתפו שינויים בקובץ השאול; את השאר אפשר להשאיר סגור אם תרצו.
pros:
  - היקף ברמת הקובץ
  - הענקת פטנט
cons:
  - אינו תואם ל-GPL (בעיית ZFS-on-Linux)
  - מעט פרויקטים חדשים מאמצים אותו
