summary: "לתוכן ולנתונים: נדרש ייחוס, ושימוש מסחרי אינו מותר."
analogy: שתפו את התמונה בחופשיות, אבל לא בפרסומות או במוצרים שאתם מוכרים.
pros:
  - חוסם שימוש חוזר מסחרי
  - תרגומים רשמיים
cons:
  - אינו פתוח לפי OSI או לפי Open Definition
  - “לא מסחרי” אינו ברור פעמים רבות
  - חוסם שימושים לגיטימיים רבים
