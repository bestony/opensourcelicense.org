sourceHash: f723aee8de4d57cd
summary: מקדיש את היצירה לנחלת הכלל היכן שהדבר אפשרי, עם רישיון גיבוי מתירני.
  אין צורך בייחוס.
analogy: "כמו להשאיר ספר על ספסל בפארק בלי שם בפנים: כל אחד רשאי לקחת אותו."
pros:
  - ללא תנאים כלל
  - קל לשלב עם כל דבר
cons:
  - הקדשה לנחלת הכלל אינה מוכרת בכל מדינה
  - חלק מהחברות נמנעות ממנו בשל אי-ודאות משפטית
