summary: "שיתוף זהה למסדי נתונים: מותר להשתמש בנתונים מסחרית, אך מסדי נתונים
  נגזרים ציבוריים חייבים להישאר תחת ODbL. יצירות שהופקו, כמו מפות או תמונות,
  דורשות ייחוס בלבד."
analogy: בנו על המפה המשותפת, ואם אתם מפרסמים מסד נתונים משופר של מפות, שתפו
  אותו בחזרה באותם תנאים.
pros:
  - שומר על מסדי נתונים משופרים פתוחים
  - שימוש מסחרי מותר
  - הוכח ב-OpenStreetMap
cons:
  - שיתוף זהה עלול למנוע שילוב עם נתונים אחרים
  - “מסד נתונים נגזר” אינו ברור לפעמים
