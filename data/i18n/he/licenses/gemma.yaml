summary: "תנאי המודל של Google: שימוש מסחרי מותר, עם מדיניות שימושים אסורים
  שעוברת לכל יצירה נגזרת, כולל מודלים מזוקקים."
analogy: מנוע חינמי עם ספר חוקים שכל מנוע שנבנה מחדש חייב לשאת.
pros:
  - שימוש מסחרי ללא סף משתמשים
  - כללים ברורים ליצירות נגזרות
cons:
  - אינו קוד פתוח לפי OSI
  - Google עשויה לעדכן את מדיניות השימוש
