summary: שימוש מסחרי חינמי לשירותים עם פחות ממיליון משתמשים פעילים ביום, לאחר
  הרשמה; שירותים גדולים יותר זקוקים לרישיון נפרד.
analogy: מנוע חינמי לציים קטנים, אחרי שרושמים את הרכב.
pros:
  - חינמי לרוב המשתמשים המסחריים
  - מודלים חזקים לשפה הסינית
cons:
  - אינו קוד פתוח
  - הרשמה וסף משתמשים
