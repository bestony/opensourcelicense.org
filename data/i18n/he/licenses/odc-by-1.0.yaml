summary: "למסדי נתונים ולמערכי נתונים: כל שימוש, כולל מסחרי, בתנאי ששומרים על
  הודעת הייחוס. גם יצירות שתפיקו מהנתונים דורשות הודעה."
analogy: השתמשו בנתוני המפה בכל מקום, רק ציינו מאין הם הגיעו.
pros:
  - כלל ייחוס פשוט
  - נפוץ בקורפוסי אימון AI גדולים
  - מכסה זכויות במסדי נתונים, לא רק זכויות יוצרים
cons:
  - לא תוכנן לתוכנה
  - אין הענקת פטנט
