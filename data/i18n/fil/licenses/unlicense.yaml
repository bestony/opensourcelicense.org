summary: Inilalaan ang gawa sa public domain hangga't maaari, na may permissive
  na reserbang lisensya. Hindi kailangan ng pagkilala.
analogy: "Pag-iwan ng aklat sa bangko sa parke nang walang pangalan sa loob:
  puwede itong kunin ng kahit sino."
pros:
  - Walang anumang kondisyon
  - Madaling pagsamahin sa kahit ano
cons:
  - Hindi kinikilala sa lahat ng bansa ang paglalaan sa public domain
  - Iniiwasan ito ng ilang kompanya dahil sa legal na kawalang-katiyakan
