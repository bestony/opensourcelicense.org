summary: Lisensya ng modelo mula sa TII na batay sa Apache-2.0 at may patakaran
  sa katanggap-tanggap na paggamit; pinapayagan ang pangkomersyong paggamit nang
  walang royalty.
analogy: Ang toolkit ng Apache na may maikling listahan ng bawal na paggamit.
pros:
  - Pangkomersyong paggamit nang walang royalty
  - Batay sa Apache-2.0
cons:
  - Hindi open source ayon sa OSI
  - Puwedeng i-update ang patakaran sa paggamit
