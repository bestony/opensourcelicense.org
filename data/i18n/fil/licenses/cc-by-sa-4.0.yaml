summary: "Copyleft para sa nilalaman: anumang paggamit na may pagkilala, at
  dapat ibahagi ang mga adaptasyon sa ilalim ng parehong lisensya."
analogy: Malayang i-remix ang litrato, pero ibahagi ang remix mo sa parehong tuntunin.
pros:
  - Pinananatiling bukas ang mga adaptasyon
  - Ginagamit ng Wikipedia
cons:
  - Puwedeng hadlangan ng share-alike ang paghahalo
  - Hindi idinisenyo para sa software
