summary: Pinapayagan ang pangkomersyong paggamit na may patakaran sa
  katanggap-tanggap na paggamit; kailangan ng hiwalay na lisensya ang
  napakalalaking serbisyo, at may ilang teritoryong hindi saklaw.
analogy: Isang libreng makina na may rulebook, limitasyon sa laki, at mapa kung
  saan ito puwedeng imaneho.
pros:
