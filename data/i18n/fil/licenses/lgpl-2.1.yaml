summary: "Copyleft para sa library: nananatiling bukas ang mga pagbabago sa
  library; puwedeng mag-link dito ang mga saradong programa kung kaya ng mga
  user na muling mag-link gamit ang binagong library."
analogy: Ang mas lumang edisyon ng napapalitang pinagsasaluhang makina.
pros:
  - Nagagamit ng mga proprietary na app ang library
  - Karaniwan sa mga desktop at multimedia library
cons:
  - Masalimuot ang mga patakaran sa muling pag-link
  - Walang tahasang pagbibigay ng karapatan sa patent
