summary: "Para sa nilalaman: may pagkilala, walang pangkomersyong paggamit, at
  ang mga adaptasyon ay nasa ilalim ng parehong lisensya."
analogy: Ibahagi at i-remix ang lecture notes, hindi kailanman para kumita,
  laging sa parehong tuntunin.
pros:
  - Hinaharangan ang pangkomersyong muling paggamit
  - Karaniwan para sa mga materyales sa kurso
cons:
  - Hindi bukas ayon sa Open Definition
  - Madalas malabo ang ibig sabihin ng "hindi pangkomersyo"
