summary: "Ang dual license ng Perl: pumipili ang tumatanggap sa pagitan ng
  Artistic License 1.0 o ng GPL (bersyon 1 o mas bago)."
analogy: Piliin kung alin sa dalawang rulebook ang bagay sa iyo.
pros:
  - Pagpipilian sa pagitan ng medyo permissive at copyleft na tuntunin
  - Pamantayan para sa mga CPAN module
cons:
  - Malabo ang Artistic 1.0
  - Walang pagbibigay ng karapatan sa patent
