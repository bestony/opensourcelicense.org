summary: "Para sa nilalaman at datos: kailangan ang pagkilala at hindi
  pinapayagan ang pangkomersyong paggamit."
analogy: Malayang ibahagi ang litrato, pero hindi sa mga ad o produktong ibinebenta mo.
pros:
  - Hinaharangan ang pangkomersyong muling paggamit
  - May mga opisyal na salin
cons:
  - Hindi bukas ayon sa OSI o sa Open Definition
  - Madalas malabo ang ibig sabihin ng "hindi pangkomersyo"
  - Hinaharangan ang maraming lehitimong paggamit
