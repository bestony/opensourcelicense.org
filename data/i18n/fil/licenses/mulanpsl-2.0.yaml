summary: Isang permissive na lisensyang Tsino na may pagbibigay ng karapatan sa
  patent at ganti. Pantay ang bisa ng tekstong Tsino at Ingles; Tsino ang
  mananaig kapag nagsalungat.
analogy: Proteksyong istilong Apache na isinulat nang isinasaalang-alang ang
  batas ng Tsina.
pros:
  - Opisyal na tekstong dalawang wika
  - Pagbibigay ng karapatan sa patent
  - Aprubado ng OSI
cons:
  - Hindi gaanong kilala sa labas ng Tsina
  - Limitadong jurisprudence
