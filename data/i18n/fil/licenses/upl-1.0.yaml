summary: Isang maikling permissive na lisensya na may tahasang pagbibigay ng
  karapatan sa patent, ginagamit ng Oracle para sa GraalVM at iba pang proyekto.
analogy: Ang libreng aklat ng MIT, na may dagdag na pangako tungkol sa mga patent.
pros:
  - Maikli at permissive
  - Tahasang pagbibigay ng karapatan sa patent
cons:
  - Walang probisyon sa ganti sa patent
  - Hindi gaanong kilala kaysa sa MIT o Apache
