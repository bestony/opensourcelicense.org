summary: Libre para sa pananaliksik, hindi pangkomersyong paggamit, at
  pangkomersyong paggamit na may taunang kita na mas mababa sa USD 1M; kailangan
  ng enterprise license ang mas malalaking kompanya.
analogy: Libreng pasok para sa maliliit na negosyo; bibili ng tiket ang malalaki.
pros:
  - Libre para sa mga indibidwal at maliliit na kompanya
  - Saklaw ang mga bagong modelo ng Stability
cons:
  - Hindi open source
  - Kailangang bantayan ang hangganan ng kita
