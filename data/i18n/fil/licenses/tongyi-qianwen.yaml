summary: "Lisensya ng Alibaba para sa pinakamalalaking modelo ng Qwen:
  pinapayagan ang pangkomersyong paggamit, na may pagkilala at hiwalay na
  lisensya kapag lampas sa 100 milyong monthly active user."
analogy: Isang libreng makina, na may espesyal na kontrata para sa
  napakalalaking gumagawa ng sasakyan.
pros:
