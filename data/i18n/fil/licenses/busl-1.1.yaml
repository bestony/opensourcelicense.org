summary: "Source-available: limitado ng Additional Use Grant ang paggamit sa
  production, at bawat bersyon ay nagiging bukas na lisensya pagkatapos ng
  Change Date (hanggang 4 na taon)."
analogy: "Isang display window: puwede kang tumingin at sumubok, at pagkalipas
  ng ilang taon ay magiging libre ang item para sa lahat."
pros:
