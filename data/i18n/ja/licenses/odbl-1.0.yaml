sourceHash: 6a4054dc9cca8e7e
summary: データベースの継承型ライセンス。商用利用は可能だが、公開する派生データベースは ODbL
  のままでなければならない。地図や画像などの成果物はクレジット表示だけでよい。
analogy: 共有の地図の上に作り、改良した地図データベースを公開するなら同じ条件で共有し返す。
pros:
  - 改良されたデータベースを開かれたままにする
  - 商用利用が可能
  - OpenStreetMap で実績がある
cons:
  - 継承条件が他のデータとの組み合わせを妨げることがある
  - 「派生データベース」の範囲があいまいなことがある
