sourceHash: 6d33e2e6b797d27f
summary: "Copyleft σε επίπεδο αρχείου: οι αλλαγές σε αρχεία υπό MPL πρέπει να
  μένουν ανοιχτές, αλλά μπορούν να συνδυάζονται με κλειστό κώδικα σε άλλα
  αρχεία."
analogy: Αν δανειστείτε ένα κεφάλαιο, πρέπει να μοιραστείτε τις διορθώσεις σας
  σε αυτό, αλλά το υπόλοιπο βιβλίο είναι δικό σας.
pros:
  - Ισορροπία ανάμεσα σε επιτρεπτική και copyleft
  - Ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Συμβατή με την GPL από προεπιλογή
cons:
  - Τα όρια των αρχείων μπορεί να είναι ασαφή
  - Δεν καλύπτει τη χρήση μέσω δικτύου
