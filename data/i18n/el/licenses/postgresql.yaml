summary: Σύντομη επιτρεπτική άδεια παρόμοια με την MIT και την BSD, που
  χρησιμοποιείται από την PostgreSQL και το οικοσύστημά της.
analogy: Η δική εκδοχή της κοινότητας PostgreSQL για το δωρεάν βιβλίο.
pros:
  - Σύντομη και επιτρεπτική
  - Οικεία στο οικοσύστημα PostgreSQL
cons:
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Επιτρέπονται κλειστά fork
