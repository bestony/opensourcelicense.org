summary: Επιτρεπτική άδεια με ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας, ρήτρα
  αντιποίνων για διπλώματα και υποχρέωση σήμανσης των τροποποιημένων αρχείων.
analogy: Μια δωρεάν εργαλειοθήκη που συνοδεύεται από υπόσχεση ότι δεν θα σας
  μηνύσουν για τα διπλώματα ευρεσιτεχνίας της – εκτός αν μηνύσετε εσείς πρώτοι.
pros:
  - Ρητή παραχώρηση διπλωμάτων από κάθε συνεισφέροντα
  - Προτιμάται από πολλές εταιρείες και ιδρύματα
  - Προστατεύει τα εμπορικά σήματα
cons:
  - Μεγαλύτερη· διαχείριση αρχείου NOTICE
  - Ασύμβατη με την GPL-2.0-only
  - Δεν αποτρέπει ανταγωνιστές που τη φιλοξενούν ως υπηρεσία
