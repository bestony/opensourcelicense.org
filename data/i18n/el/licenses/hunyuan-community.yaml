summary: Επιτρέπεται η εμπορική χρήση με πολιτική αποδεκτής χρήσης· οι πολύ
  μεγάλες υπηρεσίες χρειάζονται ξεχωριστή άδεια και ορισμένες περιοχές
  εξαιρούνται.
analogy: Ένας δωρεάν κινητήρας με κανονισμό, όριο μεγέθους και χάρτη με τα μέρη
  όπου επιτρέπεται να κυκλοφορεί.
pros:
  - Εμπορική χρήση για τους περισσότερους χρήστες
  - Καλύπτει μοντέλα κειμένου, βίντεο και 3D
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Γεωγραφικές εξαιρέσεις
