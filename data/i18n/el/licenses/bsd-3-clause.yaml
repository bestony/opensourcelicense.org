summary: Όπως η MIT, συν μια ρήτρα που απαγορεύει τη χρήση του ονόματός σας για
  την προώθηση παράγωγων προϊόντων.
analogy: "Ένα δωρεάν βιβλίο με σημείωση: «Μην ισχυρίζεστε ότι ο συγγραφέας
  συνιστά την έκδοσή σας.»"
pros:
  - Επιτρεπτική και γνωστή
  - Προστατεύει το όνομά σας από χρήση ως σύσταση
cons:
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Επιτρέπονται fork κλειστού κώδικα
