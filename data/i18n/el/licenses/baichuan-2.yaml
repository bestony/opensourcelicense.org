summary: Δωρεάν εμπορική χρήση για υπηρεσίες με λιγότερους από ένα εκατομμύριο
  ημερήσιους ενεργούς χρήστες, μετά από εγγραφή· οι μεγαλύτερες υπηρεσίες
  χρειάζονται ξεχωριστή άδεια.
analogy: Δωρεάν κινητήρας για μικρούς στόλους, αφού ταξινομήσετε το αυτοκίνητο.
pros:
  - Δωρεάν για τους περισσότερους εμπορικούς χρήστες
  - Ισχυρά μοντέλα για τα κινεζικά
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Εγγραφή και όριο χρηστών
