summary: Δωρεάν για έρευνα, μη εμπορική χρήση και εμπορική χρήση με ετήσια έσοδα
  κάτω από 1 εκατ. USD· οι μεγαλύτερες εταιρείες χρειάζονται εταιρική άδεια.
analogy: Δωρεάν είσοδος για μικρές επιχειρήσεις· οι μεγάλες αγοράζουν εισιτήριο.
pros:
  - Δωρεάν για ιδιώτες και μικρές εταιρείες
  - Καλύπτει τα πρόσφατα μοντέλα Stability
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Το όριο εσόδων χρειάζεται παρακολούθηση
