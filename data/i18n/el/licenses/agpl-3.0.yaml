summary: "GPL-3.0 συν μια ρήτρα δικτύου: στους χρήστες που αλληλεπιδρούν με
  τροποποιημένη έκδοση μέσω δικτύου πρέπει να προσφέρεται ο πηγαίος κώδικάς
  της."
analogy: "Ο κανόνας της συνταγής ισχύει και για τα εστιατόρια: το σερβίρισμα του
  πιάτου μετράει ως διανομή."
pros:
  - Κλείνει το παραθυράκι του SaaS
  - Καλή βάση για διπλή αδειοδότηση
  - Ανοιχτός κώδικας εγκεκριμένος από την OSI
cons:
  - Πολλές εταιρείες την απαγορεύουν εντελώς
  - Η φιλοξενία χωρίς τροποποιήσεις εξακολουθεί να επιτρέπεται
