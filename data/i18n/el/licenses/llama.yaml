summary: "Ειδική άδεια μοντέλου: επιτρέπεται η εμπορική χρήση, με Acceptable Use
  Policy, κανόνες αναφοράς και ονοματοδοσίας, και ξεχωριστή άδεια πάνω από 700
  εκατ. μηνιαίους ενεργούς χρήστες."
analogy: Ένας κινητήρας ελεύθερος προς χρήση με κανονισμό, και ειδικό συμβόλαιο
  για τους πολύ μεγαλύτερους κατασκευαστές αυτοκινήτων.
pros:
  - Επιτρέπεται η εμπορική χρήση για τους περισσότερους χρήστες
  - Μεγάλο οικοσύστημα
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Υποχρεώσεις πολιτικής χρήσης και ονοματοδοσίας
  - Οι όροι αλλάζουν από έκδοση σε έκδοση
