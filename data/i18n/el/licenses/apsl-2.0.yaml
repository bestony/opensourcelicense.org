sourceHash: 3440c6c6f7e1c94d
summary: "Copyleft σε επίπεδο αρχείου από την Apple: τα τροποποιημένα
  καλυπτόμενα αρχεία πρέπει να δημοσιεύονται, ακόμη και όταν αναπτύσσονται
  εξωτερικά ως υπηρεσία. Ασύμβατη με την GPL."
analogy: Μοιραστείτε τις αλλαγές στο δανεικό αρχείο, ακόμη κι αν απλώς σερβίρετε
  το αποτέλεσμα.
pros:
  - Καλύπτει την εξωτερική ανάπτυξη
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας
cons:
  - Ασύμβατη με την GPL
  - Περιορίζεται κυρίως στον ανοιχτό κώδικα της Apple
