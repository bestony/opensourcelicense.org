summary: Επιτρέπει ελεύθερη τροποποίηση και διανομή, αλλά μια τροποποιημένη
  έκδοση πρέπει να επισημαίνεται σαφώς ή να μετονομάζεται, ή να διατίθεται ο
  πηγαίος κώδικάς της. Περιλαμβάνει όρους για διπλώματα ευρεσιτεχνίας.
analogy: Κάντε remix το τραγούδι, αλλά μην πουλάτε το remix σας ως το πρωτότυπο.
pros:
  - Προστατεύει την ταυτότητα του πρωτοτύπου
  - Συμβατή με την GPL
cons:
  - Οι όροι είναι φλύαροι
  - Σπάνια εκτός Raku και Perl
