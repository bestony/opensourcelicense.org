summary: "Copyleft για βιβλιοθήκες: οι αλλαγές στη βιβλιοθήκη μένουν ανοιχτές·
  κλειστά προγράμματα μπορούν να συνδέονται σε αυτήν, αν οι χρήστες μπορούν να
  τα επανασυνδέσουν με τροποποιημένη βιβλιοθήκη."
analogy: Η παλαιότερη έκδοση του αντικαταστάσιμου κοινόχρηστου κινητήρα.
pros:
  - Επιτρέπει σε ιδιόκτητες εφαρμογές να χρησιμοποιούν τη βιβλιοθήκη
  - Συνηθισμένη σε βιβλιοθήκες desktop και πολυμέσων
cons:
  - Οι κανόνες επανασύνδεσης είναι πολύπλοκοι
  - Καμία ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας
