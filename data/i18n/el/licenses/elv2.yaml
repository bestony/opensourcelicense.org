summary: "Διαθέσιμος πηγαίος κώδικας: ελεύθερη χρήση και τροποποίηση, αλλά δεν
  επιτρέπεται η παροχή του ως διαχειριζόμενης υπηρεσίας ούτε η παράκαμψη
  κλειδιών άδειας."
analogy: Μαγειρέψτε με αυτό στο σπίτι ή στο εστιατόριό σας, αλλά μην ανοίξετε
  μαγαζί που πουλάει ακριβώς αυτό το πιάτο.
pros:
  - Σύντομη και σαφής
  - Στοχεύει μόνο ανταγωνιστές διαχειριζόμενων υπηρεσιών
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Περιορίζει τα fork και ορισμένους συνεργάτες
