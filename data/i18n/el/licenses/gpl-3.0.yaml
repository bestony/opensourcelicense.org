summary: "Ισχυρό copyleft: αν διανέμετε το λογισμικό ή παράγωγα έργα, πρέπει να
  δημοσιεύσετε ολόκληρο τον πηγαίο κώδικα υπό GPL-3.0."
analogy: "Μια συνταγή που λέει: όποιος σερβίρει πιάτο βασισμένο σε αυτήν πρέπει
  να δώσει και ολόκληρη τη συνταγή."
pros:
  - Διατηρεί όλα τα διανεμόμενα παράγωγα ανοιχτά
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας και προστασία από tivoization
  - Ισχυρή παράδοση στην κοινότητα
cons:
  - Πολλές εταιρείες την αποφεύγουν
  - Δεν καλύπτει το SaaS (δεν υπάρχει διανομή)
  - Ασύμβατη με την GPL-2.0-only
