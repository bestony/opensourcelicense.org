summary: GPL-2.0 για την ίδια τη βιβλιοθήκη, συν μια εξαίρεση που επιτρέπει σε
  ανεξάρτητα προγράμματα να συνδέονται σε αυτήν με οποιαδήποτε άδεια.
analogy: Ένας κοινόχρηστος κινητήρας υπό τον κανόνα «μοιράσου τη συνταγή», αλλά
  το δικό σας αυτοκίνητο παραμένει δικό σας.
pros:
  - Οι εφαρμογές που συνδέονται σε αυτήν μπορούν να είναι κλειστές
  - Τη χρησιμοποιεί το OpenJDK
cons:
  - Οι αλλαγές στη βιβλιοθήκη παραμένουν GPL
  - Ασύμβατη με έργα GPL-3.0-only
