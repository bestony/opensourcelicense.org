summary: "Ελεύθερη άδεια γραμματοσειρών: χρήση, ενσωμάτωση και τροποποίηση
  ελεύθερα, αλλά οι τροποποιημένες γραμματοσειρές πρέπει να εγκαταλείπουν τα
  δεσμευμένα ονόματα και οι γραμματοσειρές δεν πωλούνται μεμονωμένα."
analogy: Χρησιμοποιήστε τη γραμματοσειρά παντού, αλλά μην πουλάτε σκέτο το αρχείο της.
pros:
  - Επιτρέπει την ενσωμάτωση σε έγγραφα και εφαρμογές
  - Πρότυπο για ανοιχτές γραμματοσειρές
cons:
  - Τα δεσμευμένα ονόματα γραμματοσειρών περιπλέκουν τα fork
  - Μόνο για γραμματοσειρές
