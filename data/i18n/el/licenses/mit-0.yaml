summary: "Η MIT χωρίς την απαίτηση αναφοράς: χρησιμοποιήστε, αντιγράψτε και
  πουλήστε χωρίς να διατηρείτε καμία σημείωση."
analogy: Ένα δωρεάν βιβλίο στο οποίο μπορείτε ακόμη και να βάλετε νέο εξώφυλλο
  χωρίς το όνομα του συγγραφέα.
pros:
  - Δεν απαιτείται αναφορά
  - Κατάλληλη για παραδείγματα και αποσπάσματα κώδικα
cons:
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Οι δημιουργοί δεν έχουν δικαίωμα μνείας
