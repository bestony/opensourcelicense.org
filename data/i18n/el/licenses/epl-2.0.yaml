summary: Ασθενές copyleft σε επίπεδο module με παραχώρηση διπλωμάτων
  ευρεσιτεχνίας· μπορεί να ορίσει την GPL ως δευτερεύουσα άδεια για λόγους
  συμβατότητας.
analogy: Μοιραστείτε τις αλλαγές σας στο δανεικό κεφάλαιο· το υπόλοιπο βιβλίο
  είναι δικό σας.
pros:
  - Copyleft φιλικό προς τις επιχειρήσεις
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας
cons:
  - Συμβατότητα με την GPL μόνο με δηλωμένη δευτερεύουσα άδεια
  - Τα όρια των modules μπορεί να είναι ασαφή
