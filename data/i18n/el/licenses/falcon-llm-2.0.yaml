summary: Άδεια μοντέλου του TII βασισμένη στην Apache-2.0 με πολιτική αποδεκτής
  χρήσης· επιτρέπεται η εμπορική χρήση χωρίς δικαιώματα εκμετάλλευσης
  (royalties).
analogy: Η εργαλειοθήκη της Apache με μια σύντομη λίστα απαγορευμένων χρήσεων.
pros:
  - Εμπορική χρήση χωρίς royalties
  - Βασίζεται στην Apache-2.0
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Η πολιτική χρήσης μπορεί να ενημερωθεί
