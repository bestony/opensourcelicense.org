summary: "Επιτρεπτική άδεια: ο τροποποιημένος πηγαίος κώδικας πρέπει να
  επισημαίνεται ως τροποποιημένος, η προέλευση δεν πρέπει να παρουσιάζεται
  ψευδώς και η σημείωση παραμένει στα αντίγραφα του πηγαίου κώδικα."
analogy: Δανειστείτε τη συνταγή, αλλά αν την αλλάξετε, μην ισχυρίζεστε ότι είναι
  η αρχική.
pros:
