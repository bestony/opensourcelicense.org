summary: Copyleft σε επίπεδο αρχείου που προέρχεται από την MPL, με παραχώρηση
  διπλωμάτων ευρεσιτεχνίας· ασύμβατη με την GPL.
analogy: Μοιραστείτε τις αλλαγές στο δανεικό αρχείο· τα υπόλοιπα μπορείτε να τα
  κρατήσετε κλειστά, αν θέλετε.
pros:
  - Εμβέλεια σε επίπεδο αρχείου
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας
cons:
  - Ασύμβατη με την GPL (το πρόβλημα ZFS-on-Linux)
  - Λίγα νέα έργα την υιοθετούν
