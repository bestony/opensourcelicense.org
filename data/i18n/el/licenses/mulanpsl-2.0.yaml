summary: Κινεζική επιτρεπτική άδεια με παραχώρηση διπλωμάτων ευρεσιτεχνίας και
  ρήτρα αντιποίνων. Τα κινεζικά και τα αγγλικά κείμενα είναι εξίσου έγκυρα· σε
  περίπτωση αντίφασης υπερισχύει το κινεζικό.
analogy: Προστασία τύπου Apache, γραμμένη με γνώμονα το κινεζικό δίκαιο.
pros:
  - Επίσημο δίγλωσσο κείμενο
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Εγκεκριμένη από την OSI
cons:
  - Λιγότερο γνωστή εκτός Κίνας
  - Περιορισμένη νομολογία
