summary: Apache-2.0 συν μια εξαίρεση που καταργεί τις απαιτήσεις αναφοράς για
  μεταγλωττισμένο κώδικα και τον κάνει χρησιμοποιήσιμο σε έργα GPL-2.0.
analogy: Η εργαλειοθήκη της Apache, με μια σημείωση ότι τα υπολείμματα των
  εργαλείων στο προϊόν σας δεν χρειάζονται μνεία.
pros:
  - Η παραχώρηση διπλωμάτων ευρεσιτεχνίας της Apache-2.0
  - Λειτουργεί με κώδικα GPL-2.0
cons:
  - Μεγαλύτερη από την MIT
  - Η εξαίρεση αφορά έργα τύπου μεταγλωττιστή
