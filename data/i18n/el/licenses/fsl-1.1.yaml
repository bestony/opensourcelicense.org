summary: "Διαθέσιμος πηγαίος κώδικας: κάθε χρήση εκτός από ανταγωνιστικό προϊόν,
  και κάθε έκδοση γίνεται Apache-2.0 δύο χρόνια αργότερα."
analogy: Μια βιτρίνα της οποίας τα προϊόντα γίνονται δωρεάν για όλους μετά από
  δύο χρόνια.
pros:
  - Σύντομη και προβλέψιμη
  - Ο κώδικας γίνεται ανοιχτός μετά από δύο χρόνια
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Η «ανταγωνιστική χρήση» μπορεί να είναι δύσκολο να κριθεί
