sourceHash: 6a4054dc9cca8e7e
summary: "Παρόμοια διανομή για βάσεις δεδομένων: μπορείτε να χρησιμοποιήσετε τα
  δεδομένα εμπορικά, αλλά οι δημόσιες παράγωγες βάσεις δεδομένων πρέπει να
  μένουν υπό ODbL. Τα παραγόμενα έργα, όπως χάρτες ή εικόνες, χρειάζονται μόνο
  αναφορά."
analogy: Χτίστε πάνω στον κοινό χάρτη, και αν δημοσιεύσετε βελτιωμένη βάση
  χαρτογραφικών δεδομένων, μοιραστείτε την με τους ίδιους όρους.
pros:
  - Διατηρεί τις βελτιωμένες βάσεις δεδομένων ανοιχτές
  - Επιτρέπεται η εμπορική χρήση
  - Δοκιμασμένη από το OpenStreetMap
cons:
  - Η παρόμοια διανομή μπορεί να εμποδίσει τον συνδυασμό με άλλα δεδομένα
  - Η «παράγωγη βάση δεδομένων» είναι μερικές φορές ασαφής
