summary: "Διαθέσιμος πηγαίος κώδικας: η χρήση σε παραγωγή περιορίζεται από το
  Additional Use Grant και κάθε έκδοση μετατρέπεται σε ανοιχτή άδεια μετά το
  Change Date (έως 4 χρόνια)."
analogy: "Μια βιτρίνα: μπορείτε να κοιτάξετε και να δοκιμάσετε, και μετά από
  λίγα χρόνια το προϊόν γίνεται δωρεάν για όλους."
pros:
  - Σας επιτρέπει να ελέγχετε την εμπορική χρήση
  - Ο κώδικας γίνεται ανοιχτός αργότερα
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Οι όροι της παραχώρησης διαφέρουν ανά έργο
  - Μπορεί να προκαλέσει fork
