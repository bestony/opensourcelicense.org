summary: "Ελεύθερη άδεια για πακέτα LaTeX: τα τροποποιημένα αρχεία πρέπει να
  μετονομάζονται ή να επισημαίνονται σαφώς, ώστε τα έγγραφα να λειτουργούν
  παντού με τον ίδιο τρόπο."
analogy: Μπορείτε να αλλάξετε τη γραμματοσειρά, αλλά δώστε νέο όνομα στην έκδοσή σας.
pros:
  - Διατηρεί τα έγγραφα αναπαραγώγιμα
  - Πρότυπο σε όλο το CTAN
cons:
  - Ο κανόνας μετονομασίας είναι ασυνήθιστος
  - Ασύμβατη με την GPL
