summary: "Για βάσεις και σύνολα δεδομένων: κάθε χρήση, και εμπορική, αρκεί να
  διατηρείτε τη σημείωση αναφοράς. Και τα έργα που παράγετε από τα δεδομένα
  χρειάζονται σημείωση."
analogy: Χρησιμοποιήστε τα χαρτογραφικά δεδομένα οπουδήποτε, απλώς πείτε από πού
  προέρχονται.
pros:
  - Απλός κανόνας αναφοράς
  - Συνηθισμένη σε μεγάλα σώματα εκπαίδευσης AI
  - Καλύπτει δικαιώματα βάσεων δεδομένων, όχι μόνο πνευματικά δικαιώματα
cons:
  - Δεν σχεδιάστηκε για λογισμικό
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
