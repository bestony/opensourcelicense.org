summary: Επιτρεπτική άδεια· η σημείωση απαιτείται στα αντίγραφα του πηγαίου
  κώδικα αλλά όχι στα μεταγλωττισμένα εκτελέσιμα.
analogy: Κρατήστε το όνομα του συγγραφέα στο βιβλίο συνταγών, όχι σε κάθε πιάτο
  που σερβίρετε.
pros:
  - Δεν χρειάζεται σημείωση στα εκτελέσιμα
  - Πρότυπο για βιβλιοθήκες C++
cons:
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Λιγότερο γνωστή εκτός C++
