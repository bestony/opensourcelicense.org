summary: "Όπως η MIT: χρησιμοποιήστε τον κώδικα ελεύθερα· διατηρήστε τη σημείωση
  πνευματικών δικαιωμάτων και την αποποίηση ευθύνης σε αντίγραφα πηγαίου και
  εκτελέσιμου κώδικα."
analogy: "Μια δωρεάν κάρτα συνταγής: αντιγράψτε την οπουδήποτε, απλώς κρατήστε
  τη γραμμή του δημιουργού στο κάτω μέρος."
pros:
