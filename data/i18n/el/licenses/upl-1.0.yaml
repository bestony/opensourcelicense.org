summary: Σύντομη επιτρεπτική άδεια με ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας,
  που χρησιμοποιείται από την Oracle για το GraalVM και άλλα έργα.
analogy: Το δωρεάν βιβλίο της MIT, με μια πρόσθετη υπόσχεση για τα διπλώματα
  ευρεσιτεχνίας.
pros:
  - Σύντομη και επιτρεπτική
  - Ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας
cons:
  - Καμία ρήτρα αντιποίνων για διπλώματα ευρεσιτεχνίας
  - Λιγότερο γνωστή από την MIT ή την Apache
