summary: "Άδεια μοντέλου για εμπορική χρήση: επιτρέπονται παράγωγα, η NVIDIA δεν
  διεκδικεί δικαιώματα στα αποτελέσματα, αλλά οι ενσωματωμένοι μηχανισμοί
  ασφαλείας δεν πρέπει να παρακάμπτονται."
analogy: Ένας δωρεάν κινητήρας του οποίου δεν επιτρέπεται να αφαιρέσετε τις
  ζώνες ασφαλείας.
pros:
  - Επιτρέπεται η εμπορική χρήση
  - Καμία αξίωση στα αποτελέσματα
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Η ρήτρα για τους μηχανισμούς ασφαλείας θέλει προσοχή
