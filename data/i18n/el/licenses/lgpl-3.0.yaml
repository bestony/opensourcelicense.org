summary: "Copyleft σε επίπεδο βιβλιοθήκης: οι αλλαγές στη βιβλιοθήκη μένουν
  ανοιχτές· κλειστές εφαρμογές μπορούν να συνδέονται σε αυτήν, αν οι χρήστες
  μπορούν να αντικαταστήσουν τη βιβλιοθήκη."
analogy: "Ένας κοινόχρηστος κινητήρας: μπορείτε να τον βάλετε στο αυτοκίνητό
  σας, αλλά οι ιδιοκτήτες πρέπει να μπορούν να τον αντικαταστήσουν με δικό
  τους."
pros:
  - Επιτρέπει σε ιδιόκτητες εφαρμογές να χρησιμοποιούν τη βιβλιοθήκη
  - Οι αλλαγές στη βιβλιοθήκη μένουν ανοιχτές
  - Παραχώρηση διπλωμάτων ευρεσιτεχνίας
cons:
  - Οι κανόνες επανασύνδεσης είναι πολύπλοκοι, ιδίως για στατική σύνδεση και
    κινητές συσκευές
  - Ορισμένες εταιρείες εξακολουθούν να την αποφεύγουν
