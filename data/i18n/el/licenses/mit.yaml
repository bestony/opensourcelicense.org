sourceHash: 33f06e1e52928136
summary: Κάντε σχεδόν οτιδήποτε με τον κώδικα. Διατηρήστε τη σημείωση
  πνευματικών δικαιωμάτων και την άδεια. Καμία εγγύηση.
analogy: "Σαν να αφήνετε ένα δωρεάν βιβλίο σε ένα καφέ: πάρτε το, αντιγράψτε το,
  πουλήστε το, απλώς κρατήστε το όνομα του συγγραφέα στο εξώφυλλο."
pros:
  - Σύντομη και ευρέως κατανοητή
  - Η ευκολότερη άδεια για υιοθέτηση από εταιρείες
  - Συμβατή με σχεδόν κάθε άλλη άδεια
cons:
  - Καμία παραχώρηση διπλωμάτων ευρεσιτεχνίας
  - Οποιοσδήποτε μπορεί να δημιουργήσει ανταγωνιστή κλειστού κώδικα ή
    φιλοξενούμενης υπηρεσίας
