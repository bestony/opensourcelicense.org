summary: "Οι όροι μοντέλου της Google: επιτρέπεται η εμπορική χρήση, με πολιτική
  απαγορευμένων χρήσεων που μεταβιβάζεται σε κάθε παράγωγο, και στα μοντέλα που
  προκύπτουν με distillation."
analogy: Ένας δωρεάν κινητήρας με κανονισμό που πρέπει να συνοδεύει κάθε
  ανακατασκευασμένο κινητήρα.
pros:
  - Εμπορική χρήση χωρίς όριο χρηστών
  - Σαφείς κανόνες για τα παράγωγα
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Η Google μπορεί να ενημερώσει την πολιτική χρήσης
