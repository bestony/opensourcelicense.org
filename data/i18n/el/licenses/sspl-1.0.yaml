summary: Παρόμοια με την AGPL, αλλά η παροχή του λογισμικού ως υπηρεσίας απαιτεί
  δημοσίευση του πηγαίου κώδικα ολόκληρης της στοίβας της υπηρεσίας. Δεν είναι
  εγκεκριμένη από την OSI.
analogy: Αν έχετε εστιατόριο που σερβίρει αυτό το πιάτο, πρέπει να δημοσιεύσετε
  και τα σχέδια της κουζίνας σας.
pros:
  - Ισχυρή προστασία απέναντι στους παρόχους cloud
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Την έχουν απορρίψει πολλές διανομές
  - Μπορεί να προκαλέσει fork από την κοινότητα
