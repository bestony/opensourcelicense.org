summary: "Για περιεχόμενο: αναφορά δημιουργού, όχι εμπορική χρήση και διασκευές
  με την ίδια άδεια."
analogy: Μοιραστείτε και διασκευάστε τις σημειώσεις του μαθήματος, ποτέ για
  κέρδος, πάντα με τους ίδιους όρους.
pros:
  - Αποκλείει την εμπορική επαναχρησιμοποίηση
  - Συνηθισμένη για εκπαιδευτικό υλικό
cons:
  - Δεν είναι ανοιχτή κατά το Open Definition
  - Το «μη εμπορική» είναι συχνά ασαφές
