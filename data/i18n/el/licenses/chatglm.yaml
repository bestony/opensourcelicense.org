summary: Τα βάρη είναι δωρεάν για ακαδημαϊκή έρευνα· η εμπορική χρήση είναι
  δωρεάν μετά από εγγραφή, με την επιφύλαξη περιορισμών χρήσης.
analogy: Ελεύθερο για μελέτη· εγγραφείτε πριν το χρησιμοποιήσετε επαγγελματικά.
pros:
  - Εμπορική χρήση μετά από εγγραφή
  - Ευρέως χρησιμοποιούμενα κινεζικά μοντέλα
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Βήμα εγγραφής
