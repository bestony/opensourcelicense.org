summary: "Copyleft για εγχειρίδια: τα αντίγραφα και οι τροποποιημένες εκδόσεις
  πρέπει να παραμένουν υπό GFDL, διατηρώντας το ιστορικό και τις αμετάβλητες
  ενότητες."
analogy: Ο κανόνας «μοιράσου τη συνταγή» για το εγχειρίδιο του βιβλίου μαγειρικής.
pros:
  - Διατηρεί την τεκμηρίωση ελεύθερη
  - Τη χρησιμοποιούν τα εγχειρίδια του GNU
cons:
  - Οι αμετάβλητες ενότητες είναι αμφιλεγόμενες
  - Δύσκολος ο συνδυασμός με περιεχόμενο CC
