summary: "Διαθέσιμος πηγαίος κώδικας: χρήση, τροποποίηση και διανομή ελεύθερα,
  εκτός από την παροχή προϊόντος SaaS που ανταγωνίζεται την Confluent."
analogy: Χρησιμοποιήστε τη συνταγή σε οποιοδήποτε εστιατόριο εκτός από ένα που
  ανταγωνίζεται του δημιουργού.
pros:
  - Στενός περιορισμός
  - Οι περισσότεροι χρήστες δεν επηρεάζονται
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Αποκλείει ανταγωνιστές cloud μόνο μέσω περιγραφής
