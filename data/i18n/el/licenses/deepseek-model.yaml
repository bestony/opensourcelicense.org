summary: "Άδεια μοντέλου τύπου OpenRAIL: επιτρέπεται η εμπορική χρήση, με
  περιορισμούς βάσει χρήσης που μεταβιβάζονται στα παράγωγα."
analogy: Ένα δωρεάν εργαλείο με λίστα απαγορευμένων χρήσεων προσαρτημένη σε κάθε
  αντίγραφο.
pros:
  - Επιτρέπεται η εμπορική χρήση
  - Οι περιορισμοί χρήσης μεταφέρονται στους επόμενους χρήστες
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Τα νεότερα μοντέλα DeepSeek πέρασαν στην MIT
