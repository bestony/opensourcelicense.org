summary: "Άδεια διαθέσιμου πηγαίου κώδικα της Redis: ελεύθερη χρήση και
  τροποποίηση, αλλά όχι παροχή του λογισμικού ως διαχειριζόμενης υπηρεσίας ούτε
  παράκαμψη κλειδιών άδειας."
analogy: Μαγειρέψτε με αυτό οπουδήποτε, αλλά μην ανοίξετε μαγαζί που πουλάει
  αυτό το πιάτο.
pros:
  - Στοχεύει μόνο ανταγωνιστές διαχειριζόμενων υπηρεσιών
  - Σύντομη
cons:
  - Δεν είναι ανοιχτός κώδικας
  - Προκάλεσε το fork Valkey
