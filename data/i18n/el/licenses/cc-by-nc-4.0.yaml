summary: "Για περιεχόμενο και δεδομένα: απαιτείται αναφορά δημιουργού και η
  εμπορική χρήση δεν επιτρέπεται."
analogy: Μοιραστείτε τη φωτογραφία ελεύθερα, αλλά όχι σε διαφημίσεις ή σε
  προϊόντα που πουλάτε.
pros:
  - Αποκλείει την εμπορική επαναχρησιμοποίηση
  - Επίσημες μεταφράσεις
cons:
  - Δεν είναι ανοιχτή κατά την OSI ή το Open Definition
  - Το «μη εμπορική» είναι συχνά ασαφές
  - Αποκλείει πολλές νόμιμες χρήσεις
