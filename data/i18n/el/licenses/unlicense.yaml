sourceHash: f723aee8de4d57cd
summary: Αφιερώνει το έργο στο δημόσιο κτήμα όπου αυτό είναι δυνατό, με
  επιτρεπτική εφεδρική άδεια. Δεν απαιτείται αναφορά.
analogy: "Σαν να αφήνετε ένα βιβλίο σε ένα παγκάκι του πάρκου χωρίς όνομα:
  όποιος θέλει μπορεί να το πάρει."
pros:
  - Κανένας απολύτως όρος
  - Εύκολος συνδυασμός με οτιδήποτε
cons:
  - Η αφιέρωση στο δημόσιο κτήμα δεν αναγνωρίζεται σε κάθε χώρα
  - Ορισμένες εταιρείες την αποφεύγουν λόγω νομικής αβεβαιότητας
