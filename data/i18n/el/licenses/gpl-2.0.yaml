summary: "Ισχυρό copyleft: τα διανεμόμενα παράγωγα πρέπει να δημοσιεύονται
  ολόκληρα υπό GPL-2.0. Καμία ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας· ασύμβατη
  με την GPL-3.0, εκτός αν χρησιμοποιείται το «or later»."
analogy: Ο κανόνας «μοιράσου τη συνταγή», στην παλαιότερη έκδοσή του.
pros:
  - Διατηρεί τα διανεμόμενα παράγωγα ανοιχτά
  - Τη χρησιμοποιεί ο πυρήνας Linux
cons:
  - Ασύμβατη με Apache-2.0 και GPL-3.0 (μόνο αυτή η έκδοση)
  - Καμία ρητή παραχώρηση διπλωμάτων ευρεσιτεχνίας
