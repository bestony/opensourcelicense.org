summary: "Responsible AI License για μοντέλα: επιτρεπτικοί όροι συν περιορισμοί
  βάσει χρήσης που κάθε παράγωγο πρέπει να μεταβιβάζει."
analogy: Ένα δωρεάν εργαλείο με λίστα απαγορευμένων χρήσεων που ταξιδεύει μαζί
  με κάθε αντίγραφο.
pros:
  - Επιτρέπει εμπορική χρήση
  - Διατηρεί τους περιορισμούς επιβλαβών χρήσεων στους επόμενους χρήστες
cons:
  - Δεν είναι ανοιχτός κώδικας κατά την OSI
  - Οι περιορισμοί επιβάλλονται δύσκολα
  - Υπάρχουν αρκετές παραλλαγές
