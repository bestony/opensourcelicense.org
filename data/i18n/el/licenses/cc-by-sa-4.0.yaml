summary: "Copyleft για περιεχόμενο: κάθε χρήση με αναφορά δημιουργού, και οι
  διασκευές πρέπει να διανέμονται με την ίδια άδεια."
analogy: Διασκευάστε τη φωτογραφία ελεύθερα, αλλά μοιραστείτε τη διασκευή σας με
  τους ίδιους όρους.
pros:
  - Διατηρεί τις διασκευές ανοιχτές
  - Τη χρησιμοποιεί η Wikipedia
cons:
  - Η παρόμοια διανομή μπορεί να εμποδίσει τον συνδυασμό
  - Δεν σχεδιάστηκε για λογισμικό
