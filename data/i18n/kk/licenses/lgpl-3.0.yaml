sourceHash: cdef0d42cb1ab51e
summary: "Кітапхана деңгейіндегі копилефт: кітапханадағы өзгерістер ашық қалады;
  пайдаланушылар кітапхананы ауыстыра алса, жабық қолданбалар онымен байланыса
  алады."
analogy: "Ортақ қозғалтқыш: оны көлігіңізге орната аласыз, бірақ иелері оны өз
  қозғалтқышына ауыстыра алуы керек."
pros:
  - Проприетарлық қолданбаларға кітапхананы пайдалануға мүмкіндік береді
  - Кітапханадағы өзгерістер ашық қалады
  - Патенттік лицензия
cons:
  - Қайта байланыстыру ережелері күрделі, әсіресе статикалық байланыстыру мен
    мобильді құрылғылар үшін
  - Кейбір компаниялар әлі де одан аулақ болады
