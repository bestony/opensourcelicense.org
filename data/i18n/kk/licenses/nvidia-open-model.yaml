summary: "Коммерциялық пайдалануға болатын модель лицензиясы: туынды жұмыстарға
  рұқсат бар, NVIDIA шығыстарға құқық талап етпейді, бірақ кіріктірілген
  қауіпсіздік шектеулерін айналып өтуге болмайды."
analogy: Қауіпсіздік белдіктерін алып тастауға болмайтын тегін қозғалтқыш.
pros:
  - Коммерциялық пайдалануға рұқсат бар
  - Шығыстарға талап жоқ
cons:
  - Open source емес
  - Қауіпсіздік шектеулері туралы ереже мұқияттылықты талап етеді
