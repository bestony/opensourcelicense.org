summary: Модель салмақтары тек коммерциялық емес пайдалануға арналған;
  салмақтарды коммерциялық пайдалану үшін Black Forest Labs-тан жеке лицензия
  қажет.
analogy: Камераны өз жобаларыңызға алыңыз, ақылы түсірілімдерге емес.
pros:
  - Зерттеу мен хоббиге арналған ашық салмақтар
  - Коммерциялық пайдаланудың айқын жолы
cons:
  - Open source емес
  - Коммерциялық пайдалануға ақылы лицензия қажет
