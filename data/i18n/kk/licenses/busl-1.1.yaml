summary: "Source-available: өндірістік пайдалануды Additional Use Grant
  шектейді, ал әр нұсқа Change Date-тен кейін (ең көбі 4 жыл) ашық лицензияға
  ауысады."
analogy: "Дүкен витринасы: қарап, байқап көруге болады, ал бірнеше жылдан кейін
  тауар бәріне тегін болады."
pros:
  - Коммерциялық пайдалануды бақылауға мүмкіндік береді
  - Код кейін open source-қа айналады
cons:
  - Open source емес
  - Grant шарттары жобадан жобаға өзгереді
  - Форктарға себеп болуы мүмкін
