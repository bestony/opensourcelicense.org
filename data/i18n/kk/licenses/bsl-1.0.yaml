summary: Рұқсат беретін лицензия; ескерту бастапқы код көшірмелерінде міндетті,
  бірақ компиляцияланған бинарлық файлдарда міндетті емес.
analogy: Автордың атын аспаздық кітапта қалдырыңыз, ұсынатын әр табаққа емес.
pros:
  - Бинарлық файлдарда ескерту қажет емес
  - C++ кітапханалары үшін стандарт
cons:
  - Патенттік лицензия жоқ
  - C++-тан тыс аз танымал
