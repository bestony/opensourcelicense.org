sourceHash: f723aee8de4d57cd
summary: Мүмкін болған жерде туындыны қоғамдық игілікке береді, рұқсат беретін
  қосалқы лицензиясы бар. Авторлықты көрсету талап етілмейді.
analogy: "Ішінде ешкімнің аты жоқ кітапты саябақ орындығына қалдырғандай: кез
  келген адам ала алады."
pros:
  - Ешқандай шарт жоқ
  - Кез келген нәрсемен оңай біріктіріледі
cons:
  - Қоғамдық игілікке беру барлық елде танылмайды
  - Кейбір компаниялар құқықтық белгісіздікке байланысты одан аулақ болады
