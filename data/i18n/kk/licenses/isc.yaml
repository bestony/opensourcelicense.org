summary: "MIT-ке балама қысқарақ лицензия: авторлық құқық пен рұқсат туралы
  ескертуді сақтау шартымен кез келген пайдалану."
analogy: MIT-пен бірдей тегін кітап, тек мұқабасындағы ескертпесі қысқарақ.
pros:
  - Кең таралған рұқсат беретін лицензиялардың ең қысқасы
  - Көптеген npm пакеттерінің әдепкі лицензиясы
cons:
  - Патенттік лицензия жоқ
  - Жабық форктарға рұқсат етілген
