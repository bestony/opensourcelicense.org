summary: MPL-ден туындаған, патенттік лицензиясы бар файл деңгейіндегі копилефт;
  GPL-мен үйлесімсіз.
analogy: Алынған файлдағы өзгерістерді бөлісіңіз; қалғанын қаласаңыз жабық ұстаңыз.
pros:
  - Файл деңгейіндегі қамту
  - Патенттік лицензия
cons:
  - GPL-мен үйлесімсіз (ZFS on Linux мәселесі)
  - Жаңа жобалар оны сирек таңдайды
