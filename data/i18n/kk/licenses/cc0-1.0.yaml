sourceHash: d61f5398bef2c150
summary: "Деректер мен контентті қосалқы лицензиямен қоғамдық игілікке беру:
  ешқандай шарт жоқ, тіпті авторлықты көрсету де."
analogy: Фотоны қоғамдық қабырғаға іліңіз; кез келген адам оны ала алады.
pros:
  - Шарттар жоқ
  - Ашық деректер үшін тамаша
cons:
  - Авторлықты көрсетуге кепілдік жоқ
  - Патенттік лицензия жоқ
