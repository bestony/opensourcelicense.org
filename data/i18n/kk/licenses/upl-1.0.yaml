summary: Oracle GraalVM және басқа жобалар үшін қолданатын, айқын патенттік
  лицензиясы бар қысқа рұқсат беретін лицензия.
analogy: Патенттер туралы қосымша уәдесі бар MIT тегін кітабы.
pros:
  - Қысқа әрі рұқсат беретін
  - Айқын патенттік лицензия
cons:
  - Патенттік жауап шарасы туралы ереже жоқ
  - MIT немесе Apache-тен аз танымал
