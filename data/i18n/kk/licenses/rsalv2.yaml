summary: "Redis ұсынған source-available лицензия: еркін пайдалануға және
  өзгертуге болады, бірақ бағдарламаны басқарылатын сервис ретінде ұсынуға
  немесе лицензия кілттерін айналып өтуге болмайды."
analogy: Онымен кез келген жерде тамақ пісіріңіз, бірақ бұл тағамды сататын
  дүкен ашпаңыз.
pros:
  - Тек басқарылатын сервис ұсынатын бәсекелестерге бағытталған
  - Қысқа
cons:
  - Open source емес
  - Valkey форкінің пайда болуына себеп болды
