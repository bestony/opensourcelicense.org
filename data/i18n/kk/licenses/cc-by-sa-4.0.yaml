summary: "Контентке арналған копилефт: авторлықты көрсетумен кез келген
  пайдалану, ал бейімдеулерді сол лицензиямен бөлісу керек."
analogy: Фотоны еркін өңдеңіз, бірақ өңделген нұсқаны сол шарттармен бөлісіңіз.
pros:
  - Бейімдеулерді ашық сақтайды
  - Уикипедия қолданады
cons:
  - Сол шарттармен бөлісу талабы біріктіруге кедергі болуы мүмкін
  - Бағдарламалық жасақтамаға арналмаған
