summary: "Контент пен деректер үшін: авторлықты көрсету міндетті, коммерциялық
  пайдалануға рұқсат жоқ."
analogy: Фотоны еркін бөлісіңіз, бірақ жарнамада немесе сатылатын өнімдерде емес.
pros:
  - Коммерциялық қайта пайдалануға тыйым салады
  - Ресми аудармалары бар
cons:
  - OSI немесе Open Definition бойынша ашық емес
  - «Коммерциялық емес» ұғымы жиі түсініксіз
  - Көптеген заңды қолданыстарға тыйым салады
