summary: Патенттік лицензиясы бар модуль деңгейіндегі әлсіз копилефт;
  үйлесімділік үшін GPL-ді қосалқы лицензия ретінде көрсете алады.
analogy: Алынған тараудағы өзгерістеріңізді бөлісіңіз; кітаптың қалған бөлігі сіздікі.
pros:
  - Бизнеске ыңғайлы копилефт
  - Патенттік лицензия
cons:
  - GPL-мен үйлесімділік тек жарияланған қосалқы лицензиямен
  - Модуль шекаралары түсініксіз болуы мүмкін
