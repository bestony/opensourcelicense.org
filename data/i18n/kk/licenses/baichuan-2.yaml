summary: Тіркелгеннен кейін күнделікті белсенді пайдаланушылары бір миллионнан
  аз сервистер үшін коммерциялық пайдалану тегін; ірі сервистерге жеке лицензия
  қажет.
analogy: Көлікті тіркегеннен кейін шағын автопарктерге тегін қозғалтқыш.
pros:
  - Коммерциялық пайдаланушылардың көпшілігіне тегін
  - Қытай тіліне арналған мықты модельдер
cons:
  - Open source емес
  - Тіркеу және пайдаланушылар саны шегі
