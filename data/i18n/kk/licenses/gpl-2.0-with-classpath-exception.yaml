summary: Кітапхананың өзі үшін GPL-2.0, оған қоса тәуелсіз бағдарламаларға
  онымен кез келген лицензия бойынша байланысуға мүмкіндік беретін ерекшелік.
analogy: «Рецептпен бөліс» ережесіндегі ортақ қозғалтқыш, бірақ сіздің көлігіңіз
  өзіңізде қалады.
pros:
  - Онымен байланысатын қолданбалар жабық бола алады
  - OpenJDK қолданады
cons:
  - Кітапханадағы өзгерістер GPL бойынша қалады
  - GPL-3.0-only жобаларымен үйлесімсіз
