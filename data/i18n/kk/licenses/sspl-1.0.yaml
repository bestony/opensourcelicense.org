summary: AGPL-ге ұқсас, бірақ бағдарламаны сервис ретінде ұсыну бүкіл сервис
  стегінің бастапқы кодын ашуды талап етеді. OSI бекітпеген.
analogy: Мейрамханаңызда осы тағамды ұсынсаңыз, асүйіңіздің сызбаларын да
  жариялауыңыз керек.
pros:
  - Бұлт провайдерлерінен күшті қорғаныс
cons:
  - OSI анықтамасы бойынша open source емес
  - Көптеген дистрибутивтер одан бас тартқан
  - Қауымдастық форктарына себеп болуы мүмкін
