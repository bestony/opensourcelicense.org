summary: "Linux Foundation ұсынған деректерге арналған рұқсат беретін лицензия:
  деректерді еркін пайдаланып, бөлісіңіз; оқытылған модельдер сияқты нәтижелер
  шектелмейді."
analogy: Деректер жиынтығын кез келген мақсатқа пайдаланыңыз; деректерді әрі
  қарай бергенде келісімді қоса беріңіз.
pros:
  - Есептеу нәтижелерін айқын түрде босатады
  - Деректер үшін жазылған
cons:
  - CC лицензияларынан аз танымал
  - 2.0 нұсқасы қарапайымырақ
