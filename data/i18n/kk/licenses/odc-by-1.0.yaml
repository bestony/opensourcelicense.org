sourceHash: 7c50fe5f1b7f3c7d
summary: "Дерекқорлар мен деректер жиынтықтары үшін: авторлық туралы ескертуді
  сақтасаңыз, кез келген пайдалану, соның ішінде коммерциялық. Деректерден
  жасалған туындыларға да ескерту қажет."
analogy: Карта деректерін кез келген жерде пайдаланыңыз, тек қайдан алынғанын
  көрсетіңіз.
pros:
  - Авторлықты көрсетудің қарапайым ережесі
  - ЖИ-ді оқытуға арналған ірі корпустарда жиі қолданылады
  - Тек авторлық құқықты емес, дерекқорларға құқықты да қамтиды
cons:
  - Бағдарламалық жасақтамаға арналмаған
  - Патенттік лицензия жоқ
