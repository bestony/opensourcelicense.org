summary: "MIT сияқты: кодты еркін пайдаланыңыз; бастапқы және бинарлық
  көшірмелерде авторлық құқық туралы ескертуді және жауапкершіліктен бас тартуды
  сақтаңыз."
analogy: "Тегін рецепт карточкасы: оны кез келген жерге көшіріңіз, тек төменгі
  жағындағы автор жолын қалдырыңыз."
pros:
  - Өте қысқа әрі рұқсат беретін
  - BSD жүйелерінде кеңінен қолданылады
cons:
  - Патенттік лицензия жоқ
  - Жабық форктарға рұқсат етілген
