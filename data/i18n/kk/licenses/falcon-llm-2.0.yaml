summary: TII ұсынған, Apache-2.0 негізіндегі, рұқсат етілген пайдалану саясаты
  бар модель лицензиясы; коммерциялық пайдалануға роялтисіз рұқсат бар.
analogy: Тыйым салынған қолданыстардың қысқа тізімі бар Apache құралдар жинағы.
pros:
  - Роялтисіз коммерциялық пайдалану
  - Apache-2.0 негізінде
cons:
  - OSI анықтамасы бойынша open source емес
  - Пайдалану саясаты жаңартылуы мүмкін
