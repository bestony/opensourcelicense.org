summary: "GPL-3.0 және желілік ереже: өзгертілген нұсқамен желі арқылы жұмыс
  істейтін пайдаланушыларға оның бастапқы кодын ұсыну керек."
analogy: "Рецепт ережесі мейрамханаларға да қолданылады: тағамды ұсыну оны
  таратумен тең."
pros:
  - SaaS олқылығын жабады
  - Қос лицензиялауға жақсы негіз
  - OSI бекіткен open source
cons:
  - Көптеген компаниялар оған толықтай тыйым салады
  - Өзгертілмеген нұсқаны хостингтеуге бәрібір рұқсат бар
