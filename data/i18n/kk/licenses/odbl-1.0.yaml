summary: "Дерекқорларға арналған «сол шарттармен бөлісу» қағидасы: деректерді
  коммерциялық мақсатта пайдалануға болады, бірақ жария туынды дерекқорлар ODbL
  бойынша қалуы керек. Карталар немесе суреттер сияқты жасалған туындылар тек
  авторлықты көрсетуді талап етеді."
analogy: Ортақ картаға сүйеніп жұмыс істеңіз, ал жақсартылған карта дерекқорын
  жарияласаңыз, оны сол шарттармен қайта бөлісіңіз.
pros:
  - Жақсартылған дерекқорларды ашық сақтайды
  - Коммерциялық пайдалануға рұқсат бар
  - OpenStreetMap тәжірибесімен дәлелденген
cons:
  - Сол шарттармен бөлісу талабы басқа деректермен біріктіруге кедергі болуы
    мүмкін
  - «Туынды дерекқор» ұғымы кейде түсініксіз
