summary: "Күшті копилефт: таратылатын туынды жұмыстар толығымен GPL-2.0 бойынша
  ашылуы керек. Айқын патенттік лицензия жоқ; «or later» қолданылмаса,
  GPL-3.0-мен үйлесімсіз."
analogy: «Рецептпен бөліс» ережесінің ескі басылымы.
pros:
  - Таратылатын туынды жұмыстарды ашық сақтайды
  - Linux ядросы қолданады
cons:
  - Apache-2.0 және GPL-3.0-мен үйлесімсіз (тек осы нұсқа)
  - Айқын патенттік лицензия жоқ
