summary: "Контент үшін: авторлықты көрсету, коммерциялық пайдаланусыз,
  бейімдеулер сол лицензиямен."
analogy: Дәріс жазбаларын бөлісіп, өңдеңіз, бірақ ешқашан пайда үшін емес және
  әрқашан сол шарттармен.
pros:
  - Коммерциялық қайта пайдалануға тыйым салады
  - Оқу материалдарында жиі қолданылады
cons:
