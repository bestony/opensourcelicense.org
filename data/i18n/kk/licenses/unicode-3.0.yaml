summary: ICU және CLDR сияқты Unicode деректері мен бағдарламаларына арналған
  рұқсат беретін лицензия; ескертуді сақтаңыз және құқық иесінің атын жарнама
  үшін пайдаланбаңыз.
analogy: "Тегін анықтамалық: оны көшіріңіз, автор жолын сақтаңыз."
pros:
  - Рұқсат беретін
  - Деректер файлдары мен кодты қамтиды
cons:
  - Патенттік лицензия жоқ
  - Негізінен Unicode жобаларында қолданылады
