summary: Рұқсат етілген пайдалану саясатымен коммерциялық пайдалануға рұқсат
  бар; өте ірі сервистерге жеке лицензия қажет, ал кейбір аумақтар шығарылған.
analogy: Ережелер жинағы, өлшем шегі және қай жерде жүруге болатыны көрсетілген
  картасы бар тегін қозғалтқыш.
pros:
  - Пайдаланушылардың көпшілігіне коммерциялық пайдалану
  - Мәтін, бейне және 3D модельдерін қамтиды
cons:
  - Open source емес
  - Аумақтық шектеулер
