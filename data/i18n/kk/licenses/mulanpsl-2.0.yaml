summary: Патенттік лицензиясы мен жауап шарасы бар қытайлық рұқсат беретін
  лицензия. Қытай және ағылшын мәтіндері тең күшті; қайшылық болса, қытай мәтіні
  басым.
analogy: Қытай құқығы ескеріліп жазылған Apache стиліндегі қорғаныс.
pros:
  - Ресми екі тілді мәтін
  - Патенттік лицензия
  - OSI бекіткен
cons:
  - Қытайдан тыс аз танымал
  - Сот тәжірибесі шектеулі
