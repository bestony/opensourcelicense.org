sourceHash: 3ab9492f75e7adb0
summary: "Күшті копилефт: бағдарламаны немесе туынды жұмыстарды таратсаңыз,
  толық бастапқы кодты GPL-3.0 бойынша ашуыңыз керек."
analogy: «Осы рецепт бойынша тағам ұсынған адам толық рецептті де таратуы керек»
  дейтін рецепт.
pros:
  - Барлық таратылатын туынды жұмыстарды ашық сақтайды
  - Патенттік лицензия және тивоизацияға қарсы қорғаныс
  - Қауымдастықтың берік дәстүрі
cons:
  - Көптеген компаниялар одан аулақ болады
  - SaaS-ты қамтымайды (тарату жоқ)
  - GPL-2.0-only лицензиясымен үйлесімсіз
