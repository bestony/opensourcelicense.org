summary: "Google модельдерінің шарттары: коммерциялық пайдалануға рұқсат бар,
  тыйым салынған қолданыстар саясаты әр туынды жұмысқа, соның ішінде
  дистилляцияланған модельдерге беріледі."
analogy: Әр қайта жасалған қозғалтқышпен бірге жүруі тиіс ережелер жинағы бар
  тегін қозғалтқыш.
pros:
  - Пайдаланушылар саны шегінсіз коммерциялық пайдалану
  - Туынды жұмыстарға арналған айқын ережелер
cons:
  - OSI анықтамасы бойынша open source емес
  - Google пайдалану саясатын жаңартуы мүмкін
