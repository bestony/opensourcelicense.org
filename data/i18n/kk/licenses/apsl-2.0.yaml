summary: "Apple-дың файл деңгейіндегі копилефті: лицензия қамтитын өзгертілген
  файлдарды, соның ішінде сервис ретінде сыртқа орналастырғанда да жариялау
  керек. GPL-мен үйлесімсіз."
analogy: Алынған файлдағы өзгерістерді бөлісіңіз, тіпті нәтижені ғана ұсынсаңыз да.
pros:
  - Сыртқы орналастыруды қамтиды
  - Патенттік лицензия
cons:
  - GPL-мен үйлесімсіз
  - Негізінен Apple-дың open source жобаларымен шектеледі
