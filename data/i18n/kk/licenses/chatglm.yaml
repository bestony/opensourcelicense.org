summary: Салмақтар академиялық зерттеулер үшін тегін; коммерциялық пайдалану
  тіркелгеннен кейін, пайдалану шектеулерін сақтау шартымен тегін.
analogy: Зерттеуге еркін; бизнесте қолданбас бұрын тіркеліңіз.
pros:
  - Тіркелгеннен кейін коммерциялық пайдалану
  - Кең қолданылатын қытай модельдері
cons:
  - Open source емес
  - Тіркеу кезеңі
