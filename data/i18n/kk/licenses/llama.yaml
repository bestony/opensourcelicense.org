summary: "Арнайы модель лицензиясы: коммерциялық пайдалануға рұқсат бар,
  Acceptable Use Policy, авторлықты көрсету және атау беру ережелері, ал айына
  700 млн-нан астам белсенді пайдаланушыға жеке лицензия қажет."
analogy: Ережелер жинағы бар тегін қозғалтқыш және ең ірі автоөндірушілерге
  арналған арнайы келісімшарт.
pros:
  - Пайдаланушылардың көпшілігіне коммерциялық пайдалануға рұқсат бар
  - Ауқымды экожүйе
cons:
  - OSI анықтамасы бойынша open source емес
  - Пайдалану саясаты мен атау беру міндеттемелері
  - Шарттар нұсқадан нұсқаға өзгереді
