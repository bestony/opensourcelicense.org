summary: "Ең ірі Qwen модельдеріне арналған Alibaba лицензиясы: коммерциялық
  пайдалануға рұқсат бар, авторлықты көрсету және айына 100 миллионнан астам
  белсенді пайдаланушыға жеке лицензия талабымен."
analogy: Өте ірі автоөндірушілерге арналған арнайы келісімшарты бар тегін қозғалтқыш.
pros:
  - Пайдаланушылардың көпшілігіне коммерциялық пайдалану
  - Мықты көптілді модельдер
cons:
  - Open source емес
  - Пайдаланушылар саны шегі
