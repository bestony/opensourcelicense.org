summary: "Контент, деректер және құжаттама үшін: кез келген пайдалану, соның
  ішінде коммерциялық, авторлықты және өзгерістерді көрсету шартымен."
analogy: Фотоны кез келген жерде бөлісіңіз, тек фотографты көрсетіңіз.
pros:
  - Авторлықты көрсетудің қарапайым ережесі
  - Деректер мен құжаттамаға жақсы
  - Ресми аудармалары бар
cons:
  - Бағдарламалық жасақтамаға арналмаған
  - Патенттік лицензия жоқ
