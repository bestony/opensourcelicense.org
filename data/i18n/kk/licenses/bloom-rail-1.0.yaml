analogy: Әр көшірмесіне тыйым салынған қолданыстар тізімі тіркелген тегін құрал.
pros:
  - Коммерциялық пайдалануға рұқсат береді
  - RAIL лицензиялауының бастамашысы
cons:
  - OSI анықтамасы бойынша open source емес
  - Шектеулерді орындату қиын
