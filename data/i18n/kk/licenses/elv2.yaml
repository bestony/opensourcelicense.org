summary: "Source-available: еркін пайдалануға және өзгертуге болады, бірақ
  бағдарламаны басқарылатын сервис ретінде ұсынуға немесе лицензия кілттерін
  айналып өтуге болмайды."
analogy: Онымен үйде немесе мейрамханаңызда тамақ пісіріңіз, бірақ дәл осы
  тағамды сататын дүкен ашпаңыз.
pros:
  - Қысқа әрі түсінікті
  - Тек басқарылатын сервис ұсынатын бәсекелестерге бағытталған
cons:
  - Open source емес
  - Форктар мен кейбір серіктестерді шектейді
