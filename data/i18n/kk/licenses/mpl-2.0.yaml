summary: "Файл деңгейіндегі копилефт: MPL лицензиялы файлдардағы өзгерістер ашық
  қалуы керек, бірақ оларды басқа файлдардағы жабық кодпен біріктіруге болады."
analogy: Тарауды алсаңыз, сол тарауға енгізген түзетулеріңізді бөлісуіңіз керек,
  бірақ кітаптың қалғаны сіздікі.
pros:
  - Рұқсат беретін лицензиялар мен копилефт арасындағы тепе-теңдік
  - Айқын патенттік лицензия
  - Әдепкі бойынша GPL-мен үйлесімді
cons:
  - Файл шекаралары түсініксіз болуы мүмкін
  - Желі арқылы пайдалануды қамтымайды
