summary: Apache-2.0 және компиляцияланған код үшін авторлықты көрсету талабын
  алып тастайтын, оны GPL-2.0 жобаларында қолдануға мүмкіндік беретін ерекшелік.
analogy: Apache құралдар жинағы, өніміңіздегі құралдардың қалдықтары үшін
  авторды көрсетудің қажеті жоқ деген ескертпемен.
pros:
  - Apache-2.0 патенттік лицензиясы
  - GPL-2.0 кодымен жұмыс істейді
cons:
  - MIT-тен ұзағырақ
  - Ерекшелік компилятор тәрізді жобаларға арналған
