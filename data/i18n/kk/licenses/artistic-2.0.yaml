summary: Еркін өзгертуге және таратуға мүмкіндік береді, бірақ өзгертілген нұсқа
  анық белгіленуі не атауы өзгертілуі, немесе оның бастапқы коды қолжетімді
  болуы керек. Патенттік ережелері бар.
analogy: Әннің ремиксін жасаңыз, бірақ оны түпнұсқа ретінде сатпаңыз.
pros:
  - Түпнұсқаның бірегейлігін қорғайды
  - GPL-мен үйлесімді
cons:
  - Шарттары ұзақ жазылған
  - Raku мен Perl-ден тыс сирек кездеседі
