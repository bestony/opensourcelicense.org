summary: Айқын патенттік лицензиясы, патенттік жауап шарасы және өзгертілген
  файлдарды белгілеу талабы бар рұқсат беретін лицензия.
analogy: Тегін құралдар жинағы, оның патенттері үшін сізді сотқа бермеуге
  уәдесімен — егер сіз бірінші болып сотқа бермесеңіз.
pros:
  - Әр үлес қосушыдан айқын патенттік лицензия
  - Көптеген компаниялар мен қорлар таңдайды
  - Тауар белгілерін қорғайды
cons:
  - Ұзағырақ; NOTICE файлымен жұмыс істеу керек
  - GPL-2.0-only лицензиясымен үйлесімсіз
  - Оны сервис ретінде хостингтейтін бәсекелестерді тоқтатпайды
