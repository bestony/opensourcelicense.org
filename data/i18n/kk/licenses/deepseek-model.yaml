summary: "OpenRAIL стиліндегі модель лицензиясы: коммерциялық пайдалануға рұқсат
  бар, туынды жұмыстарға берілетін пайдалану шектеулерімен."
analogy: Әр көшірмесіне тыйым салынған қолданыстар тізімі тіркелген тегін құрал.
pros:
  - Коммерциялық пайдалануға рұқсат бар
  - Пайдалану шектеулері әрі қарай беріледі
cons:
  - OSI анықтамасы бойынша open source емес
  - Жаңа DeepSeek модельдері MIT-ке ауысты
