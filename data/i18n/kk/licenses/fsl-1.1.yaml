summary: "Source-available: бәсекелес өнімнен басқа кез келген пайдалану, ал әр
  шығарылым екі жылдан кейін Apache-2.0-ге айналады."
analogy: Тауарлары екі жылдан кейін бәріне тегін болатын дүкен витринасы.
pros:
  - Қысқа әрі болжамды
  - Код екі жылдан кейін open source-қа айналады
cons:
  - Open source емес
  - «Бәсекелес пайдалануды» бағалау қиын болуы мүмкін
