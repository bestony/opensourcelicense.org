summary: "Қаріптерге арналған еркін лицензия: қаріптерді еркін пайдаланыңыз,
  ендіріңіз және өзгертіңіз, бірақ өзгертілген қаріптер сақталған атауларды
  қолданбауы керек, ал қаріптердің өзін жеке сатуға болмайды."
analogy: Қаріпті барлық жерде пайдаланыңыз, бірақ қаріп файлының өзін сатпаңыз.
pros:
  - Құжаттар мен қолданбаларға ендіруге мүмкіндік береді
  - Ашық қаріптер үшін стандарт
cons:
  - Сақталған қаріп атаулары форктарды қиындатады
  - Тек қаріптерге арналған
