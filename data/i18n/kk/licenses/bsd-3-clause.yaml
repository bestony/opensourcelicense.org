summary: MIT сияқты, оған қоса туынды өнімдерді жарнамалау үшін сіздің атыңызды
  пайдалануға тыйым салатын ереже бар.
analogy: "Ескертпесі бар тегін кітап: «Автор сіздің басылымыңызды ұсынады деп
  мәлімдемеңіз»."
pros:
  - Рұқсат беретін және танымал
  - Атыңызды жарнамада пайдаланудан қорғайды
cons:
  - Патенттік лицензия жоқ
  - Жабық кодты форктарға рұқсат етілген
