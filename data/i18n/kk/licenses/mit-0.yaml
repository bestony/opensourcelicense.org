summary: "Авторлықты көрсету талабы жоқ MIT: ешқандай ескертуді сақтамай
  пайдаланыңыз, көшіріңіз және сатыңыз."
analogy: Автордың атынсыз мұқабасын ауыстыруға да болатын тегін кітап.
pros:
  - Авторлықты көрсету қажет емес
  - Мысалдар мен код үзінділеріне жақсы
cons:
  - Патенттік лицензия жоқ
  - Авторлардың аты көрсетілуіне кепілдік жоқ
