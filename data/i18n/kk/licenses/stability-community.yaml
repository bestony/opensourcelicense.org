summary: Зерттеу, коммерциялық емес пайдалану және жылдық табысы 1 млн АҚШ
  долларынан аз болғанда коммерциялық пайдалану үшін тегін; ірі компанияларға
  корпоративтік лицензия қажет.
analogy: Шағын бизнеске кіру тегін; ірілері билет сатып алады.
pros:
  - Жеке тұлғалар мен шағын компанияларға тегін
  - Stability-дің соңғы модельдерін қамтиды
cons:
  - Open source емес
  - Табыс шегін қадағалау қажет
