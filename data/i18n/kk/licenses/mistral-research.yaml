summary: Салмақтар тек зерттеу мен жеке пайдалануға арналған; кез келген
  коммерциялық немесе өндірістік пайдалануға Mistral AI-дан коммерциялық
  лицензия қажет.
analogy: "Кітапхана кітабы: оқып, зерттеңіз, бірақ қайта сатпаңыз."
pros:
  - Зерттеуге арналған ашық салмақтар
  - Зерттеу үшін өзгертуге рұқсат береді
cons:
  - Коммерциялық пайдалану жоқ
  - Open source емес
