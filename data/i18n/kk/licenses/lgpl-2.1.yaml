summary: "Кітапханаға арналған копилефт: кітапханадағы өзгерістер ашық қалады;
  пайдаланушылар өзгертілген кітапханамен қайта байланыстыра алса, жабық
  бағдарламалар онымен байланыса алады."
analogy: Ауыстырылатын ортақ қозғалтқыштың ескі басылымы.
pros:
  - Проприетарлық қолданбаларға кітапхананы пайдалануға мүмкіндік береді
  - Жұмыс үстелі және мультимедиа кітапханаларында кең таралған
cons:
  - Қайта байланыстыру ережелері күрделі
  - Айқын патенттік лицензия жоқ
