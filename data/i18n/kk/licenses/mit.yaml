summary: Кодпен кез келген дерлік нәрсені жасаңыз. Авторлық құқық пен лицензия
  туралы ескертуді сақтаңыз. Кепілдік жоқ.
analogy: "Кафеде тегін кітап қалдырғандай: алыңыз, көшіріңіз, сатыңыз, тек
  мұқабадағы автордың атын қалдырыңыз."
pros:
  - Қысқа әрі баршаға түсінікті
  - Компаниялар үшін енгізуге ең оңай лицензия
  - Басқа лицензиялардың барлығы дерлік үйлесімді
cons:
  - Патенттік лицензия жоқ
  - Кез келген адам жабық немесе хостингтік бәсекелес жасай алады
