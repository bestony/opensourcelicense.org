summary: "Рұқсат беретін лицензия: өзгертілген бастапқы код өзгертілген деп
  белгіленуі керек, шығу тегін бұрмалауға болмайды, ал ескерту бастапқы код
  көшірмелерінде қалады."
analogy: Рецептті алыңыз, бірақ өзгертсеңіз, оны түпнұсқа деп айтпаңыз.
pros:
  - Рұқсат беретін әрі қысқа
  - Ойындар мен нативті кітапханаларда танымал
cons:
  - Патенттік лицензия жоқ
  - Жабық форктарға рұқсат етілген
