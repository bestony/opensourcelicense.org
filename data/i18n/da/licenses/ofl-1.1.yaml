summary: "Fri skrifttypelicens: brug, indlejr og ændr skrifttyper frit, men
  ændrede skrifttyper skal opgive reserverede navne, og skrifttyperne må ikke
  sælges alene."
analogy: Brug skrifttypen overalt, men sælg ikke den nøgne skrifttypefil.
pros:
