summary: "GPL-3.0 plus en netværksklausul: brugere, der interagerer med en
  ændret version over et netværk, skal tilbydes dens kildekode."
analogy: "Opskriftsreglen gælder også for restauranter: at servere retten tæller
  som at dele den ud."
pros:
  - Lukker SaaS-smuthullet
  - Godt grundlag for dobbeltlicensering
  - OSI-godkendt open source
cons:
  - Mange virksomheder forbyder den helt
  - Uændret hosting er stadig tilladt
