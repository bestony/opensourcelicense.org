summary: Tilladende licens med en udtrykkelig patentlicens, patentgengældelse og
  krav om at markere ændrede filer.
analogy: En gratis værktøjskasse, der også følger med et løfte om ikke at
  sagsøge dig for dens patenter — medmindre du sagsøger først.
pros:
