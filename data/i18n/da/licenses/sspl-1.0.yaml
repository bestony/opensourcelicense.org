summary: Ligner AGPL, men hvis du tilbyder softwaren som en tjeneste, skal
  kildekoden til hele tjenestestakken frigives. Ikke OSI-godkendt.
analogy: Driver du en restaurant med denne ret, skal du også offentliggøre
  tegningerne til dit køkken.
pros:
