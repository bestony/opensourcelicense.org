sourceHash: 0196a50e1d1c6b89
summary: "Para conteúdo e dados: exige atribuição e não permite uso comercial."
analogy: Compartilhe a foto à vontade, mas não em anúncios ou produtos que você vende.
pros:
  - Impede a reutilização comercial
  - Traduções oficiais
cons:
  - Não atende à OSI nem à Open Definition
  - '"Não comercial" costuma ser ambíguo'
  - Bloqueia muitos usos legítimos
