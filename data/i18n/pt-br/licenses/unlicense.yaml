summary: Dedica a obra ao domínio público quando possível, com uma licença
  permissiva de reserva. Não exige atribuição.
analogy: "Deixar um livro sem nome num banco de praça: qualquer um pode levar."
pros:
  - Nenhuma condição
  - Fácil de combinar com tudo
cons:
  - Nem todo país reconhece a dedicação ao domínio público
  - Algumas empresas evitam por incerteza jurídica
