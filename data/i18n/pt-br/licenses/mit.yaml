summary: Permite fazer quase tudo com o código. Basta manter o aviso de
  copyright e de licença. Sem garantia.
analogy: "Como um livro grátis em um café: pode levar, copiar ou vender, desde
  que o nome do autor continue na capa."
pros:
  - Curta e amplamente conhecida
  - A licença mais fácil de adotar para empresas
  - Compatível com quase todas as outras licenças
cons:
  - Não concede patentes
  - Qualquer um pode criar um concorrente fechado ou hospedado
