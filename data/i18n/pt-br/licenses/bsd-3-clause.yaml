summary: Como a MIT, com uma cláusula que proíbe usar seu nome para endossar
  produtos derivados.
analogy: 'Um livro grátis com um bilhete: "Não diga que o autor recomenda a sua
  edição".'
pros:
  - Permissiva e bem conhecida
  - Protege seu nome contra uso em endosso
cons:
  - Não concede patentes
  - Forks fechados são permitidos
