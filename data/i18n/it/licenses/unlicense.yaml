summary: Rilascia l'opera nel pubblico dominio ove possibile, con una licenza
  permissiva di riserva. Non è richiesta alcuna attribuzione.
analogy: "Lasciare un libro su una panchina del parco senza nome all'interno:
  chiunque può prenderlo."
pros:
  - Nessuna condizione
  - Facile da combinare con qualsiasi cosa
cons:
