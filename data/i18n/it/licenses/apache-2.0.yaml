summary: Licenza permissiva con concessione espressa di brevetti, ritorsione
  brevettuale e obbligo di indicare i file modificati.
analogy: Una cassetta degli attrezzi gratuita con la promessa di non farti causa
  per i suoi brevetti — a meno che non sia tu a farla per primo.
pros:
