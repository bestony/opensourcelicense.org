name: Weekly license sync

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync license metadata
        run: pnpm sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate
        run: pnpm validate
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/projects; then
            echo "No changes."
            exit 0
          fi
          branch="chore/license-sync-$(date +%Y%m%d)"
          git config user.name "license-sync-bot"
          git config user.email "license-sync-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add data/projects
          git commit -m "chore(data): weekly license sync $(date +%Y-%m-%d)"
          git push -u origin "$branch"
          gh pr create --title "chore(data): weekly license sync $(date +%Y-%m-%d)" --body-file sync-report.md --label data-sync || gh pr create --title "chore(data): weekly license sync $(date +%Y-%m-%d)" --body-file sync-report.md
